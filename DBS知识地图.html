”理解运行\u003c/h2>\n\u003cp>客户价值与战略选择决定要建什么；4P检查人、方案、施工流程与验收；PD安排关键能力突破和资源；工具解决具体施工问题；DM使日常标准与异常响应可靠；带教确保团队能独立建下一间。工具再多，也替代不了业务取舍和真实验收。\u003c/p>\n\u003cp>进入 \u003ca href=\"#C01_DBS%E5%AE%9A%E4%B9%89\" data-open=\"C01_DBS定义\">DBS定义\u003c/a>、\u003ca href=\"#C02_%E4%BA%BA%E6%89%8D%E8%AE%A1%E5%88%92%E6%B5%81%E7%A8%8B%E7%BB%A9%E6%95%88\" data-open=\"C02_人才计划流程绩效\">人才计划流程绩效\u003c/a>、\u003ca href=\"#M01_%E5%85%B1%E5%90%8C%E5%9F%BA%E7%A1%80\" data-open=\"M01_共同基础\">共同基础\u003c/a>、\u003ca href=\"#M02_%E7%B2%BE%E7%9B%8A%E8%83%BD%E5%8A%9B\" data-open=\"M02_精益能力\">精益能力\u003c/a>、\u003ca href=\"#M03_%E5%A2%9E%E9%95%BF%E8%83%BD%E5%8A%9B\" data-open=\"M03_增长能力\">增长能力\u003c/a>、\u003ca href=\"#M04_%E9%A2%86%E5%AF%BC%E5%8A%9B%E8%83%BD%E5%8A%9B\" data-open=\"M04_领导力能力\">领导力能力\u003c/a>。\u003c/p>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"01_体系总论.md"},{"name":"02_系统结构与运行流程","title":"从战略到现场：两个相连的运行回路","raw":"# 从战略到现场：两个相连的运行回路\r\n\r\n> 校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\r\n\r\n## 系统结构\r\n\r\n客户与竞争事实 → 战略选择 → 跨年度突破 → 年度进展 → 优先改善IP ↔ TTI与资源协商 → 行动/试验 → 效果与学习 → 标准和人才 → 下一轮战略与流程改进。\r\n\r\n关系不是严格一对一：一个IP可贡献多个目标，一个目标也可能需要多个IP。所有贡献都是需要证据支持的假设。\r\n\r\n## 突破回路与日常回路\r\n\r\n| 回路 | 输入 | 动作 | 产出 | 反馈 |\r\n|---|---|---|---|---|\r\n| PD突破 | 战略差距与能力限制 | 选突破、协商资源、试验、月度评审 | 新机制与经过验证的新水平 | 假设失效或环境变化时调整选择 |\r\n| DM日常 | 标准、实际、客户承诺 | 观察偏差、响应、升级、验证恢复 | 可靠运行和反复问题证据 | 系统性问题进入PSP或PD |\r\n\r\n两个回路共用事实数据。PD成功后的方法进入日常标准；日常暴露的能力限制可成为下一项突破。各层都有日常责任。\r\n\r\n## 异常到改善的操作顺序\r\n\r\n发现异常 → 必要遏制 → 确认事实与测量 → 按权限恢复/升级 → 反复或重大问题进入PSP → 分层定位 → 原因假设与验证 → 对策试验 → QDC效果检查 → 标准与能力交接。\r\n\r\n原因未知时先安排调查。Pareto找集中点，5Why帮助追问；二者不能直接确认因果。紧急遏制和长期对策分别记录。\r\n\r\n## 七阶段与现场闭环的区别\r\n\r\n课件七阶段是年度PD组织流程，见 [[D02_PD七阶段流程与时间表]]；这里的异常处理顺序是教学操作化。不要把两者合成所谓丹纳赫固定步骤认证法。\r\n\r\n工具由问题触发；增长项目与支持流程也遵循提出假设、验证效果、反馈学习的逻辑，测量单位则按实际业务定义。\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>从战略到现场：两个相连的运行回路\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003ch2>系统结构\u003c/h2>\n\u003cp>客户与竞争事实 → 战略选择 → 跨年度突破 → 年度进展 → 优先改善IP ↔ TTI与资源协商 → 行动/试验 → 效果与学习 → 标准和人才 → 下一轮战略与流程改进。\u003c/p>\n\u003cp>关系不是严格一对一：一个IP可贡献多个目标，一个目标也可能需要多个IP。所有贡献都是需要证据支持的假设。\u003c/p>\n\u003ch2>突破回路与日常回路\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>回路\u003c/th>\n\u003cth>输入\u003c/th>\n\u003cth>动作\u003c/th>\n\u003cth>产出\u003c/th>\n\u003cth>反馈\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>PD突破\u003c/td>\n\u003ctd>战略差距与能力限制\u003c/td>\n\u003ctd>选突破、协商资源、试验、月度评审\u003c/td>\n\u003ctd>新机制与经过验证的新水平\u003c/td>\n\u003ctd>假设失效或环境变化时调整选择\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DM日常\u003c/td>\n\u003ctd>标准、实际、客户承诺\u003c/td>\n\u003ctd>观察偏差、响应、升级、验证恢复\u003c/td>\n\u003ctd>可靠运行和反复问题证据\u003c/td>\n\u003ctd>系统性问题进入PSP或PD\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>两个回路共用事实数据。PD成功后的方法进入日常标准；日常暴露的能力限制可成为下一项突破。各层都有日常责任。\u003c/p>\n\u003ch2>异常到改善的操作顺序\u003c/h2>\n\u003cp>发现异常 → 必要遏制 → 确认事实与测量 → 按权限恢复/升级 → 反复或重大问题进入PSP → 分层定位 → 原因假设与验证 → 对策试验 → QDC效果检查 → 标准与能力交接。\u003c/p>\n\u003cp>原因未知时先安排调查。Pareto找集中点，5Why帮助追问；二者不能直接确认因果。紧急遏制和长期对策分别记录。\u003c/p>\n\u003ch2>七阶段与现场闭环的区别\u003c/h2>\n\u003cp>课件七阶段是年度PD组织流程，见 \u003ca href=\"#D02_PD%E4%B8%83%E9%98%B6%E6%AE%B5%E6%B5%81%E7%A8%8B%E4%B8%8E%E6%97%B6%E9%97%B4%E8%A1%A8\" data-open=\"D02_PD七阶段流程与时间表\">PD七阶段流程与时间表\u003c/a>；这里的异常处理顺序是教学操作化。不要把两者合成所谓丹纳赫固定步骤认证法。\u003c/p>\n\u003cp>工具由问题触发；增长项目与支持流程也遵循提出假设、验证效果、反馈学习的逻辑，测量单位则按实际业务定义。\u003c/p>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"02_系统结构与运行流程.md"},{"name":"03_按问题选择工具","title":"从问题证据选择工具","raw":"# 从问题证据选择工具\r\n\r\n> 校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\r\n\r\n先明确客户或经营差距，核实数据和现状，再选择工具。下面是诊断入口，不是见到症状就能判定原因的处方。\r\n\r\n| 问题 | 先看什么 | 方法卡 | 工作产出 |\r\n|---|---|---|---|\r\n| 需求反复 | 客户使用场景、变更原因 | [[T04_客户之声]] | 经过客户验证的CTQ与需求边界 |\r\n| 设计风险后移 | 设计假设、失效与试验记录 | [[T22_快速设计评审]] | 设计决定及支持/反对证据 |\r\n| 项目同时过多 | 资源容量和依赖 | [[T21_产品规划与资源配置]] | 组合取舍与资源承诺 |\r\n| 新品交付不稳 | 试产、放行与供应准备 | [[T30_上市与交付准备]] | 准备证据和风险处置 |\r\n| 库存高又缺料 | SKU需求、库存状态、供期波动 | [[T17_产销库存协同]] | 分类供应策略与供需例外决定 |\r\n| 周期长 | 真实订单等待、处理、返工及放行时间 | [[T05_价值流图]] | 包含生产与放行的现状价值流 |\r\n| 换型影响质量与交期 | 合格件到合格件时间与启动损耗 | [[T14_快速换型]] | 经QDC联合验证的换型标准 |\r\n| 在制堆积 | 瓶颈、批量、补货信号与质量状态 | [[T13_拉动与在制品限制]] | 有条件依据的限额、补货和异常规则 |\r\n| 预测失真 | 固定时点预测快照与对应期实际 | [[T24_销售漏斗管理]] | 阶段定义、退出证据和预测误差解释 |\r\n| 承诺不能兑现 | 客户需要与供应容量 | [[T17_产销库存协同]] | 可兑现承诺和例外审批 |\r\n| 低价换量 | 客户价值与服务成本 | [[T25_价值销售]] | 价值证据及适合的报价边界 |\r\n| 机会分散 | 客户分层和资源容量 | [[T19_客户细分]] | 目标客户与取舍 |\r\n| 有节时无现金 | 人员、加班、外包与实际支出 | [[C06_结果与过程指标]] | 能力释放与费用减少分别计量 |\r\n| 库存下降报喜 | 采购、消耗、报废、转仓和成本口径 | [[T17_产销库存协同]] | 现金变化及库存变化的分解 |\r\n| 降本伤质量 | 功能、返工、投诉、交付与全成本 | [[T18_价值分析与价值工程]] | 可接受方案与QDC副作用 |\r\n| 多个项目认领收益 | 范围、期间、账目与共同贡献 | [[T03_保龄图与行动计划]] | 归属规则与去重收益清单 |\r\n| 听过但不会做 | 真实任务演示 | [[T27_人才发展与继任]] | 能力差距与带教任务 |\r\n| 项目依赖顾问 | 业务主责与教练职责 | [[T29_DBS推进角色]] | 负责人独立推进证据 |\r\n| 评审只追数字 | 现场提问与资源决定 | [[T28_领导标准工作]] | 领导标准工作和兑现记录 |\r\n| 人才评价随意 | 绩效、潜力标准和多方证据 | [[T31_九宫格人才盘点]] | 有依据的校准与发展动作 |\r\n| 反复缺陷 | 测量系统、缺陷分层、工艺与物料记录 | [[T16_变异管理与质量控制]] | 可信数据及适用过程控制 |\r\n| 返工多 | 批次、工序、条件与损失 | [[T06_问题解决流程]] | 原因证据与经验证对策 |\r\n| 漏检流出 | 检测能力、放行与客户记录 | [[T09_标准作业]] | 异常及放行标准 |\r\n| 现场隐患 | 任务风险和现场条件 | [[T12_现场观察]] | 即时控制与责任闭环 |\r\n\r\n一个试点可以先用VSM定位流程，再用PSP验证原因，随后组合换型、标准作业或拉动等方法。不要为了覆盖工具清单而人为制造多个项目。最终用同口径QDC与现场行为验收。\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>从问题证据选择工具\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>先明确客户或经营差距，核实数据和现状，再选择工具。下面是诊断入口，不是见到症状就能判定原因的处方。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>问题\u003c/th>\n\u003cth>先看什么\u003c/th>\n\u003cth>方法卡\u003c/th>\n\u003cth>工作产出\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>需求反复\u003c/td>\n\u003ctd>客户使用场景、变更原因\u003c/td>\n\u003ctd>\u003ca href=\"#T04_%E5%AE%A2%E6%88%B7%E4%B9%8B%E5%A3%B0\" data-open=\"T04_客户之声\">客户之声\u003c/a>\u003c/td>\n\u003ctd>经过客户验证的CTQ与需求边界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>设计风险后移\u003c/td>\n\u003ctd>设计假设、失效与试验记录\u003c/td>\n\u003ctd>\u003ca href=\"#T22_%E5%BF%AB%E9%80%9F%E8%AE%BE%E8%AE%A1%E8%AF%84%E5%AE%A1\" data-open=\"T22_快速设计评审\">快速设计评审\u003c/a>\u003c/td>\n\u003ctd>设计决定及支持/反对证据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>项目同时过多\u003c/td>\n\u003ctd>资源容量和依赖\u003c/td>\n\u003ctd>\u003ca href=\"#T21_%E4%BA%A7%E5%93%81%E8%A7%84%E5%88%92%E4%B8%8E%E8%B5%84%E6%BA%90%E9%85%8D%E7%BD%AE\" data-open=\"T21_产品规划与资源配置\">产品规划与资源配置\u003c/a>\u003c/td>\n\u003ctd>组合取舍与资源承诺\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新品交付不稳\u003c/td>\n\u003ctd>试产、放行与供应准备\u003c/td>\n\u003ctd>\u003ca href=\"#T30_%E4%B8%8A%E5%B8%82%E4%B8%8E%E4%BA%A4%E4%BB%98%E5%87%86%E5%A4%87\" data-open=\"T30_上市与交付准备\">上市与交付准备\u003c/a>\u003c/td>\n\u003ctd>准备证据和风险处置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>库存高又缺料\u003c/td>\n\u003ctd>SKU需求、库存状态、供期波动\u003c/td>\n\u003ctd>\u003ca href=\"#T17_%E4%BA%A7%E9%94%80%E5%BA%93%E5%AD%98%E5%8D%8F%E5%90%8C\" data-open=\"T17_产销库存协同\">产销库存协同\u003c/a>\u003c/td>\n\u003ctd>分类供应策略与供需例外决定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>周期长\u003c/td>\n\u003ctd>真实订单等待、处理、返工及放行时间\u003c/td>\n\u003ctd>\u003ca href=\"#T05_%E4%BB%B7%E5%80%BC%E6%B5%81%E5%9B%BE\" data-open=\"T05_价值流图\">价值流图\u003c/a>\u003c/td>\n\u003ctd>包含生产与放行的现状价值流\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>换型影响质量与交期\u003c/td>\n\u003ctd>合格件到合格件时间与启动损耗\u003c/td>\n\u003ctd>\u003ca href=\"#T14_%E5%BF%AB%E9%80%9F%E6%8D%A2%E5%9E%8B\" data-open=\"T14_快速换型\">快速换型\u003c/a>\u003c/td>\n\u003ctd>经QDC联合验证的换型标准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>在制堆积\u003c/td>\n\u003ctd>瓶颈、批量、补货信号与质量状态\u003c/td>\n\u003ctd>\u003ca href=\"#T13_%E6%8B%89%E5%8A%A8%E4%B8%8E%E5%9C%A8%E5%88%B6%E5%93%81%E9%99%90%E5%88%B6\" data-open=\"T13_拉动与在制品限制\">拉动与在制品限制\u003c/a>\u003c/td>\n\u003ctd>有条件依据的限额、补货和异常规则\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>预测失真\u003c/td>\n\u003ctd>固定时点预测快照与对应期实际\u003c/td>\n\u003ctd>\u003ca href=\"#T24_%E9%94%80%E5%94%AE%E6%BC%8F%E6%96%97%E7%AE%A1%E7%90%86\" data-open=\"T24_销售漏斗管理\">销售漏斗管理\u003c/a>\u003c/td>\n\u003ctd>阶段定义、退出证据和预测误差解释\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>承诺不能兑现\u003c/td>\n\u003ctd>客户需要与供应容量\u003c/td>\n\u003ctd>\u003ca href=\"#T17_%E4%BA%A7%E9%94%80%E5%BA%93%E5%AD%98%E5%8D%8F%E5%90%8C\" data-open=\"T17_产销库存协同\">产销库存协同\u003c/a>\u003c/td>\n\u003ctd>可兑现承诺和例外审批\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>低价换量\u003c/td>\n\u003ctd>客户价值与服务成本\u003c/td>\n\u003ctd>\u003ca href=\"#T25_%E4%BB%B7%E5%80%BC%E9%94%80%E5%94%AE\" data-open=\"T25_价值销售\">价值销售\u003c/a>\u003c/td>\n\u003ctd>价值证据及适合的报价边界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>机会分散\u003c/td>\n\u003ctd>客户分层和资源容量\u003c/td>\n\u003ctd>\u003ca href=\"#T19_%E5%AE%A2%E6%88%B7%E7%BB%86%E5%88%86\" data-open=\"T19_客户细分\">客户细分\u003c/a>\u003c/td>\n\u003ctd>目标客户与取舍\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>有节时无现金\u003c/td>\n\u003ctd>人员、加班、外包与实际支出\u003c/td>\n\u003ctd>\u003ca href=\"#C06_%E7%BB%93%E6%9E%9C%E4%B8%8E%E8%BF%87%E7%A8%8B%E6%8C%87%E6%A0%87\" data-open=\"C06_结果与过程指标\">结果与过程指标\u003c/a>\u003c/td>\n\u003ctd>能力释放与费用减少分别计量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>库存下降报喜\u003c/td>\n\u003ctd>采购、消耗、报废、转仓和成本口径\u003c/td>\n\u003ctd>\u003ca href=\"#T17_%E4%BA%A7%E9%94%80%E5%BA%93%E5%AD%98%E5%8D%8F%E5%90%8C\" data-open=\"T17_产销库存协同\">产销库存协同\u003c/a>\u003c/td>\n\u003ctd>现金变化及库存变化的分解\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>降本伤质量\u003c/td>\n\u003ctd>功能、返工、投诉、交付与全成本\u003c/td>\n\u003ctd>\u003ca href=\"#T18_%E4%BB%B7%E5%80%BC%E5%88%86%E6%9E%90%E4%B8%8E%E4%BB%B7%E5%80%BC%E5%B7%A5%E7%A8%8B\" data-open=\"T18_价值分析与价值工程\">价值分析与价值工程\u003c/a>\u003c/td>\n\u003ctd>可接受方案与QDC副作用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>多个项目认领收益\u003c/td>\n\u003ctd>范围、期间、账目与共同贡献\u003c/td>\n\u003ctd>\u003ca href=\"#T03_%E4%BF%9D%E9%BE%84%E5%9B%BE%E4%B8%8E%E8%A1%8C%E5%8A%A8%E8%AE%A1%E5%88%92\" data-open=\"T03_保龄图与行动计划\">保龄图与行动计划\u003c/a>\u003c/td>\n\u003ctd>归属规则与去重收益清单\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>听过但不会做\u003c/td>\n\u003ctd>真实任务演示\u003c/td>\n\u003ctd>\u003ca href=\"#T27_%E4%BA%BA%E6%89%8D%E5%8F%91%E5%B1%95%E4%B8%8E%E7%BB%A7%E4%BB%BB\" data-open=\"T27_人才发展与继任\">人才发展与继任\u003c/a>\u003c/td>\n\u003ctd>能力差距与带教任务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>项目依赖顾问\u003c/td>\n\u003ctd>业务主责与教练职责\u003c/td>\n\u003ctd>\u003ca href=\"#T29_DBS%E6%8E%A8%E8%BF%9B%E8%A7%92%E8%89%B2\" data-open=\"T29_DBS推进角色\">DBS推进角色\u003c/a>\u003c/td>\n\u003ctd>负责人独立推进证据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>评审只追数字\u003c/td>\n\u003ctd>现场提问与资源决定\u003c/td>\n\u003ctd>\u003ca href=\"#T28_%E9%A2%86%E5%AF%BC%E6%A0%87%E5%87%86%E5%B7%A5%E4%BD%9C\" data-open=\"T28_领导标准工作\">领导标准工作\u003c/a>\u003c/td>\n\u003ctd>领导标准工作和兑现记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>人才评价随意\u003c/td>\n\u003ctd>绩效、潜力标准和多方证据\u003c/td>\n\u003ctd>\u003ca href=\"#T31_%E4%B9%9D%E5%AE%AB%E6%A0%BC%E4%BA%BA%E6%89%8D%E7%9B%98%E7%82%B9\" data-open=\"T31_九宫格人才盘点\">九宫格人才盘点\u003c/a>\u003c/td>\n\u003ctd>有依据的校准与发展动作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>反复缺陷\u003c/td>\n\u003ctd>测量系统、缺陷分层、工艺与物料记录\u003c/td>\n\u003ctd>\u003ca href=\"#T16_%E5%8F%98%E5%BC%82%E7%AE%A1%E7%90%86%E4%B8%8E%E8%B4%A8%E9%87%8F%E6%8E%A7%E5%88%B6\" data-open=\"T16_变异管理与质量控制\">变异管理与质量控制\u003c/a>\u003c/td>\n\u003ctd>可信数据及适用过程控制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>返工多\u003c/td>\n\u003ctd>批次、工序、条件与损失\u003c/td>\n\u003ctd>\u003ca href=\"#T06_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E6%B5%81%E7%A8%8B\" data-open=\"T06_问题解决流程\">问题解决流程\u003c/a>\u003c/td>\n\u003ctd>原因证据与经验证对策\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>漏检流出\u003c/td>\n\u003ctd>检测能力、放行与客户记录\u003c/td>\n\u003ctd>\u003ca href=\"#T09_%E6%A0%87%E5%87%86%E4%BD%9C%E4%B8%9A\" data-open=\"T09_标准作业\">标准作业\u003c/a>\u003c/td>\n\u003ctd>异常及放行标准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>现场隐患\u003c/td>\n\u003ctd>任务风险和现场条件\u003c/td>\n\u003ctd>\u003ca href=\"#T12_%E7%8E%B0%E5%9C%BA%E8%A7%82%E5%AF%9F\" data-open=\"T12_现场观察\">现场观察\u003c/a>\u003c/td>\n\u003ctd>即时控制与责任闭环\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>一个试点可以先用VSM定位流程，再用PSP验证原因，随后组合换型、标准作业或拉动等方法。不要为了覆盖工具清单而人为制造多个项目。最终用同口径QDC与现场行为验收。\u003c/p>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"03_按问题选择工具.md"},{"name":"04_90天部署与运营节奏","title":"90天起步与运营节奏","raw":"# 90天起步与运营节奏\r\n\r\n> 校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\r\n\r\n## 当前诊断与目标\r\n\r\n已知：团队听过5天课程，概念、工具尚不清晰，也没有固定运行节奏。目标：让团队在真实业务中完成一轮选择、诊断、改善、验证、维持和带教。本轮经营焦点为产品质量、交付期、成本控制；库存作为支持指标。\r\n\r\n未提供已填妥的海顺部署矩阵、经营基线和资源容量，因此不编造目标数字，也不判定哪道工序已经是根因。\r\n\r\n## 先补战略选择，再选一个产品族试点\r\n\r\n确认服务的客户及CTQ、交付定义、业务价值、竞争或替代压力、资源约束；比较候选产品族的损失、代表性、可控性和学习条件。总经理决定选择理由与不做事项。\r\n\r\n选择一个有真实QDC差距且可获得数据的产品族，明确从需求/承诺到生产、检验放行及交付的边界，指定一个端到端负责人。不是六个职能各选一个项目。若当前只解决局部经营问题，可先用问题解决与DM；只有具有战略突破意义的能力差距才纳入PD。\r\n\r\n## 十二周起步安排（按证据推进）\r\n\r\n| 阶段 | 做什么 | 产出 | 进入下一阶段的条件 |\r\n|---|---|---|---|\r\n| 第1—2周：建立事实 | 统一概念与测量；跟随真实订单和批次；观察过程与等待 | 试点章程、共同指标字典、现状图；可参考8—12周历史数据，按可得性与季节性调整 | 他人可复算；主要接口可追溯；缺失数据已标明 |\r\n| 第3—4周：选择机制 | 分层损失、提出和验证原因假设；选择一个优先改善；协商资源 | IP贡献假设、TTI、资源、试验计划 | 主责与资源明确；试验能区分主要解释；QDC边界写清 |\r\n| 第5—8周：小范围验证 | 执行、对照预期与实际、记录副作用；边做边带教 | 原因证据、试验记录、周/月决定 | 同口径效果有支持证据；其他QDC未被转嫁；知道适用限制 |\r\n| 第9—12周：维持与移交 | 跨班次/批次复验；换人独立执行；形成标准与异常响应 | 标准、能力证据、持续结果、扩展或继续验证决定 | 能独立维持且有持续证据，才考虑复制 |\r\n\r\n这不是90天必须结项的承诺。若原因、测量或持续性证据不足，继续验证；6—12个月的扩展按能力和验证结果逐步推进。\r\n\r\n## 最小运行节奏\r\n\r\n| 节奏 | 主持与参与 | 核心问题 | 必须留下 |\r\n|---|---|---|---|\r\n| 每日/班次10—15分钟 | 现场或流程负责人及相关岗位 | 今天哪些质量与交付风险需要立即响应？ | 异常、遏制、责任、响应时限与升级 |\r\n| 每周45—60分钟 | 端到端负责人、跨职能骨干和教练 | 假设验证到哪里？哪些障碍需决定？ | 证据、继续/修改/停止决定、资源承诺 |\r\n| 每月60—90分钟 | 总经理与负责人 | QDC效果是否真实？机制和人才是否形成？ | 资源与取舍决定、未验证之处、下期验证 |\r\n\r\n时长是初始建议；并入现有会议，取消重复汇报。AAR按关键事件或里程碑融入周评审，不另造会议体系。\r\n\r\n## 指标最小集合\r\n\r\n初始从5—7项中选实际需要的组合，不将此数量当硬性标准：客户质量、OTIF或OTD、质量损失成本/可控单位成本，配以FPY、端到端周期及一个关键机制指标。库存分层及周转仅在相关时作为支持。每项都必须定义对象、单位、分母、数据源、基线、目标、责任、频率和用途。\r\n\r\n同一OTIF事实可以支持日常异常响应和月度突破评审。保留客户请求、首次承诺和批准变更，不能改期消灭逾期。没有数据标未测；目标在基线与资源核实后批准。\r\n\r\n## 角色与分工\r\n\r\n总经理负责方向、取舍、资源和领导示范；端到端负责人负责流程结果和跨部门闭环；骨干负责事实采集、标准与试验；教练负责方法与能力形成。DBS推进者不能代替业务负责人。\r\n\r\nF02供应链/生产与F06质量是本轮主要观察视角；F03提供客户与需求，F04确认成本与收益，F05安排带教；F01仅在新品或设计转移相关时参与。成熟度与横向复制放到有证据后使用。\r\n\r\n## 使用哪些记录\r\n\r\n[[TPL14_战略到执行一页纸]] 与 [[TPL06_PD部署链与资源协商]] 说明选择和部署；[[TPL02_指标定义与基线]] 与 [[TPL05_保龄图与行动计划]] 记录效果；[[TPL04_问题解决记录]] 记录验证；[[TPL03_日常管理与异常升级]]、[[TPL07_周月评审与决定记录]]、[[TPL09_标准化与移交验收]] 和 [[TPL10_能力与带教记录]] 连接运行与人才。可合并成一套工作簿，只启用当下需要的字段。\r\n\r\n## 总经理怎样判断已经开始落地\r\n\r\n随机抽一笔订单或一个批次：能追出原始要求与承诺、当前偏差、谁在行动、依据是什么、下一步何时验证；随机问一名骨干：能现场演示标准并判断异常；随机抽一项月度决定：能看到资源是否兑现。完成培训、矩阵和看板不构成落地证据。\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>90天起步与运营节奏\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003ch2>当前诊断与目标\u003c/h2>\n\u003cp>已知：团队听过5天课程，概念、工具尚不清晰，也没有固定运行节奏。目标：让团队在真实业务中完成一轮选择、诊断、改善、验证、维持和带教。本轮经营焦点为产品质量、交付期、成本控制；库存作为支持指标。\u003c/p>\n\u003cp>未提供已填妥的海顺部署矩阵、经营基线和资源容量，因此不编造目标数字，也不判定哪道工序已经是根因。\u003c/p>\n\u003ch2>先补战略选择，再选一个产品族试点\u003c/h2>\n\u003cp>确认服务的客户及CTQ、交付定义、业务价值、竞争或替代压力、资源约束；比较候选产品族的损失、代表性、可控性和学习条件。总经理决定选择理由与不做事项。\u003c/p>\n\u003cp>选择一个有真实QDC差距且可获得数据的产品族，明确从需求/承诺到生产、检验放行及交付的边界，指定一个端到端负责人。不是六个职能各选一个项目。若当前只解决局部经营问题，可先用问题解决与DM；只有具有战略突破意义的能力差距才纳入PD。\u003c/p>\n\u003ch2>十二周起步安排（按证据推进）\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段\u003c/th>\n\u003cth>做什么\u003c/th>\n\u003cth>产出\u003c/th>\n\u003cth>进入下一阶段的条件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1—2周：建立事实\u003c/td>\n\u003ctd>统一概念与测量；跟随真实订单和批次；观察过程与等待\u003c/td>\n\u003ctd>试点章程、共同指标字典、现状图；可参考8—12周历史数据，按可得性与季节性调整\u003c/td>\n\u003ctd>他人可复算；主要接口可追溯；缺失数据已标明\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3—4周：选择机制\u003c/td>\n\u003ctd>分层损失、提出和验证原因假设；选择一个优先改善；协商资源\u003c/td>\n\u003ctd>IP贡献假设、TTI、资源、试验计划\u003c/td>\n\u003ctd>主责与资源明确；试验能区分主要解释；QDC边界写清\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5—8周：小范围验证\u003c/td>\n\u003ctd>执行、对照预期与实际、记录副作用；边做边带教\u003c/td>\n\u003ctd>原因证据、试验记录、周/月决定\u003c/td>\n\u003ctd>同口径效果有支持证据；其他QDC未被转嫁；知道适用限制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第9—12周：维持与移交\u003c/td>\n\u003ctd>跨班次/批次复验；换人独立执行；形成标准与异常响应\u003c/td>\n\u003ctd>标准、能力证据、持续结果、扩展或继续验证决定\u003c/td>\n\u003ctd>能独立维持且有持续证据，才考虑复制\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这不是90天必须结项的承诺。若原因、测量或持续性证据不足，继续验证；6—12个月的扩展按能力和验证结果逐步推进。\u003c/p>\n\u003ch2>最小运行节奏\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>节奏\u003c/th>\n\u003cth>主持与参与\u003c/th>\n\u003cth>核心问题\u003c/th>\n\u003cth>必须留下\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>每日/班次10—15分钟\u003c/td>\n\u003ctd>现场或流程负责人及相关岗位\u003c/td>\n\u003ctd>今天哪些质量与交付风险需要立即响应？\u003c/td>\n\u003ctd>异常、遏制、责任、响应时限与升级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>每周45—60分钟\u003c/td>\n\u003ctd>端到端负责人、跨职能骨干和教练\u003c/td>\n\u003ctd>假设验证到哪里？哪些障碍需决定？\u003c/td>\n\u003ctd>证据、继续/修改/停止决定、资源承诺\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>每月60—90分钟\u003c/td>\n\u003ctd>总经理与负责人\u003c/td>\n\u003ctd>QDC效果是否真实？机制和人才是否形成？\u003c/td>\n\u003ctd>资源与取舍决定、未验证之处、下期验证\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>时长是初始建议；并入现有会议，取消重复汇报。AAR按关键事件或里程碑融入周评审，不另造会议体系。\u003c/p>\n\u003ch2>指标最小集合\u003c/h2>\n\u003cp>初始从5—7项中选实际需要的组合，不将此数量当硬性标准：客户质量、OTIF或OTD、质量损失成本/可控单位成本，配以FPY、端到端周期及一个关键机制指标。库存分层及周转仅在相关时作为支持。每项都必须定义对象、单位、分母、数据源、基线、目标、责任、频率和用途。\u003c/p>\n\u003cp>同一OTIF事实可以支持日常异常响应和月度突破评审。保留客户请求、首次承诺和批准变更，不能改期消灭逾期。没有数据标未测；目标在基线与资源核实后批准。\u003c/p>\n\u003ch2>角色与分工\u003c/h2>\n\u003cp>总经理负责方向、取舍、资源和领导示范；端到端负责人负责流程结果和跨部门闭环；骨干负责事实采集、标准与试验；教练负责方法与能力形成。DBS推进者不能代替业务负责人。\u003c/p>\n\u003cp>F02供应链/生产与F06质量是本轮主要观察视角；F03提供客户与需求，F04确认成本与收益，F05安排带教；F01仅在新品或设计转移相关时参与。成熟度与横向复制放到有证据后使用。\u003c/p>\n\u003ch2>使用哪些记录\u003c/h2>\n\u003cp>\u003ca href=\"#TPL14_%E6%88%98%E7%95%A5%E5%88%B0%E6%89%A7%E8%A1%8C%E4%B8%80%E9%A1%B5%E7%BA%B8\" data-open=\"TPL14_战略到执行一页纸\">战略到执行一页纸\u003c/a> 与 \u003ca href=\"#TPL06_PD%E9%83%A8%E7%BD%B2%E9%93%BE%E4%B8%8E%E8%B5%84%E6%BA%90%E5%8D%8F%E5%95%86\" data-open=\"TPL06_PD部署链与资源协商\">PD部署链与资源协商\u003c/a> 说明选择和部署；\u003ca href=\"#TPL02_%E6%8C%87%E6%A0%87%E5%AE%9A%E4%B9%89%E4%B8%8E%E5%9F%BA%E7%BA%BF\" data-open=\"TPL02_指标定义与基线\">指标定义与基线\u003c/a> 与 \u003ca href=\"#TPL05_%E4%BF%9D%E9%BE%84%E5%9B%BE%E4%B8%8E%E8%A1%8C%E5%8A%A8%E8%AE%A1%E5%88%92\" data-open=\"TPL05_保龄图与行动计划\">保龄图与行动计划\u003c/a> 记录效果；\u003ca href=\"#TPL04_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E8%AE%B0%E5%BD%95\" data-open=\"TPL04_问题解决记录\">问题解决记录\u003c/a> 记录验证；\u003ca href=\"#TPL03_%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86%E4%B8%8E%E5%BC%82%E5%B8%B8%E5%8D%87%E7%BA%A7\" data-open=\"TPL03_日常管理与异常升级\">日常管理与异常升级\u003c/a>、\u003ca href=\"#TPL07_%E5%91%A8%E6%9C%88%E8%AF%84%E5%AE%A1%E4%B8%8E%E5%86%B3%E5%AE%9A%E8%AE%B0%E5%BD%95\" data-open=\"TPL07_周月评审与决定记录\">周月评审与决定记录\u003c/a>、\u003ca href=\"#TPL09_%E6%A0%87%E5%87%86%E5%8C%96%E4%B8%8E%E7%A7%BB%E4%BA%A4%E9%AA%8C%E6%94%B6\" data-open=\"TPL09_标准化与移交验收\">标准化与移交验收\u003c/a> 和 \u003ca href=\"#TPL10_%E8%83%BD%E5%8A%9B%E4%B8%8E%E5%B8%A6%E6%95%99%E8%AE%B0%E5%BD%95\" data-open=\"TPL10_能力与带教记录\">能力与带教记录\u003c/a> 连接运行与人才。可合并成一套工作簿，只启用当下需要的字段。\u003c/p>\n\u003ch2>总经理怎样判断已经开始落地\u003c/h2>\n\u003cp>随机抽一笔订单或一个批次：能追出原始要求与承诺、当前偏差、谁在行动、依据是什么、下一步何时验证；随机问一名骨干：能现场演示标准并判断异常；随机抽一项月度决定：能看到资源是否兑现。完成培训、矩阵和看板不构成落地证据。\u003c/p>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"04_90天部署与运营节奏.md"},{"name":"05_场景完整演练","title":"一个QDC试点怎样运行｜教学场景","raw":"# 一个QDC试点怎样运行｜教学场景\r\n\r\n> 校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\r\n\r\n## 场景与边界\r\n\r\n以下为假设场景，不是海顺已经发生的事件或已证明方案：某产品族换型后返工增加，导致延期和成本上升。目的在于演示从目标到现场的方法，不提供虚构收益数字。\r\n\r\n| 环节 | 具体动作与方法 | 产出 | 验收与下一步 |\r\n|---|---|---|---|\r\n| 选择范围 | VOC核对客户质量与交付要求，选一个产品族和端到端主责 | 章程与QDC边界 | 判断是否有战略能力差距；一般异常可先用DM/PSP |\r\n| 定义事实 | 复算客户质量、FPY、OTIF、返工报废和加急成本 | 指标字典与基线 | 分母、返工、到期未交与原承诺均保留 |\r\n| 观察现状 | VSM跟随订单至生产、检验放行和交付，拆开处理与等待 | 当前流程与损失分层 | 不凭部门印象判原因 |\r\n| 提出假设 | Pareto定位损失集中工序；5Why追问准备、参数、测量、物料和交接 | 原因假设及支持/反对证据 | 验证测量，再比较条件；防止只因同时出现就判因果 |\r\n| 设计试验 | 若证据支持准备和参数恢复不稳，试行换型准备与首件响应；若不支持，修订假设 | 受控试验、预期、停止条件和主责 | 质量人员确认适用放行条件，风险受控 |\r\n| 效果检查 | 同口径比较换型、首件、返工、交付与损失；检查产品组合等影响 | 结果与限制说明 | 换型变快但报废增加不能直接推广 |\r\n| 维持 | 更新标准、现场独立演示、建立异常阈值与升级 | 标准与带教记录 | 跨批次/班次持续有效，才考虑扩展 |\r\n\r\n## 怎样接入PD和DM\r\n\r\n若该机制是年度突破所需能力，写入IP、TTI与资源计划，在月度PD验证；每日仍用同一事实处理将到期风险和质量异常。行动完成不能替代效果达成，发现假设失效应停止或调整。\r\n\r\n## 成本怎样确认\r\n\r\n实际报废、返工材料、额外加班或外包变化按相同产品和成本边界复核；释放工时单列为能力，不自动计现金。若交付改善通过大量加急实现，应明确这项代价，不宣称QDC联合成功。\r\n\r\n## 课堂练习\r\n\r\n拿一笔真实订单照此走一遍。必须写出一个尚不确定的原因、能推翻它的证据、一个有责任与期限的调查动作。使用 [[TPL04_问题解决记录]] 与 [[TPL05_保龄图与行动计划]]。\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>一个QDC试点怎样运行｜教学场景\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003ch2>场景与边界\u003c/h2>\n\u003cp>以下为假设场景，不是海顺已经发生的事件或已证明方案：某产品族换型后返工增加，导致延期和成本上升。目的在于演示从目标到现场的方法，不提供虚构收益数字。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>环节\u003c/th>\n\u003cth>具体动作与方法\u003c/th>\n\u003cth>产出\u003c/th>\n\u003cth>验收与下一步\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>选择范围\u003c/td>\n\u003ctd>VOC核对客户质量与交付要求，选一个产品族和端到端主责\u003c/td>\n\u003ctd>章程与QDC边界\u003c/td>\n\u003ctd>判断是否有战略能力差距；一般异常可先用DM/PSP\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>定义事实\u003c/td>\n\u003ctd>复算客户质量、FPY、OTIF、返工报废和加急成本\u003c/td>\n\u003ctd>指标字典与基线\u003c/td>\n\u003ctd>分母、返工、到期未交与原承诺均保留\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>观察现状\u003c/td>\n\u003ctd>VSM跟随订单至生产、检验放行和交付，拆开处理与等待\u003c/td>\n\u003ctd>当前流程与损失分层\u003c/td>\n\u003ctd>不凭部门印象判原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>提出假设\u003c/td>\n\u003ctd>Pareto定位损失集中工序；5Why追问准备、参数、测量、物料和交接\u003c/td>\n\u003ctd>原因假设及支持/反对证据\u003c/td>\n\u003ctd>验证测量，再比较条件；防止只因同时出现就判因果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>设计试验\u003c/td>\n\u003ctd>若证据支持准备和参数恢复不稳，试行换型准备与首件响应；若不支持，修订假设\u003c/td>\n\u003ctd>受控试验、预期、停止条件和主责\u003c/td>\n\u003ctd>质量人员确认适用放行条件，风险受控\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>效果检查\u003c/td>\n\u003ctd>同口径比较换型、首件、返工、交付与损失；检查产品组合等影响\u003c/td>\n\u003ctd>结果与限制说明\u003c/td>\n\u003ctd>换型变快但报废增加不能直接推广\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>维持\u003c/td>\n\u003ctd>更新标准、现场独立演示、建立异常阈值与升级\u003c/td>\n\u003ctd>标准与带教记录\u003c/td>\n\u003ctd>跨批次/班次持续有效，才考虑扩展\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>怎样接入PD和DM\u003c/h2>\n\u003cp>若该机制是年度突破所需能力，写入IP、TTI与资源计划，在月度PD验证；每日仍用同一事实处理将到期风险和质量异常。行动完成不能替代效果达成，发现假设失效应停止或调整。\u003c/p>\n\u003ch2>成本怎样确认\u003c/h2>\n\u003cp>实际报废、返工材料、额外加班或外包变化按相同产品和成本边界复核；释放工时单列为能力，不自动计现金。若交付改善通过大量加急实现，应明确这项代价，不宣称QDC联合成功。\u003c/p>\n\u003ch2>课堂练习\u003c/h2>\n\u003cp>拿一笔真实订单照此走一遍。必须写出一个尚不确定的原因、能推翻它的证据、一个有责任与期限的调查动作。使用 \u003ca href=\"#TPL04_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E8%AE%B0%E5%BD%95\" data-open=\"TPL04_问题解决记录\">问题解决记录\u003c/a> 与 \u003ca href=\"#TPL05_%E4%BF%9D%E9%BE%84%E5%9B%BE%E4%B8%8E%E8%A1%8C%E5%8A%A8%E8%AE%A1%E5%88%92\" data-open=\"TPL05_保龄图与行动计划\">保龄图与行动计划\u003c/a>。\u003c/p>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"05_场景完整演练.md"},{"name":"06_指标字典","title":"QDC与经营指标：定义、计算和误用边界","raw":"# QDC与经营指标：定义、计算和误用边界\r\n\r\n> 校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\r\n\r\n## 所有指标先填这些字段\r\n\r\n名称、用途（PD/DM/两者）、对象、统计单位、业务范围、分子分母、排除条件、时点、数据源、基线期、样本数、目标方向与期限、责任、频率、缺失和零分母处理、版本。模板见 [[TPL02_指标定义与基线]]。\r\n\r\n| 指标 | 可采用的定义 | 必须防止的误用 |\r\n|---|---|---|\r\n| 客户质量 | 某交付队列中，经约定发现窗口确认不合格的批次/该队列交付批次；也可另选数量口径 | 批次与数量不混算，投诉件数与不合格率分开，发现滞后需说明 |\r\n| FPY一次通过率 | 首次通过且未经返工的合格数量/首次进入该过程的数量 | 返工后合格不能计首次通过；单位、工序边界相同 |\r\n| OTD准时交付 | 本期到期对象中在约定截止前完成交付的数量/本期到期对象数量 | 明确订单/订单行/批次，全部到期未交仍入分母；保留原承诺 |\r\n| OTIF准时足量交付 | 本期到期对象中同时满足约定时间与足量的数量/本期到期对象数量 | 明确足量与容差，统计单位固定；不能凭部分发货视为达成 |\r\n| 端到端周期 | 同一对象终点时间−约定起点时间，按中位数和P90等看分布 | 完成队列可能忽略长期未完，必须另列在途年龄；不只看均值 |\r\n| 质量损失成本 | 在约定边界与期间内实际报废、返工及其他已定义质量损失分项合计 | 先定义成本类别；材料与报废、工时与外包等避免重复；客户索赔另说明 |\r\n| 可控单位成本 | 同口径可控成本/相应合格产出单位，按产品族或可比组合分析 | 固定成本范围、期间与产品组合，分开价格、量、组合和效率影响 |\r\n| 库存周转次数 | 同期间销货成本/同边界平均成本库存 | 期末库存不能不加说明替代平均；频率与边界固定 |\r\n| 库存天数DIO | 平均成本库存/同期间销货成本×期间天数 | 销货成本为零时不适用；非全年不得直接套365；库存核销不是现金释放 |\r\n| 换型时间 | 上一产品最后合格件至下一产品首个合格件的约定时间 | 说明可持续恢复条件，同时看启动废品与后续质量 |\r\n| 可用性 | 约定计划生产时间内实际运行时间/计划生产时间 | 分清计划停机与故障，固定损失分类，非维修次数 |\r\n| 首次齐套率 | 首次检查满足全部约定条件的对象/首次检查对象 | 写清信息齐套或开工物料齐套，不能延后登记隐藏缺项 |\r\n| 预测WAPE | 固定快照与跨度下Σ绝对预测误差/Σ实际 | 实际总量为零时不适用并列绝对误差，不修改过去预测 |\r\n| 预测偏差 | 同队列Σ(预测−实际)/Σ实际 | 正值表示高估须注明；与绝对误差不同 |\r\n| 研发验证周期 | 明确定义的完成项逐项历时的均值/中位数 | 未完成项另列年龄，不能用总历时除以当前项目总数 |\r\n| IFR内部填补率 | 本期内部人员填补岗位次数/本期全部已填补岗位次数 | 固定岗位范围、代理和调动规则，不用员工人数替代岗位事件 |\r\n| 留任率 | 期初队列中期末仍在约定范围人数/期初队列人数 | 新入职不加进原队列分子，转岗和调动按固定边界 |\r\n| 营业利润率 | 同口径营业利润/收入 | 明确调整项和政策，不混用税后利润 |\r\n| ROIC | 常见分析口径：税后经营利润/平均投入资本 | 具体税、资本及平均规则由海顺财务确认，不宣称统一内部DBS公式 |\r\n| EHS频率与严重度 | 事件次数及按明确工时基数归一化的频率；损失工时/天数单独报告 | 事件、工时、天数不混作一个未定义的“事故率”；采用适用制度的定义 |\r\n\r\n## PD、DM与因果\r\n\r\n指标不是管理机制。同一OTIF可用于DM与PD：日常响应订单异常，月度验证能力突破；不要人为另造数据。TTI需同时有测量定义、目标和期限。完成培训或会议只能证明活动，不证明效果。过程指标和结果之间先是贡献假设，须通过证据验证。\r\n\r\n## 收益确认\r\n\r\n费用减少、现金释放、能力释放、客户结果分开记录，避免相加。节时不自动等于减少工资支出；库存减少不自动等于现金流入。共同贡献的项目须制定收益归属，避免多次申报。\r\n\r\n## 历史CVD的使用\r\n\r\n官方2018年概览包含核心价值驱动力（CVD）；本库保留经营结果、客户与人才能力的联接解释，但不把当年的指标集合和计算政策认定为2026年完整内部标准。选择指标以本轮实际问题、客户价值和可靠数据为依据。\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>QDC与经营指标：定义、计算和误用边界\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003ch2>所有指标先填这些字段\u003c/h2>\n\u003cp>名称、用途（PD/DM/两者）、对象、统计单位、业务范围、分子分母、排除条件、时点、数据源、基线期、样本数、目标方向与期限、责任、频率、缺失和零分母处理、版本。模板见 \u003ca href=\"#TPL02_%E6%8C%87%E6%A0%87%E5%AE%9A%E4%B9%89%E4%B8%8E%E5%9F%BA%E7%BA%BF\" data-open=\"TPL02_指标定义与基线\">指标定义与基线\u003c/a>。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>指标\u003c/th>\n\u003cth>可采用的定义\u003c/th>\n\u003cth>必须防止的误用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>客户质量\u003c/td>\n\u003ctd>某交付队列中，经约定发现窗口确认不合格的批次/该队列交付批次；也可另选数量口径\u003c/td>\n\u003ctd>批次与数量不混算，投诉件数与不合格率分开，发现滞后需说明\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FPY一次通过率\u003c/td>\n\u003ctd>首次通过且未经返工的合格数量/首次进入该过程的数量\u003c/td>\n\u003ctd>返工后合格不能计首次通过；单位、工序边界相同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>OTD准时交付\u003c/td>\n\u003ctd>本期到期对象中在约定截止前完成交付的数量/本期到期对象数量\u003c/td>\n\u003ctd>明确订单/订单行/批次，全部到期未交仍入分母；保留原承诺\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>OTIF准时足量交付\u003c/td>\n\u003ctd>本期到期对象中同时满足约定时间与足量的数量/本期到期对象数量\u003c/td>\n\u003ctd>明确足量与容差，统计单位固定；不能凭部分发货视为达成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>端到端周期\u003c/td>\n\u003ctd>同一对象终点时间−约定起点时间，按中位数和P90等看分布\u003c/td>\n\u003ctd>完成队列可能忽略长期未完，必须另列在途年龄；不只看均值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>质量损失成本\u003c/td>\n\u003ctd>在约定边界与期间内实际报废、返工及其他已定义质量损失分项合计\u003c/td>\n\u003ctd>先定义成本类别；材料与报废、工时与外包等避免重复；客户索赔另说明\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可控单位成本\u003c/td>\n\u003ctd>同口径可控成本/相应合格产出单位，按产品族或可比组合分析\u003c/td>\n\u003ctd>固定成本范围、期间与产品组合，分开价格、量、组合和效率影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>库存周转次数\u003c/td>\n\u003ctd>同期间销货成本/同边界平均成本库存\u003c/td>\n\u003ctd>期末库存不能不加说明替代平均；频率与边界固定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>库存天数DIO\u003c/td>\n\u003ctd>平均成本库存/同期间销货成本×期间天数\u003c/td>\n\u003ctd>销货成本为零时不适用；非全年不得直接套365；库存核销不是现金释放\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>换型时间\u003c/td>\n\u003ctd>上一产品最后合格件至下一产品首个合格件的约定时间\u003c/td>\n\u003ctd>说明可持续恢复条件，同时看启动废品与后续质量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可用性\u003c/td>\n\u003ctd>约定计划生产时间内实际运行时间/计划生产时间\u003c/td>\n\u003ctd>分清计划停机与故障，固定损失分类，非维修次数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>首次齐套率\u003c/td>\n\u003ctd>首次检查满足全部约定条件的对象/首次检查对象\u003c/td>\n\u003ctd>写清信息齐套或开工物料齐套，不能延后登记隐藏缺项\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>预测WAPE\u003c/td>\n\u003ctd>固定快照与跨度下Σ绝对预测误差/Σ实际\u003c/td>\n\u003ctd>实际总量为零时不适用并列绝对误差，不修改过去预测\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>预测偏差\u003c/td>\n\u003ctd>同队列Σ(预测−实际)/Σ实际\u003c/td>\n\u003ctd>正值表示高估须注明；与绝对误差不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>研发验证周期\u003c/td>\n\u003ctd>明确定义的完成项逐项历时的均值/中位数\u003c/td>\n\u003ctd>未完成项另列年龄，不能用总历时除以当前项目总数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>IFR内部填补率\u003c/td>\n\u003ctd>本期内部人员填补岗位次数/本期全部已填补岗位次数\u003c/td>\n\u003ctd>固定岗位范围、代理和调动规则，不用员工人数替代岗位事件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>留任率\u003c/td>\n\u003ctd>期初队列中期末仍在约定范围人数/期初队列人数\u003c/td>\n\u003ctd>新入职不加进原队列分子，转岗和调动按固定边界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>营业利润率\u003c/td>\n\u003ctd>同口径营业利润/收入\u003c/td>\n\u003ctd>明确调整项和政策，不混用税后利润\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ROIC\u003c/td>\n\u003ctd>常见分析口径：税后经营利润/平均投入资本\u003c/td>\n\u003ctd>具体税、资本及平均规则由海顺财务确认，不宣称统一内部DBS公式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EHS频率与严重度\u003c/td>\n\u003ctd>事件次数及按明确工时基数归一化的频率；损失工时/天数单独报告\u003c/td>\n\u003ctd>事件、工时、天数不混作一个未定义的“事故率”；采用适用制度的定义\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>PD、DM与因果\u003c/h2>\n\u003cp>指标不是管理机制。同一OTIF可用于DM与PD：日常响应订单异常，月度验证能力突破；不要人为另造数据。TTI需同时有测量定义、目标和期限。完成培训或会议只能证明活动，不证明效果。过程指标和结果之间先是贡献假设，须通过证据验证。\u003c/p>\n\u003ch2>收益确认\u003c/h2>\n\u003cp>费用减少、现金释放、能力释放、客户结果分开记录，避免相加。节时不自动等于减少工资支出；库存减少不自动等于现金流入。共同贡献的项目须制定收益归属，避免多次申报。\u003c/p>\n\u003ch2>历史CVD的使用\u003c/h2>\n\u003cp>官方2018年概览包含核心价值驱动力（CVD）；本库保留经营结果、客户与人才能力的联接解释，但不把当年的指标集合和计算政策认定为2026年完整内部标准。选择指标以本轮实际问题、客户价值和可靠数据为依据。\u003c/p>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"06_指标字典.md"},{"name":"07_来源与版本边界","title":"来源、版本与可证实边界","raw":"# 来源、版本与可证实边界\r\n\r\n内容校正日期：2026-09-30；公开来源核对日期：2026-09-29。本知识库不冒充丹纳赫内部培训或认证教材，也不把通用精益工具标成丹纳赫原创。\r\n\r\n## 证据类型\r\n\r\n| 标记 | 含义 | 能支持什么 |\r\n|---|---|---|\r\n| 官方公开 | 已阅读的丹纳赫公开来源 | 定义、公开架构、工具名称、所述实践 |\r\n| 书中表述 | 用户工作区提供的《丹纳赫模式》 | 书中解释及作者报告的实践，保留PDF页码 |\r\n| 通用方法 | 精益、流程管理、质量和组织发展的通用知识 | 概念解释及方法原理，不证明是DBS专有规程 |\r\n| 教学设计 | 为学习和试点补充的步骤、模板、目标、样例 | 如何操作与练习，不作为企业历史事实 |\r\n\r\n卡片的“证据”说明概念依据；每张卡片的具体步骤、产出、检查和练习默认均为教学操作化，不等于原来源逐字给出的标准程序。\r\n\r\n## S01 本地书籍（主要材料）\r\n\r\n原书：《丹纳赫模式》，杨益、陈朝巍。使用既有逐页校对稿，页码全部是**原PDF页序号**，不是印刷页码。\r\n\r\n- [校对稿](../output/pdf/逐页校对结果/丹纳赫模式_逐页校对稿.md)\r\n- 第84—88页：定义、4P、QDCI、模块架构。\r\n- 第91—97页：核心价值驱动力。\r\n- 第98—108页：共同基础，VSM、改善、可视化与日常管理。\r\n- 第109—116页：精益、物料、PSI、VA/VE等。\r\n- 第118—132页：增长、创新、商业化、漏斗。\r\n- 第133—159页：领导力、培养与组织应用。\r\n- 第161—170页：文化与组织执行条件。\r\n\r\n原书及校对稿保存在原路径，未改写。书中关于收益和成效的表述，不自动视为因果已经证实。\r\n\r\n## S02 当前官网：定义与运行逻辑\r\n\r\n[Danaher Business System](https://www.danaher.com/how-we-work/danaher-business-system)。核实DBS的“持续改进系统与文化”定位及人才、计划、流程、绩效循环。网页是动态页面，访问日期不等于发布年份。仅将已看到的当前表述当作当前官方口径。\r\n\r\n## S03 2018年官方公开概览（历史版本）\r\n\r\n[Danaher Business System — May 2018](https://filecache.investorroom.com/mr5ir_danaher/507/Danaher%20DBS%20Overview%20May%202018.pdf)。共28页，以下为PDF页序：\r\n\r\n- 第5页：Lean、Growth、Leadership的演化。\r\n- 第6页：核心价值驱动力。\r\n- 第7页：方针部署的年度过程。\r\n- 第8页：八项共同基础工具。\r\n- 第11—14页：增长工具与创新、商业化过程。\r\n- 第23—25页：领导发展和行为。\r\n\r\n本库主要通过用户提供书籍整理这些主题，用公开概览交叉核对类别和名称；不复制整套幻灯片。不要把2018年的工具清单、财务口径或领导行为词表宣称为2026年完整内部标准。\r\n\r\n## S04 2025年官方从业者访谈\r\n\r\n[DBS, yes! — Igor Zeltzer](https://jobsblog.danaher.com/blog/dbs-yes-igor-zeltzer-shares-his-passion-for-danahers-continuous-improvement-culture/)，页面日期2025-07-24。核实DBSO教练、工具持续发展与创新应用的描述。访谈提到的项目成绩是当事人叙述，不是本库开展的对照研究。\r\n\r\n## S05 通用精益定义补充\r\n\r\n- [LEI：Standardized Work](https://www.lean.org/lexicon-terms/standardized-work/)：制造现场标准化作业的基本要素。\r\n- [LEI：Value Stream Mapping](https://www.lean.org/lexicon-terms/value-stream-mapping/)：VSM的定义与现状/未来态用途。\r\n- [LEI：Hoshin Kanri与管理体系](https://www.lean.org/the-lean-post/articles/hoshin-kanri-as-a-foundational-piece-of-a-lean-management-system/)：战略部署与日常管理的关系。\r\n\r\n这些是通用方法的补充来源，不是丹纳赫内部工具定义。\r\n\r\n## S06 海顺提供的PD培训课件\r\n\r\n[PD 2026-09-14.pdf](../PD%202026-09-14.pdf)，共61个PDF页面，页面日期为2026/9/5。已提取全文，并视觉检查用于诊断的关键页面。它含培训说明、历史示例与空白模板；本次未见海顺已填写的实际部署矩阵，不能据此审核具体经营目标。\r\n\r\n第18页为突破条件；第23—27页区分优先改善与TTI；第31—37页为矩阵及向行动层部署；第38—48页为行动、结果、对策与评审；第51—58页为管理者职责与PD运行要求。\r\n\r\n## S07 用户既有读书资料\r\n\r\n文件夹“丹读书”，含五层图谱、完整手册、工具卡、X矩阵及关系数据。作为既有学习框架和偏好的输入，不能自动赋予其中所有分类与建议“官方标准”的地位。差异处理见 [[09_原有读书资料校准对照]]。\r\n\r\n## 本次没有声称核实的内容\r\n\r\n2025年可持续发展报告检索到了，但全文抓取因文件大小失败，未作为工具细节依据。未获得丹纳赫内部的完整工具手册、认证要求、实时工具数量、统一成熟度评分和全部业务的现行部署细则。\r\n\r\n因此，遇到PSP具体步数、某工具内部表单或固定频率，本库只提供清楚标为教学设计的可执行版本。工厂之外的应用需要根据实际流程定义数据和标准，不机械照搬制造指标。\r\n\r\n## 关于find-skill\r\n\r\n本任务的瓶颈是概念分类、证据和管理方法设计，而不是缺一个会搜索的技能。现有文件工具、网页核验、Mermaid和Canvas已能交付知识卡、图谱与模板；无需先安装额外技能。\r\n\r\n后续若大量维护Obsidian笔记，可再评估obsidian-markdown、json-canvas或obsidian-bases；若需要可编辑的复杂工程图，可使用已有drawio技能。本次没有安装任何技能或社区插件，也没有以此延后内容交付。\r\n\r\n\r\n## S08 本轮交叉校核的公开方法依据\r\n\r\n- [LEI：Executing Strategy through Daily Management](https://www.lean.org/the-lean-post/articles/executing-strategy-through-daily-management/)：PD与DM相连及领导参与；本库共用指标用途表是教学设计。\r\n- [LEI：Hoshin Kanri实施陷阱](https://www.lean.org/the-lean-post/articles/what-are-the-pitfalls-of-implementing-hoshin-kanri/)：目标协商及横向支持。\r\n- [LEI：Inventory](https://www.lean.org/lexicon-terms/inventory/) 与 [Pull Production](https://www.lean.org/lexicon-terms/pull-production/)：库存作用、拉动类型和适用条件。\r\n- [ASQ：Pareto](https://asq.org/quality-resources/pareto)：问题排序和集中度，不能由排序推出根因。\r\n\r\n## 校正版的授权和验证边界\r\n\r\nS06是用户提供的培训课件，未核实其丹纳赫官方授权身份。课件页码均为PDF页序，不是幻灯片编号；第10页七阶段、第31页多关系矩阵、第37页行动计划来自任一矩阵层级是本次关键核对点。第4页73%说法未找到可核实的原始研究，不作为核心知识事实。\r\n\r\n校正版已替换当前知识卡、手册、模板与图谱的相关口径；历史复核目录及原始读书笔记保留作溯源，不进入当前HTML学习内容。真实经营效果、目标可行性与人员能力须现场验证，不能由文档校对替代。当前内容不构成丹纳赫认证教材。\r\n","html":"\u003ch1>来源、版本与可证实边界\u003c/h1>\n\u003cp>内容校正日期：2026-09-30；公开来源核对日期：2026-09-29。本知识库不冒充丹纳赫内部培训或认证教材，也不把通用精益工具标成丹纳赫原创。\u003c/p>\n\u003ch2>证据类型\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>标记\u003c/th>\n\u003cth>含义\u003c/th>\n\u003cth>能支持什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>官方公开\u003c/td>\n\u003ctd>已阅读的丹纳赫公开来源\u003c/td>\n\u003ctd>定义、公开架构、工具名称、所述实践\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>书中表述\u003c/td>\n\u003ctd>用户工作区提供的《丹纳赫模式》\u003c/td>\n\u003ctd>书中解释及作者报告的实践，保留PDF页码\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>通用方法\u003c/td>\n\u003ctd>精益、流程管理、质量和组织发展的通用知识\u003c/td>\n\u003ctd>概念解释及方法原理，不证明是DBS专有规程\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>教学设计\u003c/td>\n\u003ctd>为学习和试点补充的步骤、模板、目标、样例\u003c/td>\n\u003ctd>如何操作与练习，不作为企业历史事实\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>卡片的“证据”说明概念依据；每张卡片的具体步骤、产出、检查和练习默认均为教学操作化，不等于原来源逐字给出的标准程序。\u003c/p>\n\u003ch2>S01 本地书籍（主要材料）\u003c/h2>\n\u003cp>原书：《丹纳赫模式》，杨益、陈朝巍。使用既有逐页校对稿，页码全部是\u003cstrong>原PDF页序号\u003c/strong>，不是印刷页码。\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"../output/pdf/%E9%80%90%E9%A1%B5%E6%A0%A1%E5%AF%B9%E7%BB%93%E6%9E%9C/%E4%B8%B9%E7%BA%B3%E8%B5%AB%E6%A8%A1%E5%BC%8F_%E9%80%90%E9%A1%B5%E6%A0%A1%E5%AF%B9%E7%A8%BF.md\">校对稿\u003c/a>\u003c/li>\n\u003cli>第84—88页：定义、4P、QDCI、模块架构。\u003c/li>\n\u003cli>第91—97页：核心价值驱动力。\u003c/li>\n\u003cli>第98—108页：共同基础，VSM、改善、可视化与日常管理。\u003c/li>\n\u003cli>第109—116页：精益、物料、PSI、VA/VE等。\u003c/li>\n\u003cli>第118—132页：增长、创新、商业化、漏斗。\u003c/li>\n\u003cli>第133—159页：领导力、培养与组织应用。\u003c/li>\n\u003cli>第161—170页：文化与组织执行条件。\u003c/li>\n\u003c/ul>\n\u003cp>原书及校对稿保存在原路径，未改写。书中关于收益和成效的表述，不自动视为因果已经证实。\u003c/p>\n\u003ch2>S02 当前官网：定义与运行逻辑\u003c/h2>\n\u003cp>\u003ca href=\"https://www.danaher.com/how-we-work/danaher-business-system\" target=\"_blank\" rel=\"noopener noreferrer\">Danaher Business System\u003c/a>。核实DBS的“持续改进系统与文化”定位及人才、计划、流程、绩效循环。网页是动态页面，访问日期不等于发布年份。仅将已看到的当前表述当作当前官方口径。\u003c/p>\n\u003ch2>S03 2018年官方公开概览（历史版本）\u003c/h2>\n\u003cp>\u003ca href=\"https://filecache.investorroom.com/mr5ir_danaher/507/Danaher%20DBS%20Overview%20May%202018.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Danaher Business System — May 2018\u003c/a>。共28页，以下为PDF页序：\u003c/p>\n\u003cul>\n\u003cli>第5页：Lean、Growth、Leadership的演化。\u003c/li>\n\u003cli>第6页：核心价值驱动力。\u003c/li>\n\u003cli>第7页：方针部署的年度过程。\u003c/li>\n\u003cli>第8页：八项共同基础工具。\u003c/li>\n\u003cli>第11—14页：增长工具与创新、商业化过程。\u003c/li>\n\u003cli>第23—25页：领导发展和行为。\u003c/li>\n\u003c/ul>\n\u003cp>本库主要通过用户提供书籍整理这些主题，用公开概览交叉核对类别和名称；不复制整套幻灯片。不要把2018年的工具清单、财务口径或领导行为词表宣称为2026年完整内部标准。\u003c/p>\n\u003ch2>S04 2025年官方从业者访谈\u003c/h2>\n\u003cp>\u003ca href=\"https://jobsblog.danaher.com/blog/dbs-yes-igor-zeltzer-shares-his-passion-for-danahers-continuous-improvement-culture/\" target=\"_blank\" rel=\"noopener noreferrer\">DBS, yes! — Igor Zeltzer\u003c/a>，页面日期2025-07-24。核实DBSO教练、工具持续发展与创新应用的描述。访谈提到的项目成绩是当事人叙述，不是本库开展的对照研究。\u003c/p>\n\u003ch2>S05 通用精益定义补充\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://www.lean.org/lexicon-terms/standardized-work/\" target=\"_blank\" rel=\"noopener noreferrer\">LEI：Standardized Work\u003c/a>：制造现场标准化作业的基本要素。\u003c/li>\n\u003cli>\u003ca href=\"https://www.lean.org/lexicon-terms/value-stream-mapping/\" target=\"_blank\" rel=\"noopener noreferrer\">LEI：Value Stream Mapping\u003c/a>：VSM的定义与现状/未来态用途。\u003c/li>\n\u003cli>\u003ca href=\"https://www.lean.org/the-lean-post/articles/hoshin-kanri-as-a-foundational-piece-of-a-lean-management-system/\" target=\"_blank\" rel=\"noopener noreferrer\">LEI：Hoshin Kanri与管理体系\u003c/a>：战略部署与日常管理的关系。\u003c/li>\n\u003c/ul>\n\u003cp>这些是通用方法的补充来源，不是丹纳赫内部工具定义。\u003c/p>\n\u003ch2>S06 海顺提供的PD培训课件\u003c/h2>\n\u003cp>\u003ca href=\"../PD%202026-09-14.pdf\">PD 2026-09-14.pdf\u003c/a>，共61个PDF页面，页面日期为2026/9/5。已提取全文，并视觉检查用于诊断的关键页面。它含培训说明、历史示例与空白模板；本次未见海顺已填写的实际部署矩阵，不能据此审核具体经营目标。\u003c/p>\n\u003cp>第18页为突破条件；第23—27页区分优先改善与TTI；第31—37页为矩阵及向行动层部署；第38—48页为行动、结果、对策与评审；第51—58页为管理者职责与PD运行要求。\u003c/p>\n\u003ch2>S07 用户既有读书资料\u003c/h2>\n\u003cp>文件夹“丹读书”，含五层图谱、完整手册、工具卡、X矩阵及关系数据。作为既有学习框架和偏好的输入，不能自动赋予其中所有分类与建议“官方标准”的地位。差异处理见 \u003ca href=\"#09_%E5%8E%9F%E6%9C%89%E8%AF%BB%E4%B9%A6%E8%B5%84%E6%96%99%E6%A0%A1%E5%87%86%E5%AF%B9%E7%85%A7\" data-open=\"09_原有读书资料校准对照\">原有读书资料校准对照\u003c/a>。\u003c/p>\n\u003ch2>本次没有声称核实的内容\u003c/h2>\n\u003cp>2025年可持续发展报告检索到了，但全文抓取因文件大小失败，未作为工具细节依据。未获得丹纳赫内部的完整工具手册、认证要求、实时工具数量、统一成熟度评分和全部业务的现行部署细则。\u003c/p>\n\u003cp>因此，遇到PSP具体步数、某工具内部表单或固定频率，本库只提供清楚标为教学设计的可执行版本。工厂之外的应用需要根据实际流程定义数据和标准，不机械照搬制造指标。\u003c/p>\n\u003ch2>关于find-skill\u003c/h2>\n\u003cp>本任务的瓶颈是概念分类、证据和管理方法设计，而不是缺一个会搜索的技能。现有文件工具、网页核验、Mermaid和Canvas已能交付知识卡、图谱与模板；无需先安装额外技能。\u003c/p>\n\u003cp>后续若大量维护Obsidian笔记，可再评估obsidian-markdown、json-canvas或obsidian-bases；若需要可编辑的复杂工程图，可使用已有drawio技能。本次没有安装任何技能或社区插件，也没有以此延后内容交付。\u003c/p>\n\u003ch2>S08 本轮交叉校核的公开方法依据\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://www.lean.org/the-lean-post/articles/executing-strategy-through-daily-management/\" target=\"_blank\" rel=\"noopener noreferrer\">LEI：Executing Strategy through Daily Management\u003c/a>：PD与DM相连及领导参与；本库共用指标用途表是教学设计。\u003c/li>\n\u003cli>\u003ca href=\"https://www.lean.org/the-lean-post/articles/what-are-the-pitfalls-of-implementing-hoshin-kanri/\" target=\"_blank\" rel=\"noopener noreferrer\">LEI：Hoshin Kanri实施陷阱\u003c/a>：目标协商及横向支持。\u003c/li>\n\u003cli>\u003ca href=\"https://www.lean.org/lexicon-terms/inventory/\" target=\"_blank\" rel=\"noopener noreferrer\">LEI：Inventory\u003c/a> 与 \u003ca href=\"https://www.lean.org/lexicon-terms/pull-production/\" target=\"_blank\" rel=\"noopener noreferrer\">Pull Production\u003c/a>：库存作用、拉动类型和适用条件。\u003c/li>\n\u003cli>\u003ca href=\"https://asq.org/quality-resources/pareto\" target=\"_blank\" rel=\"noopener noreferrer\">ASQ：Pareto\u003c/a>：问题排序和集中度，不能由排序推出根因。\u003c/li>\n\u003c/ul>\n\u003ch2>校正版的授权和验证边界\u003c/h2>\n\u003cp>S06是用户提供的培训课件，未核实其丹纳赫官方授权身份。课件页码均为PDF页序，不是幻灯片编号；第10页七阶段、第31页多关系矩阵、第37页行动计划来自任一矩阵层级是本次关键核对点。第4页73%说法未找到可核实的原始研究，不作为核心知识事实。\u003c/p>\n\u003cp>校正版已替换当前知识卡、手册、模板与图谱的相关口径；历史复核目录及原始读书笔记保留作溯源，不进入当前HTML学习内容。真实经营效果、目标可行性与人员能力须现场验证，不能由文档校对替代。当前内容不构成丹纳赫认证教材。\u003c/p>\n","file":"07_来源与版本边界.md"},{"name":"08_知识图谱说明","title":"怎样读知识图谱","raw":"# 怎样读知识图谱\r\n\r\n> 校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\r\n\r\n## 节点和有方向的关系\r\n\r\n节点包括概念C、能力模块M、工具T、战略部署D、职能应用F、扩展机制X、角色R、问题P、指标K、模板TPL与来源S。卡片ID保持稳定，文件路径保留兼容。\r\n\r\n箭头表示明确的管理关系，如“支撑”“记录”“检验”“部署为”“反馈”。它不是已经证明的统计因果；“相邻节点”也不是必然执行顺序。目标与IP允许多对多。\r\n\r\n入边与出边都可阅读，不要求为每一条关系手工补一个反向链接。每条边保留证据说明，区分来源分类与教学联接。图谱结构不替代卡片的适用条件和证据。\r\n\r\n## 文件一致性\r\n\r\nMarkdown是内容主源；图谱/cards.json提取55张知识卡；知识图谱.json及节点表、关系表CSV供交换；5张Canvas用于Obsidian关系导航；HTML内嵌同版数据与全文。历史复核和备份不参与当前索引。\r\n\r\n## 阅读顺序\r\n\r\n先看体系分类，再读PD与DM两个回路，继而按问题选工具，最后看岗位与模板。职能手册是协作视角，扩展机制按证据条件启用。关系有疑问时先读两端定义和边界，不从画面位置推断组织授权。\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>怎样读知识图谱\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003ch2>节点和有方向的关系\u003c/h2>\n\u003cp>节点包括概念C、能力模块M、工具T、战略部署D、职能应用F、扩展机制X、角色R、问题P、指标K、模板TPL与来源S。卡片ID保持稳定，文件路径保留兼容。\u003c/p>\n\u003cp>箭头表示明确的管理关系，如“支撑”“记录”“检验”“部署为”“反馈”。它不是已经证明的统计因果；“相邻节点”也不是必然执行顺序。目标与IP允许多对多。\u003c/p>\n\u003cp>入边与出边都可阅读，不要求为每一条关系手工补一个反向链接。每条边保留证据说明，区分来源分类与教学联接。图谱结构不替代卡片的适用条件和证据。\u003c/p>\n\u003ch2>文件一致性\u003c/h2>\n\u003cp>Markdown是内容主源；图谱/cards.json提取55张知识卡；知识图谱.json及节点表、关系表CSV供交换；5张Canvas用于Obsidian关系导航；HTML内嵌同版数据与全文。历史复核和备份不参与当前索引。\u003c/p>\n\u003ch2>阅读顺序\u003c/h2>\n\u003cp>先看体系分类，再读PD与DM两个回路，继而按问题选工具，最后看岗位与模板。职能手册是协作视角，扩展机制按证据条件启用。关系有疑问时先读两端定义和边界，不从画面位置推断组织授权。\u003c/p>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"08_知识图谱说明.md"},{"name":"09_原有读书资料校准对照","title":"原资料如何进入校正版","raw":"# 原资料如何进入校正版\r\n\r\n> 校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\r\n\r\n| 原资料中容易混淆的内容 | 校正版处理 |\r\n|---|---|\r\n| 把五层图、能力模块和QDCI并为同一分类 | 区分运行逻辑、经营方向、能力架构与管理机制 |\r\n| 工具目录被当作固定执行顺序 | 从实际问题、证据、适用条件选择工具 |\r\n| 把历史公开清单作为现行内部全部标准 | 标出2018年历史版本、当前官网与通用补充 |\r\n| 把课件表述直接升格为通用规则 | 对七阶段、关系矩阵、行动层级等核对原页；对绝对化解释作边界修订 |\r\n| PD与DM只能采用不同指标 | 共用事实底座，区分用途、目标、周期与责任 |\r\n| 目标与IP一对一、5Why直接找到根因 | 多对多贡献关系；原因必须取证验证 |\r\n| 只关注降库存或某职能单项指标 | 本轮QDC联合验收，库存作为支持指标 |\r\n| 六职能各自90天推进 | 统一为一个跨职能产品族试点 |\r\n\r\n原始书籍、课件和“丹读书”笔记保留，以免失去溯源。当前使用本目录校正版，详细修订映射见 [[12_校正版修订与验收记录]]。\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>原资料如何进入校正版\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>原资料中容易混淆的内容\u003c/th>\n\u003cth>校正版处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>把五层图、能力模块和QDCI并为同一分类\u003c/td>\n\u003ctd>区分运行逻辑、经营方向、能力架构与管理机制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工具目录被当作固定执行顺序\u003c/td>\n\u003ctd>从实际问题、证据、适用条件选择工具\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>把历史公开清单作为现行内部全部标准\u003c/td>\n\u003ctd>标出2018年历史版本、当前官网与通用补充\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>把课件表述直接升格为通用规则\u003c/td>\n\u003ctd>对七阶段、关系矩阵、行动层级等核对原页；对绝对化解释作边界修订\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PD与DM只能采用不同指标\u003c/td>\n\u003ctd>共用事实底座，区分用途、目标、周期与责任\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>目标与IP一对一、5Why直接找到根因\u003c/td>\n\u003ctd>多对多贡献关系；原因必须取证验证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>只关注降库存或某职能单项指标\u003c/td>\n\u003ctd>本轮QDC联合验收，库存作为支持指标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>六职能各自90天推进\u003c/td>\n\u003ctd>统一为一个跨职能产品族试点\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>原始书籍、课件和“丹读书”笔记保留，以免失去溯源。当前使用本目录校正版，详细修订映射见 \u003ca href=\"#12_%E6%A0%A1%E6%AD%A3%E7%89%88%E4%BF%AE%E8%AE%A2%E4%B8%8E%E9%AA%8C%E6%94%B6%E8%AE%B0%E5%BD%95\" data-open=\"12_校正版修订与验收记录\">校正版修订与验收记录\u003c/a>。\u003c/p>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA% ile":"12_校正版修订与验收记录.md"},{"name":"13_QDC模拟训练与填表示范","title":"QDC模拟训练：从原始记录到评审决定","raw":"# QDC模拟训练：从原始记录到评审决定\r\n\r\n**全部产品、订单、数值、目标和角色安排均为模拟教学数据，不是海顺经营事实，也不证明某种对策已经有效。** 2026-09-30使用改进版。\r\n\r\n## 任务与测量边界\r\n\r\n同一假设产品族，每期6条到期订单，每条100件，均在该期首次进入观察工序。质量看首次通过率FPY；交付看本期到期订单行OTIF；成本看已定义范围内的返工报废损失。工序FPY不能替代客户质量，客户放行要求仍须满足。\r\n\r\n按期足量依据固定承诺截止与100件要求；FPY不含返工后合格。损失金额已经包含本例范围内的返工报废，不能再重复加材料或工时。各期产品结构相同便于练习，真实业务要检查组合及其他影响。\r\n\r\n## 1. 原始记录\r\n\r\n| 周期 | 订单行 | 首次投入件数 | 首次通过件数 | 按承诺截止的交付 | OTIF | 损失金额（元） |\r\n|---|---|---:|---:|---|---|---:|\r\n| A基线 | A01 | 100 | 90 | 按期100件 | 是 | 200 |\r\n| A基线 | A02 | 100 | 85 | 截止未交，次日交100件 | 否 | 200 |\r\n| A基线 | A03 | 100 | 95 | 按期100件 | 是 | 200 |\r\n| A基线 | A04 | 100 | 90 | 按期100件 | 是 | 200 |\r\n| A基线 | A05 | 100 | 88 | 按期80件，余20件次日交 | 否 | 200 |\r\n| A基线 | A06 | 100 | 92 | 按期100件 | 是 | 200 |\r\n| B试行 | B01 | 100 | 95 | 按期100件 | 是 | 120 |\r\n| B试行 | B02 | 100 | 94 | 按期100件 | 是 | 120 |\r\n| B试行 | B03 | 100 | 96 | 按期100件 | 是 | 120 |\r\n| B试行 | B04 | 100 | 95 | 按期100件 | 是 | 120 |\r\n| B试行 | B05 | 100 | 93 | 按期100件 | 是 | 120 |\r\n| B试行 | B06 | 100 | 97 | 截止未交，次日交100件 | 否 | 120 |\r\n\r\n## 2. 指标复算\r\n\r\n| 指标 | A基线 | B试行 | 教学假设的B期批准目标 | B期判定 |\r\n|---|---|---|---|---|\r\n| FPY | 540/600＝90% | 570/600＝95% | ≥95% | 达标 |\r\n| OTIF | 4/6＝66.7% | 5/6＝83.3% | ≥90% | 未达标，差−6.7个百分点 |\r\n| 质量损失 | 6×200＝1200元 | 6×120＝720元 | ≤800元 | 达标，比上限低80元 |\r\n\r\n百分比展示一位小数，计算用未舍入值。6条订单时，≥90%实际上要求6条全部兑现，目标设置须理解样本粒度。损失比较是同边界观察，尚不能证明改善原因。\r\n\r\n## 3. 部署关系怎样写\r\n\r\n战略选择的教学假设：集中改善该产品族的可靠交付能力，在质量和成本边界内服务选定客户；本例演示部署，不构成完整市场战略。年度进展的教学假设：建立可持续的生产准备及承诺兑现机制。上表只是B期检验目标，不能自动当已批准年度目标。\r\n\r\n| IP候选机制 | 质量贡献假设 | 交付贡献假设 | 成本贡献假设 | 主责与资源（模拟） |\r\n|---|---|---|---|---|\r\n| I01：受控准备、首件确认与异常反应 | 减少启动缺陷 | 减少返工占用 | 减少返工报废 | 工序负责人；工艺与质量共同观察2小时，需资源批准 |\r\n| I02：承诺前可行性核对与风险升级 | 放行条件不被交期挤压 | 提前识别不可兑现订单 | 减少无计划加急风险 | 计划负责人；销售、生产、质量共用风险表 |\r\n\r\n两个IP可贡献多个目标。原始记录只有结果，不能验证这些原因；不能因为B期变好就宣称I01或I02成功。\r\n\r\n## 4. 原因验证与行动记录\r\n\r\n| 编号／类型 | 事实与未知点 | 动作及完成证据 | 主责／截止（模拟） | 判断 |\r\n|---|---|---|---|---|\r\n| A01 调查 | B06逾期，等待位置未知 | 核对准备、生产、返工、检验、放行、发运时间戳，形成可追溯时间线 | 流程负责人／下次周会前 | 定位等待后提出可检验假设，不直接归责生产 |\r\n| A02 验证 | I01是否减少启动缺陷尚未知 | 设计小范围试行，记录物料、设备、人员、参数与测量；写预期、反证及停止条件，质量角色确认风险 | 工艺与质量／方案批准后 | 排查替代解释，证据不支持则调整 |\r\n| A03 执行 | 原因与对策得到支持后才启动 | 更新标准，由替代人员独立演示并判断异常 | 岗位主管／对策验证后 | 培训签到不等于独立能力 |\r\n\r\n## 5. 填好的周期效果表\r\n\r\n| 指标 | 行别 | A基线 | B试行 | C后续 |\r\n|---|---|---|---|---|\r\n| FPY | 目标 | — | ≥95% | 待批准 |\r\n| FPY | 实际 | 90% | 95% | 未测 |\r\n| FPY | 状态 | 基线 | 达标，持续性待验证 | 未判断 |\r\n| OTIF | 目标 | — | ≥90% | 待批准 |\r\n| OTIF | 实际 | 66.7% | 83.3% | 未测 |\r\n| OTIF | 状态 | 基线 | 未达标，调查B06 | 未判断 |\r\n| 质量损失 | 目标 | — | ≤800元 | 待批准 |\r\n| 质量损失 | 实际 | 1200元 | 720元 | 未测 |\r\n| 质量损失 | 状态 | 基线 | 达标，核对构成与持续性 | 未判断 |\r\n\r\n正确读法：两项达到B期目标，交付未达标，机制贡献与持续性仍待验证。错误读法：两项变好就是全面成功，或把OTIF目标改为80%消除红灯。\r\n\r\n## 6. 第一次周评审\r\n\r\n会前准备原始记录、指标定义、效果表和未知点，各职能核对接口事实。\r\n\r\n会上依次问：数据可靠吗？差距在哪里？哪些原因有证据？今天需要什么决定？谁何时带回什么证据？\r\n\r\n本例决定：保留B期OTIF红灯；批准A01所需协作时间；A02先提交受控方案；C期目标待讨论，不预填实际。资源超出权限由业务负责人裁决。下次检查证据，不只问任务完成没有。\r\n\r\n## 7. 标准移交与学习验收\r\n\r\n对策验证后用 [[TPL09_标准化与移交验收]] 记录条件、质量点及异常路径，用 [[TPL10_能力与带教记录]] 验证独立操作。制造标准化作业、通用SOP及岗位指导目的不同，应按实际工艺选用，不能用一张交接表替代全部现场设计。\r\n\r\n不看答案复算三个指标；解释为何B06不能删出分母；指出达标为何仍不能证明原因；写一个带完成证据的调查任务。教师记录学员卡点，本例不替代真人现场试用。\r\n\r\n配套 [[TPL02_指标定义与基线]]、[[TPL05_保龄图与行动计划]]、[[TPL06_PD部署链与资源协商]]、[[TPL07_周月评审与决定记录]]。来源边界见 [[07_来源与版本边界]]。\r\n","html":"\u003ch1>QDC模拟训练：从原始记录到评审决定\u003c/h1>\n\u003cp>\u003cstrong>全部产品、订单、数值、目标和角色安排均为模拟教学数据，不是海顺经营事实，也不证明某种对策已经有效。\u003c/strong> 2026-09-30使用改进版。\u003c/p>\n\u003ch2>任务与测量边界\u003c/h2>\n\u003cp>同一假设产品族，每期6条到期订单，每条100件，均在该期首次进入观察工序。质量看首次通过率FPY；交付看本期到期订单行OTIF；成本看已定义范围内的返工报废损失。工序FPY不能替代客户质量，客户放行要求仍须满足。\u003c/p>\n\u003cp>按期足量依据固定承诺截止与100件要求；FPY不含返工后合格。损失金额已经包含本例范围内的返工报废，不能再重复加材料或工时。各期产品结构相同便于练习，真实业务要检查组合及其他影响。\u003c/p>\n\u003ch2>1. 原始记录\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>周期\u003c/th>\n\u003cth>订单行\u003c/th>\n\u003cth align=\"right\">首次投入件数\u003c/th>\n\u003cth align=\"right\">首次通过件数\u003c/th>\n\u003cth>按承诺截止的交付\u003c/th>\n\u003cth>OTIF\u003c/th>\n\u003cth align=\"right\">损失金额（元）\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A基线\u003c/td>\n\u003ctd>A01\u003c/td>\n\u003ctd align=\"right\">100\u003c/td>\n\u003ctd align=\"right\">90\u003c/td>\n\u003ctd>按期100件\u003c/td>\n\u003ctd>是\u003c/td>\n\u003ctd align=\"right\">200\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A基线\u003c/td>\n\u003ctd>A02\u003c/td>\n\u003ctd align=\"right\">100\u003c/td>\n\u003ctd align=\"right\">85\u003c/td>\n\u003ctd>截止未交，次日交100件\u003c/td>\n\u003ctd>否\u003c/td>\n\u003ctd align=\"right\">200\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A基线\u003c/td>\n\u003ctd>A03\u003c/td>\n\u003ctd align=\"right\">100\u003c/td>\n\u003ctd align=\"right\">95\u003c/td>\n\u003ctd>按期100件\u003c/td>\n\u003ctd>是\u003c/td>\n\u003ctd align=\"right\">200\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A基线\u003c/td>\n\u003ctd>A04\u003c/td>\n\u003ctd align=\"right\">100\u003c/td>\n\u003ctd align=\"right\">90\u003c/td>\n\u003ctd>按期100件\u003c/td>\n\u003ctd>是\u003c/td>\n\u003ctd align=\"right\">200\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A基线\u003c/td>\n\u003ctd>A05\u003c/td>\n\u003ctd align=\"right\">100\u003c/td>\n\u003ctd align=\"right\">88\u003c/td>\n\u003ctd>按期80件，余20件次日交\u003c/td>\n\u003ctd>否\u003c/td>\n\u003ctd align=\"right\">200\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A基线\u003c/td>\n\u003ctd>A06\u003c/td>\n\u003ctd align=\"right\">100\u003c/td>\n\u003ctd align=\"right\">92\u003c/td>\n\u003ctd>按期100件\u003c/td>\n\u003ctd>是\u003c/td>\n\u003ctd align=\"right\">200\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B试行\u003c/td>\n\u003ctd>B01\u003c/td>\n\u003ctd align=\"right\">100\u003c/td>\n\u003ctd align=\"right\">95\u003c/td>\n\u003ctd>按期100件\u003c/td>\n\u003ctd>是\u003c/td>\n\u003ctd align=\"right\">120\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B试行\u003c/td>\n\u003ctd>B02\u003c/td>\n\u003ctd align=\"right\">100\u003c/td>\n\u003ctd align=\"right\">94\u003c/td>\n\u003ctd>按期100件\u003c/td>\n\u003ctd>是\u003c/td>\n\u003ctd align=\"right\">120\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B试行\u003c/td>\n\u003ctd>B03\u003c/td>\n\u003ctd align=\"right\">100\u003c/td>\n\u003ctd align=\"right\">96\u003c/td>\n\u003ctd>按期100件\u003c/td>\n\u003ctd>是\u003c/td>\n\u003ctd align=\"right\">120\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B试行\u003c/td>\n\u003ctd>B04\u003c/td>\n\u003ctd align=\"right\">100\u003c/td>\n\u003ctd align=\"right\">95\u003c/td>\n\u003ctd>按期100件\u003c/td>\n\u003ctd>是\u003c/td>\n\u003ctd align=\"right\">120\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B试行\u003c/td>\n\u003ctd>B05\u003c/td>\n\u003ctd align=\"right\">100\u003c/td>\n\u003ctd align=\"right\">93\u003c/td>\n\u003ctd>按期100件\u003c/td>\n\u003ctd>是\u003c/td>\n\u003ctd align=\"right\">120\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B试行\u003c/td>\n\u003ctd>B06\u003c/td>\n\u003ctd align=\"right\">100\u003c/td>\n\u003ctd align=\"right\">97\u003c/td>\n\u003ctd>截止未交，次日交100件\u003c/td>\n\u003ctd>否\u003c/td>\n\u003ctd align=\"right\">120\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 指标复算\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>指标\u003c/th>\n\u003cth>A基线\u003c/th>\n\u003cth>B试行\u003c/th>\n\u003cth>教学假设的B期批准目标\u003c/th>\n\u003cth>B期判定\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>FPY\u003c/td>\n\u003ctd>540/600＝90%\u003c/td>\n\u003ctd>570/600＝95%\u003c/td>\n\u003ctd>≥95%\u003c/td>\n\u003ctd>达标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>OTIF\u003c/td>\n\u003ctd>4/6＝66.7%\u003c/td>\n\u003ctd>5/6＝83.3%\u003c/td>\n\u003ctd>≥90%\u003c/td>\n\u003ctd>未达标，差−6.7个百分点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>质量损失\u003c/td>\n\u003ctd>6×200＝1200元\u003c/td>\n\u003ctd>6×120＝720元\u003c/td>\n\u003ctd>≤800元\u003c/td>\n\u003ctd>达标，比上限低80元\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>百分比展示一位小数，计算用未舍入值。6条订单时，≥90%实际上要求6条全部兑现，目标设置须理解样本粒度。损失比较是同边界观察，尚不能证明改善原因。\u003c/p>\n\u003ch2>3. 部署关系怎样写\u003c/h2>\n\u003cp>战略选择的教学假设：集中改善该产品族的可靠交付能力，在质量和成本边界内服务选定客户；本例演示部署，不构成完整市场战略。年度进展的教学假设：建立可持续的生产准备及承诺兑现机制。上表只是B期检验目标，不能自动当已批准年度目标。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>IP候选机制\u003c/th>\n\u003cth>质量贡献假设\u003c/th>\n\u003cth>交付贡献假设\u003c/th>\n\u003cth>成本贡献假设\u003c/th>\n\u003cth>主责与资源（模拟）\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>I01：受控准备、首件确认与异常反应\u003c/td>\n\u003ctd>减少启动缺陷\u003c/td>\n\u003ctd>减少返工占用\u003c/td>\n\u003ctd>减少返工报废\u003c/td>\n\u003ctd>工序负责人；工艺与质量共同观察2小时，需资源批准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I02：承诺前可行性核对与风险升级\u003c/td>\n\u003ctd>放行条件不被交期挤压\u003c/td>\n\u003ctd>提前识别不可兑现订单\u003c/td>\n\u003ctd>减少无计划加急风险\u003c/td>\n\u003ctd>计划负责人；销售、生产、质量共用风险表\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>两个IP可贡献多个目标。原始记录只有结果，不能验证这些原因；不能因为B期变好就宣称I01或I02成功。\u003c/p>\n\u003ch2>4. 原因验证与行动记录\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号／类型\u003c/th>\n\u003cth>事实与未知点\u003c/th>\n\u003cth>动作及完成证据\u003c/th>\n\u003cth>主责／截止（模拟）\u003c/th>\n\u003cth>判断\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A01 调查\u003c/td>\n\u003ctd>B06逾期，等待位置未知\u003c/td>\n\u003ctd>核对准备、生产、返工、检验、放行、发运时间戳，形成可追溯时间线\u003c/td>\n\u003ctd>流程负责人／下次周会前\u003c/td>\n\u003ctd>定位等待后提出可检验假设，不直接归责生产\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A02 验证\u003c/td>\n\u003ctd>I01是否减少启动缺陷尚未知\u003c/td>\n\u003ctd>设计小范围试行，记录物料、设备、人员、参数与测量；写预期、反证及停止条件，质量角色确认风险\u003c/td>\n\u003ctd>工艺与质量／方案批准后\u003c/td>\n\u003ctd>排查替代解释，证据不支持则调整\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A03 执行\u003c/td>\n\u003ctd>原因与对策得到支持后才启动\u003c/td>\n\u003ctd>更新标准，由替代人员独立演示并判断异常\u003c/td>\n\u003ctd>岗位主管／对策验证后\u003c/td>\n\u003ctd>培训签到不等于独立能力\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>5. 填好的周期效果表\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>指标\u003c/th>\n\u003cth>行别\u003c/th>\n\u003cth>A基线\u003c/th>\n\u003cth>B试行\u003c/th>\n\u003cth>C后续\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>FPY\u003c/td>\n\u003ctd>目标\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>≥95%\u003c/td>\n\u003ctd>待批准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FPY\u003c/td>\n\u003ctd>实际\u003c/td>\n\u003ctd>90%\u003c/td>\n\u003ctd>95%\u003c/td>\n\u003ctd>未测\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FPY\u003c/td>\n\u003ctd>状态\u003c/td>\n\u003ctd>基线\u003c/td>\n\u003ctd>达标，持续性待验证\u003c/td>\n\u003ctd>未判断\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>OTIF\u003c/td>\n\u003ctd>目标\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>≥90%\u003c/td>\n\u003ctd>待批准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>OTIF\u003c/td>\n\u003ctd>实际\u003c/td>\n\u003ctd>66.7%\u003c/td>\n\u003ctd>83.3%\u003c/td>\n\u003ctd>未测\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>OTIF\u003c/td>\n\u003ctd>状态\u003c/td>\n\u003ctd>基线\u003c/td>\n\u003ctd>未达标，调查B06\u003c/td>\n\u003ctd>未判断\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>质量损失\u003c/td>\n\u003ctd>目标\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>≤800元\u003c/td>\n\u003ctd>待批准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>质量损失\u003c/td>\n\u003ctd>实际\u003c/td>\n\u003ctd>1200元\u003c/td>\n\u003ctd>720元\u003c/td>\n\u003ctd>未测\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>质量损失\u003c/td>\n\u003ctd>状态\u003c/td>\n\u003ctd>基线\u003c/td>\n\u003ctd>达标，核对构成与持续性\u003c/td>\n\u003ctd>未判断\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>正确读法：两项达到B期目标，交付未达标，机制贡献与持续性仍待验证。错误读法：两项变好就是全面成功，或把OTIF目标改为80%消除红灯。\u003c/p>\n\u003ch2>6. 第一次周评审\u003c/h2>\n\u003cp>会前准备原始记录、指标定义、效果表和未知点，各职能核对接口事实。\u003c/p>\n\u003cp>会上依次问：数据可靠吗？差距在哪里？哪些原因有证据？今天需要什么决定？谁何时带回什么证据？\u003c/p>\n\u003cp>本例决定：保留B期OTIF红灯；批准A01所需协作时间；A02先提交受控方案；C期目标待讨论，不预填实际。资源超出权限由业务负责人裁决。下次检查证据，不只问任务完成没有。\u003c/p>\n\u003ch2>7. 标准移交与学习验收\u003c/h2>\n\u003cp>对策验证后用 \u003ca href=\"#TPL09_%E6%A0%87%E5%87%86%E5%8C%96%E4%B8%8E%E7%A7%BB%E4%BA%A4%E9%AA%8C%E6%94%B6\" data-open=\"TPL09_标准化与移交验收\">标准化与移交验收\u003c/a> 记录条件、质量点及异常路径，用 \u003ca href=\"#TPL10_%E8%83%BD%E5%8A%9B%E4%B8%8E%E5%B8%A6%E6%95%99%E8%AE%B0%E5%BD%95\" data-open=\"TPL10_能力与带教记录\">能力与带教记录\u003c/a> 验证独立操作。制造标准化作业、通用SOP及岗位指导目的不同，应按实际工艺选用，不能用一张交接表替代全部现场设计。\u003c/p>\n\u003cp>不看答案复算三个指标；解释为何B06不能删出分母；指出达标为何仍不能证明原因；写一个带完成证据的调查任务。教师记录学员卡点，本例不替代真人现场试用。\u003c/p>\n\u003cp>配套 \u003ca href=\"#TPL02_%E6%8C%87%E6%A0%87%E5%AE%9A%E4%B9%89%E4%B8%8E%E5%9F%BA%E7%BA%BF\" data-open=\"TPL02_指标定义与基线\">指标定义与基线\u003c/a>、\u003ca href=\"#TPL05_%E4%BF%9D%E9%BE%84%E5%9B%BE%E4%B8%8E%E8%A1%8C%E5%8A%A8%E8%AE%A1%E5%88%92\" data-open=\"TPL05_保龄图与行动计划\">保龄图与行动计划\u003c/a>、\u003ca href=\"#TPL06_PD%E9%83%A8%E7%BD%B2%E9%93%BE%E4%B8%8E%E8%B5%84%E6%BA%90%E5%8D%8F%E5%95%86\" data-open=\"TPL06_PD部署链与资源协商\">PD部署链与资源协商\u003c/a>、\u003ca href=\"#TPL07_%E5%91%A8%E6%9C%88%E8%AF%84%E5%AE%A1%E4%B8%8E%E5%86%B3%E5%AE%9A%E8%AE%B0%E5%BD%95\" data-open=\"TPL07_周月评审与决定记录\">周月评审与决定记录\u003c/a>。来源边界见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。\u003c/p>\n","file":"13_QDC模拟训练与填表示范.md"},{"name":"F01_研发与新产品IPD","title":"研发与新产品的DBS应用｜职能应用手册","raw":"# 研发与新产品的DBS应用｜职能应用手册\r\n\r\n> 校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\r\n\r\n## 定义与职责\r\n\r\n以客户需求、设计验证、可制造性和交付准备连接新品价值。IPD是其他研发管理语境也使用的名称，不能把本库F01称为DBS官方IPD标准。旧文件名保留只为链接兼容。\r\n\r\n## 系统流程与接口\r\n\r\n客户需要与CTQ → 机会与组合取舍 → 关键设计假设验证 → 产品与过程准备 → 上市与交付 → 使用反馈；风险可触发返回前序。SDR设计评审、可视化项目管理与上市准备贯穿相关阶段，不是一次性的串行手续。\r\n\r\n与 [[海顺04_战略到执行总纲]] 共用一条部署链；职能是协作视角，不是六个并行项目。\r\n\r\n## 按证据选择工具\r\n\r\n| 现场问题 | 先查证据 | 方法入口 | 必须产出 |\r\n|---|---|---|---|\r\n| 需求反复 | 客户使用场景、变更原因 | [[T04_客户之声]] | 经过客户验证的CTQ与需求边界 |\r\n| 设计风险后移 | 设计假设、失效与试验记录 | [[T22_快速设计评审]] | 设计决定及支持/反对证据 |\r\n| 项目同时过多 | 资源容量和依赖 | [[T21_产品规划与资源配置]] | 组合取舍与资源承诺 |\r\n| 新品交付不稳 | 试产、放行与供应准备 | [[T30_上市与交付准备]] | 准备证据和风险处置 |\r\n\r\n## 指标与计量\r\n\r\n验证周期：对定义清楚的“完成验证项”统计各项结束时间−开始时间的均值或中位数，说明统计窗口与样本；未完成项另列在途年龄和超期数，不能用总历时/当前项目总数伪造平均。另看需求变更、首批质量与交付，按项目风险选择。\r\n\r\n实际数值、目标及责任人待海顺确认；使用 [[TPL02_指标定义与基线]]，完整口径见 [[06_指标字典]]。\r\n\r\n## 本轮怎样落地\r\n\r\n若当前QDC损失来自新产品或设计转移，加入同一试点；若无相关证据，先不另开研发改造项目。项目主责对准备与价值负责，质量角色保留放行职责。\r\n\r\n1. 前两周随同一个产品族试点获取本职能负责的事实和接口证据。\r\n2. 第3—4周参与诊断与资源协商，明确对同一IP的贡献，不另立重复指标。\r\n3. 第5—8周在本职能接口参与小范围试验，同时检查QDC效果。\r\n4. 第9—12周凭持续证据决定标准化和移交；期限只是安排建议，未通过验收则继续验证。\r\n\r\n## 运行节奏与验收\r\n\r\n日常按授权处理异常；每周与端到端主责核对试验和障碍；每月由总经理检查效果、资源和人才。相关记录进入 [[TPL07_周月评审与决定记录]]。\r\n\r\n验收时必须能回答：本职能改变了什么机制？证据来自哪一订单、批次或任务？对另外两项QDC有何影响？换人以后能否维持？不以开会、培训或表格数量作为成功。\r\n\r\n## 证据边界\r\n\r\n本手册为DBS与通用管理方法的应用设计，非丹纳赫官方职能标准。上述流程为逻辑模型，需按海顺实际业务确认条件、权限与接口。\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>研发与新产品的DBS应用｜职能应用手册\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003ch2>定义与职责\u003c/h2>\n\u003cp>以客户需求、设计验证、可制造性和交付准备连接新品价值。IPD是其他研发管理语境也使用的名称，不能把本库F01称为DBS官方IPD标准。旧文件名保留只为链接兼容。\u003c/p>\n\u003ch2>系统流程与接口\u003c/h2>\n\u003cp>客户需要与CTQ → 机会与组合取舍 → 关键设计假设验证 → 产品与过程准备 → 上市与交付 → 使用反馈；风险可触发返回前序。SDR设计评审、可视化项目管理与上市准备贯穿相关阶段，不是一次性的串行手续。\u003c/p>\n\u003cp>与 \u003ca href=\"#%E6%B5%B7%E9%A1%BA04_%E6%88%98%E7%95%A5%E5%88%B0%E6%89%A7%E8%A1%8C%E6%80%BB%E7%BA%B2\" data-open=\"海顺04_战略到执行总纲\">战略到执行总纲\u003c/a> 共用一条部署链；职能是协作视角，不是六个并行项目。\u003c/p>\n\u003ch2>按证据选择工具\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现场问题\u003c/th>\n\u003cth>先查证据\u003c/th>\n\u003cth>方法入口\u003c/th>\n\u003cth>必须产出\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>需求反复\u003c/td>\n\u003ctd>客户使用场景、变更原因\u003c/td>\n\u003ctd>\u003ca href=\"#T04_%E5%AE%A2%E6%88%B7%E4%B9%8B%E5%A3%B0\" data-open=\"T04_客户之声\">客户之声\u003c/a>\u003c/td>\n\u003ctd>经过客户验证的CTQ与需求边界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>设计风险后移\u003c/td>\n\u003ctd>设计假设、失效与试验记录\u003c/td>\n\u003ctd>\u003ca href=\"#T22_%E5%BF%AB%E9%80%9F%E8%AE%BE%E8%AE%A1%E8%AF%84%E5%AE%A1\" data-open=\"T22_快速设计评审\">快速设计评审\u003c/a>\u003c/td>\n\u003ctd>设计决定及支持/反对证据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>项目同时过多\u003c/td>\n\u003ctd>资源容量和依赖\u003c/td>\n\u003ctd>\u003ca href=\"#T21_%E4%BA%A7%E5%93%81%E8%A7%84%E5%88%92%E4%B8%8E%E8%B5%84%E6%BA%90%E9%85%8D%E7%BD%AE\" data-open=\"T21_产品规划与资源配置\">产品规划与资源配置\u003c/a>\u003c/td>\n\u003ctd>组合取舍与资源承诺\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新品交付不稳\u003c/td>\n\u003ctd>试产、放行与供应准备\u003c/td>\n\u003ctd>\u003ca href=\"#T30_%E4%B8%8A%E5%B8%82%E4%B8%8E%E4%BA%A4%E4%BB%98%E5%87%86%E5%A4%87\" data-open=\"T30_上市与交付准备\">上市与交付准备\u003c/a>\u003c/td>\n\u003ctd>准备证据和风险处置\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>指标与计量\u003c/h2>\n\u003cp>验证周期：对定义清楚的“完成验证项”统计各项结束时间−开始时间的均值或中位数，说明统计窗口与样本；未完成项另列在途年龄和超期数，不能用总历时/当前项目总数伪造平均。另看需求变更、首批质量与交付，按项目风险选择。\u003c/p>\n\u003cp>实际数值、目标及责任人待海顺确认；使用 \u003ca href=\"#TPL02_%E6%8C%87%E6%A0%87%E5%AE%9A%E4%B9%89%E4%B8%8E%E5%9F%BA%E7%BA%BF\" data-open=\"TPL02_指标定义与基线\">指标定义与基线\u003c/a>，完整口径见 \u003ca href=\"#06_%E6%8C%87%E6%A0%87%E5%AD%97%E5%85%B8\" data-open=\"06_指标字典\">指标字典\u003c/a>。\u003c/p>\n\u003ch2>本轮怎样落地\u003c/h2>\n\u003cp>若当前QDC损失来自新产品或设计转移，加入同一试点；若无相关证据，先不另开研发改造项目。项目主责对准备与价值负责，质量角色保留放行职责。\u003c/p>\n\u003col>\n\u003cli>前两周随同一个产品族试点获取本职能负责的事实和接口证据。\u003c/li>\n\u003cli>第3—4周参与诊断与资源协商，明确对同一IP的贡献，不另立重复指标。\u003c/li>\n\u003cli>第5—8周在本职能接口参与小范围试验，同时检查QDC效果。\u003c/li>\n\u003cli>第9—12周凭持续证据决定标准化和移交；期限只是安排建议，未通过验收则继续验证。\u003c/li>\n\u003c/ol>\n\u003ch2>运行节奏与验收\u003c/h2>\n\u003cp>日常按授权处理异常；每周与端到端主责核对试验和障碍；每月由总经理检查效果、资源和人才。相关记录进入 \u003ca href=\"#TPL07_%E5%91%A8%E6%9C%88%E8%AF%84%E5%AE%A1%E4%B8%8E%E5%86%B3%E5%AE%9A%E8%AE%B0%E5%BD%95\" data-open=\"TPL07_周月评审与决定记录\">周月评审与决定记录\u003c/a>。\u003c/p>\n\u003cp>验收时必须能回答：本职能改变了什么机制？证据来自哪一订单、批次或任务？对另外两项QDC有何影响？换人以后能否维持？不以开会、培训或表格数量作为成功。\u003c/p>\n\u003ch2>证据边界\u003c/h2>\n\u003cp>本手册为DBS与通用管理方法的应用设计，非丹纳赫官方职能标准。上述流程为逻辑模型，需按海顺实际业务确认条件、权限与接口。\u003c/p>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"F01_研发与新产品IPD.md"},{"name":"F02_供应链与产销协同","title":"供应链与产销协同｜职能应用手册","raw":"# 供应链与产销协同｜职能应用手册\r\n\r\n> 校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\r\n\r\n## 定义与职责\r\n\r\n将需求、承诺、供应、生产、质量放行和物流连接为可兑现的端到端流程，同时控制损失与库存。\r\n\r\n## 系统流程与接口\r\n\r\n需求与订单信息 → 承诺可行性评估（库存、供期、产能、质量条件） → 采购补充与生产计划并行协调 → 开工条件确认 → 生产 → 检验与放行 → 发运/约定交付 → 客户及经营反馈。承诺不必等到实物全部齐套后才作出，必须基于可靠条件；异常则受控调整并保留原始承诺。\r\n\r\n与 [[海顺04_战略到执行总纲]] 共用一条部署链；职能是协作视角，不是六个并行项目。\r\n\r\n## 按证据选择工具\r\n\r\n| 现场问题 | 先查证据 | 方法入口 | 必须产出 |\r\n|---|---|---|---|\r\n| 库存高又缺料 | SKU需求、库存状态、供期波动 | [[T17_产销库存协同]] | 分类供应策略与供需例外决定 |\r\n| 周期长 | 真实订单等待、处理、返工及放行时间 | [[T05_价值流图]] | 包含生产与放行的现状价值流 |\r\n| 换型影响质量与交期 | 合格件到合格件时间与启动损耗 | [[T14_快速换型]] | 经QDC联合验证的换型标准 |\r\n| 在制堆积 | 瓶颈、批量、补货信号与质量状态 | [[T13_拉动与在制品限制]] | 有条件依据的限额、补货和异常规则 |\r\n\r\n## 指标与计量\r\n\r\n结果优先看客户质量、OTIF/OTD及损失成本；过程按诊断选择FPY、等待、换型或计划变更。OTIF以本期到期订单行等明确单位为分母，到期未交仍纳入；保留客户请求日、首次承诺日和变更历史。库存按位置、状态和用途分层，作为支持指标。\r\n\r\n实际数值、目标及责任人待海顺确认；使用 [[TPL02_指标定义与基线]]，完整口径见 [[06_指标字典]]。\r\n\r\n## 本轮怎样落地\r\n\r\n计划、生产、质量和销售共用需求与供给视图，由端到端主责裁决接口问题。不能通过改变承诺日期、把货转仓或无需求多生产改善数字。拉动与缓冲调整须同时检验缺货和交付。\r\n\r\n1. 前两周随同一个产品族试点获取本职能负责的事实和接口证据。\r\n2. 第3—4周参与诊断与资源协商，明确对同一IP的贡献，不另立重复指标。\r\n3. 第5—8周在本职能接口参与小范围试验，同时检查QDC效果。\r\n4. 第9—12周凭持续证据决定标准化和移交；期限只是安排建议，未通过验收则继续验证。\r\n\r\n## 运行节奏与验收\r\n\r\n日常按授权处理异常；每周与端到端主责核对试验和障碍；每月由总经理检查效果、资源和人才。相关记录进入 [[TPL07_周月评审与决定记录]]。\r\n\r\n验收时必须能回答：本职能改变了什么机制？证据来自哪一订单、批次或任务？对另外两项QDC有何影响？换人以后能否维持？不以开会、培训或表格数量作为成功。\r\n\r\n## 证据边界\r\n\r\n本手册为DBS与通用管理方法的应用设计，非丹纳赫官方职能标准。上述流程为逻辑模型，需按海顺实际业务确认条件、权限与接口。\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>供应链与产销协同｜职能应用手册\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003ch2>定义与职责\u003c/h2>\n\u003cp>将需求、承诺、供应、生产、质量放行和物流连接为可兑现的端到端流程，同时控制损失与库存。\u003c/p>\n\u003ch2>系统流程与接口\u003c/h2>\n\u003cp>需求与订单信息 → 承诺可行性评估（库存、供期、产能、质量条件） → 采购补充与生产计划并行协调 → 开工条件确认 → 生产 → 检验与放行 → 发运/约定交付 → 客户及经营反馈。承诺不必等到实物全部齐套后才作出，必须基于可靠条件；异常则受控调整并保留原始承诺。\u003c/p>\n\u003cp>与 \u003ca href=\"#%E6%B5%B7%E9%A1%BA04_%E6%88%98%E7%95%A5%E5 指标。\r\n3. 第5—8周在本职能接口参与小范围试验，同时检查QDC效果。\r\n4. 第9—12周凭持续证据决定标准化和移交；期限只是安排建议，未通过验收则继续验证。\r\n\r\n## 运行节奏与验收\r\n\r\n日常按授权处理异常；每周与端到端主责核对试验和障碍；每月由总经理检查效果、资源和人才。相关记录进入 [[TPL07_周月评审与决定记录]]。\r\n\r\n验收时必须能回答：本职能改变了什么机制？证据来自哪一订单、批次或任务？对另外两项QDC有何影响？换人以后能否维持？不以开会、培训或表格数量作为成功。\r\n\r\n## 证据边界\r\n\r\n本手册为DBS与通用管理方法的应用设计，非丹纳赫官方职能标准。上述流程为逻辑模型，需按海顺实际业务确认条件、权限与接口。\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>销售与增长落地｜职能应用手册\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003ch2>定义与职责\u003c/h2>\n\u003cp>识别客户价值、形成可信需求与承诺，并用事实验证增长机会。销售活动可影响Q、D、C、I多个方向，不能把销售职能整体归为Q。\u003c/p>\n\u003ch2>系统流程与接口\u003c/h2>\n\u003cp>客户细分与需求 → 价值主张验证 → 商机证据与阶段管理 → 需求和订单承诺协同 → 使用与交付反馈。增长室是跨职能评审和决策机制，可贯穿上述流程，不是交易必须经过的一个阶段。\u003c/p>\n\u003cp>与 \u003ca href=\"#%E6%B5%B7%E9%A1%BA04_%E6%88%98%E7%95%A5%E5%88%B0%E6%89%A7%E8%A1%8C%E6%80%BB%E7%BA%B2\" data-open=\"海顺04_战略到执行总纲\">战略到执行总纲\u003c/a> 共用一条部署链；职能是协作视角，不是六个并行项目。\u003c/p>\n\u003ch2>按证据选择工具\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现场问题\u003c/th>\n\u003cth>先查证据\u003c/th>\n\u003cth>方法入口\u003c/th>\n\u003cth>必须产出\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>预测失真\u003c/td>\n\u003ctd>固定时点预测快照与对应期实际\u003c/td>\n\u003ctd>\u003ca href=\"#T24_%E9%94%80%E5%94%AE%E6%BC%8F%E6%96%97%E7%AE%A1%E7%90%86\" data-open=\"T24_销售漏斗管理\">销售漏斗管理\u003c/a>\u003c/td>\n\u003ctd>阶段定义、退出证据和预测误差解释\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>承诺不能兑现\u003c/td>\n\u003ctd>客户需要与供应容量\u003c/td>\n\u003ctd>\u003ca href=\"#T17_%E4%BA%A7%E9%94%80%E5%BA%93%E5%AD%98%E5%8D%8F%E5%90%8C\" data-open=\"T17_产销库存协同\">产销库存协同\u003c/a>\u003c/td>\n\u003ctd>可兑现承诺和例外审批\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>低价换量\u003c/td>\n\u003ctd>客户价值与服务成本\u003c/td>\n\u003ctd>\u003ca href=\"#T25_%E4%BB%B7%E5%80%BC%E9%94%80%E5%94%AE\" data-open=\"T25_价值销售\">价值销售\u003c/a>\u003c/td>\n\u003ctd>价值证据及适合的报价边界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>机会分散\u003c/td>\n\u003ctd>客户分层和资源容量\u003c/td>\n\u003ctd>\u003ca href=\"#T19_%E5%AE%A2%E6%88%B7%E7%BB%86%E5%88%86\" data-open=\"T19_客户细分\">客户细分\u003c/a>\u003c/td>\n\u003ctd>目标客户与取舍\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>指标与计量\u003c/h2>\n\u003cp>预测误差示例：固定预测时点和预测跨度后，WAPE=Σ|预测−实际|/Σ实际，实际总量为零时标不适用并列绝对误差；偏差=Σ(预测−实际)/Σ实际并说明正负含义。不能事后更新快照。客户流失、转化率需固定进入队列和窗口。\u003c/p>\n\u003cp>实际数值、目标及责任人待海顺确认；使用 \u003ca href=\"#TPL02_%E6%8C%87%E6%A0%87%E5%AE%9A%E4%B9%89%E4%B8%8E%E5%9F%BA%E7%BA%BF\" data-open=\"TPL02_指标定义与基线\">指标定义与基线\u003c/a>，完整口径见 \u003ca href=\"#06_%E6%8C%87%E6%A0%87%E5%AD%97%E5%85%B8\" data-open=\"06_指标字典\">指标字典\u003c/a>。\u003c/p>\n\u003ch2>本轮怎样落地\u003c/h2>\n\u003cp>本轮主要为QDC试点提供客户CTQ、交付定义、需求变化与承诺管理；没有战略依据时不另开全面增长项目。销售与计划共同维护首次承诺事实。\u003c/p>\n\u003col>\n\u003cli>前两周随同一个产品族试点获取本职能负责的事实和接口证据。\u003c/li>\n\u003cli>第3—4周参与诊断与资源协商，明确对同一IP的贡献，不另立重复指标。\u003c/li>\n\u003cli>第5—8周在本职能接口参与小范围试验，同时检查QDC效果。\u003c/li>\n\u003cli>第9—12周凭持续证据决定标准化和移交；期限只是安排建议，未通过验收则继续验证。\u003c/li>\n\u003c/ol>\n\u003ch2>运行节奏与验收\u003c/h2>\n\u003cp>日常按授权处理异常；每周与端到端主责核对试验和障碍；每月由总经理检查效果、资源和人才。相关记录进入 \u003ca href=\"#TPL07_%E5%91%A8%E6%9C%88%E8%AF%84%E5%AE%A1%E4%B8%8E%E5%86%B3%E5%AE%9A%E8%AE%B0%E5%BD%95\" data-open=\"TPL07_周月评审与决定记录\">周月评审与决定记录\u003c/a>。\u003c/p>\n\u003cp>验收时必须能回答：本职能改变了什么机制？证据来自哪一订单、批次或任务？对另外两项QDC有何影响？换人以后能否维持？不以开会、培训或表格数量作为成功。\u003c/p>\n\u003ch2>证据边界\u003c/h2>\n\u003cp>本手册为DBS与通用管理方法的应用设计，非丹纳赫官方职能标准。上述流程为逻辑模型，需按海顺实际业务确认条件、权限与接口。\u003c/p>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"F03_销售与增长落地.md"},{"name":"F04_财务价值创造树","title":"财务价值创造树｜职能应用手册","raw":"# 财务价值创造树｜职能应用手册\r\n\r\n> 校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\r\n\r\n## 定义与职责\r\n\r\n把流程变化连接到可解释的费用、现金、能力和客户结果，独立复核收益，避免把改善活动量当作价值。\r\n\r\n## 系统流程与接口\r\n\r\n能力与工作机制 → 过程表现 → 客户结果与资源耗用 → 收入、费用、营运资本和投入资本 → 财务结果。这是需要验证的贡献假设，不是自动成立的因果公式；财务恒等式另列。\r\n\r\n与 [[海顺04_战略到执行总纲]] 共用一条部署链；职能是协作视角，不是六个并行项目。\r\n\r\n## 按证据选择工具\r\n\r\n| 现场问题 | 先查证据 | 方法入口 | 必须产出 |\r\n|---|---|---|---|\r\n| 有节时无现金 | 人员、加班、外包与实际支出 | [[C06_结果与过程指标]] | 能力释放与费用减少分别计量 |\r\n| 库存下降报喜 | 采购、消耗、报废、转仓和成本口径 | [[T17_产销库存协同]] | 现金变化及库存变化的分解 |\r\n| 降本伤质量 | 功能、返工、投诉、交付与全成本 | [[T18_价值分析与价值工程]] | 可接受方案与QDC副作用 |\r\n| 多个项目认领收益 | 范围、期间、账目与共同贡献 | [[T03_保龄图与行动计划]] | 归属规则与去重收益清单 |\r\n\r\n## 指标与计量\r\n\r\n营业利润率=同口径营业利润/收入；ROIC常见分析口径=税后经营利润/平均投入资本，具体税、资本及平均方式按海顺财务政策确认。费用减少、现金释放、能力释放和客户结果分别报告，不简单加总。单位成本固定产品及成本边界，分解价格、产量、组合、效率因素。\r\n\r\n实际数值、目标及责任人待海顺确认；使用 [[TPL02_指标定义与基线]]，完整口径见 [[06_指标字典]]。\r\n\r\n## 本轮怎样落地\r\n\r\n工时节省不直接乘全额工资当现金；只有实际加班、外包或费用减少才另行验证。库存核销不是现金流入；库存减少是否带来现金释放需核对采购、应付和实际支出。财务指标改善不能由一张关系图证明因果。\r\n\r\n1. 前两周随同一个产品族试点获取本职能负责的事实和接口证据。\r\n2. 第3—4周参与诊断与资源协商，明确对同一IP的贡献，不另立重复指标。\r\n3. 第5—8周在本职能接口参与小范围试验，同时检查QDC效果。\r\n4. 第9—12周凭持续证据决定标准化和移交；期限只是安排建议，未通过验收则继续验证。\r\n\r\n## 运行节奏与验收\r\n\r\n日常按授权处理异常；每周与端到端主责核对试验和障碍；每月由总经理检查效果、资源和人才。相关记录进入 [[TPL07_周月评审与决定记录]]。\r\n\r\n验收时必须能回答：本职能改变了什么机制？证据来自哪一订单、批次或任务？对另外两项QDC有何影响？换人以后能否维持？不以开会、培训或表格数量作为成功。\r\n\r\n## 证据边界\r\n\r\n本手册为DBS与通用管理方法的应用设计，非丹纳赫官方职能标准。上述流程为逻辑模型，需按海顺实际业务确认条件、权限与接口。\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>财务价值创造树｜职能应用手册\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003ch2>定义与职责\u003c/h2>\n\u003cp>把流程变化连接到可解释的费用、现金、能力和客户结果，独立复核收益，避免把改善活动量当作价值。\u003c/p>\n\u003ch2>系统流程与接口\u003c/h2>\n\u003cp>能力与工作机制 → 过程表现 → 客户结果与资源耗用 → 收入、费用、营运资本和投入资本 → 财务结果。这是需要验证的贡献假设，不是自动成立的因果公式；财务恒等式另列。\u003c/p>\n\u003cp>与 \u003ca href=\"#%E6%B5%B7%E9%A1%BA04_%E6%88%98%E7%95%A5%E5%88%B0%E6%89%A7%E8%A1%8C%E6%80%BB%E7%BA%B2\" data-open=\"海顺04_战略到执行总纲\">战略到执行总纲\u003c/a> 共用一条部署链；职能是协作视角，不是六个并行项目。\u003c/p>\n\u003ch2>按证据选择工具\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现场问题\u003c/th>\n\u003cth>先查证据\u003c/th>\n\u003 收则继续验证。\u003c/li>\n\u003c/ol>\n\u003ch2>运行节奏与验收\u003c/h2>\n\u003cp>日常按授权处理异常；每周与端到端主责核对试验和障碍；每月由总经理检查效果、资源和人才。相关记录进入 \u003ca href=\"#TPL07_%E5%91%A8%E6%9C%88%E8%AF%84%E5%AE%A1%E4%B8%8E%E5%86%B3%E5%AE%9A%E8%AE%B0%E5%BD%95\" data-open=\"TPL07_周月评审与决定记录\">周月评审与决定记录\u003c/a>。\u003c/p>\n\u003cp>验收时必须能回答：本职能改变了什么机制？证据来自哪一订单、批次或任务？对另外两项QDC有何影响？换人以后能否维持？不以开会、培训或表格数量作为成功。\u003c/p>\n\u003ch2>证据边界\u003c/h2>\n\u003cp>本手册为DBS与通用管理方法的应用设计，非丹纳赫官方职能标准。上述流程为逻辑模型，需按海顺实际业务确认条件、权限与接口。\u003c/p>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"F04_财务价值创造树.md"},{"name":"F05_人力资源与组织能力","title":"人力资源与组织能力｜职能应用手册","raw":"# 人力资源与组织能力｜职能应用手册\r\n\r\n> 校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\r\n\r\n## 定义与职责\r\n\r\n使关键岗位具备执行、判断异常和继续改善的能力。人才支持全部经营方向，不应整体归为QDC中的C。\r\n\r\n## 系统流程与接口\r\n\r\n明确岗位与流程任务 → 观察当前能力 → 带教和真实练习 → 独立演示与异常判断 → 复验和继任准备 → 流程与经营结果反馈。\r\n\r\n与 [[海顺04_战略到执行总纲]] 共用一条部署链；职能是协作视角，不是六个并行项目。\r\n\r\n## 按证据选择工具\r\n\r\n| 现场问题 | 先查证据 | 方法入口 | 必须产出 |\r\n|---|---|---|---|\r\n| 听过但不会做 | 真实任务演示 | [[T27_人才发展与继任]] | 能力差距与带教任务 |\r\n| 项目依赖顾问 | 业务主责与教练职责 | [[T29_DBS推进角色]] | 负责人独立推进证据 |\r\n| 评审只追数字 | 现场提问与资源决定 | [[T28_领导标准工作]] | 领导标准工作和兑现记录 |\r\n| 人才评价随意 | 绩效、潜力标准和多方证据 | [[T31_九宫格人才盘点]] | 有依据的校准与发展动作 |\r\n\r\n## 指标与计量\r\n\r\n内部填补率IFR=本期由内部人员填补的岗位次数/本期全部已填补岗位次数，岗位范围、临时代理、调动及重复补位规则预先固定，不用员工人数代替岗位次数。留任率=期初确定队列中期末仍在约定范围的人数/该期初队列人数；不将期中新入职者加进分子，内部调动按既定边界处理。\r\n\r\n实际数值、目标及责任人待海顺确认；使用 [[TPL02_指标定义与基线]]，完整口径见 [[06_指标字典]]。\r\n\r\n## 本轮怎样落地\r\n\r\n培训时长仅为投入。验收依次观察能解释、能跟做、能独立做、能带人；质量和授权要求依岗位保留。主管持续带教，不能把经营结果全部推给DBSO。\r\n\r\n1. 前两周随同一个产品族试点获取本职能负责的事实和接口证据。\r\n2. 第3—4周参与诊断与资源协商，明确对同一IP的贡献，不另立重复指标。\r\n3. 第5—8周在本职能接口参与小范围试验，同时检查QDC效果。\r\n4. 第9—12周凭持续证据决定标准化和移交；期限只是安排建议，未通过验收则继续验证。\r\n\r\n## 运行节奏与验收\r\n\r\n日常按授权处理异常；每周与端到端主责核对试验和障碍；每月由总经理检查效果、资源和人才。相关记录进入 [[TPL07_周月评审与决定记录]]。\r\n\r\n验收时必须能回答：本职能改变了什么机制？证据来自哪一订单、批次或任务？对另外两项QDC有何影响？换人以后能否维持？不以开会、培训或表格数量作为成功。\r\n\r\n## 证据边界\r\n\r\n本手册为DBS与通用管理方法的应用设计，非丹纳赫官方职能标准。上述流程为逻辑模型，需按海顺实际业务确认条件、权限与接口。\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>人力资源与组织能力｜职能应用手册\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003ch2>定义与职责\u003c/h2>\n\u003cp>使关键岗位具备执行、判断异常和继续改善的能力。人才支持全部经营方向，不应整体归为QDC中的C。\u003c/p>\n\u003ch2>系统流程与接口\u003c/h2>\n\u003cp>明确岗位与流程任务 → 观察当前能力 → 带教和真实练习 → 独立演示与异常判断 → 复验和继任准备 → 流程与经营结果反馈。\u003c/p>\n\u003cp>与 \u003ca href=\"#%E6%B5%B7%E9%A1%BA04_%E6%88%98%E7%95%A5%E5%88%B0%E6%89%A7%E8%A1%8C%E6%80%BB%E7%BA%B2\" data-open=\"海顺04_战略到执行总纲\">战略到执行总纲\u003c/a> 共用一条部署链；职能是协作视角，不是六个并行项目。\u003c/p>\n\u003ch2>按证据选择工具\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现场问题\u003c/th>\n\u003cth>先查证据\u003c/th>\n\u003cth>方法入口\u003c/th>\n\u003cth>必须产出\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>听过但不会做\u003c/td>\n\u003ctd>真实任务演示\u003c/td>\n\u003ctd>\u003ca href=\"#T27_%E4%BA%BA%E6%89%8D%E5%8F%91%E5%B1%95%E4%B8%8E%E7%BB%A7%E4%BB%BB\" data-open=\"T27_人才发展与继任\">人才发展与继任\u003c/a>\u003c/td>\n\u003ctd>能力差距与带教任务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>项目依赖顾问\u003c/td>\n\u003ctd>业务主责与教练职责\u003c/td>\n\u003ctd>\u003ca href=\"#T29_DBS%E6%8E%A8%E8%BF%9B%E8%A7%92%E8%89%B2\" data-open=\"T29_DBS推进角色\">DBS推进角色\u003c/a>\u003c/td>\n\u003ctd>负责人独立推进证据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>评审只追数字\u003c/td>\n\u003ctd>现场提问与资源决定\u003c/td>\n\u003ctd>\u003ca href=\"#T28_%E9%A2%86%E5%AF%BC%E6%A0%87%E5%87%86%E5%B7%A5%E4%BD%9C\" data-open=\"T28_领导标准工作\">领导标准工作\u003c/a>\u003c/td>\n\u003ctd>领导标准工作和兑现记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>人才评价随意\u003c/td>\n\u003ctd>绩效、潜力标准和多方证据\u003c/td>\n\u003ctd>\u003ca href=\"#T31_%E4%B9%9D%E5%AE%AB%E6%A0%BC%E4%BA%BA%E6%89%8D%E7%9B%98%E7%82%B9\" data-open=\"T31_九宫格人才盘点\">九宫格人才盘点\u003c/a>\u003c/td>\n\u003ctd>有依据的校准与发展动作\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>指标与计量\u003c/h2>\n\u003cp>内部填补率IFR=本期由内部人员填补的岗位次数/本期全部已填补岗位次数，岗位范围、临时代理、调动及重复补位规则预先固定，不用员工人数代替岗位次数。留任率=期初确定队列中期末仍在约定范围的人数/该期初队列人数；不将期中新入职者加进分子，内部调动按既定边界处理。\u003c/p>\n\u003cp>实际数值、目标及责任人待海顺确认；使用 \u003ca href=\"#TPL02_%E6%8C%87%E6%A0%87%E5%AE%9A%E4%B9%89%E4%B8%8E%E5%9F%BA%E7%BA%BF\" data-open=\"TPL02_指标定义与基线\">指标定义与基线\u003c/a>，完整口径见 \u003ca href=\"#06_%E6%8C%87%E6%A0%87%E5%AD%97%E5%85%B8\" data-open=\"06_指标字典\">指标字典\u003c/a>。\u003c/p>\n\u003ch2>本轮怎样落地\u003c/h2>\n\u003cp>培训时长仅为投入。验收依次观察能解释、能跟做、能独立做、能带人；质量和授权要求依岗位保留。主管持续带教，不能把经营结果全部推给DBSO。\u003c/p>\n\u003col>\n\u003cli>前两周随同一个产品族试点获取本职能负责的事实和接口证据。\u003c/li>\n\u003cli>第3—4周参与诊断与资源协商，明确对同一IP的贡献，不另立重复指标。\u003c/li>\n\u003cli>第5—8周在本职能接口参与小范围试验，同时检查QDC效果。\u003c/li>\n\u003cli>第9—12周凭持续证据决定标准化和移交；期限只是安排建议，未通过验收则继续验证。\u003c/li>\n\u003c/ol>\n\u003ch2>运行节奏与验收\u003c/h2>\n\u003cp>日常按授权处理异常；每周与端到端主责核对试验和障碍；每月由总经理检查效果、资源和人才。相关记录进入 \u003ca href=\"#TPL07_%E5%91%A8%E6%9C%88%E8%AF%84%E5%AE%A1%E4%B8%8E%E5%86%B3%E5%AE%9A%E8%AE%B0%E5%BD%95\" data-open=\"TPL07_周月评审与决定记录\">周月评审与决定记录\u003c/a>。\u003c/p>\n\u003cp>验收时必须能回答：本职能改变了什么机制？证据来自哪一订单、批次或任务？对另外两项QDC有何影响？换人以后能否维持？不以开会、培训或表格数量作为成功。\u003c/p>\n\u003ch2>证据边界\u003c/h2>\n\u003cp>本手册为DBS与通用管理方法的应用设计，非丹纳赫官方职能标准。上述流程为逻辑模型，需按海顺实际业务确认条件、权限与接口。\u003c/p>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"F05_人力资源与组织能力.md"},{"name":"F06_质量与EHS","title":"质量与EHS｜职能应用手册","raw":"# 质量与EHS｜职能应用手册\r\n\r\n> 校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\r\n\r\n## 定义与职责\r\n\r\n将客户与产品要求转为受控过程、异常遏制和放行标准，并守住人员与环境要求。产品质量是本轮经营重点；安全和必要放行条件不得作为可交换的降本项。\r\n\r\n## 系统流程与接口\r\n\r\n明确CTQ与风险 → 确认测量可靠 → 过程标准和控制 → 发现偏差与遏制 → 原因验证与对策 → 检验放行 → 客户反馈与标准更新。\r\n\r\n与 [[海顺04_战略到执行总纲]] 共用一条部署链；职能是协作视角，不是六个并行项目。\r\n\r\n## 按证据选择工具\r\n\r\n| 现场问题 | 先查证据 | 方法入口 | 必须产出 |\r\n|---|---|---|---|\r\n| 反复缺陷 | 测量系统、缺陷分层、工艺与物料记录 | [[T16_变异管理与质量控制]] | 可信数据及适用过程控制 |\r\n| 返工多 | 批次、工序、条件与损失 | [[T06_问题解决流程]] | 原因证据与经验证对策 |\r\n| 漏检流出 | 检测能力、放行与客户记录 | [[T09_标准作业]] | 异常及放行标准 |\r\n| 现场隐患 | 任务风险和现场条件 | [[T12_现场观察]] | 即时控制与责任闭环 |\r\n\r\n## 指标与计量\r\n\r\nFPY=首次通过且未经返工的合格数量/首次进入该过程的数量，统计单位一致。客户质量可用确认不合格交付批次/对应交付批次，须声明发现窗口与队列，另列投诉件数和严重度，不能混成一个比率。外部逃逸若无法对应交付队列，先报告件数和归属限制。EHS事件发生频率与损失工时/天数分开，任何归一化工时基数需注明本地约定。\r\n\r\n实际数值、目标及责任人待海顺确认；使用 [[TPL02_指标定义与基线]]，完整口径见 [[06_指标字典]]。\r\n\r\n## 本轮怎样落地\r\n\r\n本轮与F02共同观察同一产品族端到端流程。质量人员与工艺、生产协作验证原因，放行权限按公司制度；不能为了OTIF把不合格品出货，不能因增加检验就认定过程能力已改善。\r\n\r\n1. 前两周随同一个产品族试点获取本职能负责的事实和接口证据。\r\n2. 第3—4周参与诊断与资源协商，明确对同一IP的贡献，不另立重复指标。\r\n3. 第5—8周在本职能接口参与小范围试验，同时检查QDC效果。\r\n4. 第9—12周凭持续证据决定标准化和移交；期限只是安排建议，未通过验收则继续验证。\r\n\r\n## 运行节奏与验收\r\n\r\n日常按授权处理异常；每周与端到端主责核对试验和障碍；每月由总经理检查效果、资源和人才。相关记录进入 [[TPL07_周月评审与决定记录]]。\r\n\r\n验收时必须能回答：本职能改变了什么机制？证据来自哪一订单、批次或任务？对另外两项QDC有何影响？换人以后能否维持？不以开会、培训或表格数量作为成功。\r\n\r\n## 证据边界\r\n\r\n本手册为DBS与通用管理方法的应用设计，非丹纳赫官方职能标准。上述流程为逻辑模型，需按海顺实际业务确认条件、权限与接口。\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>质量与EHS｜职能应用手册\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003ch2>定义与职责\u003c/h2>\n\u003cp>将客户与产品要求转为受控过程、异常遏制和放行标准，并守住人员与环境要求。产品质量是本轮经营重点；安全和必要放行条件不得作为可交换的降本项。\u003c/p>\n\u003ch2>系统流程与接口\u003c/h2>\n\u003cp>明确CTQ与风险 → 确认测量可靠 → 过程标准和控制 → 发现偏差与遏制 → 原因验证与对策 → 检验放行 → 客户反馈与标准更新。\u003c/p>\n\u003cp>与 \u003ca href=\"#%E6%B5%B7%E9%A1%BA04_%E6%88%98%E7%95%A5%E5%88%B0%E6%89%A7%E8%A1%8C%E6%80%BB%E7%BA%B2\" data-open=\"海顺04_战略到执行总纲\">战略到执行总纲\u003c/a> 共用一条部署链；职能是协作视角，不是六个并行项目。\u003c/p>\n\u003ch2>按证据选择工具\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现场问题\u003c/th>\n\u003cth>先查证据\u003c/th>\n\u003cth>方法入口\u003c/th>\n\u003cth>必须产出\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>反复缺陷\u003c/td>\n\u003ctd>测量系统、缺陷分层、工艺与物料记录\u003c
