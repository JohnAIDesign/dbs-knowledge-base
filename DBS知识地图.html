licy Deployment / Hoshin Kanri · 战略**\r\n\r\n## 定义\r\n\r\n将少数重要战略突破连接到流程改善、资源和周期性评审的管理过程。它关注建立新能力，不只是分配指标。\r\n\r\n## 何时用\r\n\r\n当前体系无法稳定达到战略所需的新水平。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**战略方向、客户要求、现状、资源和能力差距。\r\n\r\n1. 基于客户、竞争和经营事实作战略取舍。\r\n2. 确定突破与年度进展。\r\n3. 提出流程优先改善及贡献假设。\r\n4. 通过双向和横向协商落实资源。\r\n5. 定义TTI与行动。\r\n6. 月度验证效果并调整。\r\n7. 年度复盘与重新选择。\r\n\r\n## 必须产生的东西\r\n\r\n目标—优先改善—指标—负责人—行动—评审的闭环。\r\n\r\n## 怎样验收\r\n\r\n目标与优先改善的贡献可解释，允许多对多；资源真实可用，效果可复算，收益不重复计入。\r\n\r\n## 误区与边界\r\n\r\n将预算表或所有部门KPI重新排成X矩阵。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：年度关键差距与战略取舍。\r\n- 责任与部署：总经理决定突破与资源；流程负责人落实IP。\r\n- 记录入口：[[TPL06_PD部署链与资源协商]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n把一个年度目标改写成“必须建立哪项新流程能力”。\r\n\r\n## 来源与相邻节点\r\n\r\nPD课件第4—10、23—38、48、56—58页；通用方法补充S05。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T02_目标协商与部署矩阵]] · [[T03_保龄图与行动计划]] · [[T05_价值流图]] · [[T06_问题解决流程]] · [[T08_可视化与日常管理]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>方针部署\u003c/h1>\n\u003cp>\u003cstrong>T01 · Policy Deployment / Hoshin Kanri · 战略\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>将少数重要战略突破连接到流程改善、资源和周期性评审的管理过程。它关注建立新能力，不只是分配指标。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>当前体系无法稳定达到战略所需的新水平。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**战略方向、客户要求、现状、资源和能力差距。\u003c/p>\n\u003col>\n\u003cli>基于客户、竞争和经营事实作战略取舍。\u003c/li>\n\u003cli>确定突破与年度进展。\u003c/li>\n\u003cli>提出流程优先改善及贡献假设。\u003c/li>\n\u003cli>通过双向和横向协商落实资源。\u003c/li>\n\u003cli>定义TTI与行动。\u003c/li>\n\u003cli>月度验证效果并调整。\u003c/li>\n\u003cli>年度复盘与重新选择。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>目标—优先改善—指标—负责人—行动—评审的闭环。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>目标与优先改善的贡献可解释，允许多对多；资源真实可用，效果可复算，收益不重复计入。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>将预算表或所有部门KPI重新排成X矩阵。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：年度关键差距与战略取舍。\u003c/li>\n\u003cli>责任与部署：总经理决定突破与资源；流程负责人落实IP。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL06_PD%E9%83%A8%E7%BD%B2%E9%93%BE%E4%B8%8E%E8%B5%84%E6%BA%90%E5%8D%8F%E5%95%86\" data-open=\"TPL06_PD部署链与资源协商\">PD部署链与资源协商\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>把一个年度目标改写成“必须建立哪项新流程能力”。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>PD课件第4—10、23—38、48、56—58页；通用方法补充S05。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T02_%E7%9B%AE%E6%A0%87%E5%8D%8F%E5%95%86%E4%B8%8E%E9%83%A8%E7%BD%B2%E7%9F%A9%E9%98%B5\" data-open=\"T02_目标协商与部署矩阵\">目标协商与部署矩阵\u003c/a> · \u003ca href=\"#T03_%E4%BF%9D%E9%BE%84%E5%9B%BE%E4%B8%8E%E8%A1%8C%E5%8A%A8%E8%AE%A1%E5%88%92\" data-open=\"T03_保龄图与行动计划\">保龄图与行动计划\u003c/a> · \u003ca href=\"#T05_%E4%BB%B7%E5%80%BC%E6%B5%81%E5%9B%BE\" data-open=\"T05_价值流图\">价值流图\u003c/a> · \u003ca href=\"#T06_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E6%B5%81%E7%A8%8B\" data-open=\"T06_问题解决流程\">问题解决流程\u003c/a> · \u003ca href=\"#T08_%E5%8F%AF%E8%A7%86%E5%8C%96%E4%B8%8E%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86\" data-open=\"T08_可视化与日常管理\">可视化与日常管理\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T01_方针部署.md"},{"name":"T02_目标协商与部署矩阵","title":"目标协商与部署矩阵","raw":"---\r\nid: T02\r\n类型: 工具\r\n模块: 战略\r\n英文: Catchball / X-Matrix\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 目标协商与部署矩阵\r\n\r\n**T02 · Catchball / X-Matrix · 战略**\r\n\r\n## 定义\r\n\r\n用部署矩阵表达目标、优先改善、指标和资源的关系，通过Catchball双向及横向协商形成共同承诺。矩阵是承载关系的工具，不能替代战略选择和执行。\r\n\r\n## 何时用\r\n\r\n目标跨部门、资源冲突，或矩阵有点但没有共同理解。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**目标、拟议改善、能力与资源限制。\r\n\r\n1. 上层说明方向。\r\n2. 团队反馈现实与备选方法。\r\n3. 协商承诺和取舍。\r\n4. 标注关系及主责。\r\n5. 在可执行层次转行动。\r\n\r\n## 必须产生的东西\r\n\r\n有责任、资源和作用逻辑的部署链或X矩阵。\r\n\r\n## 怎样验收\r\n\r\n每个关联点可解释；下层产生自己的实现方法，不仅复制上层数字。\r\n\r\n## 误区与边界\r\n\r\n目标与优先改善可以多对多。点、圈、三角等符号以本表图例为准，不能把点自动解释为资源授权；必须写清主责、协作、资源和决策权限。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：跨部门目标、接口与资源冲突。\r\n- 责任与部署：流程负责人牵头，上下及横向Catchball。\r\n- 记录入口：[[TPL06_PD部署链与资源协商]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n挑一个关联点，写出贡献假设、资源承诺和依赖条件。\r\n\r\n## 来源与相邻节点\r\n\r\nPD课件第29—37页支持矩阵与部署；Catchball为通用方针管理补充。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T01_方针部署]] · [[T03_保龄图与行动计划]] · [[T27_人才发展与继任]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>目标协商与部署矩阵\u003c/h1>\n\u003cp>\u003cstrong>T02 · Catchball / X-Matrix · 战略\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>用部署矩阵表达目标、优先改善、指标和资源的关系，通过Catchball双向及横向协商形成共同承诺。矩阵是承载关系的工具，不能替代战略选择和执行。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>目标跨部门、资源冲突，或矩阵有点但没有共同理解。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**目标、拟议改善、能力与资源限制。\u003c/p>\n\u003col>\n\u003cli>上层说明方向。\u003c/li>\n\u003cli>团队反馈现实与备选方法。\u003c/li>\n\u003cli>协商承诺和取舍。\u003c/li>\n\u003cli>标注关系及主责。\u003c/li>\n\u003cli>在可执行层次转行动。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>有责任、资源和作用逻辑的部署链或X矩阵。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>每个关联点可解释；下层产生自己的实现方法，不仅复制上层数字。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>目标与优先改善可以多对多。点、圈、三角等符号以本表图例为准，不能把点自动解释为资源授权；必须写清主责、协作、资源和决策权限。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：跨部门目标、接口与资源冲突。\u003c/li>\n\u003cli>责任与部署：流程负责人牵头，上下及横向Catchball。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL06_PD%E9%83%A8%E7%BD%B2%E9%93%BE%E4%B8%8E%E8%B5%84%E6%BA%90%E5%8D%8F%E5%95%86\" data-open=\"TPL06_PD部署链与资源协商\">PD部署链与资源协商\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>挑一个关联点，写出贡献假设、资源承诺和依赖条件。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>PD课件第29—37页支持矩阵与部署；Catchball为通用方针管理补充。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T01_%E6%96%B9%E9%92%88%E9%83%A8%E7%BD%B2\" data-open=\"T01_方针部署\">方针部署\u003c/a> · \u003ca href=\"#T03_%E4%BF%9D%E9%BE%84%E5%9B%BE%E4%B8%8E%E8%A1%8C%E5%8A%A8%E8%AE%A1%E5%88%92\" data-open=\"T03_保龄图与行动计划\">保龄图与行动计划\u003c/a> · \u003ca href=\"#T27_%E4%BA%BA%E6%89%8D%E5%8F%91%E5%B1%95%E4%B8%8E%E7%BB%A7%E4%BB%BB\" data-open=\"T27_人才发展与继任\">人才发展与继任\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T02_目标协商与部署矩阵.md"},{"name":"T03_保龄图与行动计划","title":"保龄图与行动计划","raw":"---\r\nid: T03\r\n类型: 工具\r\n模块: 战略\r\n英文: Bowler / Action Plan\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 保龄图与行动计划\r\n\r\n**T03 · Bowler / Action Plan · 战略**\r\n\r\n## 定义\r\n\r\n保龄图按周期比较目标与实际；行动计划管理具体动作、负责人、期限和预计作用。效果状态与任务状态应分别保留。\r\n\r\n## 何时用\r\n\r\n需要追踪突破，或经常发生“任务完成、结果未变”。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**指标口径、基线、阶段目标和项目动作。\r\n\r\n1. 编制目标轨迹。\r\n2. 按期填实际。\r\n3. 记录差距。\r\n4. 检查动作及效果。\r\n5. 对未达标项启动原因验证和对策。\r\n\r\n## 必须产生的东西\r\n\r\n结果表、行动计划与对策记录相互链接。\r\n\r\n## 怎样验收\r\n\r\n历史目标和变更可追溯；比例年度累计按总分子/总分母计算。\r\n\r\n## 误区与边界\r\n\r\n用月均百分比直接代表全年；事后改目标使表变绿；预计作用重复相加。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：TTI实际与目标、行动及偏差。\r\n- 责任与部署：流程负责人维护；月度评审决定。\r\n- 记录入口：[[TPL05_保龄图与行动计划]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n给一个行动补上“预期影响哪个指标、何时可见、如何检验”。\r\n\r\n## 来源与相邻节点\r\n\r\nPD课件第38—48页；汇总口径为通用数据方法。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[C06_结果与过程指标]] · [[T01_方针部署]] · [[T06_问题解决流程]] · [[T08_可视化与日常管理]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>保龄图与行动计划\u003c/h1>\n\u003cp>\u003cstrong>T03 · Bowler / Action Plan · 战略\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>保龄图按周期比较目标与实际；行动计划管理具体动作、负责人、期限和预计作用。效果状态与任务状态应分别保留。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>需要追踪突破，或经常发生“任务完成、结果未变”。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**指标口径、基线、阶段目标和项目动作。\u003c/p>\n\u003col>\n\u003cli>编制目标轨迹。\u003c/li>\n\u003cli>按期填实际。\u003c/li>\n\u003cli>记录差距。\u003c/li>\n\u003cli>检查动作及效果。\u003c/li>\n\u003cli>对未达标项启动原因验证和对策。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>结果表、行动计划与对策记录相互链接。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>历史目标和变更可追溯；比例年度累计按总分子/总分母计算。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>用月均百分比直接代表全年；事后改目标使表变绿；预计作用重复相加。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：TTI实际与目标、行动及偏差。\u003c/li>\n\u003cli>责任与部署：流程负责人维护；月度评审决定。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL05_%E4%BF%9D%E9%BE%84%E5%9B%BE%E4%B8%8E%E8%A1%8C%E5%8A%A8%E8%AE%A1%E5%88%92\" data-open=\"TPL05_保龄图与行动计划\">保龄图与行动计划\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>给一个行动补上“预期影响哪个指标、何时可见、如何检验”。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>PD课件第38—48页；汇总口径为通用数据方法。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#C06_%E7%BB%93%E6%9E%9C%E4%B8%8E%E8%BF%87%E7%A8%8B%E6%8C%87%E6%A0%87\" data-open=\"C06_结果与过程指标\">结果与过程指标\u003c/a> · \u003ca href=\"#T01_%E6%96%B9%E9%92%88%E9%83%A8%E7%BD%B2\" data-open=\"T01_方针部署\">方针部署\u003c/a> · \u003ca href=\"#T06_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E6%B5%81%E7%A8%8B\" data-open=\"T06_问题解决流程\">问题解决流程\u003c/a> · \u003ca href=\"#T08_%E5%8F%AF%E8%A7%86%E5%8C%96%E4%B8%8E%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86\" data-open=\"T08_可视化与日常管理\">可视化与日常管理\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T03_保龄图与行动计划.md"},{"name":"T04_客户之声","title":"客户之声","raw":"---\r\nid: T04\r\n类型: 工具\r\n模块: 共同基础\r\n英文: Voice of Customer / VOC\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 客户之声\r\n\r\n**T04 · Voice of Customer / VOC · 共同基础**\r\n\r\n## 定义\r\n\r\n系统收集和分析客户在真实场景中的需求、困难和选择依据，将其转成可验证要求。\r\n\r\n## 何时用\r\n\r\n不清楚客户真正重视什么，或团队各自猜测需求。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**客户分群、使用场景、访谈和观察计划。\r\n\r\n1. 选择有代表性客户。\r\n2. 观察实际使用。\r\n3. 记录原话与行为。\r\n4. 分开事实和解释。\r\n5. 归纳需求。\r\n6. 回访验证并明确要求。\r\n\r\n## 必须产生的东西\r\n\r\n客户—场景—困难—需求—验证指标的证据表。\r\n\r\n## 怎样验收\r\n\r\n每个核心需求可追溯到证据，知道哪些客户适用、哪些不适用。\r\n\r\n## 误区与边界\r\n\r\n只问最熟的客户，诱导客户同意既定方案，把单个意见当普遍需求。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：客户明确要求与实际使用问题。\r\n- 责任与部署：业务与质量共同确认CTQ、交付定义和价值。\r\n- 记录入口：[[TPL01_改善项目章程]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n将“客户说太慢”展开为起点、终点、可接受时间和后果。\r\n\r\n## 来源与相邻节点\r\n\r\n书第99、119—123页；采访步骤为教学设计。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T19_客户细分]] · [[T05_价值流图]] · [[T20_创新领域与机会选择]] · [[T25_价值销售]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>客户之声\u003c/h1>\n\u003cp>\u003cstrong>T04 · Voice of Customer / VOC · 共同基础\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>系统收集和分析客户在真实场景中的需求、困难和选择依据，将其转成可验证要求。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>不清楚客户真正重视什么，或团队各自猜测需求。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**客户分群、使用场景、访谈和观察计划。\u003c/p>\n\u003col>\n\u003cli>选择有代表性客户。\u003c/li>\n\u003cli>观察实际使用。\u003c/li>\n\u003cli>记录原话与行为。\u003c/li>\n\u003cli>分开事实和解释。\u003c/li>\n\u003cli>归纳需求。\u003c/li>\n\u003cli>回访验证并明确要求。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>客户—场景—困难—需求—验证指标的证据表。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>每个核心需求可追溯到证据，知道哪些客户适用、哪些不适用。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>只问最熟的客户，诱导客户同意既定方案，把单个意见当普遍需求。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：客户明确要求与实际使用问题。\u003c/li>\n\u003cli>责任与部署：业务与质量共同确认CTQ、交付定义和价值。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL01_%E6%94%B9%E5%96%84%E9%A1%B9%E7%9B%AE%E7%AB%A0%E7%A8%8B\" data-open=\"TPL01_改善项目章程\">改善项目章程\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>将“客户说太慢”展开为起点、终点、可接受时间和后果。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>书第99、119—123页；采访步骤为教学设计。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T19_%E5%AE%A2%E6%88%B7%E7%BB%86%E5%88%86\" data-open=\"T19_客户细分\">客户细分\u003c/a> · \u003ca href=\"#T05_%E4%BB%B7%E5%80%BC%E6%B5%81%E5%9B%BE\" data-open=\"T05_价值流图\">价值流图\u003c/a> · \u003ca href=\"#T20_%E5%88%9B%E6%96%B0%E9%A2%86%E5%9F%9F%E4%B8%8E%E6%9C%BA%E4%BC%9A%E9%80%89%E6%8B%A9\" data-open=\"T20_创新领域与机会选择\">创新领域与机会选择\u003c/a> · \u003ca href=\"#T25_%E4%BB%B7%E5%80%BC%E9%94%80%E5%94%AE\" data-open=\"T25_价值销售\">价值销售\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T04_客户之声.md"},{"name":"T05_价值流图","title":"价值流图","raw":"---\r\nid: T05\r\n类型: 工具\r\n模块: 共同基础\r\n英文: Value Stream Mapping / VSM\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 价值流图\r\n\r\n**T05 · Value Stream Mapping / VSM · 共同基础**\r\n\r\n## 定义\r\n\r\n用实物流、信息流及时间数据描述某一价值流的现状，再设计未来状态和改善路径。\r\n\r\n## 何时用\r\n\r\n交付周期长、跨部门等待多，或不知道行动从哪里开始。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**一个产品/服务族、范围、需求与现场记录。\r\n\r\n1. 从客户回看流程。\r\n2. 记录处理与等待、库存/在途量、返工和信息指令。\r\n3. 定位限制。\r\n4. 画未来态。\r\n5. 形成验证项目。\r\n\r\n## 必须产生的东西\r\n\r\n现状图、未来态和有先后关系的改善清单。\r\n\r\n## 怎样验收\r\n\r\n图来自真实流动而非制度文件；改善指向端到端结果。\r\n\r\n## 误区与边界\r\n\r\n只画漂亮流程框，没有时间、等待或信息流；未测量就画理想未来。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：订单和批次实际经历的时间与流动。\r\n- 责任与部署：跨职能团队走完端到端流程，不只画部门框。\r\n- 记录入口：[[TPL08_现状价值流采集]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n跟踪一个已完成订单，标出最长等待与导致等待的信息。\r\n\r\n## 来源与相邻节点\r\n\r\n书第100—102页；PD课件第39—40页；LEI VSM补充S05。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[C05_价值流与浪费]] · [[T06_问题解决流程]] · [[T07_改善活动]] · [[T10_事务流程改进]] · [[T13_拉动与在制品限制]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>价值流图\u003c/h1>\n\u003cp>\u003cstrong>T05 · Value Stream Mapping / VSM · 共同基础\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>用实物流、信息流及时间数据描述某一价值流的现状，再设计未来状态和改善路径。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>交付周期长、跨部门等待多，或不知道行动从哪里开始。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**一个产品/服务族、范围、需求与现场记录。\u003c/p>\n\u003col>\n\u003cli>从客户回看流程。\u003c/li>\n\u003cli>记录处理与等待、库存/在途量、返工和信息指令。\u003c/li>\n\u003cli>定位限制。\u003c/li>\n\u003cli>画未来态。\u003c/li>\n\u003cli>形成验证项目。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>现状图、未来态和有先后关系的改善清单。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>图来自真实流动而非制度文件；改善指向端到端结果。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>只画漂亮流程框，没有时间、等待或信息流；未测量就画理想未来。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：订单和批次实际经历的时间与流动。\u003c/li>\n\u003cli>责任与部署：跨职能团队走完端到端流程，不只画部门框。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL08_%E7%8E%B0%E7%8A%B6%E4%BB%B7%E5%80%BC%E6%B5%81%E9%87%87%E9%9B%86\" data-open=\"TPL08_现状价值流采集\">现状价值流采集\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>跟踪一个已完成订单，标出最长等待与导致等待的信息。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>书第100—102页；PD课件第39—40页；LEI VSM补充S05。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#C05_%E4%BB%B7%E5%80%BC%E6%B5%81%E4%B8%8E%E6%B5%AA%E8%B4%B9\" data-open=\"C05_价值流与浪费\">价值流与浪费\u003c/a> · \u003ca href=\"#T06_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E6%B5%81%E7%A8%8B\" data-open=\"T06_问题解决流程\">问题解决流程\u003c/a> · \u003ca href=\"#T07_%E6%94%B9%E5%96%84%E6%B4%BB%E5%8A%A8\" data-open=\"T07_改善活动\">改善活动\u003c/a> · \u003ca href=\"#T10_%E4%BA%8B%E5%8A%A1%E6%B5%81%E7%A8%8B%E6%94%B9%E8%BF%9B\" data-open=\"T10_事务流程改进\">事务流程改进\u003c/a> · \u003ca href=\"#T13_%E6%8B%89%E5%8A%A8%E4%B8%8E%E5%9C%A8%E5%88%B6%E5%93%81%E9%99%90%E5%88%B6\" data-open=\"T13_拉动与在制品限制\">拉动与在制品限制\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T05_价值流图.md"},{"name":"T06_问题解决流程","title":"问题解决流程","raw":"---\r\nid: T06\r\n类型: 方法\r\n模块: 共同基础\r\n英文: Problem Solving Process / PSP\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 问题解决流程\r\n\r\n**T06 · Problem Solving Process / PSP · 共同基础**\r\n\r\n## 定义\r\n\r\n以事实界定差距、验证原因、试行对策并防止复发的结构化问题解决。以下是教学流程，不声称是内部固定步数。\r\n\r\n## 何时用\r\n\r\n偏差反复、原因不明，或对策多次无效。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**标准与实际、具体事件、原始记录和现场可观察条件。\r\n\r\n1. 必要时先遏制客户和现场风险。\r\n2. 界定问题并确认测量可信。\r\n3. 分层定位差距。\r\n4. 提出原因假设。\r\n5. 用记录、现场观察或试验验证并考虑替代解释。\r\n6. 试行对策。\r\n7. 同口径检查QDC效果。\r\n8. 更新标准并持续验证。\r\n\r\n## 必须产生的东西\r\n\r\n问题、原因证据、对策、结果和维持记录。\r\n\r\n## 怎样验收\r\n\r\n能区分症状、原因假设与已验证机制；对策直接作用于原因。\r\n\r\n## 误区与边界\r\n\r\nPareto排序只定位频率或损失集中点，不证明原因；5Why帮助提出和追查假设，问满五次不等于找到根因。未知原因可以先安排调查与验证。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：经分层的偏差与现场证据。\r\n- 责任与部署：问题主责组织取证、试验、效果检查。\r\n- 记录入口：[[TPL04_问题解决记录]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n为一个反复问题写出能推翻你当前猜测的证据。\r\n\r\n## 来源与相邻节点\r\n\r\n书第99页确认工具；PD课件第24、46—48页；步骤为通用方法操作化。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[C04_PDCA与试验学习]] · [[T05_价值流图]] · [[T07_改善活动]] · [[T09_标准作业]] · [[T16_变异管理与质量控制]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>问题解决流程\u003c/h1>\n\u003cp>\u003cstrong>T06 · Problem Solving Process / PSP · 共同基础\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>以事实界定差距、验证原因、试行对策并防止复发的结构化问题解决。以下是教学流程，不声称是内部固定步数。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>偏差反复、原因不明，或对策多次无效。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**标准与实际、具体事件、原始记录和现场可观察条件。\u003c/p>\n\u003col>\n\u003cli>必要时先遏制客户和现场风险。\u003c/li>\n\u003 zen Event\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 改善活动\r\n\r\n**T07 · Kaizen / Kaizen Event · 共同基础**\r\n\r\n## 定义\r\n\r\n针对具体问题实施、验证并固化工作方法的改进；集中改善活动是其中一种组织方式。\r\n\r\n## 何时用\r\n\r\n问题范围清楚，需要跨职能集中观察和试行。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**问题章程、基线、参与人员、试验权限和现场条件。\r\n\r\n1. 事前明确问题。\r\n2. 现场观察。\r\n3. 验证关键原因。\r\n4. 快速试行。\r\n5. 比较效果。\r\n6. 形成标准。\r\n7. 安排后续复查。\r\n\r\n## 必须产生的东西\r\n\r\n经过试行的新方法，以及责任明确的待办和维持计划。\r\n\r\n## 怎样验收\r\n\r\n活动后实际工作发生变化，结果继续追踪，负责人接得住。\r\n\r\n## 误区与边界\r\n\r\n把改善等同固定五天会议；活动结束就宣布收益永久实现。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：有边界且适合集中验证的问题。\r\n- 责任与部署：业务主责承诺资源，教练帮助试验与标准化。\r\n- 记录入口：[[TPL01_改善项目章程]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n写出一个小改善的试行范围和结束后谁负责维持。\r\n\r\n## 来源与相邻节点\r\n\r\n书第103—104页；时长与执行细节为教学设计。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T06_问题解决流程]] · [[T09_标准作业]] · [[T08_可视化与日常管理]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>改善活动\u003c/h1>\n\u003cp>\u003cstrong>T07 · Kaizen / Kaizen Event · 共同基础\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>针对具体问题实施、验证并固化工作方法的改进；集中改善活动是其中一种组织方式。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>问题范围清楚，需要跨职能集中观察和试行。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**问题章程、基线、参与人员、试验权限和现场条件。\u003c/p>\n\u003col>\n\u003cli>事前明确问题。\u003c/li>\n\u003cli>现场观察。\u003c/li>\n\u003cli>验证关键原因。\u003c/li>\n\u003cli>快速试行。\u003c/li>\n\u003cli>比较效果。\u003c/li>\n\u003cli>形成标准。\u003c/li>\n\u003cli>安排后续复查。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>经过试行的新方法，以及责任明确的待办和维持计划。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>活动后实际工作发生变化，结果继续追踪，负责人接得住。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>把改善等同固定五天会议；活动结束就宣布收益永久实现。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：有边界且适合集中验证的问题。\u003c/li>\n\u003cli>责任与部署：业务主责承诺资源，教练帮助试验与标准化。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL01_%E6%94%B9%E5%96%84%E9%A1%B9%E7%9B%AE%E7%AB%A0%E7%A8%8B\" data-open=\"TPL01_改善项目章程\">改善项目章程\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>写出一个小改善的试行范围和结束后谁负责维持。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>书第103—104页；时长与执行细节为教学设计。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T06_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E6%B5%81%E7%A8%8B\" data-open=\"T06_问题解决流程\">问题解决流程\u003c/a> · \u003ca href=\"#T09_%E6%A0%87%E5%87%86%E4%BD%9C%E4%B8%9A\" data-open=\"T09_标准作业\">标准作业\u003c/a> · \u003ca href=\"#T08_%E5%8F%AF%E8%A7%86%E5%8C%96%E4%B8%8E%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86\" data-open=\"T08_可视化与日常管理\">可视化与日常管理\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T07_改善活动.md"},{"name":"T08_可视化与日常管理","title":"可视化与日常管理","raw":"---\r\nid: T08\r\n类型: 机制\r\n模块: 共同基础\r\n英文: Visual & Daily Management / DM\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 可视化与日常管理\r\n\r\n**T08 · Visual & Daily Management / DM · 共同基础**\r\n\r\n## 定义\r\n\r\n通过可见的标准与实际差距、明确的责任和异常响应，在日常节奏中维持及改进流程。DM不是挂看板或开例会，也不等同于KPI。\r\n\r\n## 何时用\r\n\r\n月底才发现问题、日常靠催办或改善容易反弹。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**关键标准、指标口径、及时数据、角色与升级权限。\r\n\r\n1. 选少数运行指标。\r\n2. 展示目标和实际。\r\n3. 短会识别差距。\r\n4. 分配响应。\r\n5. 重大或反复问题升级。\r\n6. 检查关闭证据。\r\n\r\n## 必须产生的东西\r\n\r\n一块可使用的看板、异常记录和升级规则。\r\n\r\n## 怎样验收\r\n\r\n随机问一条红色：影响什么、谁处理、何时反馈、怎样确认有效。\r\n\r\n## 误区与边界\r\n\r\n各层管理者都有日常管理职责。PD与DM可共用同一事实数据和指标；每日响应异常，月度PD验证突破机制，两种用途分别定义。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：标准、实际、异常和权限。\r\n- 责任与部署：各层负责人按日常节奏响应并升级。\r\n- 记录入口：[[TPL03_日常管理与异常升级]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n用今天的一次异常填写责任人、下一动作和升级时间。\r\n\r\n## 来源与相邻节点\r\n\r\n书第104—108页；PD课件第17—18、44、55—56页。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[C06_结果与过程指标]] · [[T06_问题解决流程]] · [[T09_标准作业]] · [[T28_领导标准工作]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>可视化与日常管理\u003c/h1>\n\u003cp>\u003cstrong>T08 · Visual &amp; Daily Management / DM · 共同基础\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>通过可见的标准与实际差距、明确的责任和异常响应，在日常节奏中维持及改进流程。DM不是挂看板或开例会，也不等同于KPI。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>月底才发现问题、日常靠催办或改善容易反弹。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**关键标准、指标口径、及时数据、角色与升级权限。\u003c/p>\n\u003col>\n\u003cli>选少数运行指标。\u003c/li>\n\u003cli>展示目标和实际。\u003c/li>\n\u003cli>短会识别差距。\u003c/li>\n\u003cli>分配响应。\u003c/li>\n\u003cli>重大或反复问题升级。\u003c/li>\n\u003cli>检查关闭证据。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>一块可使用的看板、异常记录和升级规则。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>随机问一条红色：影响什么、谁处理、何时反馈、怎样确认有效。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>各层管理者都有日常管理职责。PD与DM可共用同一事实数据和指标；每日响应异常，月度PD验证突破机制，两种用途分别定义。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：标准、实际、异常和权限。\u003c/li>\n\u003cli>责任与部署：各层负责人按日常节奏响应并升级。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL03_%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86%E4%B8%8E%E5%BC%82%E5%B8%B8%E5%8D%87%E7%BA%A7\" data-open=\"TPL03_日常管理与异常升级\">日常管理与异常升级\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>用今天的一次异常填写责任人、下一动作和升级时间。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>书第104—108页；PD课件第17—18、44、55—56页。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#C06_%E7%BB%93%E6%9E%9C%E4%B8%8E%E8%BF%87%E7%A8%8B%E6%8C%87%E6%A0%87\" data-open=\"C06_结果与过程指标\">结果与过程指标\u003c/a> · \u003ca href=\"#T06_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E6%B5%81%E7%A8%8B\" data-open=\"T06_问题解决流程\">问题解决流程\u003c/a> · \u003ca href=\"#T09_%E6%A0%87%E5%87%86%E4%BD%9C%E4%B8%9A\" data-open=\"T09_标准作业\">标准作业\u003c/a> · \u003ca href=\"#T28_%E9%A2%86%E5%AF%BC%E6%A0%87%E5%87%86%E5%B7%A5%E4%BD%9C\" data-open=\"T28_领导标准工作\">领导标准工作\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T08_可视化与日常管理.md"},{"name":"T09_标准作业","title":"标准作业","raw":"---\r\nid: T09\r\n类型: 工具\r\n模块: 共同基础\r\n英文: Standard Work\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 标准作业\r\n\r\n**T09 · Standard Work · 共同基础**\r\n\r\n## 定义\r\n\r\n把当前已经验证的工作方法变成相关人员能一致执行并持续改进的标准。制造型标准化作业常包含节拍、顺序、标准在制品；通用业务还需输入、质量要求和异常路径。\r\n\r\n## 何时用\r\n\r\n同一工作因人而异、返工多，或改善需要保持。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**已验证方法、质量要求、现场限制和执行者经验。\r\n\r\n1. 与执行者一起观察。\r\n2. 写清关键步骤及理由。\r\n3. 现场试做。\r\n4. 确认能力。\r\n5. 受控发布。\r\n6. 通过偏差持续更新。\r\n\r\n## 必须产生的东西\r\n\r\n可现场使用的标准、版本、训练与异常处理方式。\r\n\r\n## 怎样验收\r\n\r\n新人或替代者能按要求执行；真实操作与标准一致。\r\n\r\n## 误区与边界\r\n\r\n把制度文件数量等同标准化；标准永久不变；忽视例外工作。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：已验证方法与关键质量条件。\r\n- 责任与部署：岗位骨干起草、现场验证，主管负责维持。\r\n- 记录入口：[[TPL09_标准化与移交验收]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n选一个高频任务，写出三个关键点及做错的后果。\r\n\r\n## 来源与相邻节点\r\n\r\n书第99页；LEI Standardized Work支持制造三要素；通用步骤为教学设计。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T07_改善活动]] · [[T08_可视化与日常管理]] · [[T27_人才发展与继任]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>标准作业\u003c/h1>\n\u003cp>\u003cstrong>T09 · Standard Work · 共同基础\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>把当前已经验证的工作方法变成相关人员能一致执行并持续改进的标准。制造型标准化作业常包含节拍、顺序、标准在制品；通用业务还需输入、质量要求和异常路径。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>同一工作因人而异、返工多，或改善需要保持。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**已验证方法、质量要求、现场限制和执行者经验。\u003c/p>\n\u003col>\n\u003cli>与执行者一起观察。\u003c/li>\n\u003cli>写清关键步骤及理由。\u003c/li>\n\u003cli>现场试做。\u003c/li>\n\u003cli>确认能力。\u003c/li>\n\u003cli>受控发布。\u003c/li>\n\u003cli>通过偏差持续更新。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>可现场使用的标准、版本、训练与异常处理方式。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>新人或替代者能按要求执行；真实操作与标准一致。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>把制度文件数量等同标准化；标准永久不变；忽视例外工作。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：已验证方法与关键质量条件。\u003c/li>\n\u003cli>责任与部署：岗位骨干起草、现场验证，主管负责维持。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL09_%E6%A0%87%E5%87%86%E5%8C%96%E4%B8%8E%E7%A7%BB%E4%BA%A4%E9%AA%8C%E6%94%B6\" data-open=\"TPL09_标准化与移交验收\">标准化与移交验收\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>选一个高频任务，写出三个关键点及做错的后果。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>书第99页；LEI Standardized Work支持制造三要素；通用步骤为教学设计。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T07_%E6%94%B9%E5%96%84%E6%B4%BB%E5%8A%A8\" data-open=\"T07_改善活动\">改善活动\u003c/a> · \u003ca href=\"#T08_%E5%8F%AF%E8%A7%86%E5%8C%96%E4%B8%8E%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86\" data-open=\"T08_可视化与日常管理\">可视化与日常管理\u003c/a> · \u003ca href=\"#T27_%E4%BA%BA%E6%89%8D%E5%8F%91%E5%B1%95%E4%B8%8E%E7%BB%A7%E4%BB%BB\" data-open=\"T27_人才发展与继任\">人才发展与继任\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T09_标准作业.md"},{"name":"T10_事务流程改进","title":"事务流程改进","raw":"---\r\nid: T10\r\n类型: 工具\r\n模块: 共同基础\r\n英文: Transactional Process Improvement / TPI\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 事务流程改进\r\n\r\n**T10 · Transactional Process Improvement / TPI · 共同基础**\r\n\r\n## 定义\r\n\r\n改进订单、报价、审批、采购、应收等信息和业务事务流中的等待、错误与重复处理。\r\n\r\n## 何时用\r\n\r\n大量耗时发生在部门间交接而不是实际处理。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**真实事务样本、时间戳、退回原因、权限和要求。\r\n\r\n1. 画跨职能流程。\r\n2. 测等待和返工。\r\n3. 验证交接问题。\r\n4. 减少不必要步骤。\r\n5. 明确输入与授权。\r\n6. 试行并标准化。\r\n\r\n## 必须产生的东西\r\n\r\n新的受理、路由、交接、响应和例外规则。\r\n\r\n## 怎样验收\r\n\r\n端到端周期和一次通过率改善，必要控制仍有效。\r\n\r\n## 误区与边界\r\n\r\n只减少审批人而不看风险；直接把错误流程电子化。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：信息缺项、等待、反复审批的记录。\r\n- 责任与部署：流程负责人优化接口，检验端到端周期。\r\n- 记录入口：[[TPL08_现状价值流采集]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n追踪一份被退回的单据，定位第一处信息缺失。\r\n\r\n## 来源与相邻节点\r\n\r\n书第90、99、109页；具体步骤为通用事务精益方法。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T05_价值流图]] · [[T06_问题解决流程]] · [[T09_标准作业]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>事务流程改进\u003c/h1>\n\u003cp>\u003cstrong>T10 · Transactional Process Improvement / TPI · 共同基础\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>改进订单、报价、审批、采购、应收等信息和业务事务流中的等待、错误与重复处理。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>大量耗时发生在部门间交接而不是实际处理。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**真实事务样本、时间戳、退回原因、权限和要求。\u003c/p>\n\u003col>\n\u003cli>画跨职能流程。\u003c/li>\n\u003cli>测等待和返工。\u003c/li>\n\u003cli>验证交接问题。\u003c/li>\n\u003cli>减少不必要步骤。\u003c/li>\n\u003cli>明确输入与授权。\u003c/li>\n\u003cli>试行并标准化。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>新的受理、路由、交接、响应和例外规则。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>端到端周期和一次通过率改善，必要控制仍有效。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>只减少审批人而不看风险；直接把错误流程电子化。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：信息缺项、等待、反复审批的记录。\u003c/li>\n\u003cli>责任与部署：流程负责人优化接口，检验端到端周期。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL08_%E7%8E%B0%E7%8A%B6%E4%BB%B7%E5%80%BC%E6%B5%81%E9%87%87%E9%9B%86\" data-open=\"TPL08_现状价值流采集\">现状价值流采集\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>追踪一份被退回的单据，定位第一处信息缺失。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>书第90、99、109页；具体步骤为通用事务精益方法。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T05_%E4%BB%B7%E5%80%BC%E6%B5%81%E5%9B%BE\" data-open=\"T05_价值流图\">价值流图\u003c/a> · \u003ca href=\"#T06_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E6%B5%81%E7%A8%8B\" data-open=\"T06_问题解决流程\">问题解决流程\u003c/a> · \u003ca href=\"#T09_%E6%A0%87%E5%87%86%E4%BD%9C%E4%B8%9A\" data-open=\"T09_标准作业\">标准作业\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T10_事务流程改进.md"},{"name":"T11_5S","title":"5S","raw":"---\r\nid: T11\r\n类型: 工具\r\n模块: 共同基础\r\n英文: Sort / Set in Order / Shine / Standardize / Sustain\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 5S\r\n\r\n**T11 · Sort / Set in Order / Shine / Standardize / Sustain · 共同基础**\r\n\r\n## 定义\r\n\r\n通过整理、整顿、清扫、标准化和持续维持，使工作环境和异常更容易识别。\r\n\r\n## 何时用\r\n\r\n查找、错取、污染、混放或基础状态不可见。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**工作需要、物品/文件使用情况和风险。\r\n\r\n1. 区分必要与不必要。\r\n2. 按使用和风险定位。\r\n3. 清洁并发现异常。\r\n4. 建立位置与状态标准。\r\n5. 日常复查。\r\n\r\n## 必须产生的东西\r\n\r\n位置、数量、状态和维护责任清楚的环境。\r\n\r\n## 怎样验收\r\n\r\n找取时间、错取和异常发现改善，不只是检查分数高。\r\n\r\n## 误区与边界\r\n\r\n把5S做成大扫除；未解决混料或异常识别。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：寻找、误取、污染或安全隐患事实。\r\n- 责任与部署：岗位人员定义必要物品、位置与异常恢复。\r\n- 记录入口：[[TPL09_标准化与移交验收]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n选择一处工具或文件区域，测量一次查找并设计可视定位。\r\n\r\n## 来源与相邻节点\r\n\r\n书第99页确认工具；5S步骤为通用精益知识。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T09_标准作业]] · [[T08_可视化与日常管理]] · [[T12_现场观察]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>5S\u003c/h1>\n\u003cp>\u003cstrong>T11 · Sort / Set in Order / Shine / Standardize / Sustain · 共同基础\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>通过整理、整顿、清扫、标准化和持续维持，使工作环境和异常更容易识别。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>查找、错取、污染、混放或基础状态不可见。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**工作需要、物品/文件使用情况和风险。\u003c/p>\n\u003col>\n\u003cli>区分必要与不必要。\u003c/li>\n\u003cli>按使用和风险定位。\u003c/li>\n\u003cli>清洁并发现异常。\u003c/li>\n\u003cli>建立位置与状态标准。\u003c/li>\n\u003cli>日常复查。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>位置、数量、状态和维护责任清楚的环境。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>找取时间、错取和异常发现改善，不只是检查分数高。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>把5S做成大扫除；未解决混料或异常识别。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：寻找、误取、污染或安全隐患事实。\u003c/li>\n\u003cli>责任与部署：岗位人员定义必要物品、位置与异常恢复。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL09_%E6%A0%87%E5%87%86%E5%8C%96%E4%B8%8E%E7%A7%BB%E4%BA%A4%E9%AA%8C%E6%94%B6\" data-open=\"TPL09_标准化与移交验收\">标准化与移交验收\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>选择一处工具或文件区域，测量一次查找并设计可视定位。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>书第99页确认工具；5S步骤为通用精益知识。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T09_%E6%A0%87%E5%87%86%E4%BD%9C%E4%B8%9A\" data-open=\"T09_标准作业\">标准作业\u003c/a> · \u003ca href=\"#T08_%E5%8F%AF%E8%A7%86%E5%8C%96%E4%B8%8E%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86\" data-open=\"T08_可视化与日常管理\">可视化与日常管理\u003c/a> · \u003ca href=\"#T12_%E7%8E%B0%E5%9C%BA%E8%A7%82%E5%AF%9F\" data-open=\"T12_现场观察\">现场观察\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T11_5S.md"},{"name":"T12_现场观察","title":"现场观察","raw":"---\r\nid: T12\r\n类型: 方法\r\n模块: 共同基础\r\n英文: Gemba / Go See\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 现场观察\r\n\r\n**T12 · Gemba / Go See · 共同基础**\r\n\r\n## 定义\r\n\r\n到实际产生价值和问题的地方观察工作，用真实事实补充和检验报告。\r\n\r\n## 何时用\r\n\r\n报告相互矛盾，原因只有推测，或管理者离工作现场太远。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**一个具体问题、观察范围、员工说明与记录方式。\r\n\r\n1. 先理解任务。\r\n2. 观察完整过程。\r\n3. 记录时间和条件。\r\n4. 区分所见与解释。\r\n5. 向操作者核实。\r\n6. 安排验证。\r\n\r\n## 必须产生的东西\r\n\r\n可追溯观察记录与待验证问题。\r\n\r\n## 怎样验收\r\n\r\n能复述工作实际如何发生，而非只知道制度规定。\r\n\r\n## 误区与边界\r\n\r\n巡查变成抓人；管理者现场直接下答案；一次观察代表所有班次。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：一个真实订单或批次及其现场事实。\r\n- 责任与部署：管理者提问并观察，不凭印象判责。\r\n- 记录入口：[[TPL04_问题解决记录]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n只记录十分钟里看见的事实，暂时不写原因结论。\r\n\r\n## 来源与相邻节点\r\n\r\nPD课件第1、17页；书第103、121页；流程为通用方法。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T04_客户之声]] · [[T05_价值流图]] · [[T06_问题解决流程]] · [[T28_领导标准工作]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>现场观察\u003c/h1>\n\u003cp>\u003cstrong>T12 · Gemba / Go See · 共同基础\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>到实际产生价值和问题的地方观察工作，用真实事实补充和检验报告。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>报告相互矛盾，原因只有推测，或管理者离工作现场太远。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**一个具体问题、观察范围、员工说明与记录方式。\u003c/p>\n\u003col>\n\u003cli>先理解任务。\u003c/li>\n\u003cli>观察完整过程。\u003c/li>\n\u003cli>记录时间和条件。\u003c/li>\n\u003cli>区分所见与解释。\u003c/li>\n\u003cli>向操作者核实。\u003c/li>\n\u003cli>安排验证。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>可追溯观察记录与待验证问题。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>能复述工作实际如何发生，而非只知道制度规定。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>巡查变成抓人；管理者现场直接下答案；一次观察代表所有班次。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：一个真实订单或批次及其现场事实。\u003c/li>\n\u003cli>责任与部署：管理者提问并观察，不凭印象判责。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL04_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E8%AE%B0%E5%BD%95\" data-open=\"TPL04_问题解决记录\">问题解决记录\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>只记录十分钟里看见的事实，暂时不写原因结论。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>PD课件第1、17页；书第103、121页；流程为通用方法。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T04_%E5%AE%A2%E6%88%B7%E4%B9%8B%E5%A3%B0\" data-open=\"T04_客户之声\">客户之声\u003c/a> · \u003ca href=\"#T05_%E4%BB%B7%E5%80%BC%E6%B5%81%E5%9B%BE\" data-open=\"T05_价值流图\">价值流图\u003c/a> · \u003ca href=\"#T06_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E6%B5%81%E7%A8%8B\" data-open=\"T06_问题解决流程\">问题解决流程\u003c/a> · \u003ca href=\"#T28_%E9%A2%86%E5%AF%BC%E6%A0%87%E5%87%86%E5%B7%A5%E4%BD%9C\" data-open=\"T28_领导标准工作\">领导标准工作\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T12_现场观察.md"},{"name":"T13_拉动与在制品限制","title":"拉动与在制品限制","raw":"---\r\nid: T13\r\n类型: 工具\r\n模块: 精益\r\n英文: Pull / Kanban / WIP Limit\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 拉动与在制品限制\r\n\r\n**T13 · Pull / Kanban / WIP Limit · 精益**\r\n\r\n## 定义\r\n\r\n以真实消耗或下游可承接能力触发补充，并限制系统中未完成工作，避免无限投放。\r\n\r\n## 何时用\r\n\r\n排队、库存高、缺料与过量同时出现。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**分产品族需求、补充周期及波动、质量可用性、容量、补货批量、服务要求与现有库存状态。\r\n\r\n1. 确认需求与供给条件。\r\n2. 选择超市式、顺序式或混合拉动等适用方式。\r\n3. 定义补货信号与在制品限额。\r\n4. 设置缺料和质量异常规则。\r\n5. 限定范围试行。\r\n6. 同时复核交付、缺货、全边界库存。\r\n7. 随条件变化重估参数。\r\n\r\n## 必须产生的东西\r\n\r\n明确的补充信号、数量限制和异常规则。\r\n\r\n## 怎样验收\r\n\r\n库存/WIP下降同时交付不恶化；能解释缓冲依据。\r\n\r\n## 误区与边界\r\n\r\n拉动不等于零库存或停止预测。先理解缓冲用途与供给能力，再改变数量；不能把统一砍库存当作拉动部署。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：需求与供给条件、库存作用、补货周期。\r\n- 责任与部署：计划与现场共同试行信号和限额。\r\n- 记录入口：[[TPL08_现状价值流采集]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n选择一类物料，列出设定补充量必须知道的五项数据。\r\n\r\n## 来源与相邻节点\r\n\r\n书第111—114页；数量设计需按实际数据，本库不给通用固定公式。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T05_价值流图]] · [[T14_快速换型]] · [[T17_产销库存协同]] · [[T08_可视化与日常管理]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>拉动与在制品限制\u003c/h1>\n\u003cp>\u003cstrong>T13 · Pull / Kanban / WIP Limit · 精益\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>以真实消耗或下游可承接能力触发补充，并限制系统中未完成工作，避免无限投放。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>排队、库存高、缺料与过量同时出现。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**分产品族需求、补充周期及波动、质量可用性、容量、补货批量、服务要求与现有库存状态。\u003c/p>\n\u003col>\n\u003cli>确认需求与供给条件。\u003c/li>\n\u003cli>选择超市式、顺序式或混合拉动等适用方式。\u003c/li>\n\u003cli>定义补货信号与在制品限额。\u003c/li>\n\u003cli>设置缺料和质量异常规则。\u003c/li>\n\u003cli>限定范围试行。\u003c/li>\n\u003cli>同时复核交付、缺货、全边界库存。\u003c/li>\n\u003cli>随条件变化重估参数。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>明确的补充信号、数量限制和异常规则。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>库存/WIP下降同时交付不恶化；能解释缓冲依据。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>拉动不等于零库存或停止预测。先理解缓冲用途与供给能力，再改变数量；不能把统一砍库存当作拉动部署。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：需求与供给条件、库存作用、补货周期。\u003c/li>\n\u003cli>责任与部署：计划与现场共同试行信号和限额。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL08_%E7%8E%B0%E7%8A%B6%E4%BB%B7%E5%80%BC%E6%B5%81%E9%87%87%E9%9B%86\" data-open=\"TPL08_现状价值流采集\">现状价值流采集\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>选择一类物料，列出设定补充量必须知道的五项数据。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>书第111—114页；数量设计需按实际数据，本库不给通用固定公式。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T05_%E4%BB%B7%E5%80%BC%E6%B5%81%E5%9B%BE\" data-open=\"T05_价值流图\">价值流图\u003c/a> · \u003ca href=\"#T14_%E5%BF%AB%E9%80%9F%E6%8D%A2%E5%9E%8B\" data-open=\"T14_快速换型\">快速换型\u003c/a> · \u003ca href=\"#T17_%E4%BA%A7%E9%94%80%E5%BA%93%E5%AD%98%E5%8D%8F%E5%90%8C\" data-open=\"T17_产销库存协同\">产销库存协同\u003c/a> · \u003ca href=\"#T08_%E5%8F%AF%E8%A7%86%E5%8C%96%E4%B8%8E%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86\" data-open=\"T08_可视化与日常管理\">可视化与日常管理\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T13_拉动与在制品限制.md"},{"name":"T14_快速换型","title":"快速换型","raw":"---\r\nid: T14\r\n类型: 工具\r\n模块: 精益\r\n英文: SMED / Setup Reduction\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 快速换型\r\n\r\n**T14 · SMED / Setup Reduction · 精益**\r\n\r\n## 定义\r\n\r\n减少从上一种产品最后合格产出到下一种产品首个合格产出的切换时间，使小批量与灵活交付更可行。\r\n\r\n## 何时用\r\n\r\n切换长导致大批量、排队或交期受损。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**完整换型记录、人员动作、首件确认和设备条件。\r\n\r\n1. 记录全过程。\r\n2. 区分停机内作业与可提前外作业。\r\n3. 转移可外置动作。\r\n4. 简化定位连接。\r\n5. 验证质量和安全。\r\n6. 标准化。\r\n\r\n## 必须产生的东西\r\n\r\n换型步骤、准备清单与首件确认标准。\r\n\r\n## 怎样验收\r\n\r\n从上一合格件到下一合格件按相同定义计时，并检查启动废品、首件质量、后续稳定性与交付；缩短停机但增加返工不算完成。\r\n\r\n## 误区与边界\r\n\r\n误以为SMED保证所有切换都小于十分钟；为快而跳过确认。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：合格件到合格件换型记录和损耗。\r\n- 责任与部署：生产、工艺、质量一起检验换型与首件。\r\n- 记录入口：[[TPL04_问题解决记录]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n把最近一次换型拆成等待、准备、安装、调整和确认。\r\n\r\n## 来源与相邻节点\r\n\r\n书第113—114页提及快速换模；方法为通用SMED补充。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T09_标准作业]] · [[T13_拉动与在制品限制]] · [[T15_设备可靠性与TPM]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>快速换型\u003c/h1>\n\u003cp>\u003cstrong>T14 · SMED / Setup Reduction · 精益\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>减少从上一种产品最后合格产出到下一种产品首个合格产出的切换时间，使小批量与灵活交付更可行。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>切换长导致大批量、排队或交期受损。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**完整换型记录、人员动作、首件确认和设备条件。\u003c/p>\n\u003col>\n\u003cli>记录全过程。\u003c/li>\n\u003cli>区分停机内作业与可提前外作业。\u003c/li>\n\u003cli>转移可外置动作。\u003c/li>\n\u003cli>简化定位连接。\u003c/li>\n\u003cli>验证质量和安全。\u003c/li>\n\u003cli>标准化。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>换型步骤、准备清单与首件确认标准。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>从上一合格件到下一合格件按相同定义计时，并检查启动废品、首件质量、后续稳定性与交付；缩短停机但增加返工不算完成。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>误以为SMED保证所有切换都小于十分钟；为快而跳过确认。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：合格件到合格件换型记录和损耗。\u003c/li>\n\u003cli>责任与部署：生产、工艺、质量一起检验换型与首件。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL04_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E8%AE%B0%E5%BD%95\" data-open=\"TPL04_问题解决记录\">问题解决记录\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>把最近一次换型拆成等待、准备、安装、调整和确认。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>书第113—114页提及快速换模；方法为通用SMED补充。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T09_%E6%A0%87%E5%87%86%E4%BD%9C%E4%B8%9A\" data-open=\"T09_标准作业\">标准作业\u003c/a> · \u003ca href=\"#T13_%E6%8B%89%E5%8A%A8%E4%B8%8E%E5%9C%A8%E5%88%B6%E5%93%81%E9%99%90%E5%88%B6\" data-open=\"T13_拉动与在制品限制\">拉动与在制品限制\u003c/a> · \u003ca href=\"#T15_%E8%AE%BE%E5%A4%87%E5%8F%AF%E9%9D%A0%E6%80%A7%E4%B8%8ETPM\" data-open=\"T15_设备可靠性与TPM\">设备可靠性与TPM\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T14_快速换型.md"},{"name":"T15_设备可靠性与TPM","title":"设备可靠性与TPM","raw":"---\r\nid: T15\r\n类型: 工具\r\n模块: 精益\r\n英文: Total Productive Maintenance\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 设备可靠性与TPM\r\n\r\n**T15 · Total Productive Maintenance · 精益**\r\n\r\n## 定义\r\n\r\n通过操作者、维护与工程协作保持设备基本条件，消除重点故障和损失，提高可依赖的生产能力。\r\n\r\n## 何时用\r\n\r\n非计划停机和设备劣化影响质量或交付。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**设备关键性、故障模式、停机时间及维护记录。\r\n\r\n1. 按业务影响排序。\r\n2. 还原主要故障。\r\n3. 恢复基本条件。\r\n4. 制定点检、维护和异常规则。\r\n5. 验证有效性。\r\n6. 更新策略。\r\n\r\n## 必须产生的东西\r\n\r\n重点故障治理、维护计划和现场可执行点检。\r\n\r\n## 怎样验收\r\n\r\n看瓶颈设备可用性及最终产出；维护执行率不能替代可靠性。\r\n\r\n## 误区与边界\r\n\r\n把提高所有设备OEE当经营目标；产量增加却形成多余库存。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：停机损失与故障模式、维护记录。\r\n- 责任与部署：设备与生产共同选择影响QDC的约束。\r\n- 记录入口：[[TPL04_问题解决记录]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n将一项停机按故障、等待备件、等待人员和恢复验证分解。\r\n\r\n## 来源与相邻节点\r\n\r\n通用精益补充工具，不宣称来自书中完整DBS目录；书第109页为可靠性应用背景。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T06_问题解决流程]] · [[T09_标准作业]] · [[M02_精益能力]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>设备可靠性与TPM\u003c/h1>\n\u003cp>\u003cstrong>T15 · Total Productive Maintenance · 精益\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>通过操作者、维护与工程协作保持设备基本条件，消除重点故障和损失，提高可依赖的生产能力。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>非计划停机和设备劣化影响质量或交付。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**设备关键性、故障模式、停机时间及维护记录。\u003c/p>\n\u003col>\n\u003cli>按业务影响排序。\u003c/li>\n\u003cli>还原主要故障。\u003c/li>\n\u003cli>恢复基本条件。\u003c/li>\n\u003cli>制定点检、维护和异常规则。\u003c/li>\n\u003cli>验证有效性。\u003c/li>\n\u003cli>更新策略。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>重点故障治理、维护计划和现场可执行点检。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>看瓶颈设备可用性及最终产出；维护执行率不能替代可靠性。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>把提高所有设备OEE当经营目标；产量增加却形成多余库存。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：停机损失与故障模式、维护记录。\u003c/li>\n\u003cli>责任与部署：设备与生产共同选择影响QDC的约束。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL04_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E8%AE%B0%E5%BD%95\" data-open=\"TPL04_问题解决记录\">问题解决记录\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>将一项停机按故障、等待备件、等待人员和恢复验证分解。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>通用精益补充工具，不宣称来自书中完整DBS目录；书第109页为可靠性应用背景。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T06_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E6%B5%81%E7%A8%8B\" data-open=\"T06_问题解决流程\">问题解决流程\u003c/a> · \u003ca href=\"#T09_%E6%A0%87%E5%87%86%E4%BD%9C%E4%B8%9A\" data-open=\"T09_标准作业\">标准作业\u003c/a> · \u003ca href=\"#M02_%E7%B2%BE%E7%9B%8A%E8%83%BD%E5%8A%9B\" data-open=\"M02_精益能力\">精益能力\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T15_设备可靠性与TPM.md"},{"name":"T16_变异管理与质量控制","title":"变异管理与质量控制","raw":"---\r\nid: T16\r\n类型: 方法\r\n模块: 精益\r\n英文: Variation Reduction / Quality Control\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 变异管理与质量控制\r\n\r\n**T16 · Variation Reduction / Quality Control · 精益**\r\n\r\n## 定义\r\n\r\n辨别过程波动、验证测量和原因，以减少不一致和缺陷；均值达标不代表每次稳定满足要求。\r\n\r\n## 何时用\r\n\r\n质量波动、反复返工，或过度调整导致过程更乱。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**清晰缺陷定义、可信测量、批次与过程条件记录。\r\n\r\n1. 先查测量可信度。\r\n2. 按条件分层。\r\n3. 用合适趋势/控制图识别模式。\r\n4. 验证原因。\r\n5. 实施防错或过程控制。\r\n6. 跟踪持续性。\r\n\r\n## 必须产生的东西\r\n\r\n缺陷定义、原因证据、过程控制和反应计划。\r\n\r\n## 怎样验收\r\n\r\n测量可靠、缺陷下降且未漏检；统计方法与数据类型匹配。\r\n\r\n## 误区与边界\r\n\r\n把规格限和控制限混为一谈；未确认稳定和测量条件就解读过程能力指数。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：测量可信性、分层过程数据。\r\n- 责任与部署：质量与工艺确认适用统计方法和异常响应。\r\n- 记录入口：[[TPL04_问题解决记录]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n为一个缺陷写出可让两人一致判断的定义。\r\n\r\n## 来源与相邻节点\r\n\r\n书第109页含减少变异与质量工具；统计注意事项为通用质量方法。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T06_问题解决流程]] · [[C06_结果与过程指标]] · [[T09_标准作业]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>变异管理与质量控制\u003c/h1>\n\u003cp>\u003cstrong>T16 · Variation Reduction / Quality Control · 精益\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>辨别过程波动、验证测量和原因，以减少不一致和缺陷；均值达标不代表每次稳定满足要求。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>质量波动、反复返工，或过度调整导致过程更乱。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**清晰缺陷定义、可信测量、批次与过程条件记录。\u003c/p>\n\u003col>\n\u003cli>先查测量可信度。\u003c/li>\n\u003cli>按条件分层。\u003c/li>\n\u003cli>用合适趋势/控制图识别模式。\u003c/li>\n\u003cli>验证原因。\u003c/li>\n\u003cli>实施防错或过程控制。\u003c/li>\n\u003cli>跟踪持续性。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>缺陷定义、原因证据、过程控制和反应计划。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>测量可靠、缺陷下降且未漏检；统计方法与数据类型匹配。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>把规格限和控制限混为一谈；未确认稳定和测量条件就解读过程能力指数。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：测量可信性、分层过程数据。\u003c/li>\n\u003cli>责任与部署：质量与工艺确认适用统计方法和异常响应。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL04_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E8%AE%B0%E5%BD%95\" data-open=\"TPL04_问题解决记录\">问题解决记录\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>为一个缺陷写出可让两人一致判断的定义。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>书第109页含减少变异与质量工具；统计注意事项为通用质量方法。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T06_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E6%B5%81%E7%A8%8B\" data-open=\"T06_问题解决流程\">问题解决流程\u003c/a> · \u003ca href=\"#C06_%E7%BB%93%E6%9E%9C%E4%B8%8E%E8%BF%87%E7%A8%8B%E6%8C%87%E6%A0%87\" data-open=\"C06_结果与过程指标\">结果与过程指标\u003c/a> · \u003ca href=\"#T09_%E6%A0%87%E5%87%86%E4%BD%9C%E4%B8%9A\" data-open=\"T09_标准作业\">标准作业\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T16_变异管理与质量控制.md"},{"name":"T17_产销库存协同","title":"产销库存协同","raw":"---\r\nid: T17\r\n类型: 机制\r\n模块: 精益\r\n英文: Production / Sales / Inventory — PSI\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 产销库存协同\r\n\r\n**T17 · Production / Sales / Inventory — PSI · 精益**\r\n\r\n## 定义\r\n\r\n用同一需求、供给、库存与能力视图，协调销售承诺、生产和补货决定。\r\n\r\n## 何时用\r\n\r\n销售与工厂认知不一致，库存与缺货并存。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**分产品族需求、订单、库存、产能和供应限制。\r\n\r\n1. 统一数据周期。\r\n2. 区分确认订单与预测。\r\n3. 识别供需缺口。\r\n4. 比较备选方案。\r\n5. 授权决策。\r\n6. 追踪执行和偏差。\r\n\r\n## 必须产生的东西\r\n\r\n一致的需求供给计划、库存策略与例外决定。\r\n\r\n## 怎样验收\r\n\r\n承诺可兑现，计划冲突明确升级，库存与服务水平同时检验。\r\n\r\n## 误区与边界\r\n\r\n计划协同不等于会议汇报。需求承诺必须检验可用库存、产能、供期与质量条件；预测不能当确定订单。库存是海顺QDC的支持指标，改善库存不得损害交付和质量。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：同一需求、库存、产能及供应视图。\r\n- 责任与部署：业务负责人裁决供需冲突和客户承诺。\r\n- 记录入口：[[TPL07_周月评审与决定记录]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n把一个供需冲突写成需要谁在何时作出哪项决定。\r\n\r\n## 来源与相邻节点\r\n\r\n书第112—114页；执行步骤为教学设计。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T13_拉动与在制品限制]] · [[T08_可视化与日常管理]] · [[T01_方针部署]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>产销库存协同\u003c/h1>\n\u003cp>\u003cstrong>T17 · Production / Sales / Inventory — PSI · 精益\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>用同一需求、供给、库存与能力视图，协调销售承诺、生产和补货决定。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>销售与工厂认知不一致，库存与缺货并存。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**分产品族需求、订单、库存、产能和供应限制。\u003c/p>\n\u003col>\n\u003cli>统一数据周期。\u003c/li>\n\u003cli>区分确认订单与预测。\u003c/li>\n\u003cli>识别供需缺口。\u003c/li>\n\u003cli>比较备选方案。\u003c/li>\n\u003cli>授权决策。\u003c/li>\n\u003cli>追踪执行和偏差。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>一致的需求供给计划、库存策略与例外决定。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>承诺可兑现，计划冲突明确升级，库存与服务水平同时检验。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>计划协同不等于会议汇报。需求承诺必须检验可用库存、产能、供期与质量条件；预测不能当确定订单。库存是海顺QDC的支持指标，改善库存不得损害交付和质量。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：同一需求、库存、产能及供应视图。\u003c/li>\n\u003cli>责任与部署：业务负责人裁决供需冲突和客户承诺。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL07_%E5%91%A8%E6%9C%88%E8%AF%84%E5%AE%A1%E4%B8%8E%E5%86%B3%E5%AE%9A%E8%AE%B0%E5%BD%95\" data-open=\"TPL07_周月评审与决定记录\">周月评审与决定记录\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>把一个供需冲突写成需要谁在何时作出哪项决定。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>书第112—114页；执行步骤为教学设计。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T13_%E6%8B%89%E5%8A%A8%E4%B8%8E%E5%9C%A8%E5%88%B6%E5%93%81%E9%99%90%E5%88%B6\" data-open=\"T13_拉动与在制品限制\">拉动与在制品限制\u003c/a> · \u003ca href=\"#T08_%E5%8F%AF%E8%A7%86%E5%8C%96%E4%B8%8E%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86\" data-open=\"T08_可视化与日常管理\">可视化与日常管理\u003c/a> · \u003ca href=\"#T01_%E6%96%B9%E9%92%88%E9%83%A8%E7%BD%B2\" data-open=\"T01_方针部署\">方针部署\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T17_产销库存协同.md"},{"name":"T18_价值分析与价值工程","title":"价值分析与价值工程","raw":"---\r\nid: T18\r\n类型: 工具\r\n模块: 精益\r\n英文: Value Analysis / Value Engineering — VA/VE\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 价值分析与价值工程\r\n\r\n**T18 · Value Analysis / Value Engineering — VA/VE · 精益**\r\n\r\n## 定义\r\n\r\n从产品或服务必须实现的功能出发，寻找在满足要求前提下更经济的设计与实现方式。\r\n\r\n## 何时用\r\n\r\n成本受设计、材料、规格和制造方法影响较大。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**功能要求、成本构成、客户与质量边界、验证条件。\r\n\r\n1. 明确必要功能。\r\n2. 分解功能与成本。\r\n3. 提出替代。\r\n4. 验证性能和总成本。\r\n5. 完成适用批准。\r\n6. 跟踪实际效果。\r\n\r\n## 必须产生的东西\r\n\r\n有功能证据、成本分析及验证记录的替代方案。\r\n\r\n## 怎样验收\r\n\r\n必要性能满足，生命周期总成本降低；变更条件和客户要求得到落实。\r\n\r\n## 误区与边界\r\n\r\n只换便宜材料，不考虑可靠性、工艺能力、验证和客户使用。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：功能要求、实际成本与替代方案。\r\n- 责任与部署：研发、采购、质量验证功能与全成本。\r\n- 记录入口：[[TPL01_改善项目章程]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n挑一个高成本部件或步骤，先写功能再想替代。\r\n\r\n## 来源与相邻节点\r\n\r\n书第115—116页；验证步骤为通用方法。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T04_客户之声]] · [[T16_变异管理与质量控制]] · [[T21_产品规划与资源配置]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>价值分析与价值工程\u003c/h1>\n\u003cp>\u003cstrong>T18 · Value Analysis / Value Engineering — VA/VE · 精益\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>从产品或服务必须实现的功能出发，寻找在满足要求前提下更经济的设计与实现方式。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>成本受设计、材料、规格和制造方法影响较大。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**功能要求、成本构成、客户与质量边界、验证条件。\u003c/p>\n\u003col>\n\u003cli>明确必要功能。\u003c/li>\n\u003cli>分解功能与成本。\u003c/li>\n\u003cli>提出替代。\u003c/li>\n\u003cli>验证性能和总成本。\u003c/li>\n\u003cli>完成适用批准。\u003c/li>\n\u003cli>跟踪实际效果。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>有功能证据、成本分析及验证记录的替代方案。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>必要性能满足，生命周期总成本降低；变更条件和客户要求得到落实。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>只换便宜材料，不考虑可靠性、工艺能力、验证和客户使用。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：功能要求、实际成本与替代方案。\u003c/li>\n\u003cli>责任与部署：研发、采购、质量验证功能与全成本。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL01_%E6%94%B9%E5%96%84%E9%A1%B9%E7%9B%AE%E7%AB%A0%E7%A8%8B\" data-open=\"TPL01_改善项目章程\">改善项目章程\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>挑一个高成本部件或步骤，先写功能再想替代。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>书第115—116页；验证步骤为通用方法。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T04_%E5%AE%A2%E6%88%B7%E4%B9%8B%E5%A3%B0\" data-open=\"T04_客户之声\">客户之声\u003c/a> · \u003ca href=\"#T16_%E5%8F%98%E5%BC%82%E7%AE%A1%E7%90%86%E4%B8%8E%E8%B4%A8%E9%87%8F%E6%8E%A7%E5%88%B6\" data-open=\"T16_变异管理与质量控制\">变异管理与质量控制\u003c/a> · \u003ca href=\"#T21_%E4%BA%A7%E5%93%81%E8%A7%84%E5%88%92%E4%B8%8E%E8%B5%84%E6%BA%90%E9%85%8D%E7%BD%AE\" data-open=\"T21_产品规划与资源配置\">产品规划与资源配置\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T18_价值分析与价值工程.md"},{"name":"T19_客户细分","title":"客户细分","raw":"---\r\nid: T19\r\n类型: 工具\r\n模块: 增长\r\n英文: Customer Segmentation\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 客户细分\r\n\r\n**T19 · Customer Segmentation · 增长**\r\n\r\n## 定义\r\n\r\n按需求、使用情境和购买行为等差异区分客户，以便选择服务对象及价值主张。\r\n\r\n## 何时用\r\n\r\n同一产品对不同客户转化差异大，或市场选择过于笼统。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**客户数据、使用任务、购买过程和服务成本。\r\n\r\n1. 提出有意义的细分维度。\r\n2. 用证据验证差异。\r\n3. 评估需求和适配性。\r\n4. 选择重点群体。\r\n5. 分别验证主张。\r\n\r\n## 必须产生的东西\r\n\r\n可识别客户群、典型场景及选择理由。\r\n\r\n## 怎样验收\r\n\r\n细分能改变产品、渠道或销售决定，而不只是给客户换标签。\r\n\r\n## 误区与边界\r\n\r\n只按地区或收入分组却没有需求差异证据。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：不同客户需要、使用场景与服务代价。\r\n- 责任与部署：业务负责人选择目标客户和服务策略。\r\n- 记录入口：[[TPL14_战略到执行一页纸]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n将“所有客户”拆成两种购买理由不同的群体。\r\n\r\n## 来源与相邻节点\r\n\r\n书第118—120、124—128页。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T04_客户之声]] · [[T20_创新领域与机会选择]] · [[T25_价值销售]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>客户细分\u003c/h1>\n\u003cp>\u003cstrong>T19 · Customer Segmentation · 增长\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>按需求、使用情境和购买行为等差异区分客户，以便选择服务对象及价值主张。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>同一产品对不同客户转化差异大，或市场选择过于笼统。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**客户数据、使用任务、购买过程和服务成本。\u003c/p>\n\u003col>\n\u003cli>提出有意义的细分维度。\u003c/li>\n\u003cli>用证据验证差异。\u003c/li>\n\u003cli>评估需求和适配性。\u003c/li>\n\u003cli>选择重点群体。\u003c/li>\n\u003cli>分别验证主张。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>可识别客户群、典型场景及选择理由。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>细分能改变产品、渠道或销售决定，而不只是给客户换标签。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>只按地区或收入分组却没有需求差异证据。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：不同客户需要、使用场景与服务代价。\u003c/li>\n\u003cli>责任与部署：业务负责人选择目标客户和服务策略。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL14_%E6%88%98%E7%95%A5%E5%88%B0%E6%89%A7%E8%A1%8C%E4%B8%80%E9%A1%B5%E7%BA%B8\" data-open=\"TPL14_战略到执行一页纸\">战略到执行一页纸\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>将“所有客户”拆成两种购买理由不同的群体。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/ rtfolio · 增长\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>明确创新投资的边界，并把已验证的客户问题转成可比较的机会与路线选择。这里解释管理功能，不复刻内部专有表单。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>研发机会太多，方向分散，或功能开发与需求脱节。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**战略边界、客户证据、技术可能性和资源约束。\u003c/p>\n\u003col>\n\u003cli>界定目标场景和不进入的领域。\u003c/li>\n\u003cli>收集问题证据。\u003c/li>\n\u003cli>比较价值、可行性及风险。\u003c/li>\n\u003cli>形成机会排序。\u003c/li>\n\u003cli>交产品组合决策。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>创新边界、关键假设、机会路线和停止条件。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>项目为何值得做、为何现在做、什么证据会使其退出可讲清楚。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>把战略产品框架当功能清单；把预测精确度当需求真实性。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：客户未满足需求与技术、竞争证据。\u003c/li>\n\u003cli>责任与部署：研发与业务筛选机会，保留反证。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL14_%E6%88%98%E7%95%A5%E5%88%B0%E6%89%A7%E8%A1%8C%E4%B8%80%E9%A1%B5%E7%BA%B8\" data-open=\"TPL14_战略到执行一页纸\">战略到执行一页纸\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>为一个新想法写出三条必须验证的客户或技术假设。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>书第119—121页；英文名称参照其公开来源，详细步骤为教学设计。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T04_%E5%AE%A2%E6%88%B7%E4%B9%8B%E5%A3%B0\" data-open=\"T04_客户之声\">客户之声\u003c/a> · \u003ca href=\"#T19_%E5%AE%A2%E6%88%B7%E7%BB%86%E5%88%86\" data-open=\"T19_客户细分\">客户细分\u003c/a> · \u003ca href=\"#T21_%E4%BA%A7%E5%93%81%E8%A7%84%E5%88%92%E4%B8%8E%E8%B5%84%E6%BA%90%E9%85%8D%E7%BD%AE\" data-open=\"T21_产品规划与资源配置\">产品规划与资源配置\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T20_创新领域与机会选择.md"},{"name":"T21_产品规划与资源配置","title":"产品规划与资源配置","raw":"---\r\nid: T21\r\n类型: 机制\r\n模块: 增长\r\n英文: Product Planning Group / Portfolio Management\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 产品规划与资源配置\r\n\r\n**T21 · Product Planning Group / Portfolio Management · 增长**\r\n\r\n## 定义\r\n\r\n在产品项目之间进行优先级、投资、资源与停止决定，防止所有项目同时争夺同一关键能力。\r\n\r\n## 何时用\r\n\r\n项目多、全部延期、关键人员被多头分配。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**机会证据、项目阶段、关键资源负荷、收益与风险假设。\r\n\r\n1. 列项目组合。\r\n2. 识别共同瓶颈。\r\n3. 比较价值与证据。\r\n4. 作继续/暂停/终止决定。\r\n5. 明确资源。\r\n6. 周期复查。\r\n\r\n## 必须产生的东西\r\n\r\n有取舍的项目组合和真实资源承诺。\r\n\r\n## 怎样验收\r\n\r\n主责人员实际有时间执行；停止项目释放的资源有去向。\r\n\r\n## 误区与边界\r\n\r\n只给优先级打分却不停止任何项目；总投入超过可用能力。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：项目组合价值、风险和能力容量。\r\n- 责任与部署：业务负责人决定组合取舍与资源。\r\n- 记录入口：[[TPL06_PD部署链与资源协商]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n把所有项目排到同一个关键岗位的日历上，检查冲突。\r\n\r\n## 来源与相邻节点\r\n\r\n书第121—123页；流程为教学设计。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T20_创新领域与机会选择]] · [[T22_快速设计评审]] · [[T23_可视化项目管理]] · [[T30_上市与交付准备]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>产品规划与资源配置\u003c/h1>\n\u003cp>\u003cstrong>T21 · Product Planning Group / Portfolio Management · 增长\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>在产品项目之间进行优先级、投资、资源与停止决定，防止所有项目同时争夺同一关键能力。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>项目多、全部延期、关键人员被多头分配。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**机会证据、项目阶段、关键资源负荷、收益与风险假设。\u003c/p>\n\u003col>\n\u003cli>列项目组合。\u003c/li>\n\u003cli>识别共同瓶颈。\u003c/li>\n\u003cli>比较价值与证据。\u003c/li>\n\u003cli>作继续/暂停/终止决定。\u003c/li>\n\u003cli>明确资源。\u003c/li>\n\u003cli>周期复查。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>有取舍的项目组合和真实资源承诺。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>主责人员实际有时间执行；停止项目释放的资源有去向。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>只给优先级打分却不停止任何项目；总投入超过可用能力。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：项目组合价值、风险和能力容量。\u003c/li>\n\u003cli>责任与部署：业务负责人决定组合取舍与资源。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL06_PD%E9%83%A8%E7%BD%B2%E9%93%B F%AF%E8%A7%86%E5%8C%96%E9%A1%B9%E7%9B%AE%E7%AE%A1%E7%90%86\" data-open=\"T23_可视化项目管理\">可视化项目管理\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T22_快速设计评审.md"},{"name":"T23_可视化项目管理","title":"可视化项目管理","raw":"---\r\nid: T23\r\n类型: 工具\r\n模块: 增长\r\n英文: Visual Project Management / Obeya\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 可视化项目管理\r\n\r\n**T23 · Visual Project Management / Obeya · 增长**\r\n\r\n## 定义\r\n\r\n让交付物、依赖、关键风险和待决定事项共同可见，促进跨职能及时解决项目障碍。\r\n\r\n## 何时用\r\n\r\n研发、工程或跨部门项目因隐性依赖与决策等待拖期。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**交付物、依赖、资源、里程碑和风险。\r\n\r\n1. 画共同计划。\r\n2. 明确接受条件。\r\n3. 展示真实阻碍。\r\n4. 按节奏检查。\r\n5. 在恰当层级作决定。\r\n6. 更新计划与假设。\r\n\r\n## 必须产生的东西\r\n\r\n项目板、依赖清单和决策记录。\r\n\r\n## 怎样验收\r\n\r\n能看到哪个决定阻碍哪个交付，责任与时间明确。\r\n\r\n## 误区与边界\r\n\r\n只有百分比进度没有可验收产物；把Obeya理解成装修一个房间。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：项目交付、依赖与风险。\r\n- 责任与部署：项目负责人可视化阻碍并获得决定。\r\n- 记录入口：[[TPL05_保龄图与行动计划]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n将一个“完成80%”改写成已验收与尚未完成的具体产物。\r\n\r\n## 来源与相邻节点\r\n\r\n书第121—122页；操作步骤为教学设计。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T21_产品规划与资源配置]] · [[T22_快速设计评审]] · [[T30_上市与交付准备]] · [[T08_可视化与日常管理]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>可视化项目管理\u003c/h1>\n\u003cp>\u003cstrong>T23 · Visual Project Management / Obeya · 增长\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>让交付物、依赖、关键风险和待决定事项共同可见，促进跨职能及时解决项目障碍。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>研发、工程或跨部门项目因隐性依赖与决策等待拖期。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**交付物、依赖、资源、里程碑和风险。\u003c/p>\n\u003col>\n\u003cli>画共同计划。\u003c/li>\n\u003cli>明确接受条件。\u003c/li>\n\u003cli>展示真实阻碍。\u003c/li>\n\u003cli>按节奏检查。\u003c/li>\n\u003cli>在恰当层级作决定。\u003c/li>\n\u003cli>更新计划与假设。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>项目板、依赖清单和决策记录。\u003c/p>\n\u003ch2>怎样验收\u00 分析同批转化与老化。\r\n4. 确定下一步双方承诺。\r\n5. 复查损失原因和预测。\r\n\r\n## 必须产生的东西\r\n\r\n有阶段证据、下一步和责任的商机清单，以及堵点改善。\r\n\r\n## 怎样验收\r\n\r\n用同批商机计算转化，区分已成交、失单、未决；预测随证据校准。\r\n\r\n## 误区与边界\r\n\r\n销售主观判断代替客户证据；存量漏斗阶段数量直接当转化率。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：固定时点商机阶段与退出证据。\r\n- 责任与部署：销售管理者检查真实性与转化阻碍。\r\n- 记录入口：[[TPL02_指标定义与基线]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n选择一个长期未动商机，找出缺少的客户确认。\r\n\r\n## 来源与相邻节点\r\n\r\n书第129—132页。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T04_客户之声]] · [[T19_客户细分]] · [[T25_价值销售]] · [[T26_增长室]] · [[C06_结果与过程指标]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>销售漏斗管理\u003c/h1>\n\u003cp>\u003cstrong>T24 · Funnel Management · 增长\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>按客户购买进展管理机会数量、阶段转化与推进速度，并针对堵点改善商业流程。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>机会多却成交少、预测失真或销售周期长。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**客户购买证据、商机进入时间、阶段变化、金额和结果。\u003c/p>\n\u003col>\n\u003cli>按客户行为定义阶段。\u003c/li>\n\u003cli>核实机会资格。\u003c/li>\n\u003cli>分析同批转化与老化。\u003c/li>\n\u003cli>确定下一步双方承诺。\u003c/li>\n\u003cli>复查损失原因和预测。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>有阶段证据、下一步和责任的商机清单，以及堵点改善。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>用同批商机计算转化，区分已成交、失单、未决；预测随证据校准。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>销售主观判断代替客户证据；存量漏斗阶段数量直接当转化率。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：固定时点商机阶段与退出证据。\u003c/li>\n\u003cli>责任与部署：销售管理者检查真实性与转化阻碍。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL02_%E6%8C%87%E6%A0%87%E5%AE%9A%E4%B9%89%E4%B8%8E%E5%9F%BA%E7%BA%BF\" data-open=\"TPL02_指标定义与基线\">指标定义与基线\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>选择一个长期未动商机，找出缺少的客户确认。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>书第129—132页。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T04_%E5%AE%A2%E6%88%B7%E4%B9%8B%E5%A3%B0\" data-open=\"T04_客户之声\">客户之声\u003c/a> · \u003ca href=\"#T19_%E5%AE%A2%E6%88%B7%E7%BB%86%E5%88%86\" data-open=\"T19_客户细分\">客户细分\u003c/a> · \u003ca href=\"#T25_%E4%BB%B7%E5%80%BC%E9%94%80%E5%94%AE\" data-open=\"T25_价值销售\">价值销售\u003c/a> · \u003ca href=\"#T26_%E5%A2%9E%E9%95%BF%E5%AE%A4\" data-open=\"T26_增长室\">增长室\u003c/a> · \u003ca href=\"#C06_%E7%BB%93%E6%9E%9C%E4%B8%8E%E8%BF%87%E7%A8%8B%E6%8C%87%E6%A0%87\" data-open=\"C06_结果与过程指标\">结果与过程指标\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T24_销售漏斗管理.md"},{"name":"T25_价值销售","title":"价值销售","raw":"---\r\nid: T25\r\n类型: 方法\r\n模块: 增长\r\n英文: Value Selling\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 价值销售\r\n\r\n**T25 · Value Selling · 增长**\r\n\r\n## 定义\r\n\r\n基于客户业务问题与可验证收益，说明方案价值并支持客户决策。\r\n\r\n## 何时用\r\n\r\n只能比价格、客户不理解差异或方案与购买理由脱节。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**客户现状、损失、目标、决策标准和方案证据。\r\n\r\n1. 确认问题及影响。\r\n2. 共同量化价值。\r\n3. 说明方案如何产生价值。\r\n4. 验证假设。\r\n5. 约定评估与交付条件。\r\n\r\n## 必须产生的东西\r\n\r\n客户认可的问题—价值—方案—证据链。\r\n\r\n## 怎样验收\r\n\r\n价值计算能被客户复核，交付后可检验承诺。\r\n\r\n## 误区与边界\r\n\r\n把产品参数清单当价值；夸大节省额且漏掉采用成本。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：客户使用价值与成本证据。\r\n- 责任与部署：销售与技术验证价值承诺，避免虚构收益。\r\n- 记录入口：[[TPL01_改善项目章程]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n把一个技术卖点改写成客户结果，并列验证条件。\r\n\r\n## 来源与相邻节点\r\n\r\n书第118—119页列为工具；具体流程为通用价值销售教学补充。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T04_客户之声]] · [[T19_客户细分]] · [[T24_销售漏斗管理]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>价值销售\u003c/h1>\n\u003cp>\u003cstrong>T25 · Value Selling · 增长\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>基于客户业务问题与可验证收益，说明方案价值并支持客户决策。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>只能比价格、客户不理解差异或方案与购买理由脱节。\u003c/p>\n\u
