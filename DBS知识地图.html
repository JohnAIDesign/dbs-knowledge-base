07_周月评审与决定记录\">周月评审与决定记录\u003c/a>。\u003c/p>\n\u003cp>验收时必须能回答：本职能改变了什么机制？证据来自哪一订单、批次或任务？对另外两项QDC有何影响？换人以后能否维持？不以开会、培训或表格数量作为成功。\u003c/p>\n\u003ch2>证据边界\u003c/h2>\n\u003cp>本手册为DBS与通用管理方法的应用设计，非丹纳赫官方职能标准。上述流程为逻辑模型，需按海顺实际业务确认条件、权限与接口。\u003c/p>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"F06_质量与EHS.md"},{"name":"X01_DBS成熟度自评","title":"DBS成熟度自评","raw":"# DBS成熟度自评\r\n\r\n> 校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\r\n\r\n## 定义\r\n\r\n描述特定业务单元可观察、可重复的管理运行能力，帮助选择下一项改善；不是丹纳赫认证。\r\n\r\n## 执行步骤\r\n\r\n1. 确定范围与维度。\r\n2. 为每一维度写可观察行为。\r\n3. 现场收集跨人员、跨周期证据。\r\n4. 区分有证据等级、未评估、证据不足、不适用。\r\n5. 共同确认差距。\r\n6. 安排改善并复评。\r\n\r\n## 判断与边界\r\n\r\n建议维度：战略与取舍、流程责任、数据与异常、原因验证、标准维持、人才与领导。每一维度单独描述，不用一个总分掩盖短板。无证据不意味着低等级，也不能机械降低此前已有证据支持的评价。\r\n\r\n## 海顺应用与验收\r\n\r\nTTI是改善目标及测量定义；管理者在机制成熟后仍需现场询证、带教和解除障碍。评价时保留范围、日期和证据，不能声称全公司成熟。\r\n\r\n记录使用 [[TPL11_DBS成熟度自评表]]。验收必须看到具体事实、管理决定与后续行动，不以完成评分或会议视为成功。\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>DBS成熟度自评\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003ch2>定义\u003c/h2>\n\u003cp>描述特定业务单元可观察、可重复的管理运行能力，帮助选择下一项改善；不是丹纳赫认证。\u003c/p>\n\u003ch2>执行步骤\u003c/h2>\n\u003col>\n\u003cli>确定范围与维度。\u003c/li>\n\u003cli>为每一维度写可观察行为。\u003c/li>\n\u003cli>现场收集跨人员、跨周期证据。\u003c/li>\n\u003cli>区分有证据等级、未评估、证据不足、不适用。\u003c/li>\n\u003cli>共同确认差距。\u003c/li>\n\u003cli>安排改善并复评。\u003c/li>\n\u003c/ol>\n\u003ch2>判断与边界\u003c/h2>\n\u003cp>建议维度：战略与取舍、流程责任、数据与异常、原因验证、标准维持、人才与领导。每一维度单独描述，不用一个总分掩盖短板。无证据不意味着低等级，也不能机械降低此前已有证据支持的评价。\u003c/p>\n\u003ch2>海顺应用与验收\u003c/h2>\n\u003cp>TTI是改善目标及测量定义；管理者在机制成熟后仍需现场询证、带教和解除障碍。评价时保留范围、日期和证据，不能声称全公司成熟。\u003c/p>\n\u003cp>记录使用 \u003ca href=\"#TPL11_DBS%E6%88%90%E7%86%9F%E5%BA%A6%E8%87%AA%E8%AF%84%E8%A1%A8\" data-open=\"TPL11_DBS成熟度自评表\">DBS成熟度自评表\u003c/a>。验收必须看到具体事实、管理决定与后续行动，不以完成评分或会议视为成功。\u003c/p>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"X01_DBS成熟度自评.md"},{"name":"X02_AAR复盘机制","title":"AAR复盘机制","raw":"# AAR复盘机制\r\n\r\n> 校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\r\n\r\n## 定义\r\n\r\n在行动中、里程碑或结束时对照预期与实际，提炼可执行学习。PDCA覆盖计划、执行、检查和调整的完整循环，AAR可为循环提供反思与决定。\r\n\r\n## 执行步骤\r\n\r\n1. 说明原来预期。\r\n2. 列出实际事实。\r\n3. 解释差异及证据。\r\n4. 识别有效与待改做法。\r\n5. 确定下一次改变。\r\n6. 指定责任与验证。\r\n7. 更新标准或计划。\r\n\r\n## 判断与边界\r\n\r\n以同一实际工作为对象，讲事实、讨论机制和可控行为。无责备学习不等于无责任，岗位履责、诚信和必要管理处理仍按制度执行；避免未经调查就归咎个人。\r\n\r\n## 海顺应用与验收\r\n\r\n在试点中按事件或里程碑使用，可并入周评审；无需另立常设复盘项目。产出必须进入下一次任务、标准或部署。\r\n\r\n记录使用 [[TPL12_AAR复盘记录]]。验收必须看到具体事实、管理决定与后续行动，不以完成评分或会议视为成功。\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>AAR复盘机制\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003ch2>定义\u003c/h2>\n\u003cp>在行动中、里程碑或结束时对照预期与实际，提炼可执行学习。PDCA覆盖计划、执行、检查和调整的完整循环，AAR可为循环提供反思与决定。\u003c/p>\n\u003ch2>执行步骤\u003c/h2>\n\u003col>\n\u003cli>说明原来预期。\u003c/li>\n\u003cli>列出实际事实。\u003c/li>\n\u003cli>解释差异及证据。\u003c/li>\n\u003cli>识别有效与待改做法。\u003c/li>\n\u003cli>确定下一次改变。\u003c/li>\n\u003cli>指定责任与验证。\u003c/li>\n\u003cli>更新标准或计划。\u003c/li>\n\u003c/ol>\n\u003ch2>判断与边界\u003c/h2>\n\u003cp>以同一实际工作为对象，讲事实、讨论机制和可控行为。无责备学习不等于无责任，岗位履责、诚信和必要管理处理仍按制度执行；避免未经调查就归咎个人。\u003c/p>\n\u003ch2>海顺应用与验收\u003c/h2>\n\u003cp>在试点中按事件或里程碑使用，可并入周评审；无需另立常设复盘项目。产出必须进入下一次任务、标准或部署。\u003c/p>\n\u003cp>记录使用 \u003ca href=\"#TPL12_AAR%E5%A4%8D%E7%9B%98%E8%AE%B0%E5%BD%95\" data-open=\"TPL12_AAR复盘记录\">AAR复盘记录\u003c/a>。验收必须看到具体事实、管理决定与后续行动，不以完成评分或会议视为成功。\u003c/p>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"X02_AAR复盘机制.md"},{"name":"X03_Yokoten横向复制","title":"Yokoten横向复制","raw":"# Yokoten横向复制\r\n\r\n> 校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\r\n\r\n## 定义\r\n\r\n把已有验证的改善机制及其适用条件传播到其他单元，经当地适配和再次验证形成能力。\r\n\r\n## 执行步骤\r\n\r\n1. 确认源头效果及持续性。\r\n2. 说明适用条件。\r\n3. 比较接收方条件。\r\n4. 保留共享定义并定义本地扩展。\r\n5. 建立本地基线。\r\n6. 小范围试行。\r\n7. 检验QDC与独立维持。\r\n8. 决定扩展。\r\n\r\n## 判断与边界\r\n\r\n共享指标定义保持一致；若接收方必须改变定义，应明确口径映射或不可比，再建立本地基线，不直接比较改善百分比。复制的是方法与机制，不是表格外观。\r\n\r\n## 海顺应用与验收\r\n\r\n只有源试点已有稳定证据才进入复制。接收方由当地业务主责负责，教练支持；不同工艺、产品和需求模式可能需要重新验证。\r\n\r\n记录使用 [[TPL13_横向复制清单]]。验收必须看到具体事实、管理决定与后续行动，不以完成评分或会议视为成功。\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>Yokoten横向复制\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003ch2>定义\u003c/h2>\n\u003cp>把已有验证的改善机制及其适用条件传播到其他单元，经当地适配和再次验证形成能力。\u003c/p>\n\u003ch2>执行步骤\u003c/h2>\n\u003col>\n\u003cli>确认源头效果及持续性。\u003c/li>\n\u003cli>说明适用条件。\u003c/li>\n\u003cli>比较接收方条件。\u003c/li>\n\u003cli>保留共享定义并定义本地扩展。\u003c/li>\n\u003cli>建立本地基线。\u003c/li>\n\u003cli>小范围试行。\u003c/li>\n\u003cli>检验QDC与独立维持。\u003c/li>\n\u003cli>决定扩展。\u003c/li>\n\u003c/ol>\n\u003ch2>判断与边界\u003c/h2>\n\u003cp>共享指标定义保持一致；若接收方必须改变定义，应明确口径映射或不可比，再建立本地基线，不直接比较改善百分比。复制的是方法与机制，不是表格外观。\u003c/p>\n\u003ch2>海顺应用与验收\u003c/h2>\n\u003cp>只有源试点已有稳定证据才进入复制。接收方由当地业务主责负责，教练支持；不同工艺、产品和需求模式可能需要重新验证。\u003c/p>\n\u003cp>记录使用 \u003ca href=\"#TPL13_%E6%A8%AA%E5%90%91%E5%A4%8D%E5%88%B6%E6%B8%85%E5%8D%95\" data-open=\"TPL13_横向复制清单\">横向复制清单\u003c/a>。验收必须看到具体事实、管理决定与后续行动，不以完成评分或会议视为成功。\u003c/p>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"X03_Yokoten横向复制.md"},{"name":"海顺01_总经理实施诊断与首月安排","title":"总经理首月安排","raw":"# 总经理首月安排\r\n\r\n> 校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\r\n\r\n## 首月不是全面铺开\r\n\r\n当前最大的实施风险是概念不清、不会独立用工具、没有固定运行节奏。首月应建立一个真实QDC试点，而不是六个职能同时发动工具项目。\r\n\r\n| 时间 | 总经理要作出的决定 | 现场团队要交付 |\r\n|---|---|---|\r\n| 第1周 | 选择产品族、客户价值与流程边界；指定端到端主责；确认观察与带教时间 | 客户要求、真实订单追踪、数据缺口与初版指标定义 |\r\n| 第2周 | 解决数据与接口障碍，亲自参加一次现场询证 | 可复算基线、现状价值流、QDC损失分层 |\r\n| 第3周 | 核对IP与年度目标贡献，决定跨部门资源及取舍 | 原因假设和验证、候选机制、TTI与试验条件 |\r\n| 第4周 | 主持第一次效果与资源评审，允许根据证据调整 | 试验记录、日常异常闭环、能力演示及下月计划 |\r\n\r\n## 亲自问的五个问题\r\n\r\n1. 客户或现场的实际差距是什么，数据能复算吗？\r\n2. 现在要改变哪项工作机制，为什么认为它有效？\r\n3. 哪些证据支持原因，哪些只是猜想？\r\n4. 质量、交付、成本另外两项付出了什么代价？\r\n5. 谁需要我提供什么资源，何时回来验证？\r\n\r\n目标数字、试点产品族与责任人仍待业务确认；不能从培训课件推断公司已有部署。完整路线见 [[海顺04_战略到执行总纲]]。\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>总经理首月安排\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003ch2>首月不是全面铺开\u003c/h2>\n\u003cp>当前最大的实施风险是概念不清、不会独立用工具、没有固定运行节奏。首月应建立一个真实QDC试点，而不是六个职能同时发动工具项目。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>时间\u003c/th>\n\u003cth>总经理要作出的决定\u003c/th>\n\u003cth>现场团队要交付\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1周\u003c/td>\n\u003ctd>选择产品族、客户价值与流程边界；指定端到端主责；确认观察与带教时间\u003c/td>\n\u003ctd>客户要求、真实订单追踪、数据缺口与初版指标定义\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2周\u003c/td>\n\u003ctd>解决数据与接口障碍，亲自参加一次现场询证\u003c/td>\n\u003ctd>可复算基线、现状价值流、QDC损失分层\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3周\u003c/td>\n\u003ctd>核对IP与年度目标贡献，决定跨部门资源及取舍\u003c/td>\n\u003ctd>原因假设和验证、候选机制、TTI与试验条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4周\u003c/td>\n\u003ctd>主持第一次效果与资源评审，允许根据证据调整\u003c/td>\n\u003ctd>试验记录、日常异常闭环、能力演示及下月计划\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>亲自问的五个问题\u003c/h2>\n\u003col>\n\u003cli>客户或现场的实际差距是什么，数据能复算吗？\u003c/li>\n\u003cli>现在要改变哪项工作机制，为什么认为它有效？\u003c/li>\n\u003cli>哪些证据支持原因，哪些只是猜想？\u003c/li>\n\u003cli>质量、交付、成本另外两项付出了什么代价？\u003c/li>\n\u003cli>谁需要我提供什么资源，何时回来验证？\u003c/li>\n\u003c/ol>\n\u003cp>目标数字、试点产品族与责任人仍待业务确认；不能从培训课件推断公司已有部署。完整路线见 \u003ca href=\"#%E6%B5%B7%E9%A1%BA04_%E6%88%98%E7%95%A5%E5%88%B0%E6%89%A7%E8%A1%8C%E6%80%BB%E7%BA%B2\" data-open=\"海顺04_战略到执行总纲\">战略到执行总纲\u003c/a>。\u003c/p>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"海顺01_总经理实施诊断与首月安排.md"},{"name":"海顺02_岗位学习与带教验收","title":"岗位学习：从知道到独立运行","raw":"# 岗位学习：从知道到独立运行\r\n\r\n> 校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\r\n\r\n## 三类角色的实际成果\r\n\r\n| 角色 | 先学 | 跟做任务 | 独立验收 |\r\n|---|---|---|---|\r\n| 总经理与经营班子 | C01/C02/C03、D00/D05/D07/D10/D12、T28 | 主持一次取舍、资源和效果评审 | 能追问证据、识别代价、兑现资源与调整假设 |\r\n| 端到端负责人及跨职能骨干 | C06、T05/T06/T08/T09、D06/D09 | 跟完订单、定义指标、验证原因、做试验 | 能独立运行一次完整闭环并解释局限 |\r\n| 班组长与岗位骨干 | T08/T09/T12及当前问题相关工具 | 按标准操作、记录事实、处理及升级异常 | 换一批次仍能独立操作，知道何时停下或升级 |\r\n\r\n## 六个带教单元\r\n\r\n定义客户与差距 → 观察价值流 → 指标复算 → 原因验证 → 对策试验 → 标准与异常响应。每次只学习当前真实任务需要的卡片，教练示范一次，学员跟做，再独立演示，记录反馈与复验。\r\n\r\n## 能力等级的使用\r\n\r\n能解释：可用自己的语言分清概念；能跟做：有人指导能完成；能独立做：无需提示能处理正常及约定异常；能带人：能观察、反馈并让他人独立完成。这是本库教学等级，不是丹纳赫认证。\r\n\r\n不用听课时数、背诵工具名称或自评信心替代现场验收。记录进入 [[TPL10_能力与带教记录]]。\r\n\r\n## 辨析题与答案\r\n\r\n- KPI就是DM吗？不是，KPI是指标，DM是管理机制。\r\n- PD和DM能用同一OTIF吗？能；分别定义用途、目标、时间与责任。\r\n- Pareto第一名就是根因吗？不是，它只提示问题集中点。\r\n- 行动一定来自最底层矩阵吗？不是，任何层级都可形成行动，未知原因也可安排调查。\r\n- 降库存就是现金收益吗？不是，需核对采购、应付、实际支出及库存变化原因。\r\n- 换型缩短但启动报废增加，能直接推广吗？不能，应联合复核QDC。\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>岗位学习：从知道到独立运行\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003ch2>三类角色的实际成果\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>角色\u003c/th>\n\u003cth>先学\u003c/th>\n\u003cth>跟做任务\u003c/th>\n\u003cth>独立验收\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>总经理与经营班子\u003c/td>\n\u003ctd>C01/C02/C03、D00/D05/D07/D10/D12、T28\u003c/td>\n\u003ctd>主持一次取舍、资源和效果评审\u003c/td>\n\u003ctd>能追问证据、识别代价、兑现资源与调整假设\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>端到端负责人及跨职能骨干\u003c/td>\n\u003ctd>C06、T05/T06/T08/T09、D06/D09\u003c/td>\n\u003ctd>跟完订单、定义指标、验证原因、做试验\u003c/td>\n\u003ctd>能独立运行一次完整闭环并解释局限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>班组长与岗位骨干\u003c/td>\n\u003ctd>T08/T09/T12及当前问题相关工具\u003c/td>\n\u003ctd>按标准操作、记录事实、处理及升级异常\u003c/td>\n\u003ctd>换一批次仍能独立操作，知道何时停下或升级\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>六个带教单元\u003c/h2>\n\u003cp>定义客户与差距 → 观察价值流 → 指标复算 → 原因验证 → 对策试验 → 标准与异常响应。每次只学习当前真实任务需要的卡片，教练示范一次，学员跟做，再独立演示，记录反馈与复验。\u003c/p>\n\u003ch2>能力等级的使用\u003c/h2>\n\u003cp>能解释：可用自己的语言分清概念；能跟做：有人指导能完成；能独立做：无需提示能处理正常及约定异常；能带人：能观察、反馈并让他人独立完成。这是本库教学等级，不是丹纳赫认证。\u003c/p>\n\u003cp>不用听课时数、背诵工具名称或自评信心替代现场验收。记录进入 \u003ca href=\"#TPL10_%E8%83%BD%E5%8A%9B%E4%B8%8E%E5%B8%A6%E6%95%99%E8%AE%B0%E5%BD%95\" data-open=\"TPL10_能力与带教记录\">能力与带教记录\u003c/a>。\u003c/p>\n\u003ch2>辨析题与答案\u003c/h2>\n\u003cul>\n\u003cli>KPI就是DM吗？不是，KPI是指标，DM是管理机制。\u003c/li>\n\u003cli>PD和DM能用同一OTIF吗？能；分别定义用途、目标、时间与责任。\u003c/li>\n\u003cli>Pareto第一名就是根因吗？不是，它只提示问题集中点。\u003c/li>\n\u003cli>行动一定来自最底层矩阵吗？不是，任何层级都可形成行动，未知原因也可安排调查。\u003c/li>\n\u003cli>降库存就是现金收益吗？不是，需核对采购、应付、实际支出及库存变化原因。\u003c/li>\n\u003cli>换型缩短但启动报废增加，能直接推广吗？不能，应联合复核QDC。\u003c/li>\n\u003c/ul>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"海顺02_岗位学习与带教验收.md"},{"name":"海顺03_PD术语与改写练习","title":"统一PD语言：从口号到可执行定义","raw":"# 统一PD语言：从口号到可执行定义\r\n\r\n> 校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\r\n\r\n| 名词 | 回答的问题 | 写法与验收 |\r\n|---|---|---|\r\n| 战略选择 | 为哪些客户创造什么价值，作什么取舍？ | 客户/竞争/经营事实＋选项＋资源约束 |\r\n| 突破 | 需要达到什么新能力与经营水平？ | 业务价值、显著差距、范围与期限 |\r\n| 年度进展 | 本年度向突破走到哪里？ | 结果、基线、目标与资源条件 |\r\n| IP优先改善 | 改变什么流程机制？ | 机制、边界、贡献假设、主责；可多对多关联目标 |\r\n| TTI | 用什么效果判断机制有效？ | 测量定义＋目标水平＋期限，不只是活动量 |\r\n| 行动 | 谁何时做出什么？ | 可验证交付；可为调查、执行或验证任务 |\r\n| 对策 | 针对哪项有证据的原因改变什么？ | 原因证据、动作、效果及副作用验证 |\r\n| DM | 日常怎样按标准运行和响应异常？ | 标准、实际、责任、时限与升级 |\r\n\r\n## 教学练习（不是海顺已确认项目）\r\n\r\n“提高质量”是方向，先明确产品族和客户要求；“减少返工”仍需定位损失；“建立关键工序准备、首件确认和异常反应机制”可以是候选IP，但须现场证据支持；“FPY按定义从待测基线达到待批准目标”是TTI框架；“本周核对某批次参数与缺陷记录”是调查行动。\r\n\r\n不要把示例机制直接当海顺根因。练习时先说哪些是事实、哪些是待验证假设，最后写出检验假设的方法。\r\n\r\n七阶段原意参见 [[D02_PD七阶段流程与时间表]]；PD与DM共用指标的边界见 [[D12_PD与日常管理KPI的边界]]。\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>统一PD语言：从口号到可执行定义\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>名词\u003c/th>\n\u003cth>回答的问题\u003c/th>\n\u003cth>写法与验收\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>战略选择\u003c/td>\n\u003ctd>为哪些客户创造什么价值，作什么取舍？\u003c/td>\n\u003ctd>客户/竞争/经营事实＋选项＋资源约束\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>突破\u003c/td>\n\u003ctd>需要达到什么新能力与经营水平？\u003c/td>\n\u003ctd>业务价值、显著差距、范围与期限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>年度进展\u003c/td>\n\u003ctd>本年度向突破走到哪里？\u003c/td>\n\u003ctd>结果、基线、目标与资源条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>IP优先改善\u003c/td>\n\u003ctd>改变什么流程机制？\u003c/td>\n\u003ctd>机制、边界、贡献假设、主责；可多对多关联目标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TTI\u003c/td>\n\u003ctd>用什么效果判断机制有效？\u003c/td>\n\u003ctd>测量定义＋目标水平＋期限，不只是活动量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>行动\u003c/td>\n\u003ctd>谁何时做出什么？\u003c/td>\n\u003ctd>可验证交付；可为调查、执行或验证任务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>对策\u003c/td>\n\u003ctd>针对哪项有证据的原因改变什么？\u003c/td>\n\u003ctd>原因证据、动作、效果及副作用验证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DM\u003c/td>\n\u003ctd>日常怎样按标准运行和响应异常？\u003c/td>\n\u003ctd>标准、实际、责任、时限与升级\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>教学练习（不是海顺已确认项目）\u003c/h2>\n\u003cp>“提高质量”是方向，先明确产品族和客户要求；“减少返工”仍需定位损失；“建立关键工序准备、首件确认和异常反应机制”可以是候选IP，但须现场证据支持；“FPY按定义从待测基线达到待批准目标”是TTI框架；“本周核对某批次参数与缺陷记录”是调查行动。\u003c/p>\n\u003cp>不要把示例机制直接当海顺根因。练习时先说哪些是事实、哪些是待验证假设，最后写出检验假设的方法。\u003c/p>\n\u003cp>七阶段原意参见 \u003ca href=\"#D02_PD%E4%B8%83%E9%98%B6%E6%AE%B5%E6%B5%81%E7%A8%8B%E4%B8%8E%E6%97%B6%E9%97%B4%E8%A1%A8\" data-open=\"D02_PD七阶段流程与时间表\">PD七阶段流程与时间表\u003c/a>；PD与DM共用指标的边界见 \u003ca href=\"#D12_PD%E4%B8%8E%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86KPI%E7%9A%84%E8%BE%B9%E7%95%8C\" data-open=\"D12_PD与日常管理KPI的边界\">PD与日常管理KPI的边界\u003c/a>。\u003c/p>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"海顺03_PD术语与改写练习.md"},{"name":"海顺04_战略到执行总纲","title":"海顺QDC：从战略选择到一个完整运行闭环","raw":"# 海顺QDC：从战略选择到一个完整运行闭环\r\n\r\n> 校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\r\n\r\n## 当前诊断与目标\r\n\r\n已知：团队听过5天课程，概念、工具尚不清晰，也没有固定运行节奏。目标：让团队在真实业务中完成一轮选择、诊断、改善、验证、维持和带教。本轮经营焦点为产品质量、交付期、成本控制；库存作为支持指标。\r\n\r\n未提供已填妥的海顺部署矩阵、经营基线和资源容量，因此不编造目标数字，也不判定哪道工序已经是根因。\r\n\r\n## 先补战略选择，再选一个产品族试点\r\n\r\n确认服务的客户及CTQ、交付定义、业务价值、竞争或替代压力、资源约束；比较候选产品族的损失、代表性、可控性和学习条件。总经理决定选择理由与不做事项。\r\n\r\n选择一个有真实QDC差距且可获得数据的产品族，明确从需求/承诺到生产、检验放行及交付的边界，指定一个端到端负责人。不是六个职能各选一个项目。若当前只解决局部经营问题，可先用问题解决与DM；只有具有战略突破意义的能力差距才纳入PD。\r\n\r\n## 十二周起步安排（按证据推进）\r\n\r\n| 阶段 | 做什么 | 产出 | 进入下一阶段的条件 |\r\n|---|---|---|---|\r\n| 第1—2周：建立事实 | 统一概念与测量；跟随真实订单和批次；观察过程与等待 | 试点章程、共同指标字典、现状图；可参考8—12周历史数据，按可得性与季节性调整 | 他人可复算；主要接口可追溯；缺失数据已标明 |\r\n| 第3—4周：选择机制 | 分层损失、提出和验证原因假设；选择一个优先改善；协商资源 | IP贡献假设、TTI、资源、试验计划 | 主责与资源明确；试验能区分主要解释；QDC边界写清 |\r\n| 第5—8周：小范围验证 | 执行、对照预期与实际、记录副作用；边做边带教 | 原因证据、试验记录、周/月决定 | 同口径效果有支持证据；其他QDC未被转嫁；知道适用限制 |\r\n| 第9—12周：维持与移交 | 跨班次/批次复验；换人独立执行；形成标准与异常响应 | 标准、能力证据、持续结果、扩展或继续验证决定 | 能独立维持且有持续证据，才考虑复制 |\r\n\r\n这不是90天必须结项的承诺。若原因、测量或持续性证据不足，继续验证；6—12个月的扩展按能力和验证结果逐步推进。\r\n\r\n## 最小运行节奏\r\n\r\n| 节奏 | 主持与参与 | 核心问题 | 必须留下 |\r\n|---|---|---|---|\r\n| 每日/班次10—15分钟 | 现场或流程负责人及相关岗位 | 今天哪些质量与交付风险需要立即响应？ | 异常、遏制、责任、响应时限与升级 |\r\n| 每周45—60分钟 | 端到端负责人、跨职能骨干和教练 | 假设验证到哪里？哪些障碍需决定？ | 证据、继续/修改/停止决定、资源承诺 |\r\n| 每月60—90分钟 | 总经理与负责人 | QDC效果是否真实？机制和人才是否形成？ | 资源与取舍决定、未验证之处、下期验证 |\r\n\r\n时长是初始建议；并入现有会议，取消重复汇报。AAR按关键事件或里程碑融入周评审，不另造会议体系。\r\n\r\n## 指标最小集合\r\n\r\n初始从5—7项中选实际需要的组合，不将此数量当硬性标准：客户质量、OTIF或OTD、质量损失成本/可控单位成本，配以FPY、端到端周期及一个关键机制指标。库存分层及周转仅在相关时作为支持。每项都必须定义对象、单位、分母、数据源、基线、目标、责任、频率和用途。\r\n\r\n同一OTIF事实可以支持日常异常响应和月度突破评审。保留客户请求、首次承诺和批准变更，不能改期消灭逾期。没有数据标未测；目标在基线与资源核实后批准。\r\n\r\n## 角色与分工\r\n\r\n总经理负责方向、取舍、资源和领导示范；端到端负责人负责流程结果和跨部门闭环；骨干负责事实采集、标准与试验；教练负责方法与能力形成。DBS推进者不能代替业务负责人。\r\n\r\nF02供应链/生产与F06质量是本轮主要观察视角；F03提供客户与需求，F04确认成本与收益，F05安排带教；F01仅在新品或设计转移相关时参与。成熟度与横向复制放到有证据后使用。\r\n\r\n## 使用哪些记录\r\n\r\n[[TPL14_战略到执行一页纸]] 与 [[TPL06_PD部署链与资源协商]] 说明选择和部署；[[TPL02_指标定义与基线]] 与 [[TPL05_保龄图与行动计划]] 记录效果；[[TPL04_问题解决记录]] 记录验证；[[TPL03_日常管理与异常升级]]、[[TPL07_周月评审与决定记录]]、[[TPL09_标准化与移交验收]] 和 [[TPL10_能力与带教记录]] 连接运行与人才。可合并成一套工作簿，只启用当下需要的字段。\r\n\r\n## 总经理怎样判断已经开始落地\r\n\r\n随机抽一笔订单或一个批次：能追出原始要求与承诺、当前偏差、谁在行动、依据是什么、下一步何时验证；随机问一名骨干：能现场演示标准并判断异常；随机抽一项月度决定：能看到资源是否兑现。完成培训、矩阵和看板不构成落地证据。\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>海顺QDC：从战略选择到一个完整运行闭环\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003ch2>当前诊断与目标\u003c/h2>\n\u003cp>已知：团队听过5天课程，概念、工具尚不清晰，也没有固定运行节奏。目标：让团队在真实业务中完成一轮选择、诊断、改善、验证、维持和带教。本轮经营焦点为产品质量、交付期、成本控制；库存作为支持指标。\u003c/p>\n\u003cp>未提供已填妥的海顺部署矩阵、经营基线和资源容量，因此不编造目标数字，也不判定哪道工序已经是根因。\u003c/p>\n\u003ch2>先补战略选择，再选一个产品族试点\u003c/h2>\n\u003cp>确认服务的客户及CTQ、交付定义、业务价值、竞争或替代压力、资源约束；比较候选产品族的损失、代表性、可控性和学习条件。总经理决定选择理由与不做事项。\u003c/p>\n\u003cp>选择一个有真实QDC差距且可获得数据的产品族，明确从需求/承诺到生产、检验放行及交付的边界，指定一个端到端负责人。不是六个职能各选一个项目。若当前只解决局部经营问题，可先用问题解决与DM；只有具有战略突破意义的能力差距才纳入PD。\u003c/p>\n\u003ch2>十二周起步安排（按证据推进）\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段\u003c/th>\n\u003cth>做什么\u003c/th>\n\u003cth>产出\u003c/th>\n\u003cth>进入下一阶段的条件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1—2周：建立事实\u003c/td>\n\u003ctd>统一概念与测量；跟随真实订单和批次；观察过程与等待\u003c/td>\n\u003ctd>试点章程、共同指标字典、现状图；可参考8—12周历史数据，按可得性与季节性调整\u003c/td>\n\u003ctd>他人可复算；主要接口可追溯；缺失数据已标明\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3—4周：选择机制\u003c/td>\n\u003ctd>分层损失、提出和验证原因假设；选择一个优先改善；协商资源\u003c/td>\n\u003ctd>IP贡献假设、TTI、资源、试验计划\u003c/td>\n\u003ctd>主责与资源明确；试验能区分主要解释；QDC边界写清\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5—8周：小范围验证\u003c/td>\n\u003ctd>执行、对照预期与实际、记录副作用；边做边带教\u003c/td>\n\u003ctd>原因证据、试验记录、周/月决定\u003c/td>\n\u003ctd>同口径效果有支持证据；其他QDC未被转嫁；知道适用限制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第9—12周：维持与移交\u003c/td>\n\u003ctd>跨班次/批次复验；换人独立执行；形成标准与异常响应\u003c/td>\n\u003ctd>标准、能力证据、持续结果、扩展或继续验证决定\u003c/td>\n\u003ctd>能独立维持且有持续证据，才考虑复制\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这不是90天必须结项的承诺。若原因、测量或持续性证据不足，继续验证；6—12个月的扩展按能力和验证结果逐步推进。\u003c/p>\n\u003ch2>最小运行节奏\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>节奏\u003c/th>\n\u003cth>主持与参与\u003c/th>\n\u003cth>核心问题\u003c/th>\n\u003cth>必须留下\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>每日/班次10—15分钟\u003c/td>\n\u003ctd>现场或流程负责人及相关岗位\u003c/td>\n\u003ctd>今天哪些质量与交付风险需要立即响应？\u003c/td>\n\u003ctd>异常、遏制、责任、响应时限与升级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>每周45—60分钟\u003c/td>\n\u003ctd>端到端负责人、跨职能骨干和教练\u003c/td>\n\u003ctd>假设验证到哪里？哪些障碍需决定？\u003c/td>\n\u003ctd>证据、继续/修改/停止决定、资源承诺\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>每月60—90分钟\u003c/td>\n\u003ctd>总经理与负责人\u003c/td>\n\u003ctd>QDC效果是否真实？机制和人才是否形成？\u003c/td>\n\u003ctd>资源与取舍决定、未验证之处、下期验证\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>时长是初始建议；并入现有会议，取消重复汇报。AAR按关键事件或里程碑融入周评审，不另造会议体系。\u003c/p>\n\u003ch2>指标最小集合\u003c/h2>\n\u003cp>初始从5—7项中选实际需要的组合，不将此数量当硬性标准：客户质量、OTIF或OTD、质量损失成本/可控单位成本，配以FPY、端到端周期及一个关键机制指标。库存分层及周转仅在相关时作为支持。每项都必须定义对象、单位、分母、数据源、基线、目标、责任、频率和用途。\u003c/p>\n\u003cp>同一OTIF事实可以支持日常异常响应和月度突破评审。保留客户请求、首次承诺和批准变更，不能改期消灭逾期。没有数据标未测；目标在基线与资源核实后批准。\u003c/p>\n\u003ch2>角色与分工\u003c/h2>\n\u003cp>总经理负责方向、取舍、资源和领导示范；端到端负责人负责流程结果和跨部门闭环；骨干负责事实采集、标准与试验；教练负责方法与能力形成。DBS推进者不能代替业务负责人。\u003c/p>\n\u003cp>F02供应链/生产与F06质量是本轮主要观察视角；F03提供客户与需求，F04确认成本与收益，F05安排带教；F01仅在新品或设计转移相关时参与。成熟度与横向复制放到有证据后使用。\u003c/p>\n\u003ch2>使用哪些记录\u003c/h2>\n\u003cp>\u003ca href=\"#TPL14_%E6%88%98%E7%95%A5%E5%88%B0%E6%89%A7%E8%A1%8C%E4%B8%80%E9%A1%B5%E7%BA%B8\" data-open=\"TPL14_战略到执行一页纸\">战略到执行一页纸\u003c/a> 与 \u003ca href=\"#TPL06_PD%E9%83%A8%E7%BD%B2%E9%93%BE%E4%B8%8E%E8%B5%84%E6%BA%90%E5%8D%8F%E5%95%86\" data-open=\"TPL06_PD部署链与资源协商\">PD部署链与资源协商\u003c/a> 说明选择和部署；\u003ca href=\"#TPL02_%E6%8C%87%E6%A0%87%E5%AE%9A%E4%B9%89%E4%B8%8E%E5%9F%BA%E7%BA%BF\" data-open=\"TPL02_指标定义与基线\">指标定义与基线\u003c/a> 与 \u003ca href=\"#TPL05_%E4%BF%9D%E9%BE%84%E5%9B%BE%E4%B8%8E%E8%A1%8C%E5%8A%A8%E8%AE%A1%E5%88%92\" data-open=\"TPL05_保龄图与行动计划\">保龄图与行动计划\u003c/a> 记录效果；\u003ca href=\"#TPL04_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E8%AE%B0%E5%BD%95\" data-open=\"TPL04_问题解决记录\">问题解决记录\u003c/a> 记录验证；\u003ca href=\"#TPL03_%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86%E4%B8%8E%E5%BC%82%E5%B8%B8%E5%8D%87%E7%BA%A7\" data-open=\"TPL03_日常管理与异常升级\">日常管理与异常升级\u003c/a>、\u003ca href=\"#TPL07_%E5%91%A8%E6%9C%88%E8%AF%84%E5%AE%A1%E4%B8%8E%E5%86%B3%E5%AE%9A%E8%AE%B0%E5%BD%95\" data-open=\"TPL07_周月评审与决定记录\">周月评审与决定记录\u003c/a>、\u003ca href=\"#TPL09_%E6%A0%87%E5%87%86%E5%8C%96%E4%B8%8E%E7%A7%BB%E4%BA%A4%E9%AA%8C%E6%94%B6\" data-open=\"TPL09_标准化与移交验收\">标准化与移交验收\u003c/a> 和 \u003ca href=\"#TPL10_%E8%83%BD%E5%8A%9B%E4%B8%8E%E5%B8%A6%E6%95%99%E8%AE%B0%E5%BD%95\" data-open=\"TPL10_能力与带教记录\">能力与带教记录\u003c/a> 连接运行与人才。可合并成一套工作簿，只启用当下需要的字段。\u003c/p>\n\u003ch2>总经理怎样判断已经开始落地\u003c/h2>\n\u003cp>随机抽一笔订单或一个批次：能追出原始要求与承诺、当前偏差、谁在行动、依据是什么、下一步何时验证；随机问一名骨干：能现场演示标准并判断异常；随机抽一项月度决定：能看到资源是否兑现。完成培训、矩阵和看板不构成落地证据。\u003c/p>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"海顺04_战略到执行总纲.md"},{"name":"知识卡索引","title":"55张知识卡索引","raw":"# 55张知识卡索引\r\n\r\n> 校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\r\n\r\n| ID | 卡片 | 定义摘要 |\r\n|---|---|---|\r\n| C01 | [[C01_DBS定义]] | 以持续改进及支持它的文化，把人才、计划、流程和绩效连接起来的企业运行系统。操作上必须同时具有方法、责任、节奏和反馈。 |\r\n| C02 | [[C02_人才计划流程绩效]] | 4P是运行逻辑：有能力的人形成计划，通过流程执行，产生绩效，再反馈人才和计划。它不是四个部门。 |\r\n| C03 | [[C03_质量交付成本创新]] | QDCI是质量、交付、成本、创新四类经营改善方向，不是四个职能部门。海顺本轮聚焦产品质量、交付期、成本控制；创新保留为体系能力，库存作为支持指标。 |\r\n| C04 | [[C04_PDCA与试验学习]] | 围绕明确假设，计划、执行、检查并据证据调整或标准化的学习循环。 |\r\n| C05 | [[C05_价值流与浪费]] | 价值流是为某类客户提供结果所经历的全部活动与信息流。浪费是消耗资源却不创造所需价值的活动；必要的非增值活动也应单独识别。 |\r\n| C06 | [[C06_结果与过程指标]] | 结果指标衡量最终交付的效果，过程指标观察效果产生机制；领先与滞后取决于相对对象和时间窗口。KPI是衡量指标，DM是运行机制，PD是突破部署机制，三者不是同一分类层次。 |\r\n| C07 | [[C07_文化价值观与管理行为]] | 价值观提供判断准则，文化体现在反复发生的管理行为。DBS文化要通过如何面对客户、事实、问题和人员来观察。 |\r\n| D00 | [[D00_战略落地总纲]] | 把战略选择、突破目标、年度进展、流程优先改善、效果指标、资源和学习评审连接成运行闭环。 |\r\n| D01 | [[D01_战略部署定义与价值]] | 将关键战略选择转化为少数突破、资源承诺与持续学习的管理过程。价值在于集中力量、跨职能对齐和根据事实纠偏。 |\r\n| D02 | [[D02_PD七阶段流程与时间表]] | 课件以七个阶段组织从愿景、战略到执行、回顾的年度部署过程；阶段名称是流程骨架，反馈可使前序决定被修订。 |\r\n| D03 | [[D03_突破性目标]] | 描述跨年度需达到的重大经营结果与能力跃迁，体现战略取舍和显著差距。 |\r\n| D04 | [[D04_年度突破目标]] | 将跨年度突破转化为本年度需要实现的可验证进展，并与年度资源安排相连。 |\r\n| D05 | [[D05_最高层优先改善]] | 为实现年度突破而优先建立或改变的关键流程机制，包含从流程改变到经营结果的可检验贡献假设。 |\r\n| D06 | [[D06_改善指标TTI]] | TTI表达优先改善需要达到的效果水平和期限；必须把测量定义与目标陈述一起管理。 |\r\n| D07 | [[D07_关键资源与多功能团队]] | 为突破明确真正可投入的人力、时间、能力、资金与跨职能协作，使责任与执行条件匹配。 |\r\n| D08 | [[D08_战略部署矩阵与层级联接]] | 用矩阵显示目标、优先改善、指标、责任和资源之间的关系，通过上下及横向协商形成可执行承诺。 |\r\n| D09 | [[D09_冲击点与行动计划]] | 把改善落到可以实施变化、观察事实和验证效果的具体工作环节及责任动作。 |\r\n| D10 | [[D10_月度评审与对策]] | 以同口径实际结果检验部署假设，处理偏差、资源障碍和能力缺口，并记录决定的学习机制。 |\r\n| D11 | [[D11_年度自诊断与实施纪律]] | 回顾经营结果、能力建立、战略假设及资源配置，决定下一年度继续、调整、停止或转入常态运行。 |\r\n| D12 | [[D12_PD与日常管理KPI的边界]] | PD聚焦关键能力与绩效突破的选择和部署；DM维持日常标准、响应异常并持续改善；KPI是衡量指标，不是DM本身。 |\r\n| M01 | [[M01_共同基础]] | 跨职能通用的观察、问题解决和维持方式。书中历史架构包括VOC、VSM、PSP、改善、可视化与日常管理、标准作业、TPI、5S。 |\r\n| M02 | [[M02_精益能力]] | 改善价值交付流程的稳定性、流动和资源使用，减少缺陷、等待、过量与返工。作用对象不限于车间。 |\r\n| M03 | [[M03_增长能力]] | 把客户洞察、创新选择、研发、上市与商业执行连接起来，提高创造和兑现需求的能力。 |\r\n| M04 | [[M04_领导力能力]] | 建立能够选择方向、组织执行、解决问题并发展他人的人才与组织机制。 |\r\n| T01 | [[T01_方针部署]] | 将少数重要战略突破连接到流程改善、资源和周期性评审的管理过程。它关注建立新能力，不只是分配指标。 |\r\n| T02 | [[T02_目标协商与部署矩阵]] | 用部署矩阵表达目标、优先改善、指标和资源的关系，通过Catchball双向及横向协商形成共同承诺。矩阵是承载关系的工具，不能替代战略选择和执行。 |\r\n| T03 | [[T03_保龄图与行动计划]] | 保龄图按周期比较目标与实际；行动计划管理具体动作、负责人、期限和预计作用。效果状态与任务状态应分别保留。 |\r\n| T04 | [[T04_客户之声]] | 系统收集和分析客户在真实场景中的需求、困难和选择依据，将其转成可验证要求。 |\r\n| T05 | [[T05_价值流图]] | 用实物流、信息流及时间数据描述某一价值流的现状，再设计未来状态和改善路径。 |\r\n| T06 | [[T06_问题解决流程]] | 以事实界定差距、验证原因、试行对策并防止复发的结构化问题解决。以下是教学流程，不声称是内部固定步数。 |\r\n| T07 | [[T07_改善活动]] | 针对具体问题实施、验证并固化工作方法的改进；集中改善活动是其中一种组织方式。 |\r\n| T08 | [[T08_可视化与日常管理]] | 通过可见的标准与实际差距、明确的责任和异常响应，在日常节奏中维持及改进流程。DM不是挂看板或开例会，也不等同于KPI。 |\r\n| T09 | [[T09_标准作业]] | 把当前已经验证的工作方法变成相关人员能一致执行并持续改进的标准。制造型标准化作业常包含节拍、顺序、标准在制品；通用业务还需输入、质量要求和异常路径。 |\r\n| T10 | [[T10_事务流程改进]] | 改进订单、报价、审批、采购、应收等信息和业务事务流中的等待、错误与重复处理。 |\r\n| T11 | [[T11_5S]] | 通过整理、整顿、清扫、标准化和持续维持，使工作环境和异常更容易识别。 |\r\n| T12 | [[T12_现场观察]] | 到实际产生价值和问题的地方观察工作，用真实事实补充和检验报告。 |\r\n| T13 | [[T13_拉动与在制品限制]] | 以真实消耗或下游可承接能力触发补充，并限制系统中未完成工作，避免无限投放。 |\r\n| T14 | [[T14_快速换型]] | 减少从上一种产品最后合格产出到下一种产品首个合格产出的切换时间，使小批量与灵活交付更可行。 |\r\n| T15 | [[T15_设备可靠性与TPM]] | 通过操作者、维护与工程协作保持设备基本条件，消除重点故障和损失，提高可依赖的生产能力。 |\r\n| T16 | [[T16_变异管理与质量控制]] | 辨别过程波动、验证测量和原因，以减少不一致和缺陷；均值达标不代表每次稳定满足要求。 |\r\n| T17 | [[T17_产销库存协同]] | 用同一需求、供给、库存与能力视图，协调销售承诺、生产和补货决定。 |\r\n| T18 | [[T18_价值分析与价值工程]] | 从产品或服务必须实现的功能出发，寻找在满足要求前提下更经济的设计与实现方式。 |\r\n| T19 | [[T19_客户细分]] | 按需求、使用情境和购买行为等差异区分客户，以便选择服务对象及价值主张。 |\r\n| T20 | [[T20_创新领域与机会选择]] | 明确创新投资的边界，并把已验证的客户问题转成可比较的机会与路线选择。这里解释管理功能，不复刻内部专有表单。 |\r\n| T21 | [[T21_产品规划与资源配置]] | 在产品项目之间进行优先级、投资、资源与停止决定，防止所有项目同时争夺同一关键能力。 |\r\n| T22 | [[T22_快速设计评审]] | 通过客户现场、跨职能协作和快速原型评价，加快关键设计假设的验证与决策。 |\r\n| T23 | [[T23_可视化项目管理]] | 让交付物、依赖、关键风险和待决定事项共同可见，促进跨职能及时解决项目障碍。 |\r\n| T24 | [[T24_销售漏斗管理]] | 按客户购买进展管理机会数量、阶段转化与推进速度，并针对堵点改善商业流程。 |\r\n| T25 | [[T25_价值销售]] | 基于客户业务问题与可验证收益，说明方案价值并支持客户决策。 |\r\n| T26 | [[T26_增长室]] | 围绕增长流程与差距进行可视化、跨职能协同和问题解决的管理场所与节奏。 |\r\n| T27 | [[T27_人才发展与继任]] | 从业务所需能力出发，通过选人、实践、反馈、授权和继任安排建立持续的人才供给。 |\r\n| T28 | [[T28_领导标准工作]] | 把领导应持续做的现场观察、过程检查、教练和障碍解除固定下来，使管理机制不依赖个人临时兴趣。 |\r\n| T29 | [[T29_DBS推进角色]] | 辅导组织正确使用和发展改善方法、培养领导与团队能力的支持角色；业务责任仍由业务管理者承担。 |\r\n| T30 | [[T30_上市与交付准备]] | 将产品就绪、供应交付、服务能力和需求生成协同起来，使新品能够被客户采用并兑现价值。 |\r\n| T31 | [[T31_九宫格人才盘点]] | 常见的人才讨论工具，以绩效及潜力等约定维度辅助校准发展需求。轴、格名及评价依据需要明确；本库不将示例视为DBS现行专属规程。 |\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>55张知识卡索引\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>卡片\u003c/th>\n\u003cth>定义摘要\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>C01\u003c/td>\n\u003ctd>\u003ca href=\"#C01_DBS%E5%AE%9A%E4%B9%89\" data-open=\"C01_DBS定义\">DBS定义\u003c/a>\u003c/td>\n\u003ctd>以持续改进及支持它的文化，把人才、计划、流程和绩效连接起来的企业运行系统。操作上必须同时具有方法、责任、节奏和反馈。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C02\u003c/td>\n\u003ctd>\u003ca href=\"#C02_%E4%BA%BA%E6%89%8D%E8%AE%A1%E5%88%92%E6%B5%81%E7%A8%8B%E7%BB%A9%E6%95%88\" data-open=\"C02_人才计划流程绩效\">人才计划流程绩效\u003c/a>\u003c/td>\n\u003ctd>4P是运行逻辑：有能力的人形成计划，通过流程执行，产生绩效，再反馈人才和计划。它不是四个部门。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C03\u003c/td>\n\u003ctd>\u003ca href=\"#C03_%E8%B4%A8%E9%87%8F%E4%BA%A4%E4%BB%98%E6%88%90%E6%9C%AC%E5%88%9B%E6%96%B0\" data-open=\"C03_质量交付成本创新\">质量交付成本创新\u003c/a>\u003c/td>\n\u003ctd>QDCI是质量、交付、成本、创新四类经营改善方向，不是四个职能部门。海顺本轮聚焦产品质量、交付期、成本控制；创新保留为体系能力，库存作为支持指标。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C04\u003c/td>\n\u003ctd>\u003ca href=\"#C04_PDCA%E4%B8%8E%E8%AF%95%E9%AA%8C%E5%AD%A6%E4%B9%A0\" data-open=\"C04_PDCA与试验学习\">PDCA与试验学习\u003c/a>\u003c/td>\n\u003ctd>围绕明确假设，计划、执行、检查并据证据调整或标准化的学习循环。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C05\u003c/td>\n\u003ctd>\u003ca href=\"#C05_%E4%BB%B7%E5%80%BC%E6%B5%81%E4%B8%8E%E6%B5%AA%E8%B4%B9\" data-open=\"C05_价值流与浪费\">价值流与浪费\u003c/a>\u003c/td>\n\u003ctd>价值流是为某类客户提供结果所经历的全部活动与信息流。浪费是消耗资源却不创造所需价值的活动；必要的非增值活动也应单独识别。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C06\u003c/td>\n\u003ctd>\u003ca href=\"#C06_%E7%BB%93%E6%9E%9C%E4%B8%8E%E8%BF%87%E7%A8%8B%E6%8C%87%E6%A0%87\" data-open=\"C06_结果与过程指标\">结果与过程指标\u003c/a>\u003c/td>\n\u003ctd>结果指标衡量最终交付的效果，过程指标观察效果产生机制；领先与滞后取决于相对对象和时间窗口。KPI是衡量指标，DM是运行机制，PD是突破部署机制，三者不是同一分类层次。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C07\u003c/td>\n\u003ctd>\u003ca href=\"#C07_%E6%96%87%E5%8C%96%E4%BB%B7%E5%80%BC%E8%A7%82%E4%B8%8E%E7%AE%A1%E7%90%86%E8%A1%8C%E4%B8%BA\" data-open=\"C07_文化价值观与管理行为\">文化价值观与管理行为\u003c/a>\u003c/td>\n\u003ctd>价值观提供判断准则，文化体现在反复发生的管理行为。DBS文化要通过如何面对客户、事实、问题和人员来观察。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D00\u003c/td>\n\u003ctd>\u003ca href=\"#D00_%E6%88%98%E7%95%A5%E8%90%BD%E5%9C%B0%E6%80%BB%E7%BA%B2\" data-open=\"D00_战略落地总纲\">战略落地总纲\u003c/a>\u003c/td>\n\u003ctd>把战略选择、突破目标、年度进展、流程优先改善、效果指标、资源和学习评审连接成运行闭环。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D01\u003c/td>\n\u003ctd>\u003ca href=\"#D01_%E6%88%98%E7%95%A5%E9%83%A8%E7%BD%B2%E5%AE%9A%E4%B9%89%E4%B8%8E%E4%BB%B7%E5%80%BC\" data-open=\"D01_战略部署定义与价值\">战略部署定义与价值\u003c/a>\u003c/td>\n\u003ctd>将关键战略选择转化为少数突破、资源承诺与持续学习的管理过程。价值在于集中力量、跨职能对齐和根据事实纠偏。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D02\u003c/td>\n\u003ctd>\u003ca href=\"#D02_PD%E4%B8%83%E9%98%B6%E6%AE%B5%E6%B5%81%E7%A8%8B%E4%B8%8E%E6%97%B6%E9%97%B4%E8%A1%A8\" data-open=\"D02_PD七阶段流程与时间表\">PD七阶段流程与时间表\u003c/a>\u003c/td>\n\u003ctd>课件以七个阶段组织从愿景、战略到执行、回顾的年度部署过程；阶段名称是流程骨架，反馈可使前序决定被修订。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D03\u003c/td>\n\u003ctd>\u003ca href=\"#D03_%E7%AA%81%E7%A0%B4%E6%80%A7%E7%9B%AE%E6%A0%87\" data-open=\"D03_突破性目标\">突破性目标\u003c/a>\u003c/td>\n\u003ctd>描述跨年度需达到的重大经营结果与能力跃迁，体现战略取舍和显著差距。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D04\u003c/td>\n\u003ctd>\u003ca href=\"#D04_%E5%B9%B4%E5%BA%A6%E7%AA%81%E7%A0%B4%E7%9B%AE%E6%A0%87\" data-open=\"D04_年度突破目标\">年度突破目标\u003c/a>\u003c/td>\n\u003ctd>将跨年度突破转化为本年度需要实现的可验证进展，并与年度资源安排相连。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D05\u003c/td>\n\u003ctd>\u003ca href=\"#D05_%E6%9C%80%E9%AB%98%E5%B1%82%E4%BC%98%E5%85%88%E6%94%B9%E5%96%84\" data-open=\"D05_最高层优先改善\">最高层优先改善\u003c/a>\u003c/td>\n\u003ctd>为实现年度突破而优先建立或改变的关键流程机制，包含从流程改变到经营结果的可检验贡献假设。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D06\u003c/td>\n\u003ctd>\u003ca href=\"#D06_%E6%94%B9%E5%96%84%E6%8C%87%E6%A0%87TTI\" data-open=\"D06_改善指标TTI\">改善指标TTI\u003c/a>\u003c/td>\n\u003ctd>TTI表达优先改善需要达到的效果水平和期限；必须把测量定义与目标陈述一起管理。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D07\u003c/td>\n\u003ctd>\u003ca href=\"#D07_%E5%85%B3%E9%94%AE%E8%B5%84%E6%BA%90%E4%B8%8E%E5%A4%9A%E5%8A%9F%E8%83%BD%E5%9B%A2%E9%98%9F\" data-open=\"D07_关键资源与多功能团队\">关键资源与多功能团队\u003c/a>\u003c/td>\n\u003ctd>为突破明确真正可投入的人力、时间、能力、资金与跨职能协作，使责任与执行条件匹配。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D08\u003c/td>\n\u003ctd>\u003ca href=\"#D08_%E6%88%98%E7%95%A5%E9%83%A8%E7%BD%B2%E7%9F%A9%E9%98%B5%E4%B8%8E%E5%B1%82%E7%BA%A7%E8%81%94%E6%8E%A5\" data-open=\"D08_战略部署矩阵与层级联接\">战略部署矩阵与层级联接\u003c/a>\u003c/td>\n\u003ctd>用矩阵显示目标、优先改善、指标、责任和资源之间的关系，通过上下及横向协商形成可执行承诺。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D09\u003c/td>\n\u003ctd>\u003ca href=\"#D09_%E5%86%B2%E5%87%BB%E7%82%B9%E4%B8%8E%E8%A1%8C%E5%8A%A8%E8%AE%A1%E5%88%92\" data-open=\"D09_冲击点与行动计划\">冲击点与行动计划\u003c/a>\u003c/td>\n\u003ctd>把改善落到可以实施变化、观察事实和验证效果的具体工作环节及责任动作。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D10\u003c/td>\n\u003ctd>\u003ca href=\"#D10_%E6%9C%88%E5%BA%A6%E8%AF%84%E5%AE%A1%E4%B8%8E%E5%AF%B9%E7%AD%96\" data-open=\"D10_月度评审与对策\">月度评审与对策\u003c/a>\u003c/td>\n\u003ctd>以同口径实际结果检验部署假设，处理偏差、资源障碍和能力缺口，并记录决定的学习机制。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D11\u003c/td>\n\u003ctd>\u003ca href=\"#D11_%E5%B9%B4%E5%BA%A6%E8%87%AA%E8%AF%8A%E6%96%AD%E4%B8%8E%E5%AE%9E%E6%96%BD%E7%BA%AA%E5%BE%8B\" data-open=\"D11_年度自诊断与实施纪律\">年度自诊断与实施纪律\u003c/a>\u003c/td>\n\u003ctd>回顾经营结果、能力建立、战略假设及资源配置，决定下一年度继续、调整、停止或转入常态运行。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D12\u003c/td>\n\u003ctd>\u003ca href=\"#D12_PD%E4%B8%8E%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86KPI%E7%9A%84%E8%BE%B9%E7%95%8C\" data-open=\"D12_PD与日常管理KPI的边界\">PD与日常管理KPI的边界\u003c/a>\u003c/td>\n\u003ctd>PD聚焦关键能力与绩效突破的选择和部署；DM维持日常标准、响应异常并持续改善；KPI是衡量指标，不是DM本身。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M01\u003c/td>\n\u003ctd>\u003ca href=\"#M01_%E5%85%B1%E5%90%8C%E5%9F%BA%E7%A1%80\" data-open=\"M01_共同基础\">共同基础\u003c/a>\u003c/td>\n\u003ctd>跨职能通用的观察、问题解决和维持方式。书中历史架构包括VOC、VSM、PSP、改善、可视化与日常管理、标准作业、TPI、5S。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M02\u003c/td>\n\u003ctd>\u003ca href=\"#M02_%E7%B2%BE%E7%9B%8A%E8%83%BD%E5%8A%9B\" data-open=\"M02_精益能力\">精益能力\u003c/a>\u003c/td>\n\u003ctd>改善价值交付流程的稳定性、流动和资源使用，减少缺陷、等待、过量与返工。作用对象不限于车间。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M03\u003c/td>\n\u003ctd>\u003ca href=\"#M03_%E5%A2%9E%E9%95%BF%E8%83%BD%E5%8A%9B\" data-open=\"M03_增长能力\">增长能力\u003c/a>\u003c/td>\n\u003ctd>把客户洞察、创新选择、研发、上市与商业执行连接起来，提高创造和兑现需求的能力。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M04\u003c/td>\n\u003ctd>\u003ca href=\"#M04_%E9%A2%86%E5%AF%BC%E5%8A%9B%E8%83%BD%E5%8A%9B\" data-open=\"M04_领导力能力\">领导力能力\u003c/a>\u003c/td>\n\u003ctd>建立能够选择方向、组织执行、解决问题并发展他人的人才与组织机制。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T01\u003c/td>\n\u003ctd>\u003ca href=\"#T01_%E6%96%B9%E9%92%88%E9%83%A8%E7%BD%B2\" data-open=\"T01_方针部署\">方针部署\u003c/a>\u003c/td>\n\u003ctd>将少数重要战略突破连接到流程改善、资源和周期性评审的管理过程。它关注建立新能力，不只是分配指标。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T02\u003c/td>\n\u003ctd>\u003ca href=\"#T02_%E7%9B%AE%E6%A0%87%E5%8D%8F%E5%95%86%E4%B8%8E%E9%83%A8%E7%BD%B2%E7%9F%A9%E9%98%B5\" data-open=\"T02_目标协商与部署矩阵\">目标协商与部署矩阵\u003c/a>\u003c/td>\n\u003ctd>用部署矩阵表达目标、优先改善、指标和资源的关系，通过Catchball双向及横向协商形成共同承诺。矩阵是承载关系的工具，不能替代战略选择和执行。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T03\u003c/td>\n\u003ctd>\u003ca href=\"#T03_%E4%BF%9D%E9%BE%84%E5%9B%BE%E4%B8%8E%E8%A1%8C%E5%8A%A8%E8%AE%A1%E5%88%92\" data-open=\"T03_保龄图与行动计划\">保龄图与行动计划\u003c/a>\u003c/td>\n\u003ctd>保龄图按周期比较目标与实际；行动计划管理具体动作、负责人、期限和预计作用。效果状态与任务状态应分别保留。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T04\u003c/td>\n\u003ctd>\u003ca href=\"#T04_%E5%AE%A2%E6%88%B7%E4%B9%8B%E5%A3%B0\" data-open=\"T04_客户之声\">客户之声\u003c/a>\u003c/td>\n\u003ctd>系统收集和分析客户在真实场景中的需求、困难和选择依据，将其转成可验证要求。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T05\u003c/td>\n\u003ctd>\u003ca href=\"#T05_%E4%BB%B7%E5%80%BC%E6%B5%81%E5%9B%BE\" data-open=\"T05_价值流图\">价值流图\u003c/a>\u003c/td>\n\u003ctd>用实物流、信息流及时间数据描述某一价值流的现状，再设计未来状态和改善路径。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T06\u003c/td>\n\u003ctd>\u003ca href=\"#T06_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E6%B5%81%E7%A8%8B\" data-open=\"T06_问题解决流程\">问题解决流程\u003c/a>\u003c/td>\n\u003ctd>以事实界定差距、验证原因、试行对策并防止复发的结构化问题解决。以下是教学流程，不声称是内部固定步数。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T07\u003c/td>\n\u003ctd>\u003ca href=\"#T07_%E6%94%B9%E5%96%84%E6%B4%BB%E5%8A%A8\" data-open=\"T07_改善活动\">改善活动\u003c/a>\u003c/td>\n\u003ctd>针对具体问题实施、验证并固化工作方法的改进；集中改善活动是其中一种组织方式。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T08\u003c/td>\n\u003ctd>\u003ca href=\"#T08_%E5%8F%AF%E8%A7%86%E5%8C%96%E4%B8%8E%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86\" data-open=\"T08_可视化与日常管理\">可视化与日常管理\u003c/a>\u003c/td>\n\u003ctd>通过可见的标准与实际差距、明确的责任和异常响应，在日常节奏中维持及改进流程。DM不是挂看板或开例会，也不等同于KPI。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T09\u003c/td>\n\u003ctd>\u003ca href=\"#T09_%E6%A0%87%E5%87%86%E4%BD%9C%E4%B8%9A\" data-open=\"T09_标准作业\">标准作业\u003c/a>\u003c/td>\n\u003ctd>把当前已经验证的工作方法变成相关人员能一致执行并持续改进的标准。制造型标准化作业常包含节拍、顺序、标准在制品；通用业务还需输入、质量要求和异常路径。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T10\u003c/td>\n\u003ctd>\u003ca href=\"#T10_%E4%BA%8B%E5%8A%A1%E6%B5%81%E7%A8%8B%E6%94%B9%E8%BF%9B\" data-open=\"T10_事务流程改进\">事务流程改进\u003c/a>\u003c/td>\n\u003ctd>改进订单、报价、审批、采购、应收等信息和业务事务流中的等待、错误与重复处理。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T11\u003c/td>\n\u003ctd>\u003ca href=\"#T11_5S\" data-open=\"T11_5S\">5S\u003c/a>\u003c/td>\n\u003ctd>通过整理、整顿、清扫、标准化和持续维持，使工作环境和异常更容易识别。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T12\u003c/td>\n\u003ctd>\u003ca href=\"#T12_%E7%8E%B0%E5%9C%BA%E8%A7%82%E5%AF%9F\" data-open=\"T12_现场观察\">现场观察\u003c/a>\u003c/td>\n\u003ctd>到实际产生价值和问题的地方观察工作，用真实事实补充和检验报告。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T13\u003c/td>\n\u003ctd>\u003ca href=\"#T13_%E6%8B%89%E5%8A%A8%E4%B8%8E%E5%9C%A8%E5%88%B6%E5%93%81%E9%99%90%E5%88%B6\" data-open=\"T13_拉动与在制品限制\">拉动与在制品限制\u003c/a>\u003c/td>\n\u003ctd>以真实消耗或下游可承接能力触发补充，并限制系统中未完成工作，避免无限投放。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T14\u003c/td>\n\u003ctd>\u003ca href=\"#T14_%E5%BF%AB%E9%80%9F%E6%8D%A2%E5%9E%8B\" data-open=\"T14_快速换型\">快速换型\u003c/a>\u003c/td>\n\u003ctd>减少从上一种产品最后合格产出到下一种产品首个合格产出的切换时间，使小批量与灵活交付更可行。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T15\u003c/td>\n\u003ctd>\u003ca href=\"#T15_%E8%AE%BE%E5%A4%87%E5%8F%AF%E9%9D%A0%E6%80%A7%E4%B8%8ETPM\" data-open=\"T15_设备可靠性与TPM\">设备可靠性与TPM\u003c/a>\u003c/td>\n\u003ctd>通过操作者、维护与工程协作保持设备基本条件，消除重点故障和损失，提高可依赖的生产能力。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T16\u003c/td>\n\u003ctd>\u003ca href=\"#T16_%E5%8F%98%E5%BC%82%E7%AE%A1%E7%90%86%E4%B8%8E%E8%B4%A8%E9%87%8F%E6%8E%A7%E5%88%B6\" data-open=\"T16_变异管理与质量控制\">变异管理与质量控制\u003c/a>\u003c/td>\n\u003ctd>辨别过程波动、验证测量和原因，以减少不一致和缺陷；均值达标不代表每次稳定满足要求。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T17\u003c/td>\n\u003ctd>\u003ca href=\"#T17_%E4%BA%A7%E9%94%80%E5%BA%93%E5%AD%98%E5%8D%8F%E5%90%8C\" data-open=\"T17_产销库存协同\">产销库存协同\u003c/a>\u003c/td>\n\u003ctd>用同一需求、供给、库存与能力视图，协调销售承诺、生产和补货决定。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T18\u003c/td>\n\u003ctd>\u003ca href=\"#T18_%E4%BB%B7%E5%80%BC%E5%88%86%E6%9E%90%E4%B8%8E%E4%BB%B7%E5%80%BC%E5%B7%A5%E7%A8%8B\" data-open=\"T18_价值分析与价值工程\">价值分析与价值工程\u003c/a>\u003c/td>\n\u003ctd>从产品或服务必须实现的功能出发，寻找在满足要求前提下更经济的设计与实现方式。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T19\u003c/td>\n\u003ctd>\u003ca href=\"#T19_%E5%AE%A2%E6%88%B7%E7%BB%86%E5%88%86\" data-open=\"T19_客户细分\">客户细分\u003c/a>\u003c/td>\n\u003ctd>按需求、使用情境和购买行为等差异区分客户，以便选择服务对象及价值主张。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T20\u003c/td>\n\u003ctd>\u003ca href=\"#T20_%E5%88%9B%E6%96%B0%E9%A2%86%E5%9F%9F%E4%B8%8E%E6%9C%BA%E4%BC%9A%E9%80%89%E6%8B%A9\" data-open=\"T20_创新领域与机会选择\">创新领域与机会选择\u003c/a>\u003c/td>\n\u003ctd>明确创新投资的边界，并把已验证的客户问题转成可比较的机会与路线选择。这里解释管理功能，不复刻内部专有表单。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T21\u003c/td>\n\u003ctd>\u003ca href=\"#T21_%E4%BA%A7%E5%93%81%E8%A7%84%E5%88%92%E4%B8%8E%E8%B5%84%E6%BA%90%E9%85%8D%E7%BD%AE\" data-open=\"T21_产品规划与资源配置\">产品规划与资源配置\u003c/a>\u003c/td>\n\u003ctd>在产品项目之间进行优先级、投资、资源与停止决定，防止所有项目同时争夺同一关键能力。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T22\u003c/td>\n\u003ctd>\u003ca href=\"#T22_%E5%BF%AB%E9%80%9F%E8%AE%BE%E8%AE%A1%E8%AF%84%E5%AE%A1\" data-open=\"T22_快速设计评审\">快速设计评审\u003c/a>\u003c/td>\n\u003ctd>通过客户现场、跨职能协作和快速原型评价，加快关键设计假设的验证与决策。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T23\u003c/td>\n\u003ctd>\u003ca href=\"#T23_%E5%8F%AF%E8%A7%86%E5%8C%96%E9%A1%B9%E7%9B%AE%E7%AE%A1%E7%90%86\" data-open=\"T23_可视化项目管理\">可视化项目管理\u003c/a>\u003c/td>\n\u003ctd>让交付物、依赖、关键风险和待决定事项共同可见，促进跨职能及时解决项目障碍。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T24\u003c/td>\n\u003ctd>\u003ca href=\"#T24_%E9%94%80%E5%94%AE%E6%BC%8F%E6%96%97%E7%AE%A1%E7%90%86\" data-open=\"T24_销售漏斗管理\">销售漏斗管理\u003c/a>\u003c/td>\n\u003ctd>按客户购买进展管理机会数量、阶段转化与推进速度，并针对堵点改善商业流程。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T25\u003c/td>\n\u003ctd>\u003ca href=\"#T25_%E4%BB%B7%E5%80%BC%E9%94%80%E5%94%AE\" data-open=\"T25_价值销售\">价值销售\u003c/a>\u003c/td>\n\u003ctd>基于客户业务问题与可验证收益，说明方案价值并支持客户决策。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T26\u003c/td>\n\u003ctd>\u003ca href=\"#T26_%E5%A2%9E%E9%95%BF%E5%AE%A4\" data-open=\"T26_增长室\">增长室\u003c/a>\u003c/td>\n\u003ctd>围绕增长流程与差距进行可视化、跨职能协同和问题解决的管理场所与节奏。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T27\u003c/td>\n\u003ctd>\u003ca href=\"#T27_%E4%BA%BA%E6%89%8D%E5%8F%91%E5%B1%95%E4%B8%8E%E7%BB%A7%E4%BB%BB\" data-open=\"T27_人才发展与继任\">人才发展与继任\u003c/a>\u003c/td>\n\u003ctd>从业务所需能力出发，通过选人、实践、反馈、授权和继任安排建立持续的人才供给。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T28\u003c/td>\n\u003ctd>\u003ca href=\"#T28_%E9%A2%86%E5%AF%BC%E6%A0%87%E5%87%86%E5%B7%A5%E4%BD%9C\" data-open=\"T28_领导标准工作\">领导标准工作\u003c/a>\u003c/td>\n\u003ctd>把领导应持续做的现场观察、过程检查、教练和障碍解除固定下来，使管理机制不依赖个人临时兴趣。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T29\u003c/td>\n\u003ctd>\u003ca href=\"#T29_DBS%E6%8E%A8%E8%BF%9B%E8%A7%92%E8%89%B2\" data-open=\"T29_DBS推进角色\">DBS推进角色\u003c/a>\u003c/td>\n\u003ctd>辅导组织正确使用和发展改善方法、培养领导与团队能力的支持角色；业务责任仍由业务管理者承担。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T30\u003c/td>\n\u003ctd>\u003ca href=\"#T30_%E4%B8%8A%E5%B8%82%E4%B8%8E%E4%BA%A4%E4%BB%98%E5%87%86%E5%A4%87\" data-open=\"T30_上市与交付准备\">上市与交付准备\u003c/a>\u003c/td>\n\u003ctd>将产品就绪、供应交付、服务能力和需求生成协同起来，使新品能够被客户采用并兑现价值。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T31\u003c/td>\n\u003ctd>\u003ca href=\"#T31_%E4%B9%9D%E5%AE%AB%E6%A0%BC%E4%BA%BA%E6%89%8D%E7%9B%98%E7%82%B9\" data-open=\"T31_九宫格人才盘点\">九宫格人才盘点\u003c/a>\u003c/td>\n\u003ctd>常见的人才讨论工具，以绩效及潜力等约定维度辅助校准发展需求。轴、格名及评价依据需要明确；本库不将示例视为DBS现行专属规程。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡索引.md"},{"name":"C01_DBS定义","title":"DBS定义","raw":"---\r\nid: C01\r\n类型: 概念\r\n模块: 体系\r\n英文: Danaher Business System\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# DBS定义\r\n\r\n**C01 · Danaher Business System · 体系**\r\n\r\n## 定义\r\n\r\n以持续改进及支持它的文化，把人才、计划、流程和绩效连接起来的企业运行系统。操作上必须同时具有方法、责任、节奏和反馈。\r\n\r\n## 何时用\r\n\r\n希望把零散改善变成可持续的经营方式；覆盖生产、销售、研发和支持职能。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**客户需要、经营差距、现有流程和人员能力。\r\n\r\n1. 明确客户价值。\r\n2. 选少数重要差距。\r\n3. 在流程中验证改善。\r\n4. 建立标准与日常响应。\r\n5. 培养能继续改进的人。\r\n\r\n## 必须产生的东西\r\n\r\n相互连接的目标、流程、指标、改善和人才机制。\r\n\r\n## 怎样验收\r\n\r\n随机抽一项目标，能追到负责人、实际动作、结果证据和维持机制。\r\n\r\n## 误区与边界\r\n\r\n把DBS等同5S、培训、降本活动或一本工具目录。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：当前试点的真实目标、过程与证据。\r\n- 责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\r\n- 记录入口：[[TPL01_改善项目章程]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n列出现有管理中一处“目标有了，但实现机制缺失”的接口。\r\n\r\n## 来源与相邻节点\r\n\r\n书第84—88页；官网定义，见S02。实施步骤为教学展开。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[C02_人才计划流程绩效]] · [[M01_共同基础]] · [[M02_精益能力]] · [[M03_增长能力]] · [[M04_领导力能力]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>DBS定义\u003c/h1>\n\u003cp>\u003cstrong>C01 · Danaher Business System · 体系\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>以持续改进及支持它的文化，把人才、计划、流程和绩效连接起来的企业运行系统。操作上必须同时具有方法、责任、节奏和反馈。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>希望把零散改善变成可持续的经营方式；覆盖生产、销售、研发和支持职能。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**客户需要、经营差距、现有流程和人员能力。\u003c/p>\n\u003col>\n\u003cli>明确客户价值。\u003c/li>\n\u003cli>选少数重要差距。\u003c/li>\n\u003cli>在流程中验证改善。\u003c/li>\n\u003cli>建立标准与日常响应。\u003c/li>\n\u003cli>培养能继续改进的人。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>相互连接的目标、流程、指标、改善和人才机制。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>随机抽一项目标，能追到负责人、实际动作、结果证据和维持机制。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>把DBS等同5S、培训、降本活动或一本工具目录。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：当前试点的真实目标、过程与证据。\u003c/li>\n\u003cli>责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL01_%E6%94%B9%E5%96%84%E9%A1%B9%E7%9B%AE%E7%AB%A0%E7%A8%8B\" data-open=\"TPL01_改善项目章程\">改善项目章程\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>列出现有管理中一处“目标有了，但实现机制缺失”的接口。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>书第84—88页；官网定义，见S02。实施步骤为教学展开。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#C02_%E4%BA%BA%E6%89%8D%E8%AE%A1%E5%88%92%E6%B5%81%E7%A8%8B%E7%BB%A9%E6%95%88\" data-open=\"C02_人才计划流程绩效\">人才计划流程绩效\u003c/a> · \u003ca href=\"#M01_%E5%85%B1%E5%90%8C%E5%9F%BA%E7%A1%80\" data-open=\"M01_共同基础\">共同基础\u003c/a> · \u003ca href=\"#M02_%E7%B2%BE%E7%9B%8A%E8%83%BD%E5%8A%9B\" data-open=\"M02_精益能力\">精益能力\u003c/a> · \u003ca href=\"#M03_%E5%A2%9E%E9%95%BF%E8%83%BD%E5%8A%9B\" data-open=\"M03_增长能力\">增长能力\u003c/a> · \u003ca href=\"#M04_%E9%A2%86%E5%AF%BC%E5%8A%9B%E8%83%BD%E5%8A%9B\" data-open=\"M04_领导力能力\">领导力能力\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/C01_DBS定义.md"},{"name":"C02_人才计划流程绩效","title":"人才计划流程绩效","raw":"---\r\nid: C02\r\n类型: 概念\r\n模块: 体系\r\n英文: People / Plan / Process / Performance\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 人才计划流程绩效\r\n\r\n**C02 · People / Plan / Process / Performance · 体系**\r\n\r\n## 定义\r\n\r\n4P是运行逻辑：有能力的人形成计划，通过流程执行，产生绩效，再反馈人才和计划。它不是四个部门。\r\n\r\n## 何时用\r\n\r\n需要检查目标落空发生在哪个管理环节。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**目标、负责人、执行方式、结果及反馈记录。\r\n\r\n1. 明确角色能力。\r\n2. 写出有取舍的计划。\r\n3. 识别结果产生的流程。\r\n4. 检查结果。\r\n5. 将发现反馈给能力与计划。\r\n\r\n## 必须产生的东西\r\n\r\n每个目标对应的人、计划、流程和结果链。\r\n\r\n## 怎样验收\r\n\r\n每一环都有实际证据，绩效未达标能指出待验证的具体环节。\r\n\r\n## 误区与边界\r\n\r\n用“人员不行”解释所有问题，忽略流程和资源。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：当前试点的真实目标、过程与证据。\r\n- 责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\r\n- 记录入口：[[TPL01_改善项目章程]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n把一个本部门目标填写成4P四格，圈出证据最少的一格。\r\n\r\n## 来源与相邻节点\r\n\r\n书第86、90页；官网运行逻辑S02。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[C01_DBS定义]] · [[T01_方针部署]] · [[T08_可视化与日常管理]] · [[T27_人才发展与继任]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>人才计划流程绩效\u003c/h1>\n\u003cp>\u003cstrong>C02 · People / Plan / Process / Performance · 体系\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>4P是运行逻辑：有能力的人形成计划，通过流程执行，产生绩效，再反馈人才和计划。它不是四个部门。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>需要检查目标落空发生在哪个管理环节。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**目标、负责人、执行方式、结果及反馈记录。\u003c/p>\n\u003col>\n\u003cli>明确角色能力。\u003c/li>\n\u003cli>写出有取舍的计划。\u003c/li>\n\u003cli>识别结果产生的流程。\u003c/li>\n\u003cli>检查结果。\u003c/li>\n\u003cli>将发现反馈给能力与计划。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>每个目标对应的人、计划、流程和结果链。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>每一环都有实际证据，绩效未达标能指出待验证的具体环节。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>用“人员不行”解释所有问题，忽略流程和资源。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：当前试点的真实目标、过程与证据。\u003c/li>\n\u003cli>责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL01_%E6%94%B9%E5%96%84%E9%A1%B9%E7%9B%AE%E7%AB%A0%E7%A8%8B\" data-open=\"TPL01_改善项目章程\">改善项目章程\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>把一个本部门目标填写成4P四格，圈出证据最少的一格。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>书第86、90页；官网运行逻辑S02。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#C01_DBS%E5%AE%9A%E4%B9%89\" data-open=\"C01_DBS定义\">DBS定义\u003c/a> · \u003ca href=\"#T01_%E6%96%B9%E9%92%88%E9%83%A8%E7%BD%B2\" data-open=\"T01_方针部署\">方针部署\u003c/a> · \u003ca href=\"#T08_%E5%8F%AF%E8%A7%86%E5%8C%96%E4%B8%8E%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86\" data-open=\"T08_可视化与日常管理\">可视化与日常管理\u003c/a> · \u003ca href=\"#T27_%E4%BA%BA%E6%89%8D%E5%8F%91%E5%B1%95%E4%B8%8E%E7%BB%A7%E4%BB%BB\" data-open=\"T27_人才发展与继任\">人才发展与继任\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/C02_人才计划流程绩效.md"},{"name":"C03_质量交付成本创新","title":"质量交付成本创新","raw":"---\r\nid: C03\r\n类型: 概念\r\n模块: 体系\r\n英文: Quality / Delivery / Cost / Innovation\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 质量交付成本创新\r\n\r\n**C03 · Quality / Delivery / Cost / Innovation · 体系**\r\n\r\n## 定义\r\n\r\nQDCI是质量、交付、成本、创新四类经营改善方向，不是四个职能部门。海顺本轮聚焦产品质量、交付期、成本控制；创新保留为体系能力，库存作为支持指标。\r\n\r\n## 何时用\r\n\r\n定义业务差距与改善的结果约束。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**客户要求、当前表现、成本和创新任务。\r\n\r\n1. 选择主要改善方向。\r\n2. 定义指标和护栏。\r\n3. 检查局部改善是否损害其他方向。\r\n4. 持续看趋势。\r\n\r\n## 必须产生的东西\r\n\r\n一项主要结果与必要的质量、交付、成本等约束。\r\n\r\n## 怎样验收\r\n\r\n质量、交付、成本同表验收。不能靠改变承诺日期、隐瞒返工、无需求增产或转移库存制造改善。安全和产品放行要求不得以经营收益交换。\r\n\r\n## 误区与边界\r\n\r\n把成本最小化当唯一目标；把安全当可交换成本。安全与质量要求应作为边界。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：当前试点的真实目标、过程与证据。\r\n- 责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\r\n- 记录入口：[[TPL01_改善项目章程]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n给一个降本项目补上质量和交付护栏。\r\n\r\n## 来源与相邻节点\r\n\r\n书第85—87页；护栏设计为通用方法和教学补充。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[C06_结果与过程指标]] · [[M02_精益能力]] · [[M03_增长能力]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>质量交付成本创新\u003c/h1>\n\u003cp>\u003cstrong>C03 · Quality / Delivery / Cost / Innovation · 体系\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>QDCI是质量、交付、成本、创新四类经营改善方向，不是四个职能部门。海顺本轮聚焦产品质量、交付期、成本控制；创新保留为体系能力，库存作为支持指标。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>定义业务差距与改善的结果约束。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**客户要求、当前表现、成本和创新任务。\u003c/p>\n\u003col>\n\u003cli>选择主要改善方向。\u003c/li>\n\u003cli>定义指标和护栏。\u003c/li>\n\u003cli>检查局部改善是否损害其他方向。\u003c/li>\n\u003cli>持续看趋势。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>一项主要结果与必要的质量、交付、成本等约束。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>质量、交付、成本同表验收。不能靠改变承诺日期、隐瞒返工、无需求增产或转移库存制造改善。安全和产品放行要求不得以经营收益交换。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>把成本最小化当唯一目标；把安全当可交换成本。安全与质量要求应作为边界。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：当前试点的真实目标、过程与证据。\u003c/li>\n\u003cli>责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL01_%E6%94%B9%E5%96%84%E9%A1%B9%E7%9B%AE%E7%AB%A0%E7%A8%8B\" data-open=\"TPL01_改善项目章程\">改善项目章程\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>给一个降本项目补上质量和交付护栏。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>书第85—87页；护栏设计为通用方法和教学补充。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#C06_%E7%BB%93%E6%9E%9C%E4%B8%8E%E8%BF%87%E7%A8%8B%E6%8C%87%E6%A0%87\" data-open=\"C06_结果与过程指标\">结果与过程指标\u003c/a> · \u003ca href=\"#M02_%E7%B2%BE%E7%9B%8A%E8%83%BD%E5%8A%9B\" data-open=\"M02_精益能力\">精益能力\u003c/a> · \u003ca href=\"#M03_%E5%A2%9E%E9%95%BF%E8%83%BD%E5%8A%9B\" data-open=\"M03_增长能力\">增长能力\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/C03_质量交付成本创新.md"},{"name":"C04_PDCA与试验学习","title":"PDCA与试验学习","raw":"---\r\nid: C04\r\n类型: 概念\r\n模块: 共同基础\r\n英文: Plan / Do / Check / Act\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# PDCA与试验学习\r\n\r\n**C04 · Plan / Do / Check / Act · 共同基础**\r\n\r\n## 定义\r\n\r\n围绕明确假设，计划、执行、检查并据证据调整或标准化的学习循环。\r\n\r\n## 何时用\r\n\r\n对原因或对策还不确定，需要低风险检验。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**问题、预测、试验范围、判断标准。\r\n\r\n1. 写出若改变X应发生Y。\r\n2. 在限定范围执行。\r\n3. 按同一口径比较实际与预测。\r\n4. 决定采用、修改或放弃。\r\n\r\n## 必须产生的东西\r\n\r\n包含假设、动作、证据和决定的试验记录。\r\n\r\n## 怎样验收\r\n\r\n能说明学到了什么，以及为什么作出下一步决定。\r\n\r\n## 误区与边界\r\n\r\n把Check做成查员工是否完成任务；结果不符仍机械推广。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：当前试点的真实目标、过程与证据。\r\n- 责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\r\n- 记录入口：[[TPL01_改善项目章程]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n为一个改进建议写下可证伪的预测和停止条件。\r\n\r\n## 来源与相邻节点\r\n\r\nPD课件第5、10页；步骤为通用PDCA教学操作化。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\ 念\r\n模块: 共同基础\r\n英文: Value Stream / Waste\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 价值流与浪费\r\n\r\n**C05 · Value Stream / Waste · 共同基础**\r\n\r\n## 定义\r\n\r\n价值流是为某类客户提供结果所经历的全部活动与信息流。浪费是消耗资源却不创造所需价值的活动；必要的非增值活动也应单独识别。\r\n\r\n## 何时用\r\n\r\n部门很忙，但客户等候或返工仍多。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**一个产品或服务族、需求到交付的实际路径。\r\n\r\n1. 划清边界。\r\n2. 观察实物流和信息流。\r\n3. 区分增值、必要非增值及可去除浪费。\r\n4. 优先处理端到端约束。\r\n\r\n## 必须产生的东西\r\n\r\n跨部门流程边界和浪费证据清单。\r\n\r\n## 怎样验收\r\n\r\n不是仅凭主观判断删步骤；保留必要检验、批准和风险控制。\r\n\r\n## 误区与边界\r\n\r\n把所有检验都删掉，或把“员工闲着”直接等同系统浪费。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：当前试点的真实目标、过程与证据。\r\n- 责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\r\n- 记录入口：[[TPL01_改善项目章程]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n跟一筆实际业务，找出一个最长等待点并记录起止时间。\r\n\r\n## 来源与相邻节点\r\n\r\n书第100—102页；浪费与必要非增值区分为通用精益方法。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T05_价值流图]] · [[T10_事务流程改进]] · [[T13_拉动与在制品限制]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>价值流与浪费\u003c/h1>\n\u003cp>\u003cstrong>C05 · Value Stream / Waste · 共同基础\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>价值流是为某类客户提供结果所经历的全部活动与信息流。浪费是消耗资源却不创造所需价值的活动；必要的非增值活动也应单独识别。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>部门很忙，但客户等候或返工仍多。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**一个产品或服务族、需求到交付的实际路径。\u003c/p>\n\u003col>\n\u003cli>划清边界。\u003c/li>\n\u003cli>观察实物流和信息流。\u003c/li>\n\u003cli>区分增值、必要非增值及可去除浪费。\u003c/li>\n\u003cli>优先处理端到端约束。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>跨部门流程边界和浪费证据清单。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>不是仅凭主观判断删步骤；保留必要检验、批准和风险控制。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>把所有检验都删掉，或把“员工闲着”直接等同系统浪费。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：当前试点的真实目标、过程与证据。\u003c/li>\n\u003cli>责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL01_%E6%94%B9%E5%96%84%E9%A1%B9%E7%9B%AE%E7%AB%A0%E7%A8%8B\" data-open=\"TPL01_改善项目章程\">改善项目章程\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>跟一筆实际业务，找出一个最长等待点并记录起止时间。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>书第100—102页；浪费与必要非增值区分为通用精益方法。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T05_%E4%BB%B7%E5%80%BC%E6%B5%81%E5%9B%BE\" data-open=\"T05_价值流图\">价值流图\u003c/a> · \u003ca href=\"#T10_%E4%BA%8B%E5%8A%A1%E6%B5%81%E7%A8%8B%E6%94%B9%E8%BF%9B\" data-open=\"T10_事务流程改进\">事务流程改进\u003c/a> · \u003ca href=\"#T13_%E6%8B%89%E5%8A%A8%E4%B8%8E%E5%9C%A8%E5%88%B6%E5%93%81%E9%99%90%E5%88%B6\" data-open=\"T13_拉动与在制品限制\">拉动与在制品限制\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/C05_价值流与浪费.md"},{"name":"C06_结果与过程指标","title":"结果与过程指标","raw":"---\r\nid: C06\r\n类型: 概念\r\n模块: 共同基础\r\n英文: Outcome / Process / Leading / Lagging Measures\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 结果与过程指标\r\n\r\n**C06 · Outcome / Process / Leading / Lagging Measures · 共同基础**\r\n\r\n## 定义\r\n\r\n结果指标衡量最终交付的效果，过程指标观察效果产生机制；领先与滞后取决于相对对象和时间窗口。KPI是衡量指标，DM是运行机制，PD是突破部署机制，三者不是同一分类层次。\r\n\r\n## 何时用\r\n\r\n只在月底看到差距，或行动完成但结果没改善。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**流程假设、可取数据、清楚的指标定义。\r\n\r\n1. 先定客户结果。\r\n2. 再选有合理作用路径的过程指标。\r\n3. 统一分子分母和时间边界。\r\n4. 跟踪两者关系并修正假设。\r\n\r\n## 必须产生的东西\r\n\r\n结果—过程—行动三层对应，含必要护栏。\r\n\r\n## 怎样验收\r\n\r\n另一个人能用同一数据复算；过程变化与结果变化有可解释关系。\r\n\r\n## 误区与边界\r\n\r\n同一指标可以用于PD和DM，但必须区分用途、范围、目标、周期与责任；不能为了区分机制而人为改名、另造数据。相关性不等于因果；活动完成率不等于效果。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：当前试点的真实目标、过程与证据。\r\n- 责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\r\n- 记录入口：[[TPL02_指标定义与基线]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n将“完成培训”改成一项能力指标，并写清分母。\r\n\r\n## 来源与相邻节点\r\n\r\n书第91—97、105—108页；PD课件第26—27页；区分逻辑为通用方法。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T03_保龄图与行动计划]] · [[T08_可视化与日常管理]] · [[T24_销售漏斗管理]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>结果与过程指标\u003c/h1>\n\u003cp>\u003cstrong>C06 · Outcome / Process / Leading / Lagging Measures · 共同基础\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>结果指标衡量最终交付的效果，过程指标观察效果产生机制；领先与滞后取决于相对对象和时间窗口。KPI是衡量指标，DM是运行机制，PD是突破部署机制，三者不是同一分类层次。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>只在月底看到差距，或行动完成但结果没改善。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**流程假设、可取数据、清楚的指标定义。\u003c/p>\n\u003col>\n\u003cli>先定客户结果。\u003c/li>\n\u003cli>再选有合理作用路径的过程指标。\u003c/li>\n\u003cli>统一分子分母和时间边界。\u003c/li>\n\u003cli>跟踪两者关系并修正假设。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>结果—过程—行动三层对应，含必要护栏。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>另一个人能用同一数据复算；过程变化与结果变化有可解释关系。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>同一指标可以用于PD和DM，但必须区分用途、范围、目标、周期与责任；不能为了区分机制而人为改名、另造数据。相关性不等于因果；活动完成率不等于效果。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：当前试点的真实目标、过程与证据。\u003c/li>\n\u003cli>责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL02_%E6%8C%87%E6%A0%87%E5%AE%9A%E4%B9%89%E4%B8%8E%E5%9F%BA%E7%BA%BF\" data-open=\"TPL02_指标定义与基线\">指标定义与基线\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>将“完成培训”改成一项能力指标，并写清分母。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>书第91—97、105—108页；PD课件第26—27页；区分逻辑为通用方法。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T03_%E4%BF%9D%E9%BE%84%E5%9B%BE%E4%B8%8E%E8%A1%8C%E5%8A%A8%E8%AE%A1%E5%88%92\" data-open=\"T03_保龄图与行动计划\">保龄图与行动计划\u003c/a> · \u003ca href=\"#T08_%E5%8F%AF%E8%A7%86%E5%8C%96%E4%B8%8E%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86\" data-open=\"T08_可视化与日常管理\">可视化与日常管理\u003c/a> · \u003ca href=\"#T24_%E9%94%80%E5%94%AE%E6%BC%8F%E6%96%97%E7%AE%A1%E7%90%86\" data-open=\"T24_销售漏斗管理\">销售漏斗管理\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/C06_结果与过程指标.md"},{"name":"C07_文化价值观与管理行为","title":"文化价值观与管理行为","raw":"---\r\nid: C07\r\n类型: 概念\r\n模块: 体系\r\n英文: Culture / Values / Behaviors\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 文化价值观与管理行为\r\n\r\n**C07 · Culture / Values / Behaviors · 体系**\r\n\r\n## 定义\r\n\r\n价值观提供判断准则，文化体现在反复发生的管理行为。DBS文化要通过如何面对客户、事实、问题和人员来观察。\r\n\r\n## 何时用\r\n\r\n工具和表格已存在，但人员隐瞒问题、领导替代思考或改善不持续。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**领导决策、现场互动、异常记录和资源安排。\r\n\r\n1. 说明原则。\r\n2. 把原则译成可观察行为。\r\n3. 领导亲自示范。\r\n4. 用实际事件复盘。\r\n5. 把合适行为嵌入日常管理和培养。\r\n\r\n## 必须产生的东西\r\n\r\n可以检查的行为约定及实例记录，例如真实呈现差距、允许说不知道、及时解除障碍。\r\n\r\n## 怎样验收\r\n\r\n员工能安全说明问题，负责人仍承担响应责任；管理者作决定时有证据。\r\n\r\n## 误区与边界\r\n\r\n把书中四品格六准则、旧五价值观和当前官网四行为混称同一版官方目录；以文化未建成延迟实操。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：当前试点的真实目标、过程与证据。\r\n- 责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\r\n- 记录入口：[[TPL01_改善项目章程]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n将“尊重人才”改成一个下次评审中能被观察的具体行为。\r\n\r\n## 来源与相邻节点\r\n\r\n书第85—86、161—170页；原读书资料；当前官网S02用语与历史分开。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[C01_DBS定义]] · [[M04_领导力能力]] · [[T12_现场观察]] · [[T28_领导标准工作]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>文化价值观与管理行为\u003c/h1>\n\u003cp>\u003cstrong>C07 · Culture / Values / Behaviors · 体系\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>价值观提供判断准则，文化体现在反复发生的管理行为。DBS文化要通过如何面对客户、事实、问题和人员来观察。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>工具和表格已存在，但人员隐瞒问题、领导替代思考或改善不持续。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**领导决策、现场互动、异常记录和资源安排。\u003c/p>\n\u003col>\n\u003cli>说明原则。\u003c/li>\n\u003cli>把原则译成可观察行为。\u003c/li>\n\u003cli>领导亲自示范。\u003c/li>\n\u003cli>用实际事件复盘。\u003c/l 真实业务问题、负责人、一线参与、基础数据。\r\n\r\n1. 按问题选择工具。\r\n2. 先完成一个闭环。\r\n3. 围绕真实作品带教。\r\n4. 以能独立应用验收能力。\r\n\r\n## 必须产生的东西\r\n\r\n共同的问题表达、流程表达、行动与检查方式。\r\n\r\n## 怎样验收\r\n\r\n不同职能能看懂同一个问题并共同改善接口。\r\n\r\n## 误区与边界\r\n\r\n八项工具按顺序逐一搞活动，未考虑业务需要。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：当前试点的真实目标、过程与证据。\r\n- 责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\r\n- 记录入口：[[TPL01_改善项目章程]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n从当前问题中挑出最需要的两项基础工具，说明理由。\r\n\r\n## 来源与相邻节点\r\n\r\n书第98—108页，工具名称经2018官方概览交叉核对。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T04_客户之声]] · [[T05_价值流图]] · [[T06_问题解决流程]] · [[T07_改善活动]] · [[T08_可视化与日常管理]] · [[T09_标准作业]] · [[T10_事务流程改进]] · [[T11_5S]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>共同基础\u003c/h1>\n\u003cp>\u003cstrong>M01 · DBS Fundamentals · 体系\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>跨职能通用的观察、问题解决和维持方式。书中历史架构包括VOC、VSM、PSP、改善、可视化与日常管理、标准作业、TPI、5S。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>团队缺少共同语言，工具使用零散。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**真实业务问题、负责人、一线参与、基础数据。\u003c/p>\n\u003col>\n\u003cli>按问题选择工具。\u003c/li>\n\u003cli>先完成一个闭环。\u003c/li>\n\u003cli>围绕真实作品带教。\u003c/li>\n\u003cli>以能独立应用验收能力。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>共同的问题表达、流程表达、行动与检查方式。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>不同职能能看懂同一个问题并共同改善接口。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>八项工具按顺序逐一搞活动，未考虑业务需要。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：当前试点的真实目标、过程与证据。\u003c/li>\n\u003cli>责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL01_%E6%94%B9%E5%96%84%E9%A1%B9%E7%9B%AE%E7%AB%A0%E7%A8%8B\" data-open=\"TPL01_改善项目章程\">改善项目章程\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>从当前问题中挑出最需要的两项基础工具，说明理由。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>书第98—108页，工具名称经2018官方概览交叉核对。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E% 3_%E5%8F%AF%E8%A7%86%E5%8C%96%E9%A1%B9%E7%9B%AE%E7%AE%A1%E7%90%86\" data-open=\"T23_可视化项目管理\">可视化项目管理\u003c/a> · \u003ca href=\"#T24_%E9%94%80%E5%94%AE%E6%BC%8F%E6%96%97%E7%AE%A1%E7%90%86\" data-open=\"T24_销售漏斗管理\">销售漏斗管理\u003c/a> · \u003ca href=\"#T25_%E4%BB%B7%E5%80%BC%E9%94%80%E5%94%AE\" data-open=\"T25_价值销售\">价值销售\u003c/a> · \u003ca href=\"#T26_%E5%A2%9E%E9%95%BF%E5%AE%A4\" data-open=\"T26_增长室\">增长室\u003c/a> · \u003ca href=\"#T30_%E4%B8%8A%E5%B8%82%E4%B8%8E%E4%BA%A4%E4%BB%98%E5%87%86%E5%A4%87\" data-open=\"T30_上市与交付准备\">上市与交付准备\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/M03_增长能力.md"},{"name":"M04_领导力能力","title":"领导力能力","raw":"---\r\nid: M04\r\n类型: 模块\r\n模块: 体系\r\n英文: Leadership\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 领导力能力\r\n\r\n**M04 · Leadership · 体系**\r\n\r\n## 定义\r\n\r\n建立能够选择方向、组织执行、解决问题并发展他人的人才与组织机制。\r\n\r\n## 何时用\r\n\r\n结果依赖少数能人，管理者忙于救火，改善难维持。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**业务需要、关键岗位、技能差距和人才准备情况。\r\n\r\n1. 明确关键能力。\r\n2. 配置和培养人员。\r\n3. 通过真实任务练习。\r\n4. 教练反馈。\r\n5. 验证能力并安排继任。\r\n\r\n## 必须产生的东西\r\n\r\n关键岗位覆盖、培养计划和能够独立带队的人。\r\n\r\n## 怎样验收\r\n\r\n人可以轮换，流程仍能运转；新负责人能解释并改善过程。\r\n\r\n## 误区与边界\r\n\r\n将领导力等同演讲课程或将培养责任全交给人力部门。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：当前试点的真实目标、过程与证据。\r\n- 责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\r\n- 记录入口：[[TPL01_改善项目章程]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n选一个只能由某人处理的问题，写出替代者要学会的能力。\r\n\r\n## 来源与相邻节点\r\n\r\n书第133—159页。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[M01_共同基础]] · [[T27_人才发展与继任]] · [[T28_领导标准工作]] · [[T29_DBS推进角色]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>领导力能力\u003c/h1>\n\u003cp>\u003cstrong>M04 · Leadership · 体系\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>建立能够选择方向、组织执行、解决问题并发展他人的人才与组织机制。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>结果依赖少数能人，管理者忙于救火，改善难维持。\u003c/p>\n
