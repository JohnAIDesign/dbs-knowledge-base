 '<div class="flow"><div class="level"><span class="level-label">先作选择</span><div class="node-row">'+node('D00','客户与战略选择','需求、竞争、价值与资源')+arrowH+node('H04','一个产品族试点','界定范围和负责人')+'</div></div>'+arrowV('第1—2周：先让事实可信')+
 '<div class="level"><span class="level-label">建立事实</span><div class="node-row">'+node('T05','跟订单看流程','含生产、检验放行、交付')+arrowH+node('C06','统一指标口径','QDC同表，保留原承诺')+'</div></div>'+arrowV('第3—4周：选择要改变的机制')+
 '<div class="level"><span class="level-label">验证改变</span><div class="node-row">'+node('D05','优先改善IP','贡献假设与资源')+arrowH+node('T06','取证与试验','Pareto和5Why不是因果证明')+arrowH+node('D06','TTI效果验证','活动与效果分开')+'</div></div>'+arrowV('第5—12周：试验、复验与移交')+
 '<div class="level"><span class="level-label">独立维持</span><div class="node-row">'+node('T09','标准与异常规则')+arrowH+node('T27','岗位独立演示')+arrowH+node('X03','有证据后复制')+'</div></div><div class="feedback">日常响应异常 → 每周检查试验 → 每月决定资源与方向 → 根据证据调整</div></div>'+
 '<p class="map-caption">周数是教学安排，不是必须结项的期限。实际基线、目标、资源和责任人待现场确认。六职能围绕同一试点协作。</p>'+doclink('海顺04_战略到执行总纲','阅读完整实施路线')+doclink('06_指标字典','核对指标公式与边界')+doclink('05_场景完整演练','看一个具体QDC试点怎样运行');}
function tasks(){const jobs=[['定义一个指标','准备原始记录、统计对象和业务问题','C06','TPL02_指标定义与基线','他人能够按同一口径复算'],['准备一次PD部署','准备年度差距、流程现状与资源容量','T02','TPL06_PD部署链与资源协商','说明每项IP的贡献、主责与资源'],['记录效果与行动','准备各期实际数据与行动证据','T03','TPL05_保龄图与行动计划','分清效果红灯与任务完成'],['开展一次问题解决','准备异常批次、现行标准和现场记录','T06','TPL04_问题解决记录','区分事实、假设与原因证据'],['主持一次周评审','准备效果趋势、未知点及资源障碍','D10','TPL07_周月评审与决定记录','留下决定、责任、期限和验证证据']];return head('今天要完成哪项工作？','先准备输入，再看一张关键卡，用工作表形成可验收的结果。')+'<div class="manual-list">'+jobs.map(([title,input,id,doc,check])=>'<section class="manual-row"><div><h2>'+title+'</h2><p>'+input+'</p>'+link(id,'读关键知识卡')+doclink(doc,'打开工作表')+'<p><strong>完成标准：</strong>'+check+'</p></div></section>').join('')+'</div>'+doclink('13_QDC模拟训练与填表示范','查看一套可复算的模拟填表示范');}
function setView(view){if(!['overview','pd','landing','qdc','tasks','tools','roles','manual'].includes(view))return;state.view=view;main.innerHTML=({overview,pd,landing,qdc,tasks,tools:toolsView,roles,manual}[view])();main.setAttribute('aria-labelledby','tab-'+view);document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===view)));}
function showNode(id,scroll=false){const c=cards.get(id),n=graphNodes.get(id);if(!n)return;state.selected=id;
 document.querySelectorAll('[data-node]').forEach(b=>{b.classList.toggle('selected',b.dataset.node===id);if(b.hasAttribute('aria-pressed'))b.setAttribute('aria-pressed',String(b.dataset.node===id));});
 if(!c){detail.innerHTML='<p class="meta">'+esc(n.type)+'</p><h2>'+esc(n.label)+'</h2><p>'+esc(n.definition)+'</p>'+doclink(n.file.split('/').pop().replace(/\.md$/,''),'阅读对应说明')+relationHTML(id);}
 else {const steps=c.steps.split('；');const isRoot=id==='C01';const rootSteps=['明确客户价值与目标，形成一致的管理行为','通过人才、计划、流程和绩效连接工作','依托共同基础与三类能力，运用工具改善','以结果检验，并进入下一轮持续改进'];
 detail.innerHTML=(isRoot?'':'<p class="meta">'+esc(c.id+' · '+c.module+' · '+c.en)+'</p>')+'<h2>'+esc(isRoot?'DBS是什么':c.name)+'</h2><p>'+esc(c.definition)+'</p><section><h3>'+(isRoot?'运行方式':'实际怎么做')+'</h3><ol>'+(isRoot?rootSteps:steps).map(s=>'<li>'+esc(s.replace(/。$/,''))+'</li>').join('')+'</ol></section><section><h3>验收问题</h3><p>'+esc(isRoot?'能否从目标追到流程、行动、证据与责任？':c.check)+'</p><button type="button" class="secondary read-more" data-doc="'+esc(c.id+'_'+c.name)+'">展开完整知识卡</button></section>'+(isRoot?'<section><h3>相关内容</h3>'+link('C02','人才计划流程绩效')+link('M01','共同基础')+'</section>':('<section><h3>产出与边界</h3><p>'+esc(c.output)+'</p><p>'+esc(c.pitfall)+'</p></section>'+relationHTML(id)))+'<section><h3>来源与证据</h3><p class="meta">'+esc(c.source)+'</p>'+doclink('07_来源与版本边界','核对来源与版本')+'</section>';}
 detail.scrollTop=0;if(scroll&&window.innerWidth<=850)detail.scrollIntoView({behavior:'smooth',block:'start'});
}
function relationHTML(id){
const out=DATA.graph.edges.filter(e=>e.source===id&&e.relation!=='概念依据参照'),ins=DATA.graph.edges.filter(e=>e.target===id&&e.relation!=='概念依据参照');
function group(es,incoming){const rows=es.map(e=>'<div class="related-row">'+(incoming?'<button type="button" data-node="'+e.source+'">'+esc(graphNodes.get(e.source).label)+'</button><span>'+esc(e.relation)+' → 本节点</span>':'<span>'+esc(e.relation)+'</span><button type="button" data-node="'+e.target+'">'+esc(graphNodes.get(e.target).label)+'</button>')+'</div>');return rows.slice(0,5).join('')+(rows.length>5?'<details><summary>展开其余 '+(rows.length-5)+' 条'+(incoming?'入向':'出向')+'关系</summary>'+rows.slice(5).join('')+'</details>':'');}
return '<section><h3>与其他节点怎样连接</h3><p class="meta">入向 '+ins.length+' 条 · 出向 '+out.length+' 条</p><h4>本节点指向哪里</h4>'+group(out,false)+'<h4>哪些节点指向本节点</h4>'+group(ins,true)+'</section>';}

function openDoc(name,push=true){name=name.replace(/\.md$/,'');const d=docMap.get(name);if(!d){toast('未找到对应文档');return;}if(reader.open&&state.doc&&push)state.history.push(state.doc);if(!reader.open)state.history=[];state.doc=name;document.getElementById('reader-title').textContent=d.title;readerBody.innerHTML=d.html;document.getElementById('reader-back').hidden=!state.history.length;if(!reader.open)reader.showModal();reader.scrollTop=0;}
function toast(t){const el=document.getElementById('toast');el.textContent=t;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.textContent='',2400);}
function search(q){
const box=document.getElementById('search-results');q=q.trim().toLowerCase();if(!q){box.innerHTML='';return;}const tokens=q.split(/\s+/);
const entries=DATA.docs.map(d=>{const c=cards.get(d.name.split('_')[0]);const isCard=c&&c.id+'_'+c.name===d.name;return {id:isCard?c.id:d.name,type:isCard?'node':'doc',title:d.title,raw:d.raw,name:d.name,score:(d.title.toLowerCase().includes(q)?30:0)+(d.name.toLowerCase().startsWith(q)?40:0)};}).filter(x=>tokens.every(t=>(x.name+' '+x.title+' '+x.raw).toLowerCase().includes(t))).sort((a,b)=>b.score-a.score);
const shown=entries.slice(0,30);box.innerHTML='<div class="search-message">找到 '+entries.length+' 项'+(entries.length>30?'，显示前30项，请增加关键词':'')+'</div>'+shown.map(x=>{const lines=x.raw.split('\n').filter(l=>l.trim()&&!l.startsWith('---'));const line=lines.find(l=>tokens.every(t=>l.toLowerCase().includes(t)))||lines.find(l=>l.toLowerCase().includes(tokens[0]))||x.title;const at=line.toLowerCase().indexOf(tokens[0]);const start=Math.max(0,at-28);const snippet=(start?'…':'')+line.slice(start,start+140);return '<button type="button" data-'+x.type+'="'+esc(x.id)+'"><span>'+esc(x.title)+'</span><small>'+esc(snippet)+'</small></button>';}).join('')+(!shown.length?'<div class="search-message">没有找到。可尝试“交付”“规格限”“5Why”。</div>':'');}
document.addEventListener('click',e=>{const view=e.target.closest('[data-view]');if(view){setView(view.dataset.view);return;}const n=e.target.closest('[data-node]');if(n){showNode(n.dataset.node,true);document.getElementById('search-results').innerHTML='';return;}const d=e.target.closest('[data-doc]');if(d){openDoc(d.dataset.doc);document.getElementById('search-results').innerHTML='';return;}const a=e.target.closest('a[data-open]');if(a){e.preventDefault();openDoc(a.dataset.open);return;}if(!e.target.closest('.searchbox'))document.getElementById('search-results').innerHTML='';});
document.getElementById('search').addEventListener('input',e=>search(e.target.value));document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('search-results').innerHTML='';e.target.blur();}if(e.key==='Enter'){const b=document.querySelector('#search-results button');if(b)b.click();}});
document.querySelector('.tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const bs=[...document.querySelectorAll('.tabs button')],i=bs.indexOf(document.activeElement);if(i<0)return;e.preventDefault();const j=e.key==='Home'?0:e.key==='End'?bs.length-1:(i+(e.key==='ArrowRight'?1:-1)+bs.length)%bs.length;bs[j].focus();bs[j].click();});
document.getElementById('close-reader').addEventListener('click',()=>reader.close());reader.addEventListener('click',e=>{if(e.target===reader){const r=reader.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)reader.close();}});
document.getElementById('reader-back').addEventListener('click',()=>{const prev=state.history.pop();if(prev)openDoc(prev,false);});
document.getElementById('download-doc').addEventListener('click',()=>{const d=docMap.get(state.doc);if(!d)return;const url=URL.createObjectURL(new Blob([d.raw],{type:'text/markdown;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=d.name+'.md';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('已请求下载；如预览器未保存，请在系统浏览器打开HTML。原模板也保存在本地模板文件夹。');});
document.getElementById('print-doc').addEventListener('click',()=>window.print());
let restoring=false;
const rawSetView=setView,rawShowNode=showNode,rawOpenDoc=openDoc;
function saveRoute(replace=false){if(restoring)return;const p=new URLSearchParams({view:state.view,node:state.selected});if(reader.open&&state.doc)p.set('doc',state.doc);const hash='#'+p.toString();if(location.hash!==hash)history[replace?'replaceState':'pushState'](null,'',hash);}
setView=function(view){rawSetView(view);saveRoute();};
showNode=function(id,scroll=false){rawShowNode(id,scroll);saveRoute();};
openDoc=function(name,push=true){rawOpenDoc(name,push);saveRoute();};
function restoreRoute(){restoring=true;const p=new URLSearchParams(location.hash.slice(1));let v=p.get('view')||'overview',n=p.get('node')||'C01',d=p.get('doc');let invalid=false;if(!['overview','pd','landing','qdc','tasks','tools','roles','manual'].includes(v)){v='overview';invalid=true;}if(!graphNodes.has(n)){n='C01';invalid=true;}if(d&&!docMap.has(d)){d=null;invalid=true;}state.doc=null;state.history=[];if(reader.open&&!d)reader.close();rawSetView(v);rawShowNode(n);if(d)rawOpenDoc(d,false);restoring=false;saveRoute(true);if(invalid)toast('链接中的内容不存在，已返回有效阅读位置。');}
reader.addEventListener('close',()=>{if(!reader.open&&state.doc){state.doc=null;saveRoute();}});
window.addEventListener('popstate',restoreRoute);window.addEventListener('hashchange',restoreRoute);
restoreRoute();
</script>
