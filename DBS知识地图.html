交付约束。\r\n\r\n1. 展示同一增长链。\r\n2. 定位短板。\r\n3. 确认原因与负责人。\r\n4. 决定跨部门行动。\r\n5. 检查转化和客户结果。\r\n\r\n## 必须产生的东西\r\n\r\n共享的增长问题清单、行动和决策。\r\n\r\n## 怎样验收\r\n\r\n每次讨论有需要解决的流程问题和明确产出，不是销售逐人报数。\r\n\r\n## 误区与边界\r\n\r\n租会议室装大屏等同增长室；追成交却忽视交付能力。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：增长假设、漏斗和跨职能阻碍。\r\n- 责任与部署：业务负责人用固定节奏决定试验与资源。\r\n- 记录入口：[[TPL07_周月评审与决定记录]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n列出一个增长障碍，说明必须同时参与的两个职能。\r\n\r\n## 来源与相邻节点\r\n\r\n书增长工具章节为基础；Growth Room名称由2018官方概览确认，步骤为教学设计。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T24_销售漏斗管理]] · [[T25_价值销售]] · [[T08_可视化与日常管理]] · [[T17_产销库存协同]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>增长室\u003c/h1>\n\u003cp>\u003cstrong>T26 · Growth Room · 增长\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>围绕增长流程与差距进行可视化、跨职能协同和问题解决的管理场所与节奏。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>市场、销售、交付各有数据却不共同解决转化问题。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**客户分群、漏斗、营销线索、产能及交付约束。\u003c/p>\n\u003col>\n\u003cli>展示同一增长链。\u003c/li>\n\u003cli>定位短板。\u003c/li>\n\u003cli>确认原因与负责人。\u003c/li>\n\u003cli>决定跨部门行动。\u003c/li>\n\u003cli>检查转化和客户结果。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>共享的增长问题清单、行动和决策。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>每次讨论有需要解决的流程问题和明确产出，不是销售逐人报数。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>租会议室装大屏等同增长室；追成交却忽视交付能力。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：增长假设、漏斗和跨职能阻碍。\u003c/li>\n\u003cli>责任与部署：业务负责人用固定节奏决定试验与资源。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL07_%E5%91%A8%E6%9C%88%E8%AF%84%E5%AE%A1%E4%B8%8E%E5%86%B3%E5%AE%9A%E8%AE%B0%E5%BD%95\" data-open=\"TPL07_周月评审与决定记录\">周月评审与决定记录\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>列出一个增长障碍，说明必须同时参与的两个职能。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>书增长工具章节为基础；Growth Room名称由2018官方概览确认，步骤为教学设计。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T24_%E9%94%80%E5%94%AE%E6%BC%8F%E6%96%97%E7%AE%A1%E7%90%86\" data-open=\"T24_销售漏斗管理\">销售漏斗管理\u003c/a> · \u003ca href=\"#T25_%E4%BB%B7%E5%80%BC%E9%94%80%E5%94%AE\" data-open=\"T25_价值销售\">价值销售\u003c/a> · \u003ca href=\"#T08_%E5%8F%AF%E8%A7%86%E5%8C%96%E4%B8%8E%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86\" data-open=\"T08_可视化与日常管理\">可视化与日常管理\u003c/a> · \u003ca href=\"#T17_%E4%BA%A7%E9%94%80%E5%BA%93%E5%AD%98%E5%8D%8F%E5%90%8C\" data-open=\"T17_产销库存协同\">产销库存协同\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T26_增长室.md"},{"name":"T27_人才发展与继任","title":"人才发展与继任","raw":"---\r\nid: T27\r\n类型: 机制\r\n模块: 领导力\r\n英文: Talent Development / Succession\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 人才发展与继任\r\n\r\n**T27 · Talent Development / Succession · 领导力**\r\n\r\n## 定义\r\n\r\n从业务所需能力出发，通过选人、实践、反馈、授权和继任安排建立持续的人才供给。\r\n\r\n## 何时用\r\n\r\n关键岗位无人替代、培训多但不能独立工作。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**关键任务、岗位能力、人员现状和发展机会。\r\n\r\n1. 定义能力。\r\n2. 用实际任务评估。\r\n3. 设计历练。\r\n4. 教练反馈。\r\n5. 现场验证独立能力。\r\n6. 确定授权及后备安排。\r\n\r\n## 必须产生的东西\r\n\r\n技能矩阵、个人发展任务与继任准备证据。\r\n\r\n## 怎样验收\r\n\r\n真实工作可独立完成；准备程度有证据而非只凭潜力评级。\r\n\r\n## 误区与边界\r\n\r\n只统计课时与内部晋升率，忽视上岗适配和团队实际能力。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：关键岗位要求及真实能力证据。\r\n- 责任与部署：直属主管带教并检验独立操作。\r\n- 记录入口：[[TPL10_能力与带教记录]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n给一名骨干设计一项真实任务，写明教练和验收。\r\n\r\n## 来源与相邻节点\r\n\r\n书第133—153页；步骤为教学设计。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[M04_领导力能力]] · [[T09_标准作业]] · [[T28_领导标准工作]] · [[T29_DBS推进角色]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>人才发展与继任\u003c/h1>\n\u003cp>\u003cstrong>T27 · Talent Development / Succession · 领导力\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>从业务所需能力出发，通过选人、实践、反馈、授权和继任安排建立持续的人才供给。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>关键岗位无人替代、培训多但不能独立工作。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**关键任务、岗位能力、人员现状和发展机会。\u003c/p>\n\u003col>\n\u003cli>定义能力。\u003c/li>\n\u003cli>用实际任务评估。\u003c/li>\n\u003cli>设计历练。\u003c/li>\n\u003cli>教练反馈。\u003c/li>\n\u003cli>现场验证独立能力。\u003c/li>\n\u003cli>确定授权及后备安排。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>技能矩阵、个人发展任务与继任准备证据。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>真实工作可独立完成；准备程度有证据而非只凭潜力评级。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>只统计课时与内部晋升率，忽视上岗适配和团队实际能力。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：关键岗位要求及真实能力证据。\u003c/li>\n\u003cli>责任与部署：直属主管带教并检验独立操作。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL10_%E8%83%BD%E5%8A%9B%E4%B8%8E%E5%B8%A6%E6%95%99%E8%AE%B0%E5%BD%95\" data-open=\"TPL10_能力与带教记录\">能力与带教记录\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>给一名骨干设计一项真实任务，写明教练和验收。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>书第133—153页；步骤为教学设计。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#M04_%E9%A2%86%E5%AF%BC%E5%8A%9B%E8%83%BD%E5%8A%9B\" data-open=\"M04_领导力能力\">领导力能力\u003c/a> · \u003ca href=\"#T09_%E6%A0%87%E5%87%86%E4%BD%9C%E4%B8%9A\" data-open=\"T09_标准作业\">标准作业\u003c/a> · \u003ca href=\"#T28_%E9%A2%86%E5%AF%BC%E6%A0%87%E5%87%86%E5%B7%A5%E4%BD%9C\" data-open=\"T28_领导标准工作\">领导标准工作\u003c/a> · \u003ca href=\"#T29_DBS%E6%8E%A8%E8%BF%9B%E8%A7%92%E8%89%B2\" data-open=\"T29_DBS推进角色\">DBS推进角色\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T27_人才发展与继任.md"},{"name":"T28_领导标准工作","title":"领导标准工作","raw":"---\r\nid: T28\r\n类型: 机制\r\n模块: 领导力\r\n英文: Leader Standard Work\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 领导标准工作\r\n\r\n**T28 · Leader Standard Work · 领导力**\r\n\r\n## 定义\r\n\r\n把领导应持续做的现场观察、过程检查、教练和障碍解除固定下来，使管理机制不依赖个人临时兴趣。\r\n\r\n## 何时用\r\n\r\n管理者只在月底追结果，现场问题长期无人响应。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**关键流程、管理节奏、授权与升级规则。\r\n\r\n1. 明确日周月要看什么。\r\n2. 约定检查问题。\r\n3. 记录偏差和承诺。\r\n4. 提供教练与决定。\r\n5. 验证自己的行动是否帮助团队。\r\n\r\n## 必须产生的东西\r\n\r\n简明管理检查表、教练记录及决策闭环。\r\n\r\n## 怎样验收\r\n\r\n管理者按承诺到现场核对事实、帮助解除障碍并带教；成熟度提高不意味着领导可以退出现场。\r\n\r\n## 误区与边界\r\n\r\n变成领导巡逻或代替员工解答所有问题。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：领导现场工作与履责计划。\r\n- 责任与部署：总经理和各级主管示范询证、带教与解除障碍。\r\n- 记录入口：[[TPL10_能力与带教记录]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n从自己的日历中固定一个现场时段，并写三个证据问题。\r\n\r\n## 来源与相邻节点\r\n\r\n通用精益领导方法，用于落实书中第133—159页领导力；不宣称为官方独立基础工具。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T08_可视化与日常管理]] · [[T12_现场观察]] · [[T27_人才发展与继任]] · [[T29_DBS推进角色]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>领导标准工作\u003c/h1>\n\u003cp>\u003cstrong>T28 · Leader Standard Work · 领导力\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>把领导应持续做的现场观察、过程检查、教练和障碍解除固定下来，使管理机制不依赖个人临时兴趣。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>管理者只在月底追结果，现场问题长期无人响应。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**关键流程、管理节奏、授权与升级规则。\u003c/p>\n\u003col>\n\u003cli>明确日周月要看什么。\u003c/li>\n\u003cli>约定检查问题。\u003c/li>\n\u003cli>记录偏差和承诺。\u003c/li>\n\u003cli>提供教练与决定。\u003c/li>\n\u003cli>验证自己的行动是否帮助团队。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>简明管理检查表、教练记录及决策闭环。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>管理者按承诺到现场核对事实、帮助解除障碍并带教；成熟度提高不意味着领导可以退出现场。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>变成领导巡逻或代替员工解答所有问题。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：领导现场工作与履责计划。\u003c/li>\n\u003cli>责任与部署：总经理和各级主管示范询证、带教与解除障碍。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL10_%E8%83%BD%E5%8A%9B%E4%B8%8E%E5%B8%A6%E6%95%99%E8%AE%B0%E5%BD%95\" data-open=\"TPL10_能力与带教记录\">能力与带教记录\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>从自己的日历中固定一个现场时段，并写三个证据问题。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>通用精益领导方法，用于落实书中第133—159页领导力；不宣称为官方独立基础工具。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T08_%E5%8F%AF%E8%A7%86%E5%8C%96%E4%B8%8E%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86\" data-open=\"T08_可视化与日常管理\">可视化与日常管理\u003c/a> · \u003ca href=\"#T12_%E7%8E%B0%E5%9C%BA%E8%A7%82%E5%AF%9F\" data-open=\"T12_现场观察\">现场观察\u003c/a> · \u003ca href=\"#T27_%E4%BA%BA%E6%89%8D%E5%8F%91%E5%B1%95%E4%B8%8E%E7%BB%A7%E4%BB%BB\" data-open=\"T27_人才发展与继任\">人才发展与继任\u003c/a> · \u003ca href=\"#T29_DBS%E6%8E%A8%E8%BF%9B%E8%A7%92%E8%89%B2\" data-open=\"T29_DBS推进角色\">DBS推进角色\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T28_领导标准工作.md"},{"name":"T29_DBS推进角色","title":"DBS推进角色","raw":"---\r\nid: T29\r\n类型: 机制\r\n模块: 领导力\r\n英文: DBS Office / DBS Leader / Improvement Coach\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# DBS推进角色\r\n\r\n**T29 · DBS Office / DBS Leader / Improvement Coach · 领导力**\r\n\r\n## 定义\r\n\r\n辅导组织正确使用和发展改善方法、培养领导与团队能力的支持角色；业务责任仍由业务管理者承担。\r\n\r\n## 何时用\r\n\r\n团队不会选工具、顾问代做多、方法无法复制。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**业务优先问题、可用教练能力和管理者承诺。\r\n\r\n1. 围绕业务项目安排带教。\r\n2. 先示范再放手。\r\n3. 检查方法与证据。\r\n4. 培养内部教练。\r\n5. 根据实践更新方法。\r\n\r\n## 必须产生的东西\r\n\r\n能独立运行的负责人和内部教练，而不只是填好的表。\r\n\r\n## 怎样验收\r\n\r\n教练退出后团队能继续；业务经理自己主持评审并承担决定。\r\n\r\n## 误区与边界\r\n\r\n把DBS办公室设成催报表部门，或让其背所有业务结果。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：试点带教需求与教练可用容量。\r\n- 责任与部署：DBS推进角色教方法，业务主责管结果。\r\n- 记录入口：[[TPL10_能力与带教记录]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n写清试点中业务负责人、流程负责人和教练三者分别交付什么。\r\n\r\n## 来源与相邻节点\r\n\r\n书第89、133—159页；2025官方访谈S04确认DBSO教练与工具发展职能。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T01_方针部署]] · [[T27_人才发展与继任]] · [[T28_领导标准工作]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>DBS推进角色\u003c/h1>\n\u003cp>\u003cstrong>T29 · DBS Office / DBS Leader / Improvement Coach · 领导力\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>辅导组织正确使用和发展改善方法、培养领导与团队能力的支持角色；业务责任仍由业务管理者承担。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>团队不会选工具、顾问代做多、方法无法复制。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**业务优先问题、可用教练能力和管理者承诺。\u003c/p>\n\u003col>\n\u003cli>围绕业务项目安排带教。\u003c/li>\n\u003cli>先示范再放手。\u003c/li>\n\u003cli>检查方法与证据。\u003c/li>\n\u003cli>培养内部教练。\u003c/li>\n\u003cli>根据实践更新方法。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>能独立运行的负责人和内部教练，而不只是填好的表。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>教练退出后团队能继续；业务经理自己主持评审并承担决定。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>把DBS办公室设成催报表部门，或让其背所有业务结果。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：试点带教需求与教练可用容量。\u003c/li>\n\u003cli>责任与部署：DBS推进角色教方法，业务主责管结果。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL10_%E8%83%BD%E5%8A%9B%E4%B8%8E%E5%B8%A6%E6%95%99%E8%AE%B0%E5%BD%95\" data-open=\"TPL10_能力与带教记录\">能力与带教记录\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>写清试点中业务负责人、流程负责人和教练三者分别交付什么。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>书第89、133—159页；2025官方访谈S04确认DBSO教练与工具发展职能。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T01_%E6%96%B9%E9%92%88%E9%83%A8%E7%BD%B2\" data-open=\"T01_方针部署\">方针部署\u003c/a> · \u003ca href=\"#T27_%E4%BA%BA%E6%89%8D%E5%8F%91%E5%B1%95%E4%B8%8E%E7%BB%A7%E4%BB%BB\" data-open=\"T27_人才发展与继任\">人才发展与继任\u003c/a> · \u003ca href=\"#T28_%E9%A2%86%E5%AF%BC%E6%A0%87%E5%87%86%E5%B7%A5%E4%BD%9C\" data-open=\"T28_领导标准工作\">领导标准工作\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T29_DBS推进角色.md"},{"name":"T30_上市与交付准备","title":"上市与交付准备","raw":"---\r\nid: T30\r\n类型: 机制\r\n模块: 增长\r\n英文: Launch Excellence\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 上市与交付准备\r\n\r\n**T30 · Launch Excellence · 增长**\r\n\r\n## 定义\r\n\r\n将产品就绪、供应交付、服务能力和需求生成协同起来，使新品能够被客户采用并兑现价值。\r\n\r\n## 何时用\r\n\r\n研发完成但上市无订单、供不上或服务接不住。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**目标客户、产品要求、验证状态、供应服务能力和商业计划。\r\n\r\n1. 明确上市接受条件。\r\n2. 检查跨职能准备。\r\n3. 试点客户使用。\r\n4. 处理缺口。\r\n5. 决定发布。\r\n6. 跟踪采用与反馈。\r\n\r\n## 必须产生的东西\r\n\r\n上市准备清单、缺口与决策、客户采用跟踪。\r\n\r\n## 怎样验收\r\n\r\n看客户采用与兑现承诺；发布会举办不能替代上市有效。\r\n\r\n## 误区与边界\r\n\r\n所有准备都放到研发结束后；把发货量等同长期客户价值。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：产品功能、过程质量、供货与服务准备。\r\n- 责任与部署：跨职能负责人按风险证据决定是否放行。\r\n- 记录入口：[[TPL09_标准化与移交验收]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n列出新品发布前最关键的一个非研发依赖。\r\n\r\n## 来源与相邻节点\r\n\r\n书第120—123页；操作步骤为教学展开。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T21_产品规划与资源配置]] · [[T23_可视化项目管理]] · [[T24_销售漏斗管理]] · [[T17_产销库存协同]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>上市与交付准备\u003c/h1>\n\u003cp>\u003cstrong>T30 · Launch Excellence · 增长\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>将产品就绪、供应交付、服务能力和需求生成协同起来，使新品能够被客户采用并兑现价值。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>研发完成但上市无订单、供不上或服务接不住。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**目标客户、产品要求、验证状态、供应服务能力和商业计划。\u003c/p>\n\u003col>\n\u003cli>明确上市接受条件。\u003c/li>\n\u003cli>检查跨职能准备。\u003c/li>\n\u003cli>试点客户使用。\u003c/li>\n\u003cli>处理缺口。\u003c/li>\n\u003cli>决定发布。\u003c/li>\n\u003cli>跟踪采用与反馈。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>上市准备清单、缺口与决策、客户采用跟踪。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\ 实证据。\r\n3. 跨管理者校准。\r\n4. 讨论不确定性。\r\n5. 给出发展任务。\r\n6. 后续复核。\r\n\r\n## 必须产生的东西\r\n\r\n有依据的发展与继任决定，而不是给人贴固定标签。\r\n\r\n## 怎样验收\r\n\r\n评价可以追溯，后续任务与反馈具体，单个格子不自动决定去留。\r\n\r\n## 误区与边界\r\n\r\n没有证据就评潜力；把所有专业人才按管理晋升潜力评价；在海顺基础实操尚弱时优先搞大规模九格。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：绩效与潜力的独立证据、评价标准。\r\n- 责任与部署：管理团队校准判断并安排发展行动。\r\n- 记录入口：[[TPL10_能力与带教记录]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n将对某位同事的一句印象改成具体观察与待验证能力。\r\n\r\n## 来源与相邻节点\r\n\r\n用户原读书资料包含；此处作为通用人才工具补充，未确认为DBS统一内部标准。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T27_人才发展与继任]] · [[M04_领导力能力]] · [[C07_文化价值观与管理行为]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>九宫格人才盘点\u003c/h1>\n\u003cp>\u003cstrong>T31 · Nine-Box Talent Review · 领导力\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>常见的人才讨论工具，以绩效及潜力等约定维度辅助校准发展需求。轴、格名及评价依据需要明确；本库不将示例视为DBS现行专属规程。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>已有可靠绩效与行为证据，需要讨论关键岗位发展和继任。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**岗位要求、观察证据、绩效记录、发展意愿和评价准则。\u003c/p>\n\u003col>\n\u003cli>定义维度。\u003c/li>\n\u003cli>提交事实证据。\u003c/li>\n\u003cli>跨管理者校准。\u003c/li>\n\u003cli>讨论不确定性。\u003c/li>\n\u003cli>给出发展任务。\u003c/li>\n\u003cli>后续复核。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>有依据的发展与继任决定，而不是给人贴固定标签。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>评价可以追溯，后续任务与反馈具体，单个格子不自动决定去留。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>没有证据就评潜力；把所有专业人才按管理晋升潜力评价；在海顺基础实操尚弱时优先搞大规模九格。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：绩效与潜力的独立证据、评价标准。\u003c/li>\n\u003cli>责任与部署：管理团队校准判断并安排发展行动。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL10_%E8%83%BD%E5%8A%9B%E4%B8%8E%E5%B8%A6%E6%95%99%E8%AE%B0%E5%BD%95\" data-open=\"TPL10_能力与带教记录\">能力与带教记录\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>将对某位同事的一句印象改成具体观察与待验证能力。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>用户原读书资料包含；此处作为通用人才工具补充，未确认为DBS统一内部标准。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T27_%E4%BA%BA%E6%89%8D%E5%8F%91%E5%B1%95%E4%B8%8E%E7%BB%A7%E4%BB%BB\" data-open=\"T27_人才发展与继任\">人才发展与继任\u003c/a> · \u003ca href=\"#M04_%E9%A2%86%E5%AF%BC%E5%8A%9B%E8%83%BD%E5%8A%9B\" data-open=\"M04_领导力能力\">领导力能力\u003c/a> · \u003ca href=\"#C07_%E6%96%87%E5%8C%96%E4%BB%B7%E5%80%BC%E8%A7%82%E4%B8%8E%E7%AE%A1%E7%90%86%E8%A1%8C%E4%B8%BA\" data-open=\"C07_文化价值观与管理行为\">文化价值观与管理行为\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"知识卡/T31_九宫格人才盘点.md"},{"name":"D00_战略落地总纲","title":"战略落地总纲","raw":"---\r\nid: D00\r\n类型: 机制\r\n模块: 战略落地\r\n英文: Deployment operating system\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 战略落地总纲\r\n\r\n**D00 · Deployment operating system · 战略落地**\r\n\r\n## 定义\r\n\r\n把战略选择、突破目标、年度进展、流程优先改善、效果指标、资源和学习评审连接成运行闭环。\r\n\r\n## 何时用\r\n\r\n战略已提出，但无法解释谁改变哪个流程以及如何验证。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**客户、竞争、经营与流程事实；资源限制；当前能力。\r\n\r\n1. 做战略取舍。\r\n2. 选择少数突破。\r\n3. 确定年度进展。\r\n4. 提出IP及贡献假设。\r\n5. 协商资源与TTI。\r\n6. 把已知任务或调查任务落到行动。\r\n7. 月度学习纠偏。\r\n8. 年度复盘并连接DM。\r\n\r\n## 必须产生的东西\r\n\r\n一条可追溯部署链与一份决定记录。\r\n\r\n## 怎样验收\r\n\r\n抽一个目标，能追到流程改变、测量口径、主责、资源、证据与维持机制。\r\n\r\n## 误区与边界\r\n\r\nQDC是本轮经营方向，不是完整战略；矩阵不能替代战略分析。行动可来自任一矩阵层级。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：当前试点的真实目标、过程与证据。\r\n- 责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\r\n- 记录入口：[[TPL06_PD部署链与资源协商]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n把一项口号补齐“服务谁、取舍什么、改变什么、怎样证明”。\r\n\r\n## 来源与相邻节点\r\n\r\nS06用户提供PD培训课件第4—10、31—48、51—58页。课件未证实为丹纳赫官方授权材料；操作字段为教学设计。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T01_方针部署]] · [[T02_目标协商与部署矩阵]] · [[T03_保龄图与行动计划]] · [[T06_问题解决流程]] · [[T08_可视化与日常管理]] · [[D01_战略部署定义与价值]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>战略落地总纲\u003c/h1>\n\u003cp>\u003cstrong>D00 · Deployment operating system · 战略落地\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>把战略选择、突破目标、年度进展、流程优先改善、效果指标、资源和学习评审连接成运行闭环。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>战略已提出，但无法解释谁改变哪个流程以及如何验证。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**客户、竞争、经营与流程事实；资源限制；当前能力。\u003c/p>\n\u003col>\n\u003cli>做战略取舍。\u003c/li>\n\u003cli>选择少数突破。\u003c/li>\n\u003cli>确定年度进展。\u003c/li>\n\u003cli>提出IP及贡献假设。\u003c/li>\n\u003cli>协商资源与TTI。\u003c/li>\n\u003cli>把已知任务或调查任务落到行动。\u003c/li>\n\u003cli>月度学习纠偏。\u003c/li>\n\u003cli>年度复盘并连接DM。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>一条可追溯部署链与一份决定记录。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>抽一个目标，能追到流程改变、测量口径、主责、资源、证据与维持机制。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>QDC是本轮经营方向，不是完整战略；矩阵不能替代战略分析。行动可来自任一矩阵层级。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：当前试点的真实目标、过程与证据。\u003c/li>\n\u003cli>责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL06_PD%E9%83%A8%E7%BD%B2%E9%93%BE%E4%B8%8E%E8%B5%84%E6%BA%90%E5%8D%8F%E5%95%86\" data-open=\"TPL06_PD部署链与资源协商\">PD部署链与资源协商\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>把一项口号补齐“服务谁、取舍什么、改变什么、怎样证明”。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>S06用户提供PD培训课件第4—10、31—48、51—58页。课件未证实为丹纳赫官方授权材料；操作字段为教学设计。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T01_%E6%96%B9%E9%92%88%E9%83%A8%E7%BD%B2\" data-open=\"T01_方针部署\">方针部署\u003c/a> · \u003ca href=\"#T02_%E7%9B%AE%E6%A0%87%E5%8D%8F%E5%95%86%E4%B8%8E%E9%83%A8%E7%BD%B2%E7%9F%A9%E9%98%B5\" data-open=\"T02_目标协商与部署矩阵\">目标协商与部署矩阵\u003c/a> · \u003ca href=\"#T03_%E4%BF%9D%E9%BE%84%E5%9B%BE%E4%B8%8E%E8%A1%8C%E5%8A%A8%E8%AE%A1%E5%88%92\" data-open=\"T03_保龄图与行动计划\">保龄图与行动计划\u003c/a> · \u003ca href=\"#T06_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E6%B5%81%E7%A8%8B\" data-open=\"T06_问题解决流程\">问题解决流程\u003c/a> · \u003ca href=\"#T08_%E5%8F%AF%E8%A7%86%E5%8C%96%E4%B8%8E%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86\" data-open=\"T08_可视化与日常管理\">可视化与日常管理\u003c/a> · \u003ca href=\"#D01_%E6%88%98%E7%95%A5%E9%83%A8%E7%BD%B2%E5%AE%9A%E4%B9%89%E4%B8%8E%E4%BB%B7%E5%80%BC\" data-open=\"D01_战略部署定义与价值\">战略部署定义与价值\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"战略落地PD/D00_战略落地总纲.md"},{"name":"D01_战略部署定义与价值","title":"战略部署定义与价值","raw":"---\r\nid: D01\r\n类型: 机制\r\n模块: 战略落地\r\n英文: Policy Deployment\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 战略部署定义与价值\r\n\r\n**D01 · Policy Deployment · 战略落地**\r\n\r\n## 定义\r\n\r\n将关键战略选择转化为少数突破、资源承诺与持续学习的管理过程。价值在于集中力量、跨职能对齐和根据事实纠偏。\r\n\r\n## 何时用\r\n\r\n重大目标靠常规工作无法可靠实现时。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**战略选择、现实差距、客户需要、资源约束。\r\n\r\n1. 说明为何要突破。\r\n2. 识别当前机制缺口。\r\n3. 选少数优先事项。\r\n4. 明确责任与协商资源。\r\n5. 按效果评审。\r\n\r\n## 必须产生的东西\r\n\r\n战略选择说明、部署范围与取消或延后事项。\r\n\r\n## 怎样验收\r\n\r\n团队能解释为什么选择这项突破、放弃了什么以及依据是什么。\r\n\r\n## 误区与边界\r\n\r\n不将培训课件中的73%等未追溯到原研究的数字作为DBS有效性的证据。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：当前试点的真实目标、过程与证据。\r\n- 责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\r\n- 记录入口：[[TPL06_PD部署链与资源协商]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n为一项候选突破写出业务理由与不做的代价。\r\n\r\n## 来源与相邻节点\r\n\r\nS06用户提供PD培训课件第4—10页；73%仅为课件转述，原始研究未核实。课件未证实为丹纳赫官方授权材料；操作字段为教学设计。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T01_方针部署]] · [[T02_目标协商与部署矩阵]] · [[T03_保龄图与行动计划]] · [[T06_问题解决流程]] · [[T08_可视化与日常管理]] · [[D00_战略落地总纲]] · [[D02_PD七阶段流程与时间表]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>战略部署定义与价值\u003c/h1>\n\u003cp>\u003cstrong>D01 · Policy Deployment · 战略落地\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>将关键战略选择转化为少数突破、资源承诺与持续学习的管理过程。价值在于集中力量、跨职能对齐和根据事实纠偏。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>重大目标靠常规工作无法可靠实现时。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**战略选择、现实差距、客户需要、资源约束。\u003c/p>\n\u003col>\n\u003cli>说明为何要突破。\u003c/li>\n\u003cli>识别当前机制缺口。\u003c/li>\n\u003cli>选少数优先事项。\u003c/li>\n\u003cli>明确责任与协商资源。\u003c/li>\n\u003cli>按效果评审。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>战略选择说明、部署范围与取消或延后事项。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>团队能解释为什么选择这项突破、放弃了什么以及依据是什么。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>不将培训课件中的73%等未追溯到原研究的数字作为DBS有效性的证据。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：当前试点的真实目标、过程与证据。\u003c/li>\n\u003cli>责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL06_PD%E9%83%A8%E7%BD%B2%E9%93%BE%E4%B8%8E%E8%B5%84%E6%BA%90%E5%8D%8F%E5%95%86\" data-open=\"TPL06_PD部署链与资源协商\">PD部署链与资源协商\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>为一项候选突破写出业务理由与不做的代价。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>S06用户提供PD培训课件第4—10页；73%仅为课件转述，原始研究未核实。课件未证实为丹纳赫官方授权材料；操作字段为教学设计。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T01_%E6%96%B9%E9%92%88%E9%83%A8%E7%BD%B2\" data-open=\"T01_方针部署\">方针部署\u003c/a> · \u003ca href=\"#T02_%E7%9B%AE%E6%A0%87%E5%8D%8F%E5%95%86%E4%B8%8E%E9%83%A8%E7%BD%B2%E7%9F%A9%E9%98%B5\" data-open=\"T02_目标协商与部署矩阵\">目标协商与部署矩阵\u003c/a> · \u003ca href=\"#T03_%E4%BF%9D%E9%BE%84%E5%9B%BE%E4%B8%8E%E8%A1%8C%E5%8A%A8%E8%AE%A1%E5%88%92\" data-open=\"T03_保龄图与行动计划\">保龄图与行动计划\u003c/a> · \u003ca href=\"#T06_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E6%B5%81%E7%A8%8B\" data-open=\"T06_问题解决流程\">问题解决流程\u003c/a> · \u003ca href=\"#T08_%E5%8F%AF%E8%A7%86%E5%8C%96%E4%B8%8E%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86\" data-open=\"T08_可视化与日常管理\">可视化与日常管理\u003c/a> · \u003ca href=\"#D00_%E6%88%98%E7%95%A5%E8%90%BD%E5%9C%B0%E6%80%BB%E7%BA%B2\" data-open=\"D00_战略落地总纲\">战略落地总纲\u003c/a> · \u003ca href=\"#D02_PD%E4%B8%83%E9%98%B6%E6%AE%B5%E6%B5%81%E7%A8%8B%E4%B8%8E%E6%97%B6%E9%97%B4%E8%A1%A8\" data-open=\"D02_PD七阶段流程与时间表\">PD七阶段流程与时间表\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"战略落地PD/D01_战略部署定义与价值.md"},{"name":"D02_PD七阶段流程与时间表","title":"PD七阶段流程与时间表","raw":"---\r\nid: D02\r\n类型: 机制\r\n模块: 战略落地\r\n英文: Seven stages of PD\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# PD七阶段流程与时间表\r\n\r\n**D02 · Seven stages of PD · 战略落地**\r\n\r\n## 定义\r\n\r\n课件以七个阶段组织从愿景、战略到执行、回顾的年度部署过程；阶段名称是流程骨架，反馈可使前序决定被修订。\r\n\r\n## 何时用\r\n\r\n建立PD年度安排和分工时。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**战略周期、经营日历、客户事实与资源容量。\r\n\r\n1. 组织愿景/开发战略。\r\n2. 开发突破性目标。\r\n3. 开发年度改善优先目标和资源。\r\n4. 部署年度改善优先目标。\r\n5. 实施年度改善优先目标。\r\n6. 月度回顾。\r\n7. 年度回顾。\r\n\r\n## 必须产生的东西\r\n\r\n七阶段责任日历，各阶段输入、交付和评审门槛。\r\n\r\n## 怎样验收\r\n\r\n第三阶段同时包含年度改善优先目标与资源，不能替换为价值流选择；阶段产出有负责人。\r\n\r\n## 误区与边界\r\n\r\n七阶段不等于七张表或固定七个月。价值流选择是支撑分析，不能替代课件第三阶段。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：当前试点的真实目标、过程与证据。\r\n- 责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\r\n- 记录入口：[[TPL06_PD部署链与资源协商]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n把现有工作放入七阶段，标出缺失的交付与责任。\r\n\r\n## 来源与相邻节点\r\n\r\nS06用户提供PD培训课件第10页（PDF页序；一页包含两张幻灯片）。课件未证实为丹纳赫官方授权材料；操作字段为教学设计。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T01_方针部署]] · [[T02_目标协商与部署矩阵]] · [[T03_保龄图与行动计划]] · [[T06_问题解决流程]] · [[T08_可视化与日常管理]] · [[D01_战略部署定义与价值]] · [[D03_突破性目标]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>PD七阶段流程与时间表\u003c/h1>\n\u003cp>\u003cstrong>D02 · Seven stages of PD · 战略落地\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>课件以七个阶段组织从愿景、战略到执行、回顾的年度部署过程；阶段名称是流程骨架，反馈可使前序决定被修订。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>建立PD年度安排和分工时。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**战略周期、经营日历、客户事实与资源容量。\u003c/p>\n\u003col>\n\u003cli>组织愿景/开发战略。\u003c/li>\n\u003cli>开发突破性目标。\u003c/li>\n\u003cli>开发年度改善优先目标和资源。\u003c/li>\n\u003cli>部署年度改善优先目标。\u003c/li>\n\u003cli>实施年度改善优先目标。\u003c/li>\n\u003cli>月度回顾。\u003c/li>\n\u003cli>年度回顾。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>七阶段责任日历，各阶段输入、交付和评审门槛。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>第三阶段同时包含年度改善优先目标与资源，不能替换为价值流选择；阶段产出有负责人。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>七阶段不等于七张表或固定七个月。价值流选择是支撑分析，不能替代课件第三阶段。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：当前试点的真实目标、过程与证据。\u003c/li>\n\u003cli>责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL06_PD%E9%83%A8%E7%BD%B2%E9%93%BE%E4%B8%8E%E8%B5%84%E6%BA%90%E5%8D%8F%E5%95%86\" data-open=\"TPL06_PD部署链与资源协商\">PD部署链与资源协商\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>把现有工作放入七阶段，标出缺失的交付与责任。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>S06用户提供PD培训课件第10页（PDF页序；一页包含两张幻灯片）。课件未证实为丹纳赫官方授权材料；操作字段为教学设计。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T01_%E6%96%B9%E9%92%88%E9%83%A8%E7%BD%B2\" data-open=\"T01_方针部署\">方针部署\u003c/a> · \u003ca href=\"#T02_%E7%9B%AE%E6%A0%87%E5%8D%8F%E5%95%86%E4%B8%8E%E9%83%A8%E7%BD%B2%E7%9F%A9%E9%98%B5\" data-open=\"T02_目标协商与部署矩阵\">目标协商与部署矩阵\u003c/a> · \u003ca href=\"#T03_%E4%BF%9D%E9%BE%84%E5%9B%BE%E4%B8%8E%E8%A1%8C%E5%8A%A8%E8%AE%A1%E5%88%92\" data-open=\"T03_保龄图与行动计划\">保龄图与行动计划\u003c/a> · \u003ca href=\"#T06_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E6%B5%81%E7%A8%8B\" data-open=\"T06_问题解决流程\">问题解决流程\u003c/a> · \u003ca href=\"#T08_%E5%8F%AF%E8%A7%86%E5%8C%96%E4%B8%8E%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86\" data-open=\"T08_可视化与日常管理\">可视化与日常管理\u003c/a> · \u003ca href=\"#D01_%E6%88%98%E7%95%A5%E9%83%A8%E7%BD%B2%E5%AE%9A%E4%B9%89%E4%B8%8E%E4%BB%B7%E5%80%BC\" data-open=\"D01_战略部署定义与价值\">战略部署定义与价值\u003c/a> · \u003ca href=\"#D03_%E7%AA%81%E7%A0%B4%E6%80%A7%E7%9B%AE%E6%A0%87\" data-open=\"D03_突破性目标\">突破性目标\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"战略落地PD/D02_PD七阶段流程与时间表.md"},{"name":"D03_突破性目标","title":"突破性目标","raw":"---\r\nid: D03\r\n类型: 机制\r\n模块: 战略落地\r\n英文: Breakthrough objective\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 突破性目标\r\n\r\n**D03 · Breakthrough objective · 战略落地**\r\n\r\n## 定义\r\n\r\n描述跨年度需达到的重大经营结果与能力跃迁，体现战略取舍和显著差距。\r\n\r\n## 何时用\r\n\r\n确定未来若干年最关键的新水平时。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**客户与竞争变化、战略选择、现实能力与经营差距。\r\n\r\n1. 明确服务对象与价值。\r\n2. 说明现有体系限制。\r\n3. 定义结果范围与期限。\r\n4. 分析能力跃迁。\r\n5. 检验资源与取舍。\r\n\r\n## 必须产生的东西\r\n\r\n少数突破目标及选择依据。\r\n\r\n## 怎样验收\r\n\r\n既能说明业务价值，又能说明需要突破的能力，不是把常规预算数字放大。\r\n\r\n## 误区与边界\r\n\r\n不能把“完全不知道解决方案”作为唯一必要条件；可已有部分方法，但仍需验证和建立新能力。具体期限按战略周期确定。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：当前试点的真实目标、过程与证据。\r\n- 责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\r\n- 记录入口：[[TPL06_PD部署链与资源协商]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n区分“增长10%”背后的业务选择、能力缺口和常规增长。\r\n\r\n## 来源与相邻节点\r\n\r\nS06用户提供PD培训课件第11—18页。课件未证实为丹纳赫官方授权材料；操作字段为教学设计。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T01_方针部署]] · [[T02_目标协商与部署矩阵]] · [[T03_保龄图与行动计划]] · [[T06_问题解决流程]] · [[T08_可视化与日常管理]] · [[D02_PD七阶段流程与时间表]] · [[D04_年度突破目标]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>突破性目标\u003c/h1>\n\u003cp>\u003cstrong>D03 · Breakthrough objective · 战略落地\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>描述跨年度需达到的重大经营结果与能力跃迁，体现战略取舍和显著差距。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>确定未来若干年最关键的新水平时。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**客户与竞争变化、战略选择、现实能力与经营差距。\u003c/p>\n\u003col>\n\u003cli>明确服务对象与价值。\u003c/li>\n\u003cli>说明现有体系限制。\u003c/li>\n\u003cli>定义结果范围与期限。\u003c/li>\n\u003cli>分析能力跃迁。\u003c/li>\n\u003cli>检验资源与取舍。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>少数突破目标及选择依据。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>既能说明业务价值，又能说明需要突破的能力，不是把常规预算数字放大。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>不能把“完全不知道解决方案”作为唯一必要条件；可已有部分方法，但仍需验证和建立新能力。具体期限按战略周期确定。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：当前试点的真实目标、过程与证据。\u003c/li>\n\u003cli>责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL06_PD%E9%83%A8%E7%BD%B2%E9%93%BE%E4%B8%8E%E8%B5%84%E6%BA%90%E5%8D%8F%E5%95%86\" data-open=\"TPL06_PD部署链与资源协商\">PD部署链与资源协商\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>区分“增长10%”背后的业务选择、能力缺口和常规增长。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>S06用户提供PD培训课件第11—18页。课件未证实为丹纳赫官方授权材料；操作字段为教学设计。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T01_%E6%96%B9%E9%92%88%E9%83%A8%E7%BD%B2\" data-open=\"T01_方针部署\">方针部署\u003c/a> · \u003ca href=\"#T02_%E7%9B%AE%E6%A0%87%E5%8D%8F%E5%95%86%E4%B8%8E%E9%83%A8%E7%BD%B2%E7%9F%A9%E9%98%B5\" data-open=\"T02_目标协商与部署矩阵\">目标协商与部署矩阵\u003c/a> · \u003ca href=\"#T03_%E4%BF%9D%E9%BE%84%E5%9B%BE%E4%B8%8E%E8%A1%8C%E5%8A%A8%E8%AE%A1%E5%88%92\" data-open=\"T03_保龄图与行动计划\">保龄图与行动计划\u003c/a> · \u003ca href=\"#T06_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E6%B5%81%E7%A8%8B\" data-open=\"T06_问题解决流程\">问题解决流程\u003c/a> · \u003ca href=\"#T08_%E5%8F%AF%E8%A7%86%E5%8C%96%E4%B8%8E%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86\" data-open=\"T08_可视化与日常管理\">可视化与日常管理\u003c/a> · \u003ca href=\"#D02_PD%E4%B8%83%E9%98%B6%E6%AE%B5%E6%B5%81%E7%A8%8B%E4%B8%8E%E6%97%B6%E9%97%B4%E8%A1%A8\" data-open=\"D02_PD七阶段流程与时间表\">PD七阶段流程与时间表\u003c/a> · \u003ca href=\"#D04_%E5%B9%B4%E5%BA%A6%E7%AA%81%E7%A0%B4%E7%9B%AE%E6%A0%87\" data-open=\"D04_年度突破目标\">年度突破目标\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"战略落地PD/D03_突破性目标.md"},{"name":"D04_年度突破目标","title":"年度突破目标","raw":"---\r\nid: D04\r\n类型: 机制\r\n模块: 战略落地\r\n英文: Annual breakthrough objective\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 年度突破目标\r\n\r\n**D04 · Annual breakthrough objective · 战略落地**\r\n\r\n## 定义\r\n\r\n将跨年度突破转化为本年度需要实现的可验证进展，并与年度资源安排相连。\r\n\r\n## 何时用\r\n\r\n把长期方向转为本年度承诺时。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**跨年度突破、年度基线、能力路径、预算与资源。\r\n\r\n1. 说明年度贡献。\r\n2. 定义对象与结果。\r\n3. 确定基线和目标期限。\r\n4. 识别能力变化。\r\n5. 评估资源及其他目标的代价。\r\n\r\n## 必须产生的东西\r\n\r\n年度目标、测量口径、资源假设与批准记录。\r\n\r\n## 怎样验收\r\n\r\n能解释为何这个年度水平足以支撑长期突破，且具备执行条件。\r\n\r\n## 误区与边界\r\n\r\n年度目标不等于所有部门KPI，也不是必须采用未知方法。没有可靠基线不能凭空承诺百分比。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：当前试点的真实目标、过程与证据。\r\n- 责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\r\n- 记录入口：[[TPL06_PD部署链与资源协商]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n把“提高质量”改写为含对象、口径、目标、期限的待确认目标。\r\n\r\n## 来源与相邻节点\r\n\r\nS06用户提供PD培训课件第19—22页。课件未证实为丹纳赫官方授权材料；操作字段为教学设计。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T01_方针部署]] · [[T02_目标协商与部署矩阵]] · [[T03_保龄图与行动计划]] · [[T06_问题解决流程]] · [[T08_可视化与日常管理]] · [[D03_突破性目标]] · [[D05_最高层优先改善]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>年度突破目标\u003c/h1>\n\u003cp>\u003cstrong>D04 · Annual breakthrough objective · 战略落地\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>将跨年度突破转化为本年度需要实现的可验证进展，并与年度资源安排相连。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>把长期方向转为本年度承诺时。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**跨年度突破、年度基线、能力路径、预算与资源。\u003c/p>\n\u003col>\n\u003cli>说明年度贡献。\u003c/li>\n\u003cli>定义对象与结果。\u003c/li>\n\u003cli>确定基线和目标期限。\u003c/li>\n\u003cli>识别能力变化。\u003c/li>\n\u003cli>评估资源及其他目标的代价。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>年度目标、测量口径、资源假设与批准记录。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>能解释为何这个年度水平足以支 n模块: 战略落地\r\n英文: Improvement Priority / IP\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 最高层优先改善\r\n\r\n**D05 · Improvement Priority / IP · 战略落地**\r\n\r\n## 定义\r\n\r\n为实现年度突破而优先建立或改变的关键流程机制，包含从流程改变到经营结果的可检验贡献假设。\r\n\r\n## 何时用\r\n\r\n知道目标差距，但尚未确定如何改变产生结果的机制。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**年度目标、价值流事实、损失分层、能力与资源约束。\r\n\r\n1. 定位差距集中点。\r\n2. 提出流程机制候选。\r\n3. 解释对各目标的贡献。\r\n4. 验证关键原因假设。\r\n5. 协商责任资源。\r\n6. 设效果指标并试行。\r\n\r\n## 必须产生的东西\r\n\r\n流程边界、机制改变、贡献关系、效果目标与主责。\r\n\r\n## 怎样验收\r\n\r\n说明具体改变哪项工作方式，如何影响QDC，以及哪些证据会推翻假设。\r\n\r\n## 误区与边界\r\n\r\n目标与IP可以多对多，不强制一一对应；Pareto和5Why不能直接证明因果；同一收益不重复计算。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：当前试点的真实目标、过程与证据。\r\n- 责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\r\n- 记录入口：[[TPL06_PD部署链与资源协商]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n将“减少返工”改成一项明确的流程机制改变假设。\r\n\r\n## 来源与相邻节点\r\n\r\nS06用户提供PD培训课件第23—25、31页。课件未证实为丹纳赫官方授权材料；操作字段为教学设计。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T01_方针部署]] · [[T02_目标协商与部署矩阵]] · [[T03_保龄图与行动计划]] · [[T06_问题解决流程]] · [[T08_可视化与日常管理]] · [[D04_年度突破目标]] · [[D06_改善指标TTI]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>最高层优先改善\u003c/h1>\n\u003cp>\u003cstrong>D05 · Improvement Priority / IP · 战略落地\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>为实现年度突破而优先建立或改变的关键流程机制，包含从流程改变到经营结果的可检验贡献假设。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>知道目标差距，但尚未确定如何改变产生结果的机制。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**年度目标、价值流事实、损失分层、能力与资源约束。\u003c/p>\n\u003col>\n\u003cli>定位差距集中点。\u003c/li>\n\u003cli>提出流程机制候选。\u003c/li>\n\u003cli>解释对各目标的贡献。\u003c/li>\n\u003cli>验证关键原因假设。\u003c/li>\n\u003cli>协商责任资源。\u003c/li>\n\u003cli>设效果指标并试行。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>流程边界、机制改变、贡献关系、效果目标与主责。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>说明具体改变哪项工作方式，如何影响QDC，以及哪些证据会推翻假设。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>目标与IP可以多对多，不强制一一对应；Pareto和5Why不能直接证明因果；同一收益不重复计算。\u003c/p>\n\u003ch2>海顺怎样用\u 善指标TTI\r\n\r\n**D06 · Target to Improve · 战略落地**\r\n\r\n## 定义\r\n\r\nTTI表达优先改善需要达到的效果水平和期限；必须把测量定义与目标陈述一起管理。\r\n\r\n## 何时用\r\n\r\n评估IP是否产生实际效果时。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**IP、可信基线、测量范围、业务周期及资源承诺。\r\n\r\n1. 冻结指标定义。\r\n2. 复算基线。\r\n3. 确定目标方向和期限。\r\n4. 按作用时点设目标轨迹。\r\n5. 批准并保留版本。\r\n6. 持续记录实际与偏差。\r\n\r\n## 必须产生的东西\r\n\r\n指标名称、对象、单位、公式、数据源、基线期、目标、期限、责任与触发规则。\r\n\r\n## 怎样验收\r\n\r\n他人能够复算，目标与IP贡献一致；无数据标未测，零分母标不适用。\r\n\r\n## 误区与边界\r\n\r\n培训人数、会议次数属于活动量，不能独自证明效果。目标不必线性逐月改善，“一律超过预算”不是通用规则。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：当前试点的真实目标、过程与证据。\r\n- 责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\r\n- 记录入口：[[TPL02_指标定义与基线]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n给FPY写一张完整指标定义卡，并解释它验证哪项IP。\r\n\r\n## 来源与相邻节点\r\n\r\nS06用户提供PD培训课件第26—27、55页。课件未证实为丹纳赫官方授权材料；操作字段为教学设计。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T01_方针部署]] · [[T02_目标协商与部署矩阵]] · [[T03_保龄图与行动计划]] · [[T06_问题解决流程]] · [[T08_可视化与日常管理]] · [[D05_最高层优先改善]] · [[D07_关键资源与多功能团队]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>改善指标TTI\u003c/h1>\n\u003cp>\u003cstrong>D06 · Target to Improve · 战略落地\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>TTI表达优先改善需要达到的效果水平和期限；必须把测量定义与目标陈述一起管理。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>评估IP是否产生实际效果时。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**IP、可信基线、测量范围、业务周期及资源承诺。\u003c/p>\n\u003col>\n\u003cli>冻结指标定义。\u003c/li>\n\u003cli>复算基线。\u003c/li>\n\u003cli>确定目标方向和期限。\u003c/li>\n\u003cli>按作用时点设目标轨迹。\u003c/li>\n\u003cli>批准并保留版本。\u003c/li>\n\u003cli>持续记录实际与偏差。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>指标名称、对象、单位、公式、数据源、基线期、目标、期限、责任与触发规则。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>他人能够复算，目标与IP贡献一致；无数据标未测，零分母标不适用。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>培训人数、会议次数属于活动量，不能独自证明效果。目标不必线性逐月改善，“一律超过预算”不是通用规则。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：当前试点的真实目标、过程与证据。\u003c/li>\n\u003cli>责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL02_%E6%8C%87%E6%A0%87%E5%AE 确真正可投入的人力、时间、能力、资金与跨职能协作，使责任与执行条件匹配。\r\n\r\n## 何时用\r\n\r\n改善跨越部门边界或关键人员存在资源冲突时。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**任务负荷、资源容量、技能缺口、业务优先级。\r\n\r\n1. 明确端到端主责。\r\n2. 确认协作角色和权限。\r\n3. 估算投入容量。\r\n4. 横向协商冲突。\r\n5. 确认资源承诺。\r\n6. 定期检查兑现。\r\n\r\n## 必须产生的东西\r\n\r\n资源承诺、责任分工、决策权限与冲突升级路径。\r\n\r\n## 怎样验收\r\n\r\n有明确主责，相关人员知道投入多少、让出什么、遇到冲突谁决定。\r\n\r\n## 误区与边界\r\n\r\n名单、责任点和参会不代表资源已授权；DBSO/教练不能替代业务负责人承担经营结果。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：当前试点的真实目标、过程与证据。\r\n- 责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\r\n- 记录入口：[[TPL06_PD部署链与资源协商]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n给一个IP填写主责、协作、投入、审批人及冲突处理。\r\n\r\n## 来源与相邻节点\r\n\r\nS06用户提供PD培训课件第28—31、51—56页。课件未证实为丹纳赫官方授权材料；操作字段为教学设计。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T01_方针部署]] · [[T02_目标协商与部署矩阵]] · [[T03_保龄图与行动计划]] · [[T06_问题解决流程]] · [[T08_可视化与日常管理]] · [[D06_改善指标TTI]] · [[D08_战略部署矩阵与层级联接]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>关键资源与多功能团队\u003c/h1>\n\u003cp>\u003cstrong>D07 · Resources and cross-functional team · 战略落地\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>为突破明确真正可投入的人力、时间、能力、资金与跨职能协作，使责任与执行条件匹配。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>改善跨越部门边界或关键人员存在资源冲突时。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**任务负荷、资源容量、技能缺口、业务优先级。\u003c/p>\n\u003col>\n\u003cli>明确端到端主责。\u003c/li>\n\u003cli>确认协作角色和权限。\u003c/li>\n\u003cli>估算投入容量。\u003c/li>\n\u003cli>横向协商冲突。\u003c/li>\n\u003cli>确认资源承诺。\u003c/li>\n\u003cli>定期检查兑现。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>资源承诺、责任分工、决策权限与冲突升级路径。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>有明确主责，相关人员知道投入多少、让出什么、遇到冲突谁决定。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>名单、责任点和参会不代表资源已授权；DBSO/教练不能替代业务负责人承担经营结果。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：当前试点的真实目标、过程与证据。\u003c/li>\n\u003cli>责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL06_PD%E9%83%A8%E7%BD%B2%E9%93%BE%E4%B8%8E%E8%B5%84%E6%BA%90%E5%8D%8F%E5%95%86\" data-open=\"TPL06_PD部署链与资源协商\">PD部署链与资源协商  输入与动作\r\n\r\n**需要的输入：**已选择的目标与IP、指标定义、资源与角色。\r\n\r\n1. 声明本表符号图例。\r\n2. 建立贡献关系。\r\n3. 双向讨论可行性。\r\n4. 横向对齐接口。\r\n5. 明确资源和权责。\r\n6. 批准版本。\r\n7. 按评审修订。\r\n\r\n## 必须产生的东西\r\n\r\n可读矩阵、关系说明、资源记录与版本历史。\r\n\r\n## 怎样验收\r\n\r\n每条主要关系能解释贡献、主责和证据；发现冲突能追到决定。\r\n\r\n## 误区与边界\r\n\r\n允许多对多；符号含义依版本而定，不把某一种点/圈规定为通用标准，不从符号推断授权。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：当前试点的真实目标、过程与证据。\r\n- 责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\r\n- 记录入口：[[TPL06_PD部署链与资源协商]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n检查一条连接：是贡献、主责、协作还是资源承诺？\r\n\r\n## 来源与相邻节点\r\n\r\nS06用户提供PD培训课件第31—37页；横向协商参照S08。课件未证实为丹纳赫官方授权材料；操作字段为教学设计。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T01_方针部署]] · [[T02_目标协商与部署矩阵]] · [[T03_保龄图与行动计划]] · [[T06_问题解决流程]] · [[T08_可视化与日常管理]] · [[D07_关键资源与多功能团队]] · [[D09_冲击点与行动计划]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>战略部署矩阵与层级联接\u003c/h1>\n\u003cp>\u003cstrong>D08 · Deployment matrix and catchball · 战略落地\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>用矩阵显示目标、优先改善、指标、责任和资源之间的关系，通过上下及横向协商形成可执行承诺。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>需要检验部署完整性和跨部门一致性时。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**已选择的目标与IP、指标定义、资源与角色。\u003c/p>\n\u003col>\n\u003cli>声明本表符号图例。\u003c/li>\n\u003cli>建立贡献关系。\u003c/li>\n\u003cli>双向讨论可行性。\u003c/li>\n\u003cli>横向对齐接口。\u003c/li>\n\u003cli>明确资源和权责。\u003c/li>\n\u003cli>批准版本。\u003c/li>\n\u003cli>按评审修订。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>可读矩阵、关系说明、资源记录与版本历史。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>每条主要关系能解释贡献、主责和证据；发现冲突能追到决定。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>允许多对多；符号含义依版本而定，不把某一种点/圈规定为通用标准，不从符号推断授权。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：当前试点的真实目标、过程与证据。\u003c/li>\n\u003cli>责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL06_PD%E9%83%A8%E7%BD%B2%E9%93%BE%E4%B8%8E%E8%B5%84%E6%BA%90%E5%8D%8F%E5%95%86\" data-open=\"TPL06_PD部署链与资源协商\">PD部署链与资源协商\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本 n\r\n1. 定位具体流程环节。\r\n2. 区分已知执行任务与调查任务。\r\n3. 指定主责和截止。\r\n4. 写出完成证据。\r\n5. 执行及复核效果。\r\n6. 按事实调整。\r\n\r\n## 必须产生的东西\r\n\r\n动作、责任人、期限、前提、交付证据、效果检查与升级规则。\r\n\r\n## 怎样验收\r\n\r\n任务有可验收产出，未知原因有取证计划，不把完成任务当成经营效果已实现。\r\n\r\n## 误区与边界\r\n\r\n冲击点不等于组织最底层或固定“根因层”。课件第37页说明行动计划可由任何矩阵层级产生。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：当前试点的真实目标、过程与证据。\r\n- 责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\r\n- 记录入口：[[TPL05_保龄图与行动计划]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n把“加强培训”写成现场独立操作验证任务及后续效果检查。\r\n\r\n## 来源与相邻节点\r\n\r\nS06用户提供PD培训课件第37—40页。课件未证实为丹纳赫官方授权材料；操作字段为教学设计。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T01_方针部署]] · [[T02_目标协商与部署矩阵]] · [[T03_保龄图与行动计划]] · [[T06_问题解决流程]] · [[T08_可视化与日常管理]] · [[D08_战略部署矩阵与层级联接]] · [[D10_月度评审与对策]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>冲击点与行动计划\u003c/h1>\n\u003cp>\u003cstrong>D09 · Point of impact and action plan · 战略落地\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>把改善落到可以实施变化、观察事实和验证效果的具体工作环节及责任动作。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>部署还停留在口号，或需要进一步诊断原因时。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**部署链、流程现状、已知事实、待验证原因与约束。\u003c/p>\n\u003col>\n\u003cli>定位具体流程环节。\u003c/li>\n\u003cli>区分已知执行任务与调查任务。\u003c/li>\n\u003cli>指定主责和截止。\u003c/li>\n\u003cli>写出完成证据。\u003c/li>\n\u003cli>执行及复核效果。\u003c/li>\n\u003cli>按事实调整。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>动作、责任人、期限、前提、交付证据、效果检查与升级规则。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>任务有可验收产出，未知原因有取证计划，不把完成任务当成经营效果已实现。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>冲击点不等于组织最底层或固定“根因层”。课件第37页说明行动计划可由任何矩阵层级产生。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：当前试点的真实目标、过程与证据。\u003c/li>\n\u003cli>责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL05_%E4%BF%9D%E9%BE%84%E5%9B%BE%E4%B8%8E%E8%A1%8C%E5%8A%A8%E8%AE%A1%E5%88%92\" data-open=\"TPL05_保龄图与行动计划\">保龄图与行动计划\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li> 4. 验证原因。\r\n5. 决定继续修改或停止。\r\n6. 落实资源。\r\n7. 跟踪决定兑现。\r\n\r\n## 必须产生的东西\r\n\r\n效果表、原因证据、对策、主责、时点与下次验证。\r\n\r\n## 怎样验收\r\n\r\n红灯带来可验证的决定；没有用汇报活动量或把目标改低来掩盖问题。\r\n\r\n## 误区与边界\r\n\r\n5Why与Pareto帮助分析，不直接证明根因；没有证据可先安排调查，不凭猜测开永久对策。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：当前试点的真实目标、过程与证据。\r\n- 责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\r\n- 记录入口：[[TPL07_周月评审与决定记录]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n为一项红灯写出当前事实、未知点、取证动作和决定权限。\r\n\r\n## 来源与相邻节点\r\n\r\nS06用户提供PD培训课件第41—48页。课件未证实为丹纳赫官方授权材料；操作字段为教学设计。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T01_方针部署]] · [[T02_目标协商与部署矩阵]] · [[T03_保龄图与行动计划]] · [[T06_问题解决流程]] · [[T08_可视化与日常管理]] · [[D09_冲击点与行动计划]] · [[D11_年度自诊断与实施纪律]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>月度评审与对策\u003c/h1>\n\u003cp>\u003cstrong>D10 · Monthly review and countermeasures · 战略落地\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>以同口径实际结果检验部署假设，处理偏差、资源障碍和能力缺口，并记录决定的学习机制。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>运行中的突破需要检查效果或持续出现偏差时。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**TTI趋势、实际与目标、行动证据、原因验证、资源兑现。\u003c/p>\n\u003col>\n\u003cli>核对数据。\u003c/li>\n\u003cli>看QDC与过程趋势。\u003c/li>\n\u003cli>区分行动延误和作用假设错误。\u003c/li>\n\u003cli>验证原因。\u003c/li>\n\u003cli>决定继续修改或停止。\u003c/li>\n\u003cli>落实资源。\u003c/li>\n\u003cli>跟踪决定兑现。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>效果表、原因证据、对策、主责、时点与下次验证。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>红灯带来可验证的决定；没有用汇报活动量或把目标改低来掩盖问题。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>5Why与Pareto帮助分析，不直接证明根因；没有证据可先安排调查，不凭猜测开永久对策。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：当前试点的真实目标、过程与证据。\u003c/li>\n\u003cli>责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL07_%E5%91%A8%E6%9C%88%E8%AF%84%E5%AE%A1%E4%B8%8E%E5%86%B3%E5%AE%9A%E8%AE%B0%E5%BD%95\" data-open=\"TPL07_周月评审与决定记录\">周月评审与决定记录\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>为一项红灯写出当前事实、未知点、取证动作和决定权限。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>S06用户提供PD培训课件第41—48页。课件未证实为丹纳赫官方授权材料；操作字段为教学设计。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T01_%E6%96%B9%E9%92%88%E9%83%A8%E7%BD%B2\" data-open=\"T01_方针部署\">方针部署\u003c/a> · \u003ca href=\"#T02_%E7%9B%AE%E6%A0%87%E5%8D%8F%E5%95%86%E4%B8%8E%E9%83%A8%E7%BD%B2%E7%9F%A9%E9%98%B5\" data-open=\"T02_目标协商与部署矩阵\">目标协商与部署矩阵\u003c/a> · \u003ca href=\"#T03_%E4%BF%9D%E9%BE%84%E5%9B%BE%E4%B8%8E%E8%A1%8C%E5%8A%A8%E8%AE%A1%E5%88%92\" data-open=\"T03_保龄图与行动计划\">保龄图与行动计划\u003c/a> · \u003ca href=\"#T06_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E6%B5%81%E7%A8%8B\" data-open=\"T06_问题解决流程\">问题解决流程\u003c/a> · \u003ca href=\"#T08_%E5%8F%AF%E8%A7%86%E5%8C%96%E4%B8%8E%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86\" data-open=\"T08_可视化与日常管理\">可视化与日常管理\u003c/a> · \u003ca href=\"#D09_%E5%86%B2%E5%87%BB%E7%82%B9%E4%B8%8E%E8%A1%8C%E5%8A%A8%E8%AE%A1%E5%88%92\" data-open=\"D09_冲击点与行动计划\">冲击点与行动计划\u003c/a> · \u003ca href=\"#D11_%E5%B9%B4%E5%BA%A6%E8%87%AA%E8%AF%8A%E6%96%AD%E4%B8%8E%E5%AE%9E%E6%96%BD%E7%BA%AA%E5%BE%8B\" data-open=\"D11_年度自诊断与实施纪律\">年度自诊断与实施纪律\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"战略落地PD/D10_月度评审与对策.md"},{"name":"D11_年度自诊断与实施纪律","title":"年度自诊断与实施纪律","raw":"---\r\nid: D11\r\n类型: 机制\r\n模块: 战略落地\r\n英文: Annual review and deployment discipline\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# 年度自诊断与实施纪律\r\n\r\n**D11 · Annual review and deployment discipline · 战略落地**\r\n\r\n## 定义\r\n\r\n回顾经营结果、能力建立、战略假设及资源配置，决定下一年度继续、调整、停止或转入常态运行。\r\n\r\n## 何时用\r\n\r\n年度规划前，或重大业务条件改变时。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**全年结果、试验和失败记录、客户变化、资源与能力证据。\r\n\r\n1. 对照战略选择和结果。\r\n2. 复核贡献与副作用。\r\n3. 评估机制可持续性。\r\n4. 检验新的环境假设。\r\n5. 作出取舍。\r\n6. 连接下一年度和DM。\r\n\r\n## 必须产生的东西\r\n\r\n年度学习总结、保留/停止/调整清单、下一年度选择与资源决定。\r\n\r\n## 怎样验收\r\n\r\n从成果与未达成事项中形成具体管理改变，并检查领导带教和资源履责。\r\n\r\n## 误区与边界\r\n\r\n不能要求所有TTI机械高于预算或逐月线性改善；PD与DM不是指标互斥；成熟不意味着管理者退出现场。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：当前试点的真实目标、过程与证据。\r\n- 责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\r\n- 记录入口：[[TPL07_周月评审与决定记录]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n选一项效果改善，检查离开项目团队后能否持续。\r\n\r\n## 来源与相邻节点\r\n\r\nS06用户提供PD培训课件第49—58页。课件未证实为丹纳赫官方授权材料；操作字段为教学设计。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T01_方针部署]] · [[T02_目标协商与部署矩阵]] · [[T03_保龄图与行动计划]] · [[T06_问题解决流程]] · [[T08_可视化与日常管理]] · [[D10_月度评审与对策]] · [[D12_PD与日常管理KPI的边界]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>年度自诊断与实施纪律\u003c/h1>\n\u003cp>\u003cstrong>D11 · Annual review and deployment discipline · 战略落地\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>回顾经营结果、能力建立、战略假设及资源配置，决定下一年度继续、调整、停止或转入常态运行。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>年度规划前，或重大业务条件改变时。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**全年结果、试验和失败记录、客户变化、资源与能力证据。\u003c/p>\n\u003col>\n\u003cli>对照战略选择和结果。\u003c/li>\n\u003cli>复核贡献与副作用。\u003c/li>\n\u003cli>评估机制可持续性。\u003c/li>\n\u003cli>检验新的环境假设。\u003c/li>\n\u003cli>作出取舍。\u003c/li>\n\u003cli>连接下一年度和DM。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>年度学习总结、保留/停止/调整清单、下一年度选择与资源决定。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>从成果与未达成事项中形成具体管理改变，并检查领导带教和资源履责。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>不能要求所有TTI机械高于预算或逐月线性改善；PD与DM不是指标互斥；成熟不意味着管理者退出现场。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：当前试点的真实目标、过程与证据。\u003c/li>\n\u003cli>责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL07_%E5%91%A8%E6%9C%88%E8%AF%84%E5%AE%A1%E4%B8%8E%E5%86%B3%E5%AE%9A%E8%AE%B0%E5%BD%95\" data-open=\"TPL07_周月评审与决定记录\">周月评审与决定记录\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>选一项效果改善，检查离开项目团队后能否持续。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>S06用户提供PD培训课件第49—58页。课件未证实为丹纳赫官方授权材料；操作字段为教学设计。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T01_%E6%96%B9%E9%92%88%E9%83%A8%E7%BD%B2\" data-open=\"T01_方针部署\">方针部署\u003c/a> · \u003ca href=\"#T02_%E7%9B%AE%E6%A0%87%E5%8D%8F%E5%95%86%E4%B8%8E%E9%83%A8%E7%BD%B2%E7%9F%A9%E9%98%B5\" data-open=\"T02_目标协商与部署矩阵\">目标协商与部署矩阵\u003c/a> · \u003ca href=\"#T03_%E4%BF%9D%E9%BE%84%E5%9B%BE%E4%B8%8E%E8%A1%8C%E5%8A%A8%E8%AE%A1%E5%88%92\" data-open=\"T03_保龄图与行动计划\">保龄图与行动计划\u003c/a> · \u003ca href=\"#T06_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E6%B5%81%E7%A8%8B\" data-open=\"T06_问题解决流程\">问题解决流程\u003c/a> · \u003ca href=\"#T08_%E5%8F%AF%E8%A7%86%E5%8C%96%E4%B8%8E%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86\" data-open=\"T08_可视化与日常管理\">可视化与日常管理\u003c/a> · \u003ca href=\"#D10_%E6%9C%88%E5%BA%A6%E8%AF%84%E5%AE%A1%E4%B8%8E%E5%AF%B9%E7%AD%96\" data-open=\"D10_月度评审与对策\">月度评审与对策\u003c/a> · \u003ca href=\"#D12_PD%E4%B8%8E%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86KPI%E7%9A%84%E8%BE%B9%E7%95%8C\" data-open=\"D12_PD与日常管理KPI的边界\">PD与日常管理KPI的边界\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"战略落地PD/D11_年度自诊断与实施纪律.md"},{"name":"D12_PD与日常管理KPI的边界","title":"PD与日常管理KPI的边界","raw":"---\r\nid: D12\r\n类型: 机制\r\n模块: 战略落地\r\n英文: PD, Daily Management and KPI\r\n学习状态: 未开始\r\n证据类型: 见来源；执行步骤为教学设计\r\n版本: 校正版\r\n更新日期: 2026-09-30\r\ntags: [DBS, 知识卡, 校正版]\r\n---\r\n\r\n# PD与日常管理KPI的边界\r\n\r\n**D12 · PD, Daily Management and KPI · 战略落地**\r\n\r\n## 定义\r\n\r\nPD聚焦关键能力与绩效突破的选择和部署；DM维持日常标准、响应异常并持续改善；KPI是衡量指标，不是DM本身。\r\n\r\n## 何时用\r\n\r\n部门争论哪些指标属于PD、哪些只能放日常管理时。\r\n\r\n## 输入与动作\r\n\r\n**需要的输入：**共同指标字典、标准、年度突破、角色与运行节奏。\r\n\r\n1. 建立共同事实底座。\r\n2. 标明每项指标的日常和突破用途。\r\n3. 分别定义范围目标周期责任。\r\n4. 日常异常按授权响应。\r\n5. 系统性差距反馈PD。\r\n6. 验证后更新日常标准。\r\n\r\n## 必须产生的东西\r\n\r\n指标用途表与日/周/月联接规则。\r\n\r\n## 怎样验收\r\n\r\n同一OTIF数据可进入DM与PD，能解释每天怎样响应、月度在验证哪种新能力；无需人为改名。\r\n\r\n## 误区与边界\r\n\r\n课件用词差异是提醒区分管理用途，不应扩展为同一指标不可共用。各层都有DM职责，PD也不能只靠高层看表。\r\n\r\n## 海顺怎样用\r\n\r\n- 触发证据：当前试点的真实目标、过程与证据。\r\n- 责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\r\n- 记录入口：[[TPL03_日常管理与异常升级]]；只使用当前问题需要的字段，避免为了填表另建项目。\r\n- 共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\r\n\r\n## 10分钟启动练习\r\n\r\n用一个OTIF序列分别写出DM问题与PD问题。\r\n\r\n## 来源与相邻节点\r\n\r\nS06用户提供PD培训课件第44、55—56页；S08日常管理文章。课件未证实为丹纳赫官方授权材料；操作字段为教学设计。 详见 [[07_来源与版本边界]]。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\r\n\r\n[[T01_方针部署]] · [[T02_目标协商与部署矩阵]] · [[T03_保龄图与行动计划]] · [[T06_问题解决流程]] · [[T08_可视化与日常管理]] · [[D11_年度自诊断与实施纪律]]\r\n\r\n返回 [[00_学习入口]]。\r\n","html":"\u003ch1>PD与日常管理KPI的边界\u003c/h1>\n\u003cp>\u003cstrong>D12 · PD, Daily Management and KPI · 战略落地\u003c/strong>\u003c/p>\n\u003ch2>定义\u003c/h2>\n\u003cp>PD聚焦关键能力与绩效突破的选择和部署；DM维持日常标准、响应异常并持续改善；KPI是衡量指标，不是DM本身。\u003c/p>\n\u003ch2>何时用\u003c/h2>\n\u003cp>部门争论哪些指标属于PD、哪些只能放日常管理时。\u003c/p>\n\u003ch2>输入与动作\u003c/h2>\n\u003cp>**需要的输入：**共同指标字典、标准、年度突破、角色与运行节奏。\u003c/p>\n\u003col>\n\u003cli>建立共同事实底座。\u003c/li>\n\u003cli>标明每项指标的日常和突破用途。\u003c/li>\n\u003cli>分别定义范围目标周期责任。\u003c/li>\n\u003cli>日常异常按授权响应。\u003c/li>\n\u003cli>系统性差距反馈PD。\u003c/li>\n\u003cli>验证后更新日常标准。\u003c/li>\n\u003c/ol>\n\u003ch2>必须产生的东西\u003c/h2>\n\u003cp>指标用途表与日/周/月联接规则。\u003c/p>\n\u003ch2>怎样验收\u003c/h2>\n\u003cp>同一OTIF数据可进入DM与PD，能解释每天怎样响应、月度在验证哪种新能力；无需人为改名。\u003c/p>\n\u003ch2>误区与边界\u003c/h2>\n\u003cp>课件用词差异是提醒区分管理用途，不应扩展为同一指标不可共用。各层都有DM职责，PD也不能只靠高层看表。\u003c/p>\n\u003ch2>海顺怎样用\u003c/h2>\n\u003cul>\n\u003cli>触发证据：当前试点的真实目标、过程与证据。\u003c/li>\n\u003cli>责任与部署：总经理、流程负责人和岗位骨干按职责共同检验。\u003c/li>\n\u003cli>记录入口：\u003ca href=\"#TPL03_%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86%E4%B8%8E%E5%BC%82%E5%B8%B8%E5%8D%87%E7%BA%A7\" data-open=\"TPL03_日常管理与异常升级\">日常管理与异常升级\u003c/a>；只使用当前问题需要的字段，避免为了填表另建项目。\u003c/li>\n\u003cli>共同验收：本轮围绕产品质量、交付期和成本控制；明确主要效果与另外两项约束。库存是支持指标。真实数据与目标待确认。\u003c/li>\n\u003c/ul>\n\u003ch2>10分钟启动练习\u003c/h2>\n\u003cp>用一个OTIF序列分别写出DM问题与PD问题。\u003c/p>\n\u003ch2>来源与相邻节点\u003c/h2>\n\u003cp>S06用户提供PD培训课件第44、55—56页；S08日常管理文章。课件未证实为丹纳赫官方授权材料；操作字段为教学设计。 详见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。本卡步骤、产出、检查和海顺应用为教学操作化，不是丹纳赫内部原版规程。\u003c/p>\n\u003cp>\u003ca href=\"#T01_%E6%96%B9%E9%92%88%E9%83%A8%E7%BD%B2\" data-open=\"T01_方针部署\">方针部署\u003c/a> · \u003ca href=\"#T02_%E7%9B%AE%E6%A0%87%E5%8D%8F%E5%95%86%E4%B8%8E%E9%83%A8%E7%BD%B2%E7%9F%A9%E9%98%B5\" data-open=\"T02_目标协商与部署矩阵\">目标协商与部署矩阵\u003c/a> · \u003ca href=\"#T03_%E4%BF%9D%E9%BE%84%E5%9B%BE%E4%B8%8E%E8%A1%8C%E5%8A%A8%E8%AE%A1%E5%88%92\" data-open=\"T03_保龄图与行动计划\">保龄图与行动计划\u003c/a> · \u003ca href=\"#T06_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E6%B5%81%E7%A8%8B\" data-open=\"T06_问题解决流程\">问题解决流程\u003c/a> · \u003ca href=\"#T08_%E5%8F%AF%E8%A7%86%E5%8C%96%E4%B8%8E%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86\" data-open=\"T08_可视化与日常管理\">可视化与日常管理\u003c/a> · \u003ca href=\"#D11_%E5%B9%B4%E5%BA%A6%E8%87%AA%E8%AF%8A%E6%96%AD%E4%B8%8E%E5%AE%9E%E6%96%BD%E7%BA%AA%E5%BE%8B\" data-open=\"D11_年度自诊断与实施纪律\">年度自诊断与实施纪律\u003c/a>\u003c/p>\n\u003cp>返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"战略落地PD/D12_PD与日常管理KPI的边界.md"},{"name":"PD索引","title":"PD卡片索引","raw":"# PD卡片索引\r\n\r\n> 校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\r\n\r\n先读D00，再按当前问题阅读D01—D12。\r\n\r\n| ID | 卡片 | 定义摘要 |\r\n|---|---|---|\r\n| D00 | [[D00_战略落地总纲]] | 把战略选择、突破目标、年度进展、流程优先改善、效果指标、资源和学习评审连接成运行闭环。 |\r\n| D01 | [[D01_战略部署定义与价值]] | 将关键战略选择转化为少数突破、资源承诺与持续学习的管理过程。价值在于集中力量、跨职能对齐和根据事实纠偏。 |\r\n| D02 | [[D02_PD七阶段流程与时间表]] | 课件以七个阶段组织从愿景、战略到执行、回顾的年度部署过程；阶段名称是流程骨架，反馈可使前序决定被修订。 |\r\n| D03 | [[D03_突破性目标]] | 描述跨年度需达到的重大经营结果与能力跃迁，体现战略取舍和显著差距。 |\r\n| D04 | [[D04_年度突破目标]] | 将跨年度突破转化为本年度需要实现的可验证进展，并与年度资源安排相连。 |\r\n| D05 | [[D05_最高层优先改善]] | 为实现年度突破而优先建立或改变的关键流程机制，包含从流程改变到经营结果的可检验贡献假设。 |\r\n| D06 | [[D06_改善指标TTI]] | TTI表达优先改善需要达到的效果水平和期限；必须把测量定义与目标陈述一起管理。 |\r\n| D07 | [[D07_关键资源与多功能团队]] | 为突破明确真正可投入的人力、时间、能力、资金与跨职能协作，使责任与执行条件匹配。 |\r\n| D08 | [[D08_战略部署矩阵与层级联接]] | 用矩阵显示目标、优先改善、指标、责任和资源之间的关系，通过上下及横向协商形成可执行承诺。 |\r\n| D09 | [[D09_冲击点与行动计划]] | 把改善落到可以实施变化、观察事实和验证效果的具体工作环节及责任动作。 |\r\n| D10 | [[D10_月度评审与对策]] | 以同口径实际结果检验部署假设，处理偏差、资源障碍和能力缺口，并记录决定的学习机制。 |\r\n| D11 | [[D11_年度自诊断与实施纪律]] | 回顾经营结果、能力建立、战略假设及资源配置，决定下一年度继续、调整、停止或转入常态运行。 |\r\n| D12 | [[D12_PD与日常管理KPI的边界]] | PD聚焦关键能力与绩效突破的选择和部署；DM维持日常标准、响应异常并持续改善；KPI是衡量指标，不是DM本身。 |\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>PD卡片索引\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>先读D00，再按当前问题阅读D01—D12。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>卡片\u003c/th>\n\u003cth>定义摘要\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>D00\u003c/td>\n\u003ctd>\u003ca href=\"#D00_%E6%88%98%E7%95%A5%E8%90%BD%E5%9C%B0%E6%80%BB%E7%BA%B2\" data-open=\"D00_战略落地总纲\">战略落地总纲\u003c/a>\u003c/td>\n\u003ctd>把战略选择、突破目标、年度进展、流程优先改善、效果指标、资源和学习评审连接成运行闭环。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D01\u003c/td>\n\u003ctd>\u003ca href=\"#D01_%E6%88%98%E7%95%A5%E9%83%A8%E7%BD%B2%E5%AE%9A%E4%B9%89%E4%B8%8E%E4%BB%B7%E5%80%BC\" data-open=\"D01_战略部署定义与价值\">战略部署定义与价值\u003c/a>\u003c/td>\n\u003ctd>将关键战略选择转化为少数突破、资源承诺与持续学习的管理过程。价值在于集中力量、跨职能对齐和根据事实纠偏。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D02\u003c/td>\n\u003ctd>\u003ca href=\"#D02_PD%E4%B8%83%E9%98%B6%E6%AE%B5%E6%B5%81%E7%A8%8B%E4%B8%8E%E6%97%B6%E9%97%B4%E8%A1%A8\" data-open=\"D02_PD七阶段流程与时间表\">PD七阶段流程与时间表\u003c/a>\u003c/td>\n\u003ctd>课件以七个阶段组织从愿景、战略到执行、回顾的年度部署过程；阶段名称是流程骨架，反馈可使前序决定被修订。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D03\u003c/td>\n\u003ctd>\u003ca href=\"#D03_%E7%AA%81%E7%A0%B4%E6%80%A7%E7%9B%AE%E6%A0%87\" data-open=\"D03_突破性目标\">突破性目标\u003c/a>\u003c/td>\n\u003ctd>描述跨年度需达到的重大经营结果与能力跃迁，体现战略取舍和显著差距。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D04\u003c/td>\n\u003ctd>\u003ca href=\"#D04_%E5%B9%B4%E5%BA%A6%E7%AA%81%E7%A0%B4%E7%9B%AE%E6%A0%87\" data-open=\"D04_年度突破目标\">年度突破目标\u003c/a>\u003c/td>\n\u003ctd>将跨年度突破转化为本年度需要实现的可验证进展，并与年度资源安排相连。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D05\u003c/td>\n\u003ctd>\u003ca href=\"#D05_%E6%9C%80%E9%AB%98%E5%B1%82%E4%BC%98%E5%85%88%E6%94%B9%E5%96%84\" data-open=\"D05_最高层优先改善\">最高层优先改善\u003c/a>\u003c/td>\n\u003ctd>为实现年度突破而优先建立或改变的关键流程机制，包含从流程改变到经营结果的可检验贡献假设。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D06\u003c/td>\n\u003ctd>\u003ca href=\"#D06_%E6%94%B9%E5%96%84%E6%8C%87%E6%A0%87TTI\" data-open=\"D06_改善指标TTI\">改善指标TTI\u003c/a>\u003c/td>\n\u003ctd>TTI表达优先改善需要达到的效果水平和期限；必须把测量定义与目标陈述一起管理。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D07\u003c/td>\n\u003ctd>\u003ca href=\"#D07_%E5%85%B3%E9%94%AE%E8%B5%84%E6%BA%90%E4%B8%8E%E5%A4%9A%E5%8A%9F%E8%83%BD%E5%9B%A2%E9%98%9F\" data-open=\"D07_关键资源与多功能团队\">关键资源与多功能团队\u003c/a>\u003c/td>\n\u003ctd>为突破明确真正可投入的人力、时间、能力、资金与跨职能协作，使责任与执行条件匹配。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D08\u003c/td>\n\u003ctd>\u003ca href=\"#D08_%E6%88%98%E7%95%A5%E9%83%A8%E7%BD%B2%E7%9F%A9%E9%98%B5%E4%B8%8E%E5%B1%82%E7%BA%A7%E8%81%94%E6%8E%A5\" data-open=\"D08_战略部署矩阵与层级联接\">战略部署矩阵与层级联接\u003c/a>\u003c/td>\n\u003ctd>用矩阵显示目标、优先改善、指标、责任和资源之间的关系，通过上下及横向协商形成可执行承诺。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D09\u003c/td>\n\u003ctd>\u003ca href=\"#D09_%E5%86%B2%E5%87%BB%E7%82%B9%E4%B8%8E%E8%A1%8C%E5%8A%A8%E8%AE%A1%E5%88%92\" data-open=\"D09_冲击点与行动计划\">冲击点与行动计划\u003c/a>\u003c/td>\n\u003ctd>把改善落到可以实施变化、观察事实和验证效果的具体工作环节及责任动作。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D10\u003c/td>\n\u003ctd>\u003ca href=\"#D10_%E6%9C%88%E5%BA%A6%E8%AF%84%E5%AE%A1%E4%B8%8E%E5%AF%B9%E7%AD%96\" data-open=\"D10_月度评审与对策\">月度评审与对策\u003c/a>\u003c/td>\n\u003ctd>以同口径实际结果检验部署假设，处理偏差、资源障碍和能力缺口，并记录决定的学习机制。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D11\u003c/td>\n\u003ctd>\u003ca href=\"#D11_%E5%B9%B4%E5%BA%A6%E8%87%AA%E8%AF%8A%E6%96%AD%E4%B8%8E%E5%AE%9E%E6%96%BD%E7%BA%AA%E5%BE%8B\" data-open=\"D11_年度自诊断与实施纪律\">年度自诊断与实施纪律\u003c/a>\u003c/td>\n\u003ctd>回顾经营结果、能力建立、战略假设及资源配置，决定下一年度继续、调整、停止或转入常态运行。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D12\u003c/td>\n\u003ctd>\u003ca href=\"#D12_PD%E4%B8%8E%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86KPI%E7%9A%84%E8%BE%B9%E7%95%8C\" data-open=\"D12_PD与日常管理KPI的边界\">PD与日常管理KPI的边界\u003c/a>\u003c/td>\n\u003ctd>PD聚焦关键能力与绩效突破的选择和部署；DM维持日常标准、响应异常并持续改善；KPI是衡量指标，不是DM本身。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"战略落地PD/PD索引.md"},{"name":"TPL01_改善项目章程","title":"改善项目章程｜可填写模板","raw":"# 改善项目章程｜可填写模板\r\n\r\n> 校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\r\n\r\n## 用途\r\n\r\n把一个跨职能QDC试点的范围、客户价值和资源说清。\r\n\r\n## 填写区\r\n\r\n| 字段 | 真实记录 |\r\n|---|---|\r\n| 业务理由 | 待填写 |\r\n| 客户与产品族 | 待填写 |\r\n| 流程起止 | 待填写 |\r\n| 问题事实 | 待填写 |\r\n| 质量要求 | 待填写 |\r\n| 交付承诺口径 | 待填写 |\r\n| 成本边界 | 待填写 |\r\n| 已知与未知 | 待填写 |\r\n| 明确不在范围事项 | 待填写 |\r\n| 端到端主责 | 待填写 |\r\n| 协作与教练 | 待填写 |\r\n| 资源投入与授权 | 待填写 |\r\n| 目标待基线确认 | 待填写 |\r\n| 停止条件 | 待填写 |\r\n| 批准与版本 | 待填写 |\r\n\r\n## 使用与验收\r\n\r\n客户与现场问题是否真实？是否由同一流程负责人协调QDC？尚未核实的假设是否单列？\r\n\r\n每个事项按需要增加行；多个模板可以合在一份工作簿中，不要求建立14套独立台账。未测量、未知原因与未授权资源必须如实标记。\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>改善项目章程｜可填写模板\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003ch2>用途\u003c/h2>\n\u003cp>把一个跨职能QDC试点的范围、客户价值和资源说清。\u003c/p>\n\u003ch2>填写区\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>字段\u003c/th>\n\u003cth>真实记录\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>业务理由\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr> 零替代。\r\n\r\n## 表一：周期效果（保龄图）\r\n\r\n每项指标分别填写目标、实际和状态。按需要增加周次或月份；状态写文字，不能只用颜色。\r\n\r\n| 指标与单位 | 行别 | 基线期 | 周期1 | 周期2 | 周期3 | 责任人 |\r\n|---|---|---|---|---|---|---|\r\n| 指标A：待填写 | 批准目标 | — | 待填写 | 待填写 | 待填写 | 待填写 |\r\n| 同上 | 实际 | 待填写 | 未测 | 未测 | 未测 | 同上 |\r\n| 同上 | 状态与偏差 | — | 待判断 | 待判断 | 待判断 | 同上 |\r\n| 指标B：待填写 | 批准目标 | — | 待填写 | 待填写 | 待填写 | 待填写 |\r\n| 同上 | 实际 | 待填写 | 未测 | 未测 | 未测 | 同上 |\r\n| 同上 | 状态与偏差 | — | 待判断 | 待判断 | 待判断 | 同上 |\r\n\r\n“达标”只表示达到本期目标，不证明原因或长期稳定。偏差为实际−目标，结合指标方向解释。目标可非线性变化，须先批准、保留版本，不得事后改目标消除红灯。\r\n\r\n## 表二：行动与验证\r\n\r\n| 编号 | 对应IP／偏差 | 类型（调查／执行／验证） | 具体动作及完成证据 | 主责 | 截止 | 资源与依赖 | 状态 | 效果验证时点与结论 |\r\n|---|---|---|---|---|---|---|---|---|\r\n| A01 | 待填写 | 待选择 | 待填写 | 待填写 | 待填写 | 待填写 | 未开始 | 待验证 |\r\n| A02 | 待填写 | 待选择 | 待填写 | 待填写 | 待填写 | 待填写 | 未开始 | 待验证 |\r\n\r\n调查任务可用核对后的记录或试验结论验收；对策动作完成后仍须返回表一看效果。逾期要说明障碍和决定，不能只改日期。\r\n\r\n## 如何评审\r\n\r\n核对数据→看效果差距→区分任务延误与作用假设失效→列证据和未知点→决定继续、修改、停止或调查→落实责任资源及下次验证。决定写入 [[TPL07_周月评审与决定记录]]。\r\n\r\n填好样例见 [[13_QDC模拟训练与填表示范]]。来源与边界见 [[07_来源与版本边界]]。\r\n","html":"\u003ch1>保龄图与行动计划｜周期效果表＋行动表\u003c/h1>\n\u003cp>校正版使用改进版，2026-09-30。教学模板，海顺真实目标与数据待确认。下载后可在文档或表格中填写；本HTML用于阅读，不保存业务填写记录。\u003c/p>\n\u003ch2>先确定测量规则\u003c/h2>\n\u003cp>填写产品族、流程边界、负责人、指标定义版本、单位、数据源、统计周期、截止时点与达标方向。口径使用 \u003ca href=\"#TPL02_%E6%8C%87%E6%A0%87%E5%AE%9A%E4%B9%89%E4%B8%8E%E5%9F%BA%E7%BA%BF\" data-open=\"TPL02_指标定义与基线\">指标定义与基线\u003c/a>。无数据标“未测”，零分母标“不适用”，不可用零替代。\u003c/p>\n\u003ch2>表一：周期效果（保龄图）\u003c/h2>\n\u003cp>每项指标分别填写目标、实际和状态。按需要增加周次或月份；状态写文字，不能只用颜色。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>指标与单位\u003c/th>\n\u003cth>行别\u003c/th>\n\u003cth>基线期\u003c/th>\n\u003cth>周期1\u003c/th>\n\u003cth>周期2\u003c/th>\n\u003cth>周期3\u003c/th>\n\u003cth>责任人\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>指标A：待填写\u003c/td>\n\u003ctd>批准目标\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同上\u003c/td \u003c/p>\n\u003ch2>如何评审\u003c/h2>\n\u003cp>核对数据→看效果差距→区分任务延误与作用假设失效→列证据和未知点→决定继续、修改、停止或调查→落实责任资源及下次验证。决定写入 \u003ca href=\"#TPL07_%E5%91%A8%E6%9C%88%E8%AF%84%E5%AE%A1%E4%B8%8E%E5%86%B3%E5%AE%9A%E8%AE%B0%E5%BD%95\" data-open=\"TPL07_周月评审与决定记录\">周月评审与决定记录\u003c/a>。\u003c/p>\n\u003cp>填好样例见 \u003ca href=\"#13_QDC%E6%A8%A1%E6%8B%9F%E8%AE%AD%E7%BB%83%E4%B8%8E%E5%A1%AB%E8%A1%A8%E7%A4%BA%E8%8C%83\" data-open=\"13_QDC模拟训练与填表示范\">QDC模拟训练与填表示范\u003c/a>。来源与边界见 \u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。\u003c/p>\n","file":"模板/TPL05_保龄图与行动计划.md"},{"name":"TPL06_PD部署链与资源协商","title":"PD部署链与资源协商｜贡献关系表与资源承诺","raw":"# PD部署链与资源协商｜贡献关系表与资源承诺\r\n\r\n校正版使用改进版，2026-09-30。本表是便于初学者填写的部署关系表，不是丹纳赫统一原版X矩阵。海顺真实数据与授权待确认。\r\n\r\n## 表一：战略与年度进展\r\n\r\n| 编号 | 客户与经营依据 | 战略选择及不做事项 | 跨年度突破 | 年度结果目标 | 基线／口径／期限 | 决策人 |\r\n|---|---|---|---|---|---|---|\r\n| G01 | 待填写 | 待填写 | 待填写 | 待填写 | 待确认 | 待填写 |\r\n| G02 | 待填写 | 待填写 | 待填写 | 待填写 | 待确认 | 待填写 |\r\n\r\n## 表二：目标与IP贡献关系\r\n\r\n可增加目标列和IP行。每条关联写一句可检验的贡献假设；“—”表示本次未主张直接贡献。一个IP可关联多个目标，一个目标可需要多个IP。\r\n\r\n| IP编号与流程机制改变 | 对G01的贡献假设 | 对G02的贡献假设 | 流程边界 | TTI：定义／基线／目标／期限 | 主责 |\r\n|---|---|---|---|---|---|\r\n| I01：待填写 | 待验证 | 待验证 | 待填写 | 待确认 | 待填写 |\r\n| I02：待填写 | 待验证 | 待验证 | 待填写 | 待确认 | 待填写 |\r\n\r\n“降低成本”是方向，IP要说明具体改变哪项工作机制；TTI验证效果，培训人数等活动量单列记录。\r\n\r\n## 表三：资源与横向协商\r\n\r\n| IP | 主责／协作 | 人数、时间、资金或设备窗口 | 容量冲突与取舍 | 批准人及日期 | 决策权限／升级路径 | 未解决事项 |\r\n|---|---|---|---|---|---|---|\r\n| I01 | 待填写 | 待估算 | 待协商 | 未授权 | 待填写 | 待填写 |\r\n| I02 | 待填写 | 待估算 | 待协商 | 未授权 | 待填写 | 待填写 |\r\n\r\n责任符号不代表资源已授权。采用X矩阵时标明本版图例，并保留贡献解释和资源记录。\r\n\r\n## 表四：行动与反馈\r\n\r\n| IP | 首个调查／执行任务 | 主责与截止 | 行动编号 | 首次效果检查 | 返回协商的触发条件 |\r\n|---|---|---|---|---|---|\r\n| I01 | 待填写 | 待填写 | A01 | 待填写 | 待填写 |\r\n\r\n行动可来自任一部署层级；未知原因先调查。效果与行动分别进入 [[TPL05_保龄图与行动计划]]；共同贡献的收益须去重。\r\n\r\n## 验收\r\n\r\n随机抽一个目标，能追到IP、贡献假设、TTI、主责、已承诺资源和第一次验证。相关职能能说明投入和冲突处理。样例见 [[13_QDC模拟训练与填表示范]]，边界见 [[07_来源与版本边界]]。\r\n","html":"\u003ch1>PD部署链与资源协商｜贡献关系表与资源 03c/tbody>\u003c/table>\u003c/div>\n\u003ch2>使用与验收\u003c/h2>\n\u003cp>QDC是经营方向，需补客户、竞争、价值与取舍后才形成战略。不能仅从年度数字开始填矩阵。\u003c/p>\n\u003cp>每个事项按需要增加行；多个模板可以合在一份工作簿中，不要求建立14套独立台账。未测量、未知原因与未授权资源必须如实标记。\u003c/p>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"模板/TPL14_战略到执行一页纸.md"},{"name":"模板索引","title":"14份工作模板索引","raw":"# 14份工作模板索引\r\n\r\n> 校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\r\n\r\n按实际任务选用，可合在一份工作簿中，不要求建立14套台账。\r\n\r\n| ID | 模板 | 用途 |\r\n|---|---|---|\r\n| TPL01 | [[TPL01_改善项目章程]] | 把一个跨职能QDC试点的范围、客户价值和资源说清。 |\r\n| TPL02 | [[TPL02_指标定义与基线]] | 确保任何人用同一批记录能够复算指标。 |\r\n| TPL03 | [[TPL03_日常管理与异常升级]] | 让标准、偏差、当日响应与跨层支持形成闭环。 |\r\n| TPL04 | [[TPL04_问题解决记录]] | 以证据验证原因及对策。 |\r\n| TPL05 | [[TPL05_保龄图与行动计划]] | 把效果与活动分别记录，并在评审时连接起来。 |\r\n| TPL06 | [[TPL06_PD部署链与资源协商]] | 连接战略、目标、流程机制、效果与资源承诺。 |\r\n| TPL07 | [[TPL07_周月评审与决定记录]] | 用事实解决问题和资源冲突，保留决定及后续兑现。 |\r\n| TPL08 | [[TPL08_现状价值流采集]] | 跟随真实订单或批次获得信息流、物料流与时间事实。 |\r\n| TPL09 | [[TPL09_标准化与移交验收]] | 将验证有效的方法交给日常责任人并持续检查。 |\r\n| TPL10 | [[TPL10_能力与带教记录]] | 用真实任务验证是否会做，而非统计听课时长。 |\r\n| TPL11 | [[TPL11_DBS成熟度自评表]] | 对特定单元的运行能力作证据描述，不作官方认证。 |\r\n| TPL12 | [[TPL12_AAR复盘记录]] | 在行动中及里程碑回顾预期与实际，把学习转为下一步改变。 |\r\n| TPL13 | [[TPL13_横向复制清单]] | 将已验证机制适配到新场景，重新验证效果。 |\r\n| TPL14 | [[TPL14_战略到执行一页纸]] | 把战略选择的依据和执行闭环放在同一页核对。 |\r\n\r\n来源与适用边界：[[07_来源与版本边界]]。返回 [[00_学习入口]]。\r\n","html":"\u003ch1>14份工作模板索引\u003c/h1>\n\u003cblockquote>\n\u003cp>校正版 · 2026-09-30。概念依据与实施建议分开标注；步骤、模板和海顺试点安排属于教学设计。海顺实际基线、目标、负责人和资源尚待确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>按实际任务选用，可合在一份工作簿中，不要求建立14套台账。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>模板\u003c/th>\n\u003cth>用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>TPL01\u003c/td>\n\u003ctd>\u003ca href=\"#TPL01_%E6%94%B9%E5%96%84%E9%A1%B9%E7%9B%AE%E7%AB%A0%E7%A8%8B\" data-open=\"TPL01_改善项目章程\">改善项目章程\u003c/a>\u003c/td>\n\u003ctd>把一个跨职能QDC试点的范围、客户价值和资源说清。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TPL02\u003c/td>\n\u003ctd>\u003ca href=\"#TPL02_%E6%8C%87%E6%A0%87%E5%AE%9A%E4%B9%89%E4%B8%8E%E5%9F%BA%E7%BA%BF\" data-open=\"TPL02_指标定义与基线\">指标定义与基线\u003c/a>\u003c/td>\n\u003ctd>确保任何人用同一批记录能够复算指标。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TPL03\u003c/td>\n\u003ctd>\u003ca href=\"#TPL03_%E6%97%A5%E5%B8%B8%E7%AE%A1%E7%90%86%E4%B8%8E%E5%BC%82%E5%B8%B8%E5%8D%87%E7%BA%A7\" data-open=\"TPL03_日常管理与异常升级\">日常管理与异常升级\u003c/a>\u003c/td>\n\u003ctd>让标准、偏差、当日响应与跨层支持形成闭环。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TPL04\u003c/td>\n\u003ctd>\u003ca href=\"#TPL04_%E9%97%AE%E9%A2%98%E8%A7%A3%E5%86%B3%E8%AE%B0%E5%BD%95\" data-open=\"TPL04_问题解决记录\">问题解决记录\u003c/a>\u003c/td>\n\u003ctd>以证据验证原因及对策。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TPL05\u003c/td>\n\u003ctd>\u003ca href=\"#TPL05_%E4%BF%9D%E9%BE%84%E5%9B%BE%E4%B8%8E%E8%A1%8C%E5%8A%A8%E8%AE%A1%E5%88%92\" data-open=\"TPL05_保龄图与行动计划\">保龄图与行动计划\u003c/a>\u003c/td>\n\u003ctd>把效果与活动分别记录，并在评审时连接起来。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TPL06\u003c/td>\n\u003ctd>\u003ca href=\"#TPL06_PD%E9%83%A8%E7%BD%B2%E9%93%BE%E4%B8%8E%E8%B5%84%E6%BA%90%E5%8D%8F%E5%95%86\" data-open=\"TPL06_PD部署链与资源协商\">PD部署链与资源协商\u003c/a>\u003c/td>\n\u003ctd>连接战略、目标、流程机制、效果与资源承诺。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TPL07\u003c/td>\n\u003ctd>\u003ca href=\"#TPL07_%E5%91%A8%E6%9C%88%E8%AF%84%E5%AE%A1%E4%B8%8E%E5%86%B3%E5%AE%9A%E8%AE%B0%E5%BD%95\" data-open=\"TPL07_周月评审与决定记录\">周月评审与决定记录\u003c/a>\u003c/td>\n\u003ctd>用事实解决问题和资源冲突，保留决定及后续兑现。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TPL08\u003c/td>\n\u003ctd>\u003ca href=\"#TPL08_%E7%8E%B0%E7%8A%B6%E4%BB%B7%E5%80%BC%E6%B5%81%E9%87%87%E9%9B%86\" data-open=\"TPL08_现状价值流采集\">现状价值流采集\u003c/a>\u003c/td>\n\u003ctd>跟随真实订单或批次获得信息流、物料流与时间事实。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TPL09\u003c/td>\n\u003ctd>\u003ca href=\"#TPL09_%E6%A0%87%E5%87%86%E5%8C%96%E4%B8%8E%E7%A7%BB%E4%BA%A4%E9%AA%8C%E6%94%B6\" data-open=\"TPL09_标准化与移交验收\">标准化与移交验收\u003c/a>\u003c/td>\n\u003ctd>将验证有效的方法交给日常责任人并持续检查。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TPL10\u003c/td>\n\u003ctd>\u003ca href=\"#TPL10_%E8%83%BD%E5%8A%9B%E4%B8%8E%E5%B8%A6%E6%95%99%E8%AE%B0%E5%BD%95\" data-open=\"TPL10_能力与带教记录\">能力与带教记录\u003c/a>\u003c/td>\n\u003ctd>用真实任务验证是否会做，而非统计听课时长。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TPL11\u003c/td>\n\u003ctd>\u003ca href=\"#TPL11_DBS%E6%88%90%E7%86%9F%E5%BA%A6%E8%87%AA%E8%AF%84%E8%A1%A8\" data-open=\"TPL11_DBS成熟度自评表\">DBS成熟度自评表\u003c/a>\u003c/td>\n\u003ctd>对特定单元的运行能力作证据描述，不作官方认证。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TPL12\u003c/td>\n\u003ctd>\u003ca href=\"#TPL12_AAR%E5%A4%8D%E7%9B%98%E8%AE%B0%E5%BD%95\" data-open=\"TPL12_AAR复盘记录\">AAR复盘记录\u003c/a>\u003c/td>\n\u003ctd>在行动中及里程碑回顾预期与实际，把学习转为下一步改变。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TPL13\u003c/td>\n\u003ctd>\u003ca href=\"#TPL13_%E6%A8%AA%E5%90%91%E5%A4%8D%E5%88%B6%E6%B8%85%E5%8D%95\" data-open=\"TPL13_横向复制清单\">横向复制清单\u003c/a>\u003c/td>\n\u003ctd>将已验证机制适配到新场景，重新验证效果。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TPL14\u003c/td>\n\u003ctd>\u003ca href=\"#TPL14_%E6%88%98%E7%95%A5%E5%88%B0%E6%89%A7%E8%A1%8C%E4%B8%80%E9%A1%B5%E7%BA%B8\" data-open=\"TPL14_战略到执行一页纸\">战略到执行一页纸\u003c/a>\u003c/td>\n\u003ctd>把战略选择的依据和执行闭环放在同一页核对。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>来源与适用边界：\u003ca href=\"#07_%E6%9D%A5%E6%BA%90%E4%B8%8E%E7%89%88%E6%9C%AC%E8%BE%B9%E7%95%8C\" data-open=\"07_来源与版本边界\">来源与版本边界\u003c/a>。返回 \u003ca href=\"#00_%E5%AD%A6%E4%B9%A0%E5%85%A5%E5%8F%A3\" data-open=\"00_学习入口\">学习入口\u003c/a>。\u003c/p>\n","file":"模板/模板索引.md"}]}</script>
<script>

const main=document.getElementById('main'),detail=document.getElementById('detail'),reader=document.getElementById('reader'),readerBody=document.getElementById('reader-body');
const state={view:'overview',selected:'C01',doc:null,history:[]};

function link(id,label){return '<button type="button" class="text-button" data-node="'+id+'">'+esc(label||graphNodes.get(id)?.label||id)+'</button>';}
function doclink(name,label){return '<button type="button" class="text-button" data-doc="'+esc(name)+'">'+esc(label||name.replace(/^\w+_/,''))+'</button>';}

function overview(){return head('先分清层次，再连接执行','校正版：点击节点查看定义、方法与验收。海顺本轮聚焦质量、交付、成本。')+doclink('海顺04_战略到执行总纲','从这里开始：海顺QDC运行路线')+
 '<div class="atlas" aria-label="DBS体系分层结构图">'+

 '<div class="level"><span class="level-label">运行逻辑</span><div class="node-row">'+['人才','计划','流程','绩效'].map(t=>node('C02',t)).join(arrowH)+'</div></div><div class="space-section"></div>'+
 '<div class="level"><span class="level-label">能力架构</span><div class="diagram-content">'+node('M01','共同基础 · 历史八项工具','','band soft')+

 '</div><div class="system-foot">能力架构与运行机制是两个视角。<button type="button" data-doc="09_原有读书资料校准对照">查看原笔记校准</button>　·　<button type="button" data-doc="01_体系总论">阅读体系总论</button></div>';}
function pd(){return head('把目标接到实际工作','少数突破 → 改变流程 → 验证效果 → 标准与日常管理')+
 '<div class="flow" aria-label="PD落地运行流程">'+
 '<div class="level"><span class="level-label">定方向</span><div class="node-row">'+node('T04','客户之声','需求与业务差距')+arrowH+node('T01','方针部署','少数突破与优先改善')+arrowH+node('T02','目标与资源','协商责任和实现方法')+'</div></div>'+arrowV('选定流程，进入现场')+
 '<div class="level"><span class="level-label">改流程</span><div class="node-row">'+node('T05','价值流图','看清真实流动')+arrowH+node('T06','问题解决','验证原因与对策')+arrowH+node('T07','试行改善','在限定范围验证')+'</div></div>'+arrowV('有效方法，形成新标准')+
 '<div class="level"><span class="level-label">稳运行</span><div class="node-row">'+node('T09','标准作业','训练与交接')+arrowH+node('T08','日常管理','发现异常并响应')+arrowH+node('T03','结果与行动','按周期评审效果')+'</div></div>'+
 '<div class="feedback">反复偏差 → <button type="button" data-node="T06">重新验证原因</button><br>战略假设失效或资源冲突 → <button type="button" data-node="T01">重新取舍与部署</button></div></div>'+

 '<div class="tool-columns">'+toolGroups.map(([id,title,sub,ids])=>'<section class="tool-section"><h2><button type="button" class="mini-link" data-node="'+id+'" style="font:inherit;color:inherit;padding:0">'+title+'</button></h2><p>'+sub+'</p>'+ids.map(toolItem).join('')+'</section>').join('')+'</div>'+

function landing(){
const stages=[['组织愿景／开发战略','D01','客户、竞争、价值与取舍'],['开发突破性目标','D03','明确需要建立的新能力'],['开发年度改善优先目标和资源','D05','年度进展、流程机制与资源共同协商'],['部署年度改善优先目标','D08','双向及横向协商，明确关系和主责'],['实施年度改善优先目标','D09','执行或调查，验证效果'],['月度回顾','D10','偏差、资源和假设的检验'],['年度回顾','D11','保留、调整、停止与下一轮选择']];

'<div class="flow">'+stages.map(([title,id,sub],i)=>'<div class="level"><span class="level-label">阶段 '+(i+1)+'</span><div class="diagram-content">'+node(id,title,sub,'band node')+'</div></div>'+(i<6?arrowV('进入下一阶段；必要时返回协商'):'')).join('')+'<div class="feedback">月度／年度回顾 → 重新检验战略假设、目标与资源 → 更新部署</div></div>'+
'<h2>PD知识结构：这些是组成与支持关系</h2><p>下面按作用分组，不用顺序箭头把定义误画成执行步骤。</p><div class="role-list">'+[['理解全貌',['D00','D01','D02']],['目标与实现机制',['D03','D04','D05']],['测量、资源与协商',['D06','D07','D08']],['执行、评审与日常联接',['D09','D10','D11','D12']]].map(([title,ids])=>'<section><h3>'+title+'</h3>'+ids.map(id=>link(id)).join('')+'</section>').join('')+'</div><p class="map-caption">七阶段名称依据用户提供PD课件PDF第10页；分组及操作提示为教学设计。目标与IP可多对多，贡献需证据验证。</p>'+doclink('海顺04_战略到执行总纲','海顺QDC实施总纲');}
