margin:20px 0}table{border-collapse:collapse;width:100%;font-size:14px;min-width:650px}th,td{border:1px solid var(--line);padding:12px 14px;text-align:left;vertical-align:top}th{background:var(--pale)}.filters{display:flex;gap:15px;align-items:end;flex-wrap:wrap;margin:22px 0}.filters label{display:block;font-size:13px;color:var(--muted)}input,select{display:block;border:1px solid #b8cbc3;border-radius:5px;padding:10px 12px;background:#fff;max-width:100%}input{width:410px}details{border-bottom:1px solid var(--line);padding:16px 0}summary{font-weight:600;font-size:18px;line-height:1.6}summary small{font-size:13px;font-weight:400;color:var(--muted);margin-right:12px}details .body{padding:6px 0 10px 22px;max-width:1000px}details p b{font-size:14px}.label{display:inline-block;font-size:12px;padding:2px 8px;background:var(--pale);font-weight:400;margin-right:8px}.critical{background:#f6eadc;color:#784515}.counter{font-size:14px;color:var(--muted);margin:12px 0}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}.actions button,.actions a{border:1px solid var(--line);padding:8px 14px;background:#fff;border-radius:4px;font-size:14px;text-decoration:none}.outline{background:#f5f8f7;padding:18px 24px;display:flex;gap:5px 22px;flex-wrap:wrap;margin:18px 0 30px}.outline a{font-size:14px}.doc p,.doc li{max-width:1050px}footer{border-top:1px solid var(--line);padding:18px 4vw;color:var(--muted);font-size:13px}.empty{padding:30px;border:1px dashed var(--line)}@media(max-width:650px){header{display:block;padding:20px}header strong{font-size:23px}header a{display:inline-block;margin-top:10px}nav{padding:0 14px;gap:13px}nav button{font-size:14px}main{padding:25px 20px 45px}h1{font-size:26px}h2{font-size:21px}.lead{font-size:17px}.band{font-size:18px;padding:18px}.chain{display:block}.chain button{display:block;width:100%;margin:10px 0}.filters{display:block}.filters label{margin-bottom:12px}input,select{width:100%}.outline{padding:15px}summary{font-size:16px}.filters button{ </style></head><body><header><div><strong>海顺 DBS · 第二版建议</strong><p>资料复核 → 统一口径 → 质量、交付期、成本联合实施</p></div><a href="../DBS知识地图.html">返回原知识地图 ↗</a></header><nav role="tablist" aria-label="复核与实施建议"><button role="tab" aria-selected="true" data-tab="home">建议总览</button><button role="tab" aria-selected="false" data-tab="audit">22项核对</button><button role="tab" aria-selected="false" data-tab="plan">QDC实施方案</button><button role="tab" aria-selected="false" data-tab="cards">修订口径卡</button><button role="tab" aria-selected="false" data-tab="register">逐卡登记</button><button role="tab" aria-selected="false" data-tab="sources">来源与边界</button></nav><main id="content" role="tabpanel"></main><footer>2026.09.29 · 本地阅读 · 原资料保留 · 未填造公司基线、目标或收益 · 本版为修订与实施建议，尚非已批准企业标准</footer><script type="application/json" id="data">{"docs":{"audit":{"html":"\u003ch1>新增资料与既有知识卡复核\u003c/h1>\n\u003cp>结论：新增资料的覆盖面有价值，但当前应作为待校准的学习草稿，尚不适合直接作为全员培训标准或全面部署指令。保留体系主干，优先修订会改变行动的概念与指标，再用质量、交付、成本联合试点验证。\u003c/p>\n\u003ch2>范围与结论尺度\u003c/h2>\n\u003cp>本轮阅读13份D00—D12战略部署卡、6份职能手册、3份X机制、海顺04总纲与4份新增模板；与原42张卡的定义、步骤、边界、来源对照。原10份模板沿用此前阅读并做接口检查。本轮不声称逐项重证原书全部页码、所有公式的公司适用性或丹纳赫内部现行规程。\u003c/p>\n\u003cp>对PD课件的争议点重新检索原文，并视觉核对第10、31页。来源分为：原课件可确认、通用方法、内部一致性、实施设计。课件来源不能自动证明丹纳赫官方授权。公司基线、产品族、资源与实际矩阵仍未取得；用户最新选择是“产品质量、交付期、控制成本”；库存周转保留为支撑指标。\u003c/p>\n\u003cp>“必须修订”表示讲授/部署前应改；“补充边界”表示核心内容可留但必须限制解释；“证据待补”表示不作为已证实事实。以下事项均为已发现问题，并非对整本资料的无错误保证。原资料保持不变，本目录是单独的审核与修订建议版本。\u003c/p>\n\u003ch2>A01｜七阶段第3阶段与原课件不一致\u003c/h2>\n\u003cp>\u003cstrong>处理：必须修订；位置：D02\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>原表述/现状：第3阶段写为“确定战略价值流与优先权”。\u003c/li>\n\u003cli>核对依据：PDF第10页上半图第3阶段是“开发年度改善优先目标和资源”；现卡将下半图的价值流内容混入七阶段。已对照页面图像。\u003c/li>\n\u003cli>建议替换为：七阶段依次为：组织愿景/开发战略、开发突破性目标、开发年度改善优先目标和资源、部署年度改善优先目标、实施年度改善优先目标、月度回顾、年度回顾。价值流诊断作为方法嵌入，不能替换资源设计。\u003c/li>\n\u003cli>对海顺的影响：新卡修正后沿用；不要从上到下走成一次性审批。\u003c/li>\n\u003cli>依据定位：PD第10页；D02；T01、T02\u003c/li>\n\u003c/ul>\n\u003ch2>A02｜优先改善与年度突破不要求一一对应\u003c/h2>\n\u003cp>\u003cstrong>处理：必须修订；位置：D05\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>原表述/现状：“与年度突破一一对应”。\u003c/li>\n\u003cli>核对依据：X矩阵用于显示多项之间的关联；现有T02要求解释每个关联点，并没有一对一限制。\u003c/li>\n\u003cli>建议替换为：一个优先改善可支持多个年度目标，一个年度目标也可能依靠多个改善。每条关联写贡献假设、责任和证据，避免重复计算收益。\u003c/li>\n\u003cli>对海顺的影响：交付与库存通常共享流程改善；不可机械分成互不关联的两套项目。\u003c/li>\n\u003cli>依据定位：PD第31页；T02；教学逻辑校正\u003c/li>\n\u003c/ul>\n\u003ch2>A03｜PD与DM要区分用途，不能切成互斥指标库\u003c/h2>\n\u003cp>\u003cstrong>处理：必须修订；位置：D12/D00/D11\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>原表述/现状：“不要用同样的词汇”；将指标分两列。\u003c/li>\n\u003cli>核对依据：这是课件第55页的教学强调，不能推导出同一测量名称绝不共用。KPI是指标类别，DM是管理机制，两者也非同义词。\u003c/li>\n\u003cli>建议替换为：同一OTD口径可用于日常维持与年度突破跟踪；分别标明范围、目标、频率、用途及响应机制。各层管理者都承担DM，PD也需要一线参与。\u003c/li>\n\u003cli>对海顺的影响：建立一个指标字典、两个使用场景，避免两套数字。\u003c/li>\n\u003cli>依据定位：PD第44、55—56页；C06、T08；LEI日常管理文章\u003c/li>\n\u003c/ul>\n\u003ch2>A04｜追问与柏拉图不能直接证明根因\u003c/h2>\n\u003cp>\u003cstrong>处理：必须修订；位置：D05/D10\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>原表述/现状：流程图“连续为什么→根本原因”；“柏拉图是否说明了原因”。\u003c/li>\n\u003cli>核对依据：旧T06已明确5Why/鱼骨图只能形成假设；柏拉图用于排序已分类的现象或原因数据。\u003c/li>\n\u003cli>建议替换为：差距→分层/现场观察→原因假设→取证或试验→确认/否定→对策→效果复核。柏拉图选重点；未验证原因标为假设。\u003c/li>\n\u003cli>对海顺的影响：延期最多的“缺料”只是症状，需要追到需求变化、参数、供应履约或记录差错等可验证机制。\u003c/li>\n\u003cli>依据定位：T06；PD第24、46—47页；ASQ Pareto\u003c/li>\n\u003c/ul>\n\u003ch2>A05｜冲击点不是固定组织层级，也不意味着根因已知\u003c/h2>\n\u003cp>\u003cstrong>处理：必须修订；位置：D09/D00\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>原表述/现状：“降到根本原因层”“该层次中包含根本原因”。\u003c/li>\n\u003cli>核对依据：课件第37页也明确行动方案可从任一矩阵层次提出；未知原因仍需调查行动。\u003c/li>\n\u003cli>建议替换为：冲击点是可以改变实际工作机制的位置。先指定可控流程与取证责任；行动计划允许包含原因验证任务，证据足够后再固化对策。\u003c/li>\n\u003cli>对海顺的影响：销售承诺、参数批准、排程或质量放行都可能是冲击点，不一定在班组。\u003c/li>\n\u003cli>依据定位：PD第37页；T02、T06、T12\u003c/li>\n\u003c/ul>\n\u003ch2>A06｜突破目标不能机械“超过预算”\u003c/h2>\n\u003cp>\u003cstrong>处理：必须修订；位置：D06/D11\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>原表述/现状：“指标应始终超出预算”；TTI清单相同表述。\u003c/li>\n\u003cli>核对依据：旧海顺01已指出指标方向和口径问题；预算与突破计划必须有资源一致性。\u003c/li>\n\u003cli>建议替换为：设有证据和资源支持的能力提升目标，说明与预算假设的关系。库存等指标更低可能更好；活动里程碑与效果目标分列。不要按月均匀摊分不连续的改善效果。\u003c/li>\n\u003cli>对海顺的影响：明确基线后再承诺交付和库存目标，不填写任意百分比。\u003c/li>\n\u003cli>依据定位：PD第26—27、55页；海顺01；C06\u003c/li>\n\u003c/ul>\n\u003ch2>A07｜73%不能作为普遍事实或因果证据\u003c/h2>\n\u003cp>\u003cstrong>处理：证据待补；位置：D01\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>原表述/现状：“73%是因为没有把战略和战术结合起来，根源是缺少战略部署流程”。\u003c/li>\n\u003cli>核对依据：课件第4页确有类似文字，但未给研究来源、样本、时间或方法；本轮未核到原始研究。\u003c/li>\n\u003cli>建议替换为：保留为“课件引用，原始出处未核实”，移出培训论证正文。PD的必要性用海顺真实的目标—资源—行动断点证明。\u003c/li>\n\u003cli>对海顺的影响：无需用不可追溯的统计说服员工。\u003c/li>\n\u003cli>依据定位：PD第4页；D01\u003c/li>\n\u003c/ul>\n\u003ch2>A08｜突破不以“完全不知道解法”为资格条件\u003c/h2>\n\u003cp>\u003cstrong>处理：补充边界；位置：D03/D04\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>原表述/现状：检查清单“实现它的方案是否还不知道”。\u003c/li>\n\u003cli>核对依据：课程用语强调现有系统不能自然达成；已知可借鉴技术或部分方法并不否定突破。\u003c/li>\n\u003cli>建议替换为：突破要求形成显著的新能力或水平；可已有方向，但仍需验证本地适用性、资源和路径。年度突破以结果和能力进展表述。\u003c/li>\n\u003cli>对海顺的影响：避免故意选不可控、完全无路径的目标。\u003c/li>\n\u003cli>依据定位：PD第18、21页；T01；教学解释\u003c/li>\n\u003c/ul>\n\u003ch2>A09｜矩阵圆点的含义必须跟随图例\u003c/h2>\n\u003cp>\u003cstrong>处理：补充边界；位置：D08\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>原表述/现状：“实心圆才表示向下一层部署”。\u003c/li>\n\u003cli>核对依据：课件第31页确这样标注，但符号约定不是所有X矩阵版本的通用定义。\u003c/li>\n\u003cli>建议替换为：在所用模板中保留图例：关联强度、主要责任、支持责任分别怎么读；主责必须配权限、时间和资源。横向与纵向Catchball不可省略。\u003c/li>\n\u003cli>对海顺的影响：矩阵上的点不等于真实承诺；每个点能说清贡献和依赖。\u003c/li>\n\u003cli>依据定位：PD第31—37页；T02；LEI Catchball\u003c/li>\n\u003c/ul>\n\u003ch2>A10｜供应链流程图遗漏生产和质量放行，顺序也过直\u003c/h2>\n\u003cp>\u003cstrong>处理：必须修订；位置：F02\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>原表述/现状：“物料齐套→排程与承诺→补货与拉动→库存与在途→交付”。\u003c/li>\n\u003cli>核对依据：流程顺序不是普遍适用；接单阶段应先评估可承诺能力，生产、检验/放行等关键接口必须出现。\u003c/li>\n\u003cli>建议替换为：需求/订单→评估承诺→采购补货与生产计划协同→投产前条件确认→生产/转换→检验放行→发运/到货→兑现核对。各环节反馈缺口，按实际路线补全。\u003c/li>\n\u003cli>对海顺的影响：用真实产品族验证当前流程；不要照着抽象图建审批。\u003c/li>\n\u003cli>依据定位：F02；T05、T17；海顺试点设计\u003c/li>\n\u003c/ul>\n\u003ch2>A11｜“价值创造树”混合了作用假设与财务恒等式\u003c/h2>\n\u003cp>\u003cstrong>处理：必须修订；位置：F04\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>原表述/现状：客户结果和员工结果作根，经流程汇聚到ROIC。\u003c/li>\n\u003cli>核对依据：客户结果也来自流程，当前图容易形成倒因果；箭头不能代替经营机制或会计计算。\u003c/li>\n\u003cli>建议替换为：分开两图：作用假设图（能力/机制→过程→客户→经营）；财务分解（ROIC=税后经营利润/平均投入资本）。收益分别登记费用、现金、产能、服务，不重复相加。\u003c/li>\n\u003cli>对海顺的影响：库存账面下降可能来自核销或转移，不能直接当现金释放。\u003c/li>\n\u003cli>依据定位：C06；F04内部一致性；海顺财务口径待确认\u003c/li>\n\u003c/ul>\n\u003ch2>A12｜内部填补率与留任率的公式不清\u003c/h2>\n\u003cp>\u003cstrong>处理：必须修订；位置：F05\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>原表述/现状：“指定岗位通过内部人才补充的比例／岗位范围”。\u003c/li>\n\u003cli>核对依据：比例再除以范围不是可复算公式；与原06指标字典的范围说明不一致。\u003c/li>\n\u003cli>建议替换为：内部填补率=期间范围内由内部人员填补的岗位次数/同范围全部已填补岗位次数。留任率=期初指定人群中期末仍在范围内人数/期初人数；内部转岗、退出定义另定。\u003c/li>\n\u003cli>对海顺的影响：两项均为人才指标，不用作首轮交付库存项目主要验收。\u003c/li>\n\u003cli>依据定位：F05；06指标字典；通用口径设计\u003c/li>\n\u003c/ul>\n\u003ch2>A13｜IPD文件名易被误读成DBS标准流程\u003c/h2>\n\u003cp>\u003cstrong>处理：补充边界；位置：F01\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>原表述/现状：文件名“研发与新产品IPD”，正文是工具组合。\u003c/li>\n\u003cli>核对依据：正文已声明不是丹纳赫内部IPD规程，名称仍容易让初学者混同。\u003c/li>\n\u003cli>建议替换为：显示名改为“研发与新产品的DBS应用”；把设计评审、项目管理、上市准备视为贯穿开发的机制，不是一次性串行关卡。\u003c/li>\n\u003cli>对海顺的影响：本轮仅在新品引入影响现有交付时调用相关内容。\u003c/li>\n\u003cli>依据定位：F01；T20—T23、T30\u003c/li>\n\u003c/ul>\n\u003ch2>A14｜不宜强把每个职能归到一个QDCI字母\u003c/h2>\n\u003cp>\u003cstrong>处理：补充边界；位置：F03/F05\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>原表述/现状：销售主要落在创新和成本；人力主要落在创新和质量。\u003c/li>\n\u003cli>核对依据：QDCI是改善方向，不是职能归属；旧C03本就作此区分。\u003c/li>\n\u003cli>建议替换为：销售围绕客户选择与增长兑现，人力围绕业务能力形成；跨QDCI贡献应由具体问题决定。增长室也不是销售流程中的必经交易阶段。\u003c/li>\n\u003cli>对海顺的影响：销售与人力加入同一价值流团队，不各建独立试点追字母。\u003c/li>\n\u003cli>依据定位：C03、M03、M04；F03、F05\u003c/li>\n\u003c/ul>\n\u003ch2>A15｜复制时“重新定义口径”与“相同口径比较”冲突\u003c/h2>\n\u003cp>\u003cstrong>处理：必须修订；位置：X03/TPL13\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>原表述/现状：接收方重定义指标；复制后按源头相同口径验证。\u003c/li>\n\u003cli>核对依据：两种要求需有显式映射，否则结果不可比较。\u003c/li>\n\u003cli>建议替换为：保留共享指标的定义、边界与单位；接收方扩展本地指标。必须改口径时，记录映射并重建本地基线，不直接比较原始值或改善百分比。\u003c/li>\n\u003cli>对海顺的影响：复制补货方法时可调整参数，不能把出货OTD和到货OTD直接比较。\u003c/li>\n\u003cli>依据定位：X03第4—5节；TPL13；C06\u003c/li>\n\u003c/ul>\n\u003ch2>A16｜没有证据不等于组织能力处于上一等级\u003c/h2>\n\u003cp>\u003cstrong>处理：补充边界；位置：X01/TPL11\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>原表述/现状：“找不到证据时，等级就停在上一档”；TII拼写。\u003c/li>\n\u003cli>核对依据：未提供、未观察和已经证明未做到是不同状态；强制定档会制造假精确。\u003c/li>\n\u003cli>建议替换为：增加“证据不足/未评估/不适用”，有充分证据才定级；TII改为TTI。自主改进阶段仍需领导到现场带教，不能写成管理层只看证据。\u003c/li>\n\u003cli>对海顺的影响：先记录试点运行证据，不给全公司成熟度评分。\u003c/li>\n\u003cli>依据定位：X01；T28；TPL11\u003c/li>\n\u003c/ul>\n\u003ch2>A17｜AAR、PDCA与PSP不能按事前事后机械分割\u003c/h2>\n\u003cp>\u003cstrong>处理：补充边界；位置：X02\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>原表述/现状：PDCA仅在原因/对策不确定时用；AAR不问谁的错。\u003c/li>\n\u003cli>核对依据：PDCA贯穿计划至复查，也适用于已知方法的执行学习；AAR可在阶段间开展。\u003c/li>\n\u003cli>建议替换为：以用途区分三者；先事实、后学习，同时保留明确的履职、行为与承诺责任。复盘不替代根因验证或正式责任处理。\u003c/li>\n\u003cli>对海顺的影响：复盘结论进入行动和标准，避免再开一场泛泛总结会。\u003c/li>\n\u003cli>依据定位：C04、T06、C07；X02\u003c/li>\n\u003c/ul>\n\u003ch2>A18｜若干指标仍无法直接复算\u003c/h2>\n\u003cp>\u003cstrong>处理：必须修订；位置：F01/F03/F06\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>原表述/现状：验证周期“时间／假设数”；安全事件“事件或工时损失／暴露工时”。\u003c/li>\n\u003cli>核对依据：均值需先汇总各对象时长；事件频率与损失工时是不同量，不能共用一个名称。\u003c/li>\n\u003cli>建议替换为：验证周期按同一类已完成假设分别求平均/中位数，未完成另列账龄；预测偏差固定预测截点并处理零值；安全事件频率与损失工时分别定义；缺陷逃逸按一致批次与单位追踪。\u003c/li>\n\u003cli>对海顺的影响：进入正式看板前由数据责任人逐项试算，不能直接复制表头。\u003c/li>\n\u003cli>依据定位：C06；F01、F03、F06；通用测量逻辑\u003c/li>\n\u003c/ul>\n\u003ch2>A19｜有执行链，还缺“为何选择它”的战略证据\u003c/h2>\n\u003cp>\u003cstrong>处理：必须修订；位置：D00/海顺04/TPL14\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>原表述/现状：战略选择只有“服务谁、凭什么赢、放弃什么”的占位。\u003c/li>\n\u003cli>核对依据：部署一个目标不等于证明该目标是正确战略；模板尚未要求竞争、客户和经济性证据。\u003c/li>\n\u003cli>建议替换为：在部署前补一页：客户分层与服务承诺、当前差距、不同方案、能力/资本约束、选择理由、停止条件。数字目标通过基线和Catchball批准。\u003c/li>\n\u003cli>对海顺的影响：质量、交付期、成本方向已确认，具体产品族、服务政策和目标值仍需诊断。\u003c/li>\n\u003cli>依据定位：海顺04；T04、T19、T01；本次实施建议\u003c/li>\n\u003c/ul>\n\u003ch2>A20｜六份90天建议不能等于六条并行推广计划\u003c/h2>\n\u003cp>\u003cstrong>处理：补充边界；位置：全部F/X\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>原表述/现状：F01—F06均各有90天起步表。\u003c/li>\n\u003cli>核对依据：这是工具应用视角，不是资源已经具备的部署授权。用户已明确概念工具不清、无固定节奏。\u003c/li>\n\u003cli>建议替换为：首轮一个跨职能价值流试点，质量、交付、成本联合验收。F02/F06提供主要流程视角，F03/F04/F05承担接口；F01仅在新品切换相关时加入。X02随阶段用，X01/X03在证据就绪后用。\u003c/li>\n\u003cli>对海顺的影响：将有限骨干集中在同一问题上边做边学。\u003c/li>\n\u003cli>依据定位：海顺01、海顺02；本次用户确认\u003c/li>\n\u003c/ul>\n\u003ch2>A21｜新增D卡的结构化摘要存在缺字段和错位\u003c/h2>\n\u003cp>\u003cstrong>处理：必须修订；位置：图谱/cards.json与HTML\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>原表述/现状：D00、D12定义为空，多张D卡步骤为空或把产物作为步骤。\u003c/li>\n\u003cli>核对依据：直接读取当前cards.json确认；源Markdown章节名不同造成摘要字段映射不完整。\u003c/li>\n\u003cli>建议替换为：每张D卡人工核对定义、输入、步骤、产出、验收字段；按字段质量检查生成HTML，不能只验证文件链接和节点数量。\u003c/li>\n\u003cli>对海顺的影响：本次复核页提供完整修订口径；原HTML不标记为已完成全量校正版。\u003c/li>\n\u003cli>依据定位：当前cards.json；D00—D12正文\u003c/li>\n\u003c/ul>\n\u003ch2>A22｜强制所有卡片双向链接可能增加噪声\u003c/h2>\n\u003cp>\u003cstrong>处理：补充边界；位置：10索引/图谱关系\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>原表述/现状：“A链B，则B的相邻节点必须含A”。\u003c/li>\n\u003cli>核对依据：阅读反向入口有帮助，但语义关系有方向，“需要”不能被反向理解为同样关系。\u003c/li>\n\u003cli>建议替换为：有向关系保留动词及证据，界面可自动显示入边；不要求每卡都塞满对称相邻列表。为各字段保留唯一内容源和审核状态。\u003c/li>\n\u003cli>对海顺的影响：清晰度用能否追到下一动作检验，不以链接密度衡量。\u003c/li>\n\u003cli>依据定位：10知识总索引；08知识图谱说明；教学设计\u003c/li>\n\u003c/ul>\n\u003ch2>保留什么\u003c/h2>\n\u003cp>保留“DBS是持续改进系统与文化”的定位；保留4P运行逻辑与能力架构分层；保留优先改善关注流程、TTI关注效果、主责与资源承诺、按证据标准化的主干。新增职能手册保留为应用参考，AAR和横向复制保留为通用补充，成熟度自评保留其非官方属性。\u003c/p>\n\u003ch2>如何修订发布\u003c/h2>\n\u003cp>先处理A01—A06、A10—A12、A15、A18—A21涉及的实际动作/测量风险；随后完善其他边界。D卡讲部署流程，T卡作为工具唯一主定义，F手册只引用工具而不另定义。每卡固定：用途、定义、输入、步骤、产物、验收、例外、来源、状态。发布状态用“草稿/已核对概念/已试点验证/已批准标准”，不要用一个“已审核”涵盖所有层次。所有修订应同时检查Markdown、cards.json和HTML，防止三份内容不一致。\u003c/p>\n","file":"01_新旧资料核对结论.md"},"register":{"html":"\u003ch1>逐卡核对登记\u003c/h1>\n\u003cp>“主干可保留”仅指本轮概念与跨卡一致性检查，非丹纳赫认证，非全部内部规程已核实。操作细节仍须结合试点验证。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>卡片\u003c/th>\n\u003cth>本轮处理\u003c/th>\n\u003cth>对本次试点的用法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>C01 DBS定义\u003c/td>\n\u003ctd>主干可保留\u003c/td>\n\u003ctd>班子统一体系定义\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C02 人才计划流程绩效\u003c/td>\n\u003ctd>主干可保留\u003c/td>\n\u003ctd>检查人/计划/流程/绩效的断点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C03 质量交付成本创新\u003c/td>\n\u003ctd>主干可保留\u003c/td>\n\u003ctd>共同看交付、库存与质量护栏\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C04 PDCA与试验学习\u003c/td>\n\u003ctd>主干可保留\u003c/td>\n\u003ctd>对策前写预测及验证标准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C05 价值流与浪费\u003c/td>\n\u003ctd>主干可保留\u003c/td>\n\u003ctd>定义产品族与端到端边界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C06 结果与过程指标\u003c/td>\n\u003ctd>主干可保留\u003c/td>\n\u003ctd>建立唯一指标字典\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M01 共同基础\u003c/td>\n\u003ctd>主干可保留\u003c/td>\n\u003ctd>按任务取用基础工具\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M02 精益能力\u003c/td>\n\u003ctd>主干可保留\u003c/td>\n\u003ctd>交付库存试点的主要能力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M03 增长能力\u003c/td>\n\u003ctd>主干可保留\u003c/td>\n\u003ctd>按销售承诺接口调用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M04 领导力能力\u003c/td>\n\u003ctd>主干可保留\u003c/td>\n\u003ctd>负责人带教与资源取舍\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T01 方针部署\u003c/td>\n\u003ctd>主干可保留\u003c/td>\n\u003ctd>定突破与优先改善\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T02 目标协商与部署矩阵\u003c/td>\n\u003ctd>主干可保留\u003c/td>\n\u003ctd>主责、资源及横向承诺\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T03 保龄图与行动计划\u003c/td>\n\u003ctd>主干可保留\u003c/td>\n\u003ctd>分开效果与任务状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T04 客户之声\u003c/td>\n\u003ctd>主干可保留\u003c/td>\n\u003ctd>确认客户要货日期及服务价值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T05 价值流图\u003c/td>\n\u003ctd>主干可保留\u003c/td>\n\u003ctd>画真实订单与库存流\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T06 问题解决流程\u003c/td>\n\u003ctd>主干可保留\u003c/td>\n\u003ctd>对主要延期原因取证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T07 改善活动\u003c/td>\n\u003ctd>主干可保留\u003c/td>\n\u003ctd>限定范围验证对策\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T08 可视化与日常管理\u003c/td>\n\u003ctd>主干可保留\u003c/td>\n\u003ctd>每日异常与升级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T09 标准作业\u003c/td>\n\u003ctd>主干可保留；需补试点操作条件\u003c/td>\n\u003ctd>验证有效后发布标准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T10 事务流程改进\u003c/td>\n\u003ctd>主干可保留\u003c/td>\n\u003ctd>仅在订单信息交接是瓶颈时用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>T11 5S\u003c/td>\n\u003ctd>主干可保留\u003c/td F01\u003c/td>\n\u003ctd>A13、A18\u003c/td>\n\u003ctd>修订后用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F02\u003c/td>\n\u003ctd>A10\u003c/td>\n\u003ctd>修订后用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F03\u003c/td>\n\u003ctd>A14、A18\u003c/td>\n\u003ctd>修订后用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F04\u003c/td>\n\u003ctd>A11\u003c/td>\n\u003ctd>修订后用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F05\u003c/td>\n\u003ctd>A12、A14\u003c/td>\n\u003ctd>修订后用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F06\u003c/td>\n\u003ctd>A18\u003c/td>\n\u003ctd>修订后用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>X01\u003c/td>\n\u003ctd>A16\u003c/td>\n\u003ctd>补充边界后按需用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>X02\u003c/td>\n\u003ctd>A17\u003c/td>\n\u003ctd>补充边界后按需用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>X03\u003c/td>\n\u003ctd>A15\u003c/td>\n\u003ctd>修订后用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>海顺04 / TPL14\u003c/td>\n\u003ctd>A19、A20\u003c/td>\n\u003ctd>增加战略证据与资源取舍；不是只填占位符\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TPL11\u003c/td>\n\u003ctd>A16\u003c/td>\n\u003ctd>增加证据不足/未评估/不适用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TPL12\u003c/td>\n\u003ctd>A17\u003c/td>\n\u003ctd>保留四问，关联责任与后续验证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TPL13\u003c/td>\n\u003ctd>A15\u003c/td>\n\u003ctd>增加共同口径与本地口径映射\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>额外检查边界\u003c/h2>\n\u003cp>55张结构化卡不等于55张同等成熟度卡。D00/D12字段缺失和D卡步骤错位见A21；本次不把原HTML的“可以打开”解释为“内容已经正确”。原42张卡仅以已读取的定义/动作/边界与前轮资料比对，不重新宣称每一外部出处都独立核实。\u003c/p>\n","file":"02_逐卡核对登记.md"},"plan":{"html":"\u003ch1>海顺第二版实施建议：质量、交付期、成本一起落到流程\u003c/h1>\n\u003cp>本版以您最新确认的三项重点为准：产品质量、交付期、成本控制。此前提出的库存周转保留为支撑指标，不再单列为第四项战略主轴。以下是实施设计，不是对海顺现有业绩或根因的判断；所有实际目标值、人员和日期需基于业务资料确定。\u003c/p>\n\u003ch2>1. 总经理先做的选择\u003c/h2>\n\u003cp>建议把首轮DBS组织成“一个产品族、一位端到端负责人、三个结果、一个日周月节奏”。一个试点是当前能力条件下的起步建议，不是DBS的普遍规定。\u003c/p>\n\u003cp>QDC是需要改善的结果方向，本身还不是完整战略。班子先回答：哪个客户群和产品族最值得优先改善？客户最在意哪项质量特性及哪种交期承诺？我们要靠什么能力取得优势？改善的经济价值是否值得投入？本轮暂缓哪些工作？\u003c/p>\n\u003cp>首轮不要求同时把三项都做到极致。批准一个主要改善假设，同时为另外两项设边界并监测。若有当前严重质量风险，先依现有质量制度遏制、隔离和授权处理；这不意味着其他流程必须等质量全面改善后才启动。\u003c/p>\n\u003cp>\u003cstrong>建议的年度突破表述骨架：\u003c/strong> 在【产品族/客户群】建立可重复的质量保证与可靠交付能力，在满足【客户质量要求】及【交付承诺】的同时，将【质量损失/可控过程成本】由【基线】改善至【经批准目标】。具体数字应在基线核实、原因诊断和资源协商后批准。\u003c/p>\n\u003ch2>2. 从战略到现场的部署链\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层次\u003c/th>\n\u003cth>海顺要回答什么\u003c/th>\n\u003cth>实际工作产物\u003c/th>\n\u003cth>不能混用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>客户与战略选择\u003c/td>\n\u003ctd>为谁改善，哪些质量/交付要求最重要，为什么现在做\u003c/td>\n\u003ctd>一页客户与业务差距说明，明确不做什么\u003c/td>\n\u003ctd>QDC三个词不等于战略\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>年度突破\u003c/td>\n\u003ctd>今年必须形成什么能力和结果\u003c/td>\n\u003ctd>三项结果基线、目标范围、期限和依据\u003c/td>\n\u003ctd>不能拿培训或上线系统当年度经营结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>优先改善IP\u003c/td>\n\u003ctd>哪项流程机制必须改变\u003c/td>\n\u003ctd>一至两项初选流程改善，经诊断再确认\u003c/td>\n\u003ctd>一个改善可以同时支持Q、D、C\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TTI\u003c/td>\n\u003ctd>如何知道这个流程真的改善\u003c/td>\n\u003ctd>有口径、数据来源、基线、目标轨迹的效果指标\u003c/td>\n\u003ctd>不是“开会/培训/完成方案”\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>资源协商\u003c/td>\n\u003ctd>谁主责，谁支持，需要停下什么\u003c/td>\n\u003ctd>明确时间、权限、依赖和升级路径\u003c/td>\n\u003ctd>矩阵圆点不等于资源可用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>现场行动\u003c/td>\n\u003ctd>改哪个步骤、参数、信号或接口\u003c/td>\n\u003ctd>调查/试验/实施任务，逐项负责人和接受条件\u003c/td>\n\u003ctd>未验证原因不能写成既定事实\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>日常运行\u003c/td>\n\u003ctd>什么是正常，异常谁响应\u003c/td>\n\u003ctd>标准、实际、偏差、响应和升级看板\u003c/td>\n\u003ctd>有看板不等于DM在运行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>经营与能力评审\u003c/td>\n\u003ctd>效果、代价和人员能力是否达标\u003c/td>\n\u003ctd>继续/修改/停止/标准化/复制的决定\u003c/td>\n\u003ctd>不把任务完成率等同收益兑现\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这条链需反复往返。诊断可能改变优先改善，试验可能否定因果假设，资源不足可能要求缩小范围。PD部署与试点DM可并行建立；这与LEI对二者关系的解释一致。\u003ca href=\"https://www.lean.org/the-lean-post/articles/executing-strategy-through-daily-management/\" target=\"_blank\" rel=\"noopener noreferrer\">LEI：战略执行与日常管理\u003c/a>\u003c/p>\n\u003ch2>3. 首轮选哪条产品族\u003c/h2>\n\u003cp>先比较2—3个候选，避免凭音量最大的部门决定。每个候选写清以下事实，不先拼一个主观总分：\u003c/p>\n\u003col>\n\u003cli>客户影响：客户投诉、退货、欠交或交期不稳定的实际证据。\u003c/li>\n\u003cli>经济损失：报废、返工、加急、额外检验、占用等能够追溯的记录。\u003c/li>\n\u003cli>流程边界：订单/工艺/物料/生产/检验放行/发运有哪些跨部门接口。\u003c/li>\n\u003cli>可观察性：有没有足够业务量、原始记录和合理观察周期。\u003c/li>\n\u003cli>可改变性：负责人能否调动需要的资源并在试点范围试行。\u003c/li>\n\u003cli>代表性与风险：是否覆盖常见产品路线；是否含必须独立处理的重大风险。\u003c/li>\n\u003c/ol>\n\u003cp>选客户影响重要、边界可控、能在合理周期观察学习结果的一条。不要仅挑最容易做出漂亮数字的流程，也不把无法在90天完成客户验证的新品项目硬塞入短周期验收。\u003c/p>\n\u003ch2>4. 一个团队对同一结果负责\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>角色\u003c/th>\n\u003cth>必须承担的工作\u003c/th>\n\u003cth>验收证据\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>总经理/业务赞助人\u003c/td>\n\u003ctd>选择试点、批准目标与资源、协调冲突、示范现场问证据\u003c/td>\n\u003ctd>有取舍的决定、障碍解除、按期评审\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>端到端流程负责人\u003c/td>\n\u003ctd>对三项结果、跨职能行动与日常维持负责\u003c/td>\n\u003ctd>能追溯一次订单及一次缺陷的全链路\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>质量/工艺\u003c/td>\n\u003ctd>定义关键质量要求、测量方式、验证和放行条件\u003c/td>\n\u003ctd>缺陷定义一致、验证记录、受控标准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>计划/生产/采购\u003c/td>\n\u003ctd>识别约束、物料缺口、换型、排程与供应条件\u003c/td>\n\u003ctd>实际时间与异常证据、可信计划\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>销售/客户接口\u003c/td>\n\u003ctd>确认需求、承诺基准与变更，反馈客户结果\u003c/td>\n\u003ctd>原始要求、承诺及变更记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>财务/数据支持\u003c/td>\n\u003ctd>核实损失、成本口径和收益类型\u003c/td>\n\u003ctd>可复算基线、成本变化分解、无重复记账\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DBS教练/内部骨干\u003c/td>\n\u003ctd>示范方法、现场纠偏、逐步让负责人独立主持\u003c/td>\n\u003ctd>团队会做，不是教练替团队填完\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>角色可由现有人员兼任。质量批准权限与现行职责不因试点被取消。首轮不必先设完整DBS办公室，先明确谁承担教练功能及可用时间。\u003c/p>\n\u003ch2>5. 指标：三项结果，少量驱动因素\u003c/h2>\n\u003cp>所有分母、单位、排除规则、变更记录和统计截点在试点开始时冻结为基准版本。指标“过程/结果”是相对目标而言，不是永久标签。建议首轮看板只放5—7项，下面是备选字典，不要求全部上墙。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>指标\u003c/th>\n\u003cth>建议定义\u003c/th>\n\u003cth>使用与陷阱\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Q：客户质量表现\u003c/td>\n\u003ctd>同批/同期间范围下的确认不合格交付量÷对应交付量；件、重量、面积选择适用且一致的单位\u003c/td>\n\u003ctd>投诉率、退货率与外部PPM分别定义；不能把投诉次数当缺陷件数。PPM需要再乘10⁶；滞后投诉应回溯批次，另看开放问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q：一次通过率FPY\u003c/td>\n\u003ctd>指定工序不经返工即合格的数量÷进入该工序数量\u003c/td>\n\u003ctd>固定工序、产品族、单位和观察窗口；跨工序整体一次通过另行追踪，勿简单平均\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D：准时足量交付OTIF\u003c/td>\n\u003ctd>本期到期、按约定时间及数量完整兑现的订单行数÷本期全部到期订单行数\u003c/td>\n\u003ctd>提前约定按发运还是客户收货、容差和部分交付规则；未交付仍在分母。OTD如不含数量，需明确与OTIF区别\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D：交付周期\u003c/td>\n\u003ctd>约定订单受理点到约定完成点的时长\u003c/td>\n\u003ctd>同时列中位数、P90与未完成订单账龄，防止只统计已完成的快单。原请求日期和承诺日期同时保留\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C：质量损失成本\u003c/td>\n\u003ctd>约定范围内报废、返工和其他不良质量损失的实际金额，分项登记\u003c/td>\n\u003ctd>一项损失只记一次；另看每合格单位损失。估算机会损失与已发生支出分列\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C：可控单位过程成本\u003c/td>\n\u003ctd>同一范围可控过程成本÷合格产出量\u003c/td>\n\u003ctd>产品组合、价格、产量变化分解后比较；以财务核定口径为准，不用降质量或多生产摊薄成本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>支撑：在制品与库存\u003c/td>\n\u003ctd>按原料/在制品/成品、地点、质量状态、库龄分层的数量与金额\u003c/td>\n\u003ctd>看全边界总量，转到供应商/别的车间不算消除；滞销核销不当作现金释放\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>支撑：库存周转天数\u003c/td>\n\u003ctd>同范围期间平均库存成本÷同期间销货成本×期间天数\u003c/td>\n\u003ctd>期间与范围一致，分母为零不算；短期经营看板同时看实物和库龄，不靠销量上涨掩盖库存问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>选用：计划兑现/齐套/换型\u003c/td>\n\u003ctd>由已验证的主要差距决定口径\u003c/td>\n\u003ctd>不是三项全上；“排程变更少”不能以拒绝合理客户需求取得\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>日常DM与PD可以引用同一OTIF数据源：DM看今天的承诺与异常，PD看年度提升轨迹及新机制是否有效。不要再为PD造一套不同口径的交付率。\u003c/p>\n\u003ch2>6. 前两周怎样取证\u003c/h2>\n\u003cp>\u003cstrong>先拉数据，再到现场核对它是否代表实际。\u003c/strong> 建议提取最近8—12周的记录作为起点；有季节性、低业务量或长周期时扩展，不把该长度当统计充分性的保证。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>数据包\u003c/th>\n\u003cth>最低字段\u003c/th>\n\u003cth>谁核对\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>订单与交付\u003c/td>\n\u003ctd>订单行/产品族/数量/原请求日期/首次确认承诺/变更及原因/实际发运和到货/未交数量\u003c/td>\n\u003ctd>销售、计划、仓储共同核对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>质量与流转\u003c/td>\n\u003ctd>批次/工序/投入与合格量/缺陷种类/发生与检出点/返工报废/放行状态及时间\u003c/td>\n\u003ctd>质量、工艺、生产\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>时间与损失\u003c/td>\n\u003ctd>排队/生产/换型/停机/检验/放行/运输时间，额外加班与加急\u003c/td>\n\u003ctd>流程负责人、财务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>库存与物料\u003c/td>\n\u003ctd>SKU/地点/数量金额/库龄/可用或隔离状态/在途/供应周期/MOQ/订单绑定\u003c/td>\n\u003ctd>仓储、采购、计划\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>现有管理\u003c/td>\n\u003ctd>已填PD矩阵、目标表、行动计划、标准、异常记录及会议决定\u003c/td>\n\u003ctd>经营班子、负责人\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>从典型正常订单、延期订单、返工批次和高龄库存各选真实记录走访，先打通记录之间的关联；样本用于发现线索，不直接宣称代表总体。记录无法连接时，本阶段产出应是修复数据与追踪方式，而非精确收益承诺。\u003c/p>\n\u003ch2>7. 按证据选工具，不一次铺开\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>发现的主要机制（必须先验证）\u003c/th>\n\u003cth>优先调用\u003c/th>\n\u003cth>应改变什么\u003c/th>\n\u003cth>同时验收\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>缺陷/返工拖长周期\u003c/td>\n\u003ctd>PSP、测量核对、过程控制、标准作业\u003c/td>\n\u003ctd>发生条件及防错/反应规则\u003c/td>\n\u003ctd>缺陷、返工、周期和成本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>等待审批或信息反复补充\u003c/td>\n\u003ctd>VSM、TPI、输入标准\u003c/td>\n\u003ctd>信息一次完整、权限及异常交接\u003c/td>\n\u003ctd>等待时间、一次齐套、客户承诺\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>批量大、换型长、队列长\u003c/td>\n\u003ctd>VSM、SMED、受控小批量试验\u003c/td>\n\u003ctd>换型方法、批量与释放规则\u003c/td>\n\u003ctd>首件质量、交付、总损失成本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>需求/供应不稳导致缺料和堆货\u003c/td>\n\u003ctd>PSI协同、分层补货、供应问题解决\u003c/td>\n\u003ctd>服务策略、计划假设与补货参数\u003c/td>\n\u003ctd>缺货、库存、OTIF、加急成本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>故障反复打断关键工序\u003c/td>\n\u003ctd>设备故障分析与维护\u003c/td>\n\u003ctd>重点故障机制及点检维护\u003c/td>\n\u003ctd>实际可用能力、质量和交付\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>拉动不意味着所有SKU都设相同库存，也不意味着取消预测和能力规划。选用补货或顺序拉动应与需求、品类数量和交期条件匹配。\u003ca href=\"https://www.lean.org/lexicon-terms/pull-production/\" target=\"_blank\" rel=\"noopener noreferrer\">LEI：拉动生产\u003c/a>\u003c/p>\n\u003cp>减少缓冲前先检查需求变异与供给能力；若二者未改善，直接砍库存可能恶化交付。\u003ca href=\"https://www.lean.org/lexicon-terms/inventory/\" target=\"_blank\" rel=\"noopener noreferrer\">LEI：库存\u003c/a>\u003c/p>\n\u003ch2>8. 90天路线：按证据过关\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段\u003c/th>\n\u003cth>团队实际做什么\u003c/th>\n\u003cth>总经理作什么决定\u003c/th>\n\u003cth>通过条件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>启动—第2周\u003c/td>\n\u003ctd>选产品族、统一质量/交付/成本口径，现场跟单，核实基线，形成现状价值流\u003c/td>\n\u003ctd>范围、主责、可用时间、待暂停工作、客户及质量边界\u003c/td>\n\u003ctd>他人可以复算主要指标；至少一条真实订单/批次全链可追溯；未知数据明确列出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3—4周\u003c/td>\n\u003ctd>分层关键损失，验证原因，选择一个优先改善；搭建最小异常响应节奏\u003c/td>\n\u003ctd>批准试验边界、资源、停止条件及目标假设\u003c/td>\n\u003ctd>原因有证据；预期作用与衡量方法写清；负责人能独立解释逻辑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5—8周\u003c/td>\n\u003ctd>小范围试行，跨班次/批次观察QDC与副作用；修订方法和标准，现场带教\u003c/td>\n\u003ctd>继续、修改或停止；解除跨部门障碍\u003c/td>\n\u003ctd>看得到预期机制的改变；无不可接受的Q/D/C恶化；试验记录完整\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第9—12周\u003c/td>\n\u003ctd>固化有效方法，验证替代人员；复核结果、成本和保持条件\u003c/td>\n\u003ctd>批准维持、继续试验或第二试点\u003c/td>\n\u003ctd>覆盖约定业务周期、波动与关键条件；标准有人维持、异常有人处理、收益无重复计算\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>日期是计划窗口，不是强制毕业日。第12周未形成稳定证据就继续验证，不能为按期结项宣布成功。前两周发现问题和第一个月看板运行都不等于年度目标完成。\u003c/p>\n\u003cp>\u003cstrong>6—12个月：\u003c/strong> 在首轮机制和能力验证后，按相似约束选择下一产品族；每次只增加团队能承受的范围；季度复核客户要求、产品组合和资源。可以共享原理、数据定义和带教方法，补货参数、批量、工艺条件必须本地验证。若首轮不能独立维持，优先补负责人和日常节奏，不扩范围。\u003c/p>\n\u003ch2>9. 固定节奏及每次必须产出的东西\u003c/h2>\n\u003cp>以下时长为起步建议，可并入现有会议；不额外叠加一套会议体系。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>频率\u003c/th>\n\u003cth>谁主持\u003c/th>\n\u003cth>只处理哪些问题\u003c/th>\n\u003cth>必须留下\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>每班/每日，10—15分钟\u003c/td>\n\u003ctd>现场/计划主管\u003c/td>\n\u003ctd>当日质量风险、到期交付风险、阻塞，是否需要遏制或升级\u003c/td>\n\u003ctd>谁、何时、做什么；重大问题不等下次会议\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>每周，45—60分钟\u003c/td>\n\u003ctd>端到端负责人，教练带教\u003c/td>\n\u003ctd>主要差距、原因证据、试验、跨部门依赖\u003c/td>\n\u003ctd>继续/修改/停止动作与资源请求\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>每月，60—90分钟\u003c/td>\n\u003ctd>总经理/赞助人\u003c/td>\n\u003ctd>QDC趋势、收益性质、资源取舍和人员独立能力\u003c/td>\n\u003ctd>明确经营决定、主责与复核日期\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>阶段结束，15—30分钟\u003c/td>\n\u003ctd>负责人\u003c/td>\n\u003ctd>原计划、事实、学到什么、更新什么\u003c/td>\n\u003ctd>一页AAR；必要时并入周会\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>总经理的五个固定问题：客户差距是什么？证据在哪里？哪个原因还没验证？需要我作什么决定？教练不在时谁能按标准运行？\u003c/p>\n\u003ch2>10. 团队只学当前任务所需内容\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>训练任务\u003c/th>\n\u003cth>先读的卡片\u003c/th>\n\u003cth>必须交出的作品\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>把问题说清并复算\u003c/td>\n\u003ctd>C03、C06、T04\u003c/td>\n\u003ctd>一个明确质量/交付问题、指标字典与基线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>看清跨部门流动\u003c/td>\n\u003ctd>C05、T05、T12\u003c/td>\n\u003ctd>一条真实订单/批次现状图与等待/返工记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>验证而非猜根因\u003c/td>\n\u003ctd>T06、C04\u003c/td>\n\u003ctd>原因假设、证据、反例和试验设计\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>用小改变检验效果\u003c/td>\n\u003ctd>T07及一个针对性工具\u003c/td>\n\u003ctd>QDC试验结果、负面影响与下一决定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>维持并带人做\u003c/td>\n\u003ctd>T08、T09、T28\u003c/td>\n\u003ctd>标准、异常响应、替代人员独立演示\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>连接目标与资源\u003c/td>\n\u003ctd>T01、T02、T03及已校准D卡\u003c/td>\n\u003ctd>一条可解释的部署链与资源承诺\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>带教顺序：教练示范→共同完成→学员主持教练旁观→换一个相似任务独立完成。学习验收不以背术语、填写模板数量或讲座出勤代替。\u003c/p>\n\u003ch2>11. 一个完整演练：返工、延期与成本怎样共用一条改善链\u003c/h2>\n\u003cp>以下仅为方法演练，不是海顺现场事实，也不预设存在具体缺陷。\u003c/p>\n\u003cp>\u003cstrong>现象：\u003c/strong> 某产品族质量复验与返工多，订单延期，额外加班增加。不能直接下结论“操作员不认真”或“产能不够”。\u003c/p>\n\u003col>\n\u003cli>定义：质量人员写出能一致判定的缺陷与合格要求，确认测量方式；销售与计划确认原承诺；财务确定返工成本范围。\u003c/li>\n\u003cli>跟流：选择真实批次，把工序、检出、返工、等待、放行和发运连接，核对是否真由返工造成延期，还是另有订单优先级/物料问题。\u003c/li>\n\u003cli>分层：按产品、班次、设备、工艺条件等适用维度找集中点；柏拉图只决定先查什么，不证明原因。\u003c/li>\n\u003cli>取证：假设为“换型后关键条件未稳定导致首段不合格”，先验证测量和实际记录；若数据不支持就否定，不先采购设备或全员重训。\u003c/li>\n\u003cli>对策：只有假设获支持后，才试行经授权的准备、确认或标准调整；明确哪些条件不允许继续、谁作批准。\u003c/li>\n\u003cli>验收：看缺陷/返工、OTIF、全周期和实际损失成本；若新增检查把等待拉长，需改方案，不能只报质量提升。\u003c/li>\n\u003cli>保持：有效方法纳入标准与DM，训练替代者，跨适用条件复核；未稳定则不复制。\u003c/li>\n\u003c/ol>\n\u003cp>该例中的IP是“建立稳定的换型与质量确认流程”（仅当原因成立）；TTI是流程效果的量化目标；行动是取证、试验、修改标准与能力验证。三者不能写成同一条“加强质量管理”。\u003c/p>\n\u003ch2>12. 下一步启动包\u003c/h2>\n\u003cp>您现在需要批准的是试点选择和取证安排，而不是先批准一个未经基线验证的降本比例。\u003c/p>\n\u003cul>\n\u003cli>启动前：指定赞助人、端到端负责人和教练；准备两三个候选产品族及数据可用性。\u003c/li>\n\u003cli>90分钟启动会：确认客户与业务问题、选择试点、界定边界；决定人员投入和暂缓事项；批准两周取证计划。\u003c/li>\n\u003cli>第2周结束：审查可复算基线、现状图和主要差距；批准一个试验与临时目标假设。\u003c/li>\n\u003cli>目标定稿：以数据和资源能力为依据，通过上下/横向协商批准QDC目标、TTI及观察周期。现有实际PD矩阵若已有目标，先核对依据，不自动重设。\u003c/li>\n\u003c/ul>\n\u003cp>现有TPL01、02、03、04、05、07、09、10按需要复用；不要求团队为一次试点同时维护14份独立表。部署链、结果表、行动与问题证据、标准带教记录可以用一个工作簿或现有系统承载。\u003c/p>\n","file":"03_海顺QDC实施建议.md"},"cards":{"html":"\u003ch1>关键口径修订卡：讲授与试点时以此校准\u003c/h1>\n\u003cp>这是对既有知识卡的修订建议层，未覆盖或替换全部原文件。每卡的操作步骤为教学设计，非丹纳赫内部原版。\u003c/p>\n\u003ch2>R01｜PD与日常管理：两种用途，同一事实底座\u003c/h2>\n\u003cp>\u003cstrong>定义：\u003c/strong> PD聚焦关键能力与绩效突破的选择、资源和执行学习；DM确保日常标准、异常响应和持续改善。KPI是衡量指标，不是DM本身。\u003c/p>\n\u003cp>\u003cstrong>输入：\u003c/strong> 客户要求、业务基线、当前标准和年度突破。\u003cstrong>动作：\u003c/strong> 定义共同数据→标明日常用途和突破用途→明确每种用途的目标、时间与责任→异常按授权响应→系统性问题反馈PD。\u003c/p>\n\u003cp>\u003cstrong>产出：\u003c/strong> 一份指标字典与用途表。\u003cstrong>验收：\u003c/strong> 同一订单按同一口径可复算；班组说明今天如何响应，管理层说明要建立哪项新能力。\u003c/p>\n\u003cp>\u003cstrong>例子：\u003c/strong> 同一OTIF序列进入每日经营和月度PD；每日看将到期/已到期异常，PD看改善是否使新水平可持续。两者不必改名制造区别。\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> D12、D00、D11；参照C06、T08。\u003cstrong>来源：\u003c/strong> PD第44、55—56页与LEI日常管理文章；共用指标的具体设计是教学解释。\u003c/p>\n\u003ch2>R02｜优先改善：流程改变与结果之间的可检验假设\u003c/h2>\n\u003cp>\u003cstrong>定义：\u003c/strong> IP说明为了突破必须建立或改变的关键流程机制。目标与IP可多对多关联，不能只给每部门一个数字。\u003c/p>\n\u003cp>\u003cstrong>输入：\u003c/strong> 年度差距、价值流事实、能力限制。\u003cstrong>动作：\u003c/strong> 找差距集中点→提出流程改善候选→解释贡献路径→与资源方协商→设效果目标和试验→随证据修订。\u003c/p>\n\u003cp>\u003cstrong>产出：\u003c/strong> 流程边界、主责、贡献假设、效果指标及资源承诺。\u003cstrong>验收：\u003c/strong> 团队能解释改变哪项工作机制，如何同时影响QDC，什么证据会推翻假设。\u003c/p>\n\u003cp>\u003cstrong>例子：\u003c/strong> “减少返工”是方向；“建立某产品族关键工序的受控准备与异常反应流程”才接近IP，但也必须有诊断支持。\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> D05；参照T01、T02、T05。\u003cstrong>来源：\u003c/strong> PD第23—25、31页；多对多关系与验证步骤为教学展开。\u003c/p>\n\u003ch2>R03｜TTI：指标定义与目标值一起管理\u003c/h2>\n\u003cp>\u003cstrong>定义：\u003c/strong> TTI表达优先改善应达到的效果水平及期限。须同时写清测量口径与目标陈述，不能只有“从X到Y”。\u003c/p>\n\u003cp>\u003cstrong>输入：\u003c/strong> IP、基线、测量范围、资源和业务周期。\u003cstrong>动作：\u003c/strong> 冻结口径→复算基线→提出目标轨迹→验证作用逻辑→授权批准→保留实际与偏差。\u003c/p>\n\u003cp>\u003cstrong>产出：\u003c/strong> 名称、对象、单位、公式、数据源、基线期、目标、期限、主责、更新周期和异常触发。\u003cstrong>验收：\u003c/strong> 他人能复算；目标变化有版本；无数据时标未测，不填零。\u003c/p>\n\u003cp>\u003cstrong>例子：\u003c/strong> FPY提升为流程效果；“培训20人”仅为行动量，需继续验证人员独立操作及FPY变化。目标是否有突破性不能靠机械高于预算判断。\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> D06、D11；参照C06、T03。\u003cstrong>来源：\u003c/strong> PD第26—27、55页；测量字段为教学补充。\u003c/p>\n\u003ch2>R04｜PSP：把假设变成可检查的原因证据\u003c/h2>\n\u003cp>\u003cstrong>定义：\u003c/strong> 界定问题、验证原因、试行对策并保持效果的学习过程。\u003c/p>\n\u003cp>\u003cstrong>输入：\u003c/strong> 差距、原始记录、现场条件和当前标准。\u003cstrong>动作：\u003c/strong> 必要时遏制→定义和分层→提出原因假设→取证/试验→决定是否支持→对策→检验效果和副作用→标准化。\u003c/p>\n\u003cp>\u003cstrong>产出：\u003c/strong> 假设与证据对应表，失败试验也要记录。\u003cstrong>验收：\u003c/strong> 能区分“发生在哪里”“与什么一起发生”“什么原因得到了支持”。一次前后对比不能排除全部其他解释。\u003c/p>\n\u003cp>\u003cstrong>例子：\u003c/strong> “采购导致缺料”不能关闭问题；继续核对需求信号、下单时点、供期、实际履约及可用库存，再确定责任动作。\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> D05、D09、D10；优先沿用已有T06，避免新建另一套PSP定义。\u003cstrong>来源：\u003c/strong> 旧T06、课件第24、46—47页、ASQ Pareto。\u003c/p>\n\u003ch2>R05｜QDC联合验收：每个改善都要检查代价\u003c/h2>\n\u003cp>\u003cstrong>定义：\u003c/strong> 质量、交付、成本共同反映客户与经营结果；单项好转只有在另两项代价可接受、来源可解释时，才有推广依据。\u003c/p>\n\u003cp>\u003cstrong>输入：\u003c/strong> 质量要求、交付承诺、损失成本、过程边界。\u003cstrong>动作：\u003c/strong> 选主要差距→设另外两项边界→选择驱动指标→小范围试验→同时复核QDC→决定保持或修改。\u003c/p>\n\u003cp>\u003cstrong>产出：\u003c/strong> 一个共用的效果表和决策记录。\u003cstrong>验收：\u003c/strong> 交付改善没有靠改承诺日期，质量改善没有隐藏返工，降本没有靠不合格出货或无需求的多生产。\u003c/p>\n\u003cp>\u003cstrong>例子：\u003c/strong> 缩短换型后首件不良增加，则尚不能判定成功；增加检验后质量改善但等待上升，需要重新比较方案。\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 为C03、T14、F02、F04、F06补上本轮实施接口。\u003cstrong>来源：\u003c/strong> QDCI框架；联合验收为海顺教学设计。\u003c/p>\n\u003ch2>R06｜库存：先理解作用，再改变数量\u003c/h2>\n\u003cp>\u003cstrong>定义：\u003c/strong> 库存有位置、状态和用途；减少库存必须同时理解需求变化、供给可靠性和服务要求。\u003c/p>\n\u003cp>\u003cstrong>输入：\u003c/strong> SKU需求、供补周期、MOQ、库存状态、质量可用性和承诺。\u003cstrong>动作：\u003c/strong> 分产品族/需求特性→识别库存用途→确认补货和能力约束→设计参数/信号→小范围试行→同时看缺货和交付→按证据调整。\u003c/p>\n\u003cp>\u003cstrong>产出：\u003c/strong> 品类策略、参数依据、异常规则、重估条件。\u003cstrong>验收：\u003c/strong> 全边界库存与交付共同核对，不能靠转仓或砍安全缓冲做出数字。\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> 补充T13、T17与F02；本轮库存是支撑指标。\u003cstrong>来源：\u003c/strong> LEI Inventory、Pull Production；操作字段为教学设计。\u003c/p>\n\u003ch2>R07｜收益：先说明类型，再说改善多少\u003c/h2>\n\u003cp>\u003cstrong>定义：\u003c/strong> 服务改善、能力释放、费用减少、现金释放各自计量，不能混成一个总金额。\u003c/p>\n\u003cp>\u003cstrong>输入：\u003c/strong> 同口径成本和数量、发生记录、试验变化、业务组合。\u003cstrong>动作：\u003c/strong> 确定比较基准→剔清价格/量/组合影响→核实变化机制→分项确认→检查重复申报→持续复查。\u003c/p>\n\u003cp>\u003cstrong>产出：\u003c/strong> 费用、现金、产能、客户结果四类记录及依据。\u003cstrong>验收：\u003c/strong> 节省时间不直接乘全额工资当现金；库存核销不算现金流入；产能释放是否兑现订单另核实。\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> F04；参照C06与旧指标字典。\u003cstrong>来源：\u003c/strong> 通用经营测量逻辑；不是海顺会计确认政策。\u003c/p>\n\u003ch2>R08｜复制与成熟度：证据先于推广\u003c/h2>\n\u003cp>\u003cstrong>定义：\u003c/strong> 成熟度描述某个单元可观察的运行能力；横向复制把验证过的机制适配到新环境。\u003c/p>\n\u003cp>\u003cstrong>输入：\u003c/strong> 源头机制、效果、适用边界、接收方条件。\u003cstrong>动作：\u003c/strong> 确认稳定性→接收方检查条件→保留共享口径→建立本地基线→小范围验证→确认独立维持→再扩大。\u003c/p>\n\u003cp>\u003cstrong>产出：\u003c/strong> 源头证据、口径映射、适配记录和复制后验收。\u003cstrong>验收：\u003c/strong> 没有证据标“未评估”，不硬定等级；接收方指标不同就不能直接比较百分比；领导仍需现场支持。\u003c/p>\n\u003cp>\u003cstrong>纠正：\u003c/strong> X01、X03、TPL11、TPL13。\u003cstrong>来源：\u003c/strong> 通用改善与教学设计，不是丹纳赫成熟度认证。\u003c/p>\n","file":"04_关键口径修订卡.md"},"sources":{"html":"\u003ch1>本轮来源与复核边界\u003c/h1>\n\u003cp>复核日期：2026-09-29。公司优先项以用户最新回复“产品质量，交付期，控制成本”为准；库存为支撑指标。\u003c/p>\n\u003ch2>本地依据\u003c/h2>\n\u003cul>\n\u003cli>原42张C/M/T卡：核对定义、步骤、误区、出处标记与新材料冲突；不是重新对每个原书页码作全文校勘。\u003c/li>\n\u003cli>D00—D12：通读；对关键疑点重新定位61页PD课件；第10、31页另作视觉核对。\u003c/li>\n\u003cli>F01—F06、X01—X03、海顺04：阅读应用逻辑、指标、流程、部署节奏及来源边界。\u003c/li>\n\u003cli>TPL11—TPL14：检查与新机制是否一致；原10份模板沿用前轮阅读并作接口检查。\u003c/li>\n\u003cli>cards.json：发现新增D卡摘要缺字段/错位；本次未重建原HTML、未覆盖原卡或改变原图谱。\u003c/li>\n\u003cli>PD课件是本地培训材料。标注“课件表述”只能证明其文字在该文件中，不能等同已证实的普遍事实或官方现行标准。\u003c/li>\n\u003c/ul>\n\u003ch2>外部交叉核对\u003c/h2>\n\u003col>\n\u003cli>\u003ca href=\"https://www.danaher.com/how-we-work/danaher-business-system\" target=\"_blank\" rel=\"noopener noreferrer\">丹纳赫官网DBS\u003c/a>：本轮直接抓取超时，搜索结果可见People/Plans/Processes/Performance表述；完整定义沿用前轮阅读，不宣称本轮重新核实整页。\u003c/li>\n\u003cli>\u003ca href=\"https://www.lean.org/the-lean-post/articles/executing-strategy-through-daily-management/\" target=\"_blank\" rel=\"noopener noreferrer\">LEI：Executing Strategy through Daily Management\u003c/a>，2025-05-21：用于确认PD/DM相互连接及可并行起步。这是通用精益解释，不是丹纳赫内部规程。\u003c/li>\n\u003cli>\u003ca href=\"https://www.lean.org/the-lean-post/articles/what-are-the-pitfalls-of-implementing-hoshin-kanri/\" target=\"_blank\" rel=\"noopener noreferrer\">LEI：What are the pitfalls of implementing hoshin kanri?\u003c/a>，2016-03-28：用于确认目标协商、横向支持、管理者到现场的重要性。其作者观点不替代海顺战略选择。\u003c/li>\n\u003cli>\u003ca href=\"https://www.lean.org/lexicon-terms/inventory/\" target=\"_blank\" rel=\"noopener noreferrer\">LEI：Inventory\u003c/a>：用于确认库存用途及需求变异/供给能力与缓冲的关系。\u003c/li>\n\u003cli>\u003ca href=\"https://www.lean.org/lexicon-terms/pull-production/\" target=\"_blank\" rel=\"noopener noreferrer\">LEI：Pull Production\u003c/a>：用于确认拉动存在补货、顺序及混合方式，不能全品类统一套用。\u003c/li>\n\u003cli>\u003ca href=\"https://asq.org/quality-resources/pareto\" target=\"_blank\" rel=\"noopener noreferrer\">ASQ：Pareto Chart\u003c/a>：用于确认柏拉图排序用途。由此不能把排序图当成因果证明。\u003c/li>\n\u003c/ol>\n\u003cp>本轮外部来源主要用于少数争议点交叉核对，操作步骤、试点组织、时长、指标组合、验证门槛和学习安排均为本次实施设计。财务、安全与质量专业定义仍需由海顺相应责任人结合适用要求批准，不在此提供法规或会计意见。\u003c/p>\n\u003ch2>尚不能下的结论\u003c/h2>\n\u003cp>不能判定海顺当前质量、交付和成本的主要根因；不能给出可信降本额、目标百分比、库存削减量或投资回报；不能认定哪位负责人能力不足。需要已填写的PD方案和真实业务数据，才能把本建议变成具体目标审核与已批准项目。\u003c/p>\n\u003ch2>本版与原版的关系\u003c/h2>\n\u003cp>原HTML与原知识卡保留；本版包含核对意见、逐卡登记、八张修订口径卡和QDC实施方案。它是可讨论的第二版专家建议，不代表已经替海顺批准制度，也不代表已完成原知识库全量修订发布。\u003c/p>\n","file":"05_来源与复核边界.md"}},"findings":[{"id":"A01","level":"必须修订","scope":"D02","title":"七阶段第3阶段与原课件不一致","original":"第3阶段写为“确定战略价值流与优先权”。","basis":"PDF第10页上半图第3阶段是“开发年度改善优先目标和资源”；现卡将下半图的价值流内容混入七阶段。已对照页面图像。","revised":"七阶段依次为：组织愿景/开发战略、开发突破性目标、开发年度改善优先目标和资源、部署年度改善优先目标、实施年度改善优先目标、月度回顾、年度回顾。价值流诊断作为方法嵌入，不能替换资源设计。","impact":"新卡修正后沿用；不要从上到下走成一次性审批。","source":"PD第10页；D02；T01、T02"},{"id":"A02","level":"必须修订","scope":"D05","title":"优先改善与年度突破不要求一一对应","original":"“与年度突破一一对应”。","basis":"X矩阵用于显示多项之间的关联；现有T02要求解释每个关联点，并没有一对一限制。","revised":"一个优先改善可支持多个年度目标，一个年度目标也可能依靠多个改善。每条关联写贡献假设、责任和证据，避免重复计算收益。","impact":"交付与库存通常共享流程改善；不可机械分成互不关联的两套项目。","source":"PD第31页；T02；教学逻辑校正"},{"id":"A03","level":"必须修订","scope":"D12/D00/D11","title":"PD与DM要区分用途，不能切成互斥指标库","original":"“不要用同样的词汇”；将指标分两列。","basis":"这是课件第55页的教学强调，不能推导出同一测量名称绝不共用。KPI是指标类别，DM是管理机制，两者也非同义词。","revised":"同一OTD口径可用于日常维持与年度突破跟踪；分别标明范围、目标、频率、用途及响应机制。各层管理者都承担DM，PD也需要一线参与。","impact":"建立一个指标字典、两个使用场景，避免两套数字。","source":"PD第44、55—56页；C06、T08；LEI日常管理文章"},{"id":"A04","level":"必须修订","scope":"D05/D10","title":"追问与柏拉图不能直接证明根因","original":"流程图“连续为什么→根本原因”；“柏拉图是否说明了原因”。","basis":"旧T06已明确5Why/鱼骨图只能形成假设；柏拉图用于排序已分类的现象或原因数据。","revised":"差距→分层/现场观察→原因假设→取证或试验→确认/否定→对策→效果复核。柏拉图选重点；未验证原因标为假设。","impact":"延期最多的“缺料”只是症状，需要追到需求变化、参数、供应履约或记录差错等可验证机制。","source":"T06；PD第24、46—47页；ASQ Pareto"},{"id":"A05","level":"必须修订","scope":"D09/D00","title":"冲击点不是固定组织层级，也不意味着根因已知","original":"“降到根本原因层”“该层次中包含根本原因”。","basis":"课件第37页也明确行动方案可从任一矩阵层次提出；未知原因仍需调查行动。","revised":"冲击点是可以改变实际工作机制的位置。先指定可控流程与取证责任；行动计划允许包含原因验证任务，证据足够后再固化对策。","impact":"销售承诺、参数批准、排程或质量放行都可能是冲击点，不一定在班组。","source":"PD第37页；T02、T06、T12"},{"id":"A06","level":"必须修订","scope":"D06/D11","title":"突破目标不能机械“超过预算”","original":"“指标应始终超出预算”；TTI清单相同表述。","basis":"旧海顺01已指出指标方向和口径问题；预算与突破计划必须有资源一致性。","revised":"设有证据和资源支持的能力提升目标，说明与预算假设的关系。库存等指标更低可能更好；活动里程碑与效果目标分列。不要按月均匀摊分不连续的改善效果。","impact":"明确基线后再承诺交付和库存目标，不填写任意百分比。","source":"PD第26—27、55页；海顺01；C06"},{"id":"A07","level":"证据待补","scope":"D01","title":"73%不能作为普遍事实或因果证据","original":"“73%是因为没有把战略和战术结合起来，根源是缺少战略部署流程”。","basis":"课件第4页确有类似文字，但未给研究来源、样本、时间或方法；本轮未核到原始研究。","revised":"保留为“课件引用，原始出处未核实”，移出培训论证正文。PD的必要性用海顺真实的目标—资源—行动断点证明。","impact":"无需用不可追溯的统计说服员工。","source":"PD第4页；D01"},{"id":"A08","level":"补充边界","scope":"D03/D04","title":"突破不以“完全不知道解法”为资格条件","original":"检查清单“实现它的方案是否还不知道”。","basis":"课程用语强调现有系统不能自然达成；已知可借鉴技术或部分方法并不否定突破。","revised":"突破要求形成显著的新能力或水平；可已有方向，但仍需验证本地适用性、资源和路径。年度突破以结果和能力进展表述。","impact":"避免故意选不可控、完全无路径的目标。","source":"PD第18、21页；T01；教学解释"},{"id":"A09","level":"补充边界","scope":"D08","title":"矩阵圆点的含义必须跟随图例","original":"“实心圆才表示向下一层部署”。","basis":"课件第31页确这样标注，但符号约定不是所有X矩阵版本的通用定义。","revised":"在所用模板中保留图例：关联强度、主要责任、支持责任分别怎么读；主责必须配权限、时间和资源。横向与纵向Catchball不可省略。","impact":"矩阵上的点不等于真实承诺；每个点能说清贡献和依赖。","source":"PD第31—37页；T02；LEI Catchball"},{"id":"A10","level":"必须修订","scope":"F02","title":"供应链流程图遗漏生产和质量放行，顺序也过直","original":"“物料齐套→排程与承诺→补货与拉动→库存与在途→交付”。","basis":"流程顺序不是普遍适用；接单阶段应先评估可承诺能力，生产、检验/放行等关键接口必须出现。","revised":"需求/订单→评估承诺→采购补货与生产计划协同→投产前条件确认→生产/转换→检验放行→发运/到货→兑现核对。各环节反馈缺口，按实际路线补全。","impact":"用真实产品族验证当前流程；不要照着抽象图建审批。","source":"F02；T05、T17；海顺试点设计"},{"id":"A11","level":"必须修订","scope":"F04","title":"“价值创造树”混合了作用假设与财务恒等式","original":"客户结果和员工结果作根，经流程汇聚到ROIC。","basis":"客户结果也来自流程，当前图容易形成倒因果；箭头不能代替经营机制或会计计算。","revised":"分开两图：作用假设图（能力/机制→过程→客户→经营）；财务分解（ROIC=税后经营利润/平均投入资本）。收益分别登记费用、现金、产能、服务，不重复相加。","impact":"库存账面下降可能来自核销或转移，不能直接当现金释放。","source":"C06；F04内部一致性；海顺财务口径待确认"},{"id":"A12","level":"必须修订","scope":"F05","title":"内部填补率与留任率的公式不清","original":"“指定岗位通过内部人才补充的比例／岗位范围”。","basis":"比例再除以范围不是可复算公式；与原06指标字典的范围说明不一致。","revised":"内部填补率=期间范围内由内部人员填补的岗位次数/同范围全部已填补岗位次数。留任率=期初指定人群中期末仍在范围内人数/期初人数；内部转岗、退出定义另定。","impact":"两项均为人才指标，不用作首轮交付库存项目主要验收。","source":"F05；06指标字典；通用口径设计"},{"id":"A13","level":"补充边界","scope":"F01","title":"IPD文件名易被误读成DBS标准流程","original":"文件名“研发与新产品IPD”，正文是工具组合。","basis":"正文已声明不是丹纳赫内部IPD规程，名称仍容易让初学者混同。","revised":"显示名改为“研发与新产品的DBS应用”；把设计评审、项目管理、上市准备视为贯穿开发的机制，不是一次性串行关卡。","impact":"本轮仅在新品引入影响现有交付时调用相关内容。","source":"F01；T20—T23、T30"},{"id":"A14","level":"补充边界","scope":"F03/F05","title":"不宜强把每个职能归到一个QDCI字母","original":"销售主要落在创新和成本；人力主要落在创新和质量。","basis":"QDCI是改善方向，不是职能归属；旧C03本就作此区分。","revised":"销售围绕客户选择与增长兑现，人力围绕业务能力形成；跨QDCI贡献应由具体问题决定。增长室也不是销售流程中的必经交易阶段。","impact":"销售与人力加入同一价值流团队，不各建独立试点追字母。","source":"C03、M03、M04；F03、F05"},{"id":"A15","level":"必须修订","scope":"X03/TPL13","title":"复制时“重新定义口径”与“相同口径比较”冲突","original":"接收方重定义指标；复制后按源头相同口径验证。","basis":"两种要求需有显式映射，否则结果不可比较。","revised":"保留共享指标的定义、边界与单位；接收方扩展本地指标。必须改口径时，记录映射并重建本地基线，不直接比较原始值或改善百分比。","impact":"复制补货方法时可调整参数，不能把出货OTD和到货OTD直接比较。","source":"X03第4—5节；TPL13；C06"},{"id":"A16","level":"补充边界","scope":"X01/TPL11","title":"没有证据不等于组织能力处于上一等级","original":"“找不到证据时，等级就停在上一档”；TII拼写。","basis":"未提供、未观察和已经证明未做到是不同状态；强制定档会制造假精确。","revised":"增加“证据不足/未评估/不适用”，有充分证据才定级；TII改为TTI。自主改进阶段仍需领导到现场带教，不能写成管理层只看证据。","impact":"先记录试点运行证据，不给全公司成熟度评分。","source":"X01；T28；TPL11"},{"id":"A17","level":"补充边界","scope":"X02","title":"AAR、PDCA与PSP不能按事前事后机械分割","original":"PDCA仅在原因/对策不确定时用；AAR不问谁的错。","basis":"PDCA贯穿计划至复查，也适用于已知方法的执行学习；AAR可在阶段间开展。","revised":"以用途区分三者；先事实、后学习，同时保留明确的履职、行为与承诺责任。复盘不替代根因验证或正式责任处理。","impact":"复盘结论进入行动和标准，避免再开一场泛泛总结会。","source":"C04、T06、C07；X02"},{"id":"A18","level":"必须修订","scope":"F01/F03/F06","title":"若干指标仍无法直接复算","original":"验证周期“时间／假设数”；安全事件“事件或工时损失／暴露工时”。","basis":"均值需先汇总各对象时长；事件频率与损失工时是不同量，不能共用一个名称。","revised":"验证周期按同一类已完成假设分别求平均/中位数，未完成另列账龄；预测偏差固定预测截点并处理零值；安全事件频率与损失工时分别定义；缺陷逃逸按一致批次与单位追踪。","impact":"进入正式看板前由数据责任人逐项试算，不能直接复制表头。","source":"C06；F01、F03、F06；通用测量逻辑"},{"id":"A19","level":"必须修订","scope":"D00/海顺04/TPL14","title":"有执行链，还缺“为何选择它”的战略证据","original":"战略选择只有“服务谁、凭什么赢、放弃什么”的占位。","basis":"部署一个目标不等于证明该目标是正确战略；模板尚未要求竞争、客户和经济性证据。","revised":"在部署前补一页：客户分层与服务承诺、当前差距、不同方案、能力/资本约束、选择理由、停止条件。数字目标通过基线和Catchball批准。","impact":"质量、交付期、成本方向已确认，具体产品族、服务政策和目标值仍需诊断。","source":"海顺04；T04、T19、T01；本次实施建议"},{"id":"A20","level":"补充边界","scope":"全部F/X","title":"六份90天建议不能等于六条并行推广计划","original":"F01—F06均各有90天起步表。","basis":"这是工具应用视角，不是资源已经具备的部署授权。用户已明确概念工具不清、无固定节奏。","revised":"首轮一个跨职能价值流试点，质量、交付、成本联合验收。F02/F06提供主要流程视角，F03/F04/F05承担接口；F01仅在新品切换相关时加入。X02随阶段用，X01/X03在证据就绪后用。","impact":"将有限骨干集中在同一问题上边做边学。","source":"海顺01、海顺02；本次用户确认"},{"id":"A21","level":"必须修订","scope":"图谱/cards.json与HTML","title":"新增D卡的结构化摘要存在缺字段和错位","original":"D00、D12定义为空，多张D卡步骤为空或把产物作为步骤。","basis":"直接读取当前cards.json确认；源Markdown章节名不同造成摘要字段映射不完整。","revised":"每张D卡人工核对定义、输入、步骤、产出、验收字段；按字段质量检查生成HTML，不能只验证文件链接和节点数量。","impact":"本次复核页提供完整修订口径；原HTML不标记为已完成全量校正版。","source":"当前cards.json；D00—D12正文"},{"id":"A22","level":"补充边界","scope":"10索引/图谱关系","title":"强制所有卡片双向链接可能增加噪声","original":"“A链B，则B的相邻节点必须含A”。","basis":"阅读反向入口有帮助，但语义关系有方向，“需要”不能被反向理解为同样关系。","revised":"有向关系保留动词及证据，界面可自动显示入边；不要求每卡都塞满对称相邻列表。为各字段保留唯一内容源和审核状态。","impact":"清晰度用能否追到下一动作检验，不以链接密度衡量。","source":"10知识总索引；08知识图谱说明；教学设计"}]}</script><script>
const DATA=JSON.parse(document.getElementById('data').textContent),main=document.getElementById('content');
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function home(){return '<h1>先校准关键概念，再让一个价值流跑起来</h1><p class="lead">新增资料补足了部署链和职能应用，但还不能直接作为全员实施标准。建议保留体系主干，先修订会影响决策、动作与测量的内容，再用一个真实产品族验证。</p><div class="band">主线：产品质量 Q · 交付期 D · 成本控制 C</div><p>库存、在制品、换型、齐套和计划兑现是按原因选择的支撑指标。每个改善都检查对另外两项结果的影响，避免局部优化。</p><div class="chain"><button data-go="audit"><b>① 核对资料</b><span>22项意见：原表述、证据、替换口径</span></button><button data-go="cards"><b>② 统一语言</b><span>8张修订卡：定义、步骤、产物、验收</span></button><button data-go="plan"><b>③ 选定试点</b><span>前两周取证，90天按证据过关</span></button><button data-go="register"><b>④ 按任务带教</b><span>42张旧卡与新增材料的使用次序</span></button></div><div class="flow-note">一条产品族 · 一位端到端负责人 · 一套QDC事实 · 日周月节奏<br>现场事实 → 原因验证 → 小范围试行 → QDC联合验收 → 标准与带教 → 按条件复制<br>原因被否定或结果恶化时返回诊断，不能为了结项跳过验证。</div><h2>最先修订的四个认识</h2><ol><li>PD七阶段的第3阶段包含<strong>年度改善优先目标和资源</strong>；新增卡的转录有误。</li><li>PD与日常管理<strong>区分用途，共用事实底座</strong>；同一OTIF数据可服务不同管理层次。</li><li>优先改善与年度目标<strong>可以多对多关联</strong>，不要求机械一一对应。</li><li>5Why和柏拉图帮助追问、排序；<strong>根因必须取证</strong>，箭头不是因果证明。</li></ol><h2>总经理这一阶段要批准什么</h2><p>批准试点范围、主责、人员时间与两周取证计划；在基线与资源核实后批准具体目标。既有PD目标如已批准，应先核对依据，不能由模板自动重设。</p><p class="muted">本轮对照原42张卡、13份PD卡、6份职能手册、3份机制与4份新增模板。详细复核范围和未核实事项见“来源与边界”。原HTML和原卡未被覆盖。</p><div class="actions"><button data-go="plan">阅读QDC实施方案</button><button data-go="audit">查看22项核对</button><a href="03_海顺QDC实施建议.md">打开可编辑方案原文</a></div>';}
function filter(){const q=document.getElementById('q').value.trim().toLowerCase(),level=document.getElementById('level').value;const list=DATA.findings.filter(f=>(!level||f.level===level)&&(!q||Object.values(f).join(' ').toLowerCase().includes(q)));document.getElementById('count').textContent='显示 '+list.length+' / '+DATA.findings.length+' 项';document.getElementById('results').innerHTML=list.map(f=>'<details><summary><small>'+esc(f.id)+'</small><span class="label '+(f.level==='必须修订'?'critical':'')+'">'+esc(f.level)+'</span>'+esc(f.title)+' <small>'+esc(f.scope)+'</small></summary><div class="body"><p><b>原表述/现状：</b>'+esc(f.original)+'</p><p><b>核对依据：</b>'+esc(f.basis)+'</p><p><b>建议替换为：</b>'+esc(f.revised)+'</p><p><b>对海顺的影响：</b>'+esc(f.impact)+'</p><p class="meta">依据定位：'+esc(f.source)+'</p></div></details>').join('')||'<p class="empty">没有匹配项。试试“指标”“资源”“D12”或清空筛选。</p>';}
function show(tab){document.querySelectorAll('[data-tab]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.tab===tab));b.id='tab-'+b.dataset.tab;});main.setAttribute('aria-labelledby','tab-'+tab);if(tab==='home'){main.innerHTML=home();}else if(tab==='audit'){main.innerHTML='<h1>22项核对：逐项看依据与改法</h1><p>“必须修订”影响讲授或部署；“补充边界”保留主干并限定解释；“证据待补”不作已证实事实。</p><div class="filters"><label>查找卡片、概念或问题<input id="q" placeholder="例如 D12、根因、指标"></label><label>处理类型<select id="level"><option value="">全部类型</option><option>必须修订</option><option>补充边界</option><option>证据待补</option></select></label></div><p id="count" class="counter"></p><div id="results"></div><div class="actions"><a href="01_新旧资料核对结论.md">打开完整核对原文</a></div>';filter();document.getElementById('q').addEventListener('input',filter);document.getElementById('level').addEventListener('change',filter);}else {const d=DATA.docs[tab];main.innerHTML='<div class="actions"><a href="'+d.file+'">打开可编辑原文</a><button id="print">打印当前方案</button></div><article class="doc">'+d.html+'</article>';const headings=[...main.querySelectorAll('article h2')];headings.forEach((h,i)=>h.id=tab+'-'+i);const outline=document.createElement('div');outline.className='outline';outline.innerHTML=headings.map(h=>'<a href="#'+h.id+'">'+esc(h.textContent)+'</a>').join('');main.querySelector('article h1').after(outline);document.getElementById('print').addEventListener('click',()=>window.print());}window.scrollTo(0,0);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-tab],[data-go]');if(b)show(b.dataset.tab||b.dataset.go);});
document.querySelector('nav').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const bs=[...document.querySelectorAll('[data-tab]')],i=bs.indexOf(document.activeElement);if(i<0)return;e.preventDefault();let j=e.key==='Home'?0:e.key==='End'?bs.length-1:(i+(e.key==='ArrowRight'?1:-1)+bs.length)%bs.length;bs[j].focus();show(bs[j].dataset.tab);});show('home');
</script></body></html>
